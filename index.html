<title>Mission Zoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --ground:#E7F0E0; --surface:#F7FBF3; --surface-2:#DCE9D3; --ink:#17301F; --ink-soft:#4A6450; --line:#B6CCAC;
  --sign:#FFC928; --sign-ink:#2A2100; --sign-edge:#C9970A; --coin:#C98B00; --water:#2F97BD; --berry:#C93563; --leaf:#2E8A4B;
  --plank:#7A4E2A; --plank-ink:#FFF5DF; --fence:#8B5E34;
  --g-farm:#9CCB6B; --g-savanna:#E3C27A; --g-jungle:#4E9E62; --g-ocean:#5EB9DA; --g-frost:#DDEFF6; --g-bush:#D9A064; --g-sanct:#B9DB91;
  --t-farm:#86B957; --t-savanna:#D3AE62; --t-jungle:#3E8A52; --t-ocean:#4AA8CB; --t-frost:#C8E3EE; --t-bush:#C98D52; --t-sanct:#A5CC7C;
  --shadow:0 2px 0 rgba(23,48,31,.18), 0 8px 20px -12px rgba(23,48,31,.35);
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1B14; --surface:#17261D; --surface-2:#213428; --ink:#E4F0E0; --ink-soft:#A6BEA8; --line:#2E4838;
    --sign:#FFC928; --sign-ink:#2A2100; --sign-edge:#A87B00; --coin:#F2B92B; --water:#5CC0E3; --berry:#F0648D; --leaf:#5DC47D;
    --plank:#5C3A1E; --plank-ink:#FFF0D2; --fence:#9C6B3E;
    --g-farm:#4F7A34; --g-savanna:#8E7336; --g-jungle:#26603A; --g-ocean:#1E6E8E; --g-frost:#5C8494; --g-bush:#8C5B2F; --g-sanct:#4E7236;
    --t-farm:#45702C; --t-savanna:#80672E; --t-jungle:#1F5531; --t-ocean:#19627F; --t-frost:#527786; --t-bush:#7E5028; --t-sanct:#44672E;
    --shadow:0 2px 0 rgba(0,0,0,.35), 0 8px 20px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1B14; --surface:#17261D; --surface-2:#213428; --ink:#E4F0E0; --ink-soft:#A6BEA8; --line:#2E4838;
  --sign:#FFC928; --sign-ink:#2A2100; --sign-edge:#A87B00; --coin:#F2B92B; --water:#5CC0E3; --berry:#F0648D; --leaf:#5DC47D;
  --plank:#5C3A1E; --plank-ink:#FFF0D2; --fence:#9C6B3E;
  --g-farm:#4F7A34; --g-savanna:#8E7336; --g-jungle:#26603A; --g-ocean:#1E6E8E; --g-frost:#5C8494; --g-bush:#8C5B2F; --g-sanct:#4E7236;
  --t-farm:#45702C; --t-savanna:#80672E; --t-jungle:#1F5531; --t-ocean:#19627F; --t-frost:#527786; --t-bush:#7E5028; --t-sanct:#44672E;
  --shadow:0 2px 0 rgba(0,0,0,.35), 0 8px 20px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 96px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;line-height:1.1;text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto}
.em{font-family:var(--emoji);line-height:1}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);padding-block:12px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:30px;color:var(--ink)}
.brand .badge{background:var(--sign);color:var(--sign-ink);font-family:var(--display);font-size:13px;padding:3px 8px;border-radius:6px;transform:rotate(-4deg);box-shadow:0 2px 0 var(--sign-edge)}
.res{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;font-weight:700;font-variant-numeric:tabular-nums}
.pill .em{font-size:18px}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.12);border-color:var(--sign)}}

/* ---------- signpost nav ---------- */
.nav{display:flex;gap:8px;flex-wrap:wrap;padding-block:12px 4px}
.nav button{display:flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:8px 14px 8px 10px;background:var(--surface);color:var(--ink);font-family:var(--display);font-size:17px;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.nav button .em{font-size:22px}
.nav button:hover{transform:translateY(-1px)}
.nav button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.nav button[aria-current="true"]{background:var(--sign);color:var(--sign-ink);box-shadow:0 3px 0 var(--sign-edge)}
@media (max-width:560px){ .nav button{font-size:15px;padding:7px 10px 7px 8px} .nav button .em{font-size:19px} .brand h1{font-size:25px} }

main{padding-block:14px 24px}
.screen-head{display:flex;flex-wrap:wrap;align-items:end;gap:8px 16px;margin-bottom:16px}
.screen-head h2{font-size:34px}
.screen-head p{margin:0;color:var(--ink-soft);max-width:60ch}
.muted{color:var(--ink-soft)}
.small{font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:9px 16px;font-weight:700;background:var(--surface-2);color:var(--ink);box-shadow:0 3px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.go{background:var(--sign);color:var(--sign-ink);box-shadow:0 3px 0 var(--sign-edge)}
.btn.leaf{background:var(--leaf);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.btn.warn{background:var(--berry);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{padding:6px 10px;font-size:14px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px}

/* ---------- map ---------- */
.map-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:900px){.map-layout{grid-template-columns:1fr}}
.parkmap{background:var(--surface-2);border-radius:22px;padding:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;position:relative;border:3px solid var(--line)}
@media (max-width:700px){.parkmap{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.parkmap{grid-template-columns:1fr}}
.zone-tile{position:relative;border:0;text-align:left;border-radius:16px;min-height:170px;padding:44px 12px 12px;background:var(--g);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .12s}
.zone-tile:hover{transform:translateY(-2px) rotate(-.3deg)}
.zone-tile::before{content:"";position:absolute;inset:0;background:var(--tex);opacity:.9;pointer-events:none}
.zone-tile > *{position:relative}
.zone-tile .plank{position:absolute;top:10px;left:10px;background:var(--plank);color:var(--plank-ink);font-family:var(--display);font-size:19px;padding:4px 12px 5px;border-radius:6px;box-shadow:0 3px 0 rgba(0,0,0,.25);transform:rotate(-1.5deg)}
.zone-tile .crowd{font-family:var(--emoji);font-size:26px;letter-spacing:2px;line-height:1.25;min-height:34px;word-break:break-all}
.zone-tile .zmeta{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.zmeta span{background:rgba(255,255,255,.78);color:#17301F;font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px}
.zone-tile.sanct{grid-column:1 / -1;min-height:120px}
.z-farm{--g:var(--g-farm);--tex:repeating-linear-gradient(100deg,transparent 0 22px,var(--t-farm) 22px 26px)}
.z-savanna{--g:var(--g-savanna);--tex:radial-gradient(circle at 20% 30%,var(--t-savanna) 0 6px,transparent 7px) 0 0/46px 40px}
.z-jungle{--g:var(--g-jungle);--tex:radial-gradient(ellipse at 50% 100%,var(--t-jungle) 0 14px,transparent 15px) 0 0/34px 30px}
.z-ocean{--g:var(--g-ocean);--tex:radial-gradient(ellipse at 50% 0,transparent 0 11px,var(--t-ocean) 12px 14px,transparent 15px) 0 0/40px 18px}
.z-frost{--g:var(--g-frost);--tex:radial-gradient(circle,var(--t-frost) 0 3px,transparent 4px) 0 0/22px 22px}
.z-bush{--g:var(--g-bush);--tex:repeating-linear-gradient(45deg,transparent 0 16px,var(--t-bush) 16px 19px)}
.z-sanct{--g:var(--g-sanct);--tex:radial-gradient(circle at 30% 40%,var(--t-sanct) 0 8px,transparent 9px) 0 0/52px 44px}
.side{display:grid;gap:14px}
.booth{background:var(--sign);color:var(--sign-ink);border-radius:16px;padding:16px;box-shadow:0 4px 0 var(--sign-edge)}
.booth h3{font-size:22px}
.booth .big{font-family:var(--display);font-size:38px;line-height:1}
.booth .btn{background:var(--ink);color:var(--ground);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.stars{font-size:20px;letter-spacing:2px;color:var(--coin)}
.news{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px;font-size:14px}
.news li{padding-bottom:8px;border-bottom:1px dashed var(--line)}
.news li:last-child{border:0}
.hint{display:flex;gap:12px;align-items:center;background:var(--surface);border:2px dashed var(--sign-edge);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.hint .em{font-size:30px}

/* ---------- zone view ---------- */
.zone-banner{border-radius:18px;padding:16px;background:var(--g);position:relative;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.zone-banner::before{content:"";position:absolute;inset:0;background:var(--tex);pointer-events:none}
.zone-banner > *{position:relative}
.zone-banner .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.zone-banner h2{font-size:32px;background:var(--plank);color:var(--plank-ink);padding:4px 14px 6px;border-radius:8px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.zone-banner .loves{margin-top:10px;background:rgba(255,255,255,.8);color:#17301F;border-radius:10px;padding:6px 10px;font-size:14px;display:inline-block}
.zone-banner .loves .em{font-size:18px;letter-spacing:1px}
.pens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.pens{grid-template-columns:1fr}}
.pen{border-radius:14px;background:var(--g);position:relative;padding:10px;border:6px dashed var(--fence);box-shadow:var(--shadow)}
.pen.drop-ok{outline:4px dashed var(--sign);outline-offset:3px}
.pen.drop-full{outline:4px dashed var(--berry);outline-offset:3px}
.pen-sign{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:2}
.pen-sign b{background:var(--plank);color:var(--plank-ink);font-family:var(--display);font-weight:400;padding:2px 10px;border-radius:6px;font-size:16px}
.pen-sign .cap{background:rgba(255,255,255,.85);color:#17301F;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:700}
.field{position:relative;border-radius:10px;background:var(--tex);margin-top:8px}
.pen-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;position:relative;z-index:2}
.plot-empty{border:3px dashed var(--line);border-radius:14px;min-height:260px;display:grid;place-items:center;text-align:center;padding:16px;color:var(--ink-soft);background:var(--surface)}
.decor-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:640px){.decor-row{grid-template-columns:repeat(3,minmax(0,1fr))}}
.spot{aspect-ratio:1;width:100%;max-width:92px;justify-self:center;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;background:var(--surface);font-size:34px}
.spot.filled{border-style:solid;border-color:transparent;background:var(--surface-2)}
button.spot{cursor:pointer}
.edit-bar{background:var(--sign);color:var(--sign-ink);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* critters */
.critter{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;touch-action:none;user-select:none;-webkit-user-select:none;transition:left 2.2s ease-in-out,top 2.2s ease-in-out;z-index:1;display:flex;flex-direction:column;align-items:center;cursor:grab}
.critter .tag{font-size:11px;font-weight:700;background:rgba(255,255,255,.88);color:#17301F;border-radius:6px;padding:0 5px;margin-top:-2px;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.critter .bubble{position:absolute;top:-14px;right:-10px;font-size:14px;font-family:var(--emoji)}
.critter:hover{z-index:3}
.critter.dragging{opacity:.25}
.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-60%) scale(1.25);filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.sprite{position:relative;display:inline-block;font-family:var(--emoji);font-size:var(--sz,34px);line-height:1}
.sprite .spr{display:inline-block}
.bob .spr{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.sprite .g-hat{position:absolute;left:50%;top:-.42em;transform:translateX(-50%);font-size:.55em}
.sprite .g-shoes{position:absolute;right:-.15em;bottom:-.1em;font-size:.4em}
.sprite .g-ride{position:absolute;left:50%;bottom:-.34em;transform:translateX(-50%);font-size:.6em;z-index:-1}
.sprite .spark{position:absolute;left:-.25em;top:-.2em;font-size:.45em;animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.2;transform:scale(.7)}}
.u-golden .spr{filter:sepia(1) saturate(5) hue-rotate(-8deg) brightness(1.08) drop-shadow(0 0 5px #FFCF40)}
.u-rainbow .spr{animation:rainbow 3s linear infinite}
@keyframes rainbow{from{filter:saturate(3) hue-rotate(0deg) drop-shadow(0 0 5px #ff7ad9)}to{filter:saturate(3) hue-rotate(360deg) drop-shadow(0 0 5px #7ad9ff)}}
.u-diamond .spr{filter:grayscale(1) brightness(1.7) contrast(1.2) drop-shadow(0 0 3px #7FE3FF) drop-shadow(0 0 9px #B8F2FF)}
.u-sparkly .spr{filter:saturate(2.4) brightness(1.1) drop-shadow(0 0 7px #FFE066)}
.tray{position:sticky;bottom:0;margin-top:16px;background:var(--surface);border:3px solid var(--line);border-radius:16px 16px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 -8px 20px -14px rgba(0,0,0,.4)}
.tray.drop-ok{border-color:var(--sign)}
.tray-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.tray-head b{font-family:var(--display);font-weight:400;font-size:18px}
.tray-list{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 4px}
.tray-list:empty{display:none}
.chip{touch-action:pan-x;position:relative;transform:none;left:auto;top:auto;flex:0 0 auto;background:var(--g-sanct);border-radius:12px;padding:8px 6px 4px;min-width:66px;transition:none}
.meadow{position:relative;min-height:420px;border-radius:18px;background:var(--g-sanct);overflow:hidden;box-shadow:var(--shadow)}
.meadow::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,var(--t-sanct) 0 8px,transparent 9px) 0 0/52px 44px}

/* ---------- missions ---------- */
.choose{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.choose{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt-card{border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:132px}
.opt-card .em{font-size:30px}
.opt-card h3{font-size:21px}
.opt-card[aria-pressed="true"]{border-color:var(--sign-edge);background:var(--sign);color:var(--sign-ink)}
.opt-card[aria-pressed="true"] .muted{color:var(--sign-ink)}
.rewards{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.rewards{grid-template-columns:1fr}}
.step-label{font-family:var(--display);font-size:20px;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.step-label i{font-style:normal;background:var(--ink);color:var(--ground);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.mission{display:grid;gap:16px}
.mission.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
@media (max-width:860px){.mission.two{grid-template-columns:1fr}}
.passage{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:18px 20px;font-size:17px;line-height:1.65}
.passage h3{font-size:24px;margin-bottom:8px}
.passage p{max-width:65ch;margin:0 0 12px}
.qcard{background:var(--surface);border:3px solid var(--ink);border-radius:16px;padding:18px;box-shadow:6px 6px 0 var(--sign)}
.progress{display:flex;gap:6px;margin-bottom:12px}
.progress span{flex:1;height:8px;border-radius:99px;background:var(--surface-2)}
.progress span.ok{background:var(--leaf)}
.progress span.bad{background:var(--berry)}
.progress span.now{background:var(--sign)}
.qtext{font-size:20px;font-weight:700;line-height:1.4;margin:0 0 14px}
.answers{display:grid;gap:10px}
.answers button{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--ground);border-radius:12px;padding:10px 12px;font-size:17px}
.answers button:hover:not([disabled]){border-color:var(--ink)}
.answers button b{flex:0 0 30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font-family:var(--display);font-weight:400}
.answers button.right{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 18%,var(--ground))}
.answers button.right b{background:var(--leaf);color:#fff}
.answers button.wrong{border-color:var(--berry);background:color-mix(in srgb,var(--berry) 14%,var(--ground))}
.answers button.wrong b{background:var(--berry);color:#fff}
.answers button[disabled]{cursor:default}
.explain{margin-top:14px;border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.explain strong{font-family:var(--display);font-weight:400;font-size:20px;display:block}
.result{text-align:center;padding:26px 16px}
.result .big{font-family:var(--display);font-size:54px;line-height:1}

/* ---------- shop ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tabs button{flex:0 0 auto;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;min-width:0;width:220px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.item{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.item .top-row{display:flex;gap:10px;align-items:center}
.item .top-row .em{font-size:40px}
.item h3{font-size:19px}
.item .price{font-weight:700;color:var(--coin);font-variant-numeric:tabular-nums}
.item select{width:100%;border:2px solid var(--line);background:var(--ground);border-radius:8px;padding:5px 8px}
.item .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .row select{width:auto}
.item .grow{margin-top:auto}
.tagz{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--surface-2)}
.ultra-card{background:linear-gradient(135deg,var(--surface),var(--surface-2));border:3px solid var(--sign-edge)}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.bar.warm i{background:var(--coin)}
.bar.low i{background:var(--berry)}

/* ---------- roster / modal ---------- */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.a-card{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px}
.a-card .who{min-width:0;flex:1}
.a-card .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,20,14,.55);display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);color:var(--ink);border-radius:20px;max-width:560px;width:100%;max-height:calc(100% - 20px);overflow:auto;padding:18px;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--sign)}
.sheet-head{display:flex;gap:14px;align-items:center}
.sheet-head .portrait{width:96px;height:96px;flex:0 0 96px;border-radius:18px;display:grid;place-items:center;background:var(--g)}
.sheet h3{font-size:24px}
.sheet input[type=text]{width:100%;font-family:var(--display);font-size:22px;border:2px solid var(--line);border-radius:10px;padding:4px 10px;background:var(--ground)}
.close{float:right;border:0;background:var(--surface-2);border-radius:10px;width:36px;height:36px;font-size:18px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;align-items:center;margin:14px 0}
.kv label,.kv dt{font-weight:700;font-size:14px;color:var(--ink-soft)}
.kv select{border:2px solid var(--line);background:var(--ground);border-radius:8px;padding:5px 8px;width:100%}
.friends{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.friends li{display:flex;justify-content:space-between;gap:8px;background:var(--ground);border-radius:10px;padding:6px 10px;font-size:14px}
.pers{display:inline-block;background:var(--ink);color:var(--ground);border-radius:999px;padding:1px 10px;font-weight:700;font-size:13px}

/* ---------- arena ---------- */
.arena-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.arena-grid{grid-template-columns:1fr}}
.track{background:var(--surface-2);border-radius:16px;padding:10px;display:grid;gap:8px;border:3px solid var(--line)}
.lane{position:relative;height:62px;border-radius:10px;background:repeating-linear-gradient(90deg,var(--g-savanna) 0 40px,var(--t-savanna) 40px 42px);overflow:hidden}
.lane::after{content:"";position:absolute;right:18px;top:0;bottom:0;width:10px;background:repeating-linear-gradient(0deg,#17301F 0 8px,#fff 8px 16px)}
.lane .runner{transition:left .11s linear;position:absolute;top:50%;transform:translate(-50%,-50%);left:6%}
.lane .lname{position:absolute;left:8px;top:4px;font-size:12px;font-weight:700;background:rgba(255,255,255,.85);color:#17301F;border-radius:6px;padding:0 6px;z-index:2}
.lane.mine{box-shadow:inset 0 0 0 3px var(--sign)}
.fighters{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
.fighter .sprite{--sz:64px}
.vs{font-family:var(--display);font-size:34px;color:var(--berry)}
.hit{animation:hit .45s}
@keyframes hit{25%{transform:translateX(-8px) rotate(-6deg)}60%{transform:translateX(6px) rotate(4deg)}}
.log{font-size:15px;min-height:1.5em;text-align:center;font-weight:700;margin:10px 0}

/* toasts */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;display:grid;gap:8px;width:min(440px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--ink);color:var(--ground);border-radius:12px;padding:10px 14px;font-weight:700;box-shadow:0 8px 24px -8px rgba(0,0,0,.5);animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.foot{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-soft)}
.linkish{border:0;background:none;text-decoration:underline;color:var(--ink-soft);padding:0}

/* ---------- keypad ---------- */
.numpad{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:14px;align-items:start}
@media (max-width:600px){.numpad{grid-template-columns:1fr}}
.np-display{display:flex;align-items:center;gap:6px;min-height:64px;border:3px solid var(--ink);border-radius:14px;background:var(--ground);padding:6px 16px;font-family:var(--display);font-size:36px;font-variant-numeric:tabular-nums;overflow:hidden}
.np-display .ph{color:var(--ink-soft);opacity:.45}
.np-display .unit{color:var(--ink-soft);font-size:26px}
.np-display .caret{width:3px;height:34px;background:var(--ink);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.np-display.right{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 16%,var(--ground))}
.np-display.wrong{border-color:var(--berry);background:color-mix(in srgb,var(--berry) 12%,var(--ground))}
.np-display.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.np-hint{font-size:13px;color:var(--ink-soft);margin-top:6px}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.keys button{height:54px;border:0;border-radius:12px;background:var(--surface-2);color:var(--ink);box-shadow:0 3px 0 var(--line);font-family:var(--display);font-size:24px;touch-action:manipulation}
.keys button:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.keys button.sym{background:var(--surface);border:2px solid var(--line)}
.keys button.ok{background:var(--sign);color:var(--sign-ink);box-shadow:0 3px 0 var(--sign-edge);font-size:17px}
.keys button[disabled]{opacity:.45}

/* ---------- antics ---------- */
.zone-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:start}
@media (max-width:960px){.zone-grid{grid-template-columns:1fr}}
.gossip h3{font-size:20px}
.gossip .news{font-size:13px}
.alert{background:color-mix(in srgb,var(--berry) 14%,var(--surface));border:2px solid var(--berry);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cap.over{background:var(--berry)!important;color:#fff!important}
.zmeta span.warn{background:var(--berry);color:#fff}
.field{height:220px}
.say{position:absolute;z-index:8;transform:translate(-50%,calc(-100% - 6px));background:#fff;color:#17301F;border:2px solid #17301F;border-radius:12px;padding:4px 9px;font-size:13px;font-weight:700;max-width:180px;width:max-content;line-height:1.25;text-align:center;pointer-events:none;animation:pop .18s ease-out;box-shadow:2px 3px 0 rgba(0,0,0,.2)}
.say::after{content:"";position:absolute;left:50%;bottom:-7px;width:11px;height:11px;background:#fff;border-right:2px solid #17301F;border-bottom:2px solid #17301F;transform:translateX(-50%) rotate(45deg)}
@keyframes pop{from{opacity:0;transform:translate(-50%,calc(-100% - 6px)) scale(.5)}}
.brawl{position:absolute;z-index:7;transform:translate(-50%,-50%);width:130px;height:100px;display:grid;place-items:center;pointer-events:none}
.brawl .cloud{font-family:var(--emoji);font-size:86px;line-height:1;animation:rumble .12s infinite alternate}
.brawl .limbs{position:absolute;font-family:var(--emoji);font-size:22px;animation:spin .6s linear infinite;letter-spacing:6px}
.brawl .word{position:absolute;font-family:var(--display);font-size:24px;color:var(--sign);-webkit-text-stroke:1.5px #17301F;text-shadow:2px 2px 0 #17301F;transition:transform .12s}
@keyframes rumble{from{transform:translate(-3px,1px) rotate(-3deg)}to{transform:translate(3px,-2px) rotate(3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.critter.brawling{opacity:0}
.critter.hop .sprite{animation:hop .42s ease-in-out 5}
@keyframes hop{50%{transform:translateY(-14px)}}
.critter.dance .sprite{animation:dance .5s ease-in-out 6}
@keyframes dance{25%{transform:rotate(-14deg) translateY(-6px)}75%{transform:rotate(14deg) translateY(-6px)}}
.critter.faint .sprite{transform:rotate(-90deg) translateY(6px);transition:transform .25s}
.critter.dig .sprite{animation:dig 1.2s ease-in forwards}
@keyframes dig{30%{transform:rotate(-15deg)}60%{transform:rotate(15deg) translateY(4px)}100%{transform:translateY(20px) scale(.1);opacity:0}}
.critter.asleep .spr{animation:none;filter:saturate(.5) brightness(.95)}
.critter.asleep::after{content:"💤";position:absolute;top:-16px;left:-10px;font-family:var(--emoji);font-size:15px}
.critter.escaped .tag{background:var(--berry);color:#fff}
.hole{position:absolute;transform:translate(-50%,-30%);font-family:var(--emoji);font-size:30px;pointer-events:none;z-index:0}
.cage{position:absolute;right:8px;bottom:8px;width:140px;height:100px;border-radius:10px;border:3px solid #34393a;background:repeating-linear-gradient(90deg,rgba(40,44,46,.85) 0 3px,transparent 3px 15px),rgba(255,255,255,.3);display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:6px 4px;z-index:3}
.cage .label{position:absolute;top:-12px;left:8px;font-size:11px;font-weight:700;background:#34393a;color:#fff;border-radius:6px;padding:1px 7px}
.cage .empty{font-size:11px;font-weight:700;color:#17301F;background:rgba(255,255,255,.8);border-radius:6px;padding:1px 5px;margin-bottom:24px;text-align:center}
.cage .critter{position:relative;left:auto;top:auto;transform:none;transition:none}
.cage .critter .sprite{--sz:32px!important}
.cage.drop-ok{outline:3px dashed var(--sign);outline-offset:2px}
.cage.drop-full{outline:3px dashed var(--berry);outline-offset:2px}
.persbox{margin-top:12px;background:var(--ground);border-radius:12px;padding:10px 12px}
.quote{margin:0;font-family:var(--display);font-size:19px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

function Q(q, correct, wrongs, e) {
  correct = String(correct);

  for (const x of wrongs) { const s = String(x); if (!seen.has(s) && s !== 'NaN' && s !== '') { seen.add(s); w.push(s); } if (w.length === 3) break; }
  const opts = shuffle([correct, ...w]);
  return { kind: 'mc', q, opts, ans: opts.indexOf(correct), e };
}

  const fr = field.getBoundingClientRect(), rs = els.map(e => e.getBoundingClientRect());
  const x = (rs[0].left + rs[1].left + rs[0].width / 2 + rs[1].width / 2) / 2 - fr.left, y = (rs[0].top + rs[1].top + rs[0].height / 2 + rs[1].height / 2) / 2 - fr.top;
  els.forEach(e => e.classList.add('brawling'));
  const bw = document.createElement('div'); bw.className = 'brawl'; bw.style.left = x + 'px'; bw.style.top = y + 'px';
  bw.innerHTML = `<span class="cloud">☁️</span><span class="limbs">🦶⭐✋💫</span><span class="word">${pick(FIGHT_WORDS)}</span>`;
  field.appendChild(bw);
  const w = bw.querySelector('.word');
  const t = setInterval(() => { w.textContent = pick(FIGHT_WORDS); w.style.transform = `translate(${ri(-30, 30)}px,${ri(-26, 10)}px) rotate(${ri(-20, 20)}deg)`; }, 320);
  setTimeout(() => { clearInterval(t); bw.remove(); els.forEach(e => e.classList.remove('brawling')); }, 2200);
}
function flash(el, cls, ms) { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); }
function playEvent(pen, ev) {
  const field = document.querySelector(`[data-drop="pen:${pen.id}"] .field`); if (!field) return;
  const now = Date.now();
  if (ev.meet) {
    const [a, b] = ev.meet, ea = critEl(field, a.id), eb = critEl(field, b.id);
    if (ea && eb && !a.caged && !b.caged && POS[a.id]) {
      const pa = POS[a.id]; POS[b.id] = { x: clamp(pa.x + (pa.x > 50 ? -14 : 14), 10, 90), y: clamp(pa.y + ri(-5, 5), 24, 80) };
      eb.style.transition = 'left .6s ease-out, top .6s ease-out'; eb.style.left = POS[b.id].x + '%'; eb.style.top = POS[b.id].y + '%';
      setTimeout(() => { eb.style.transition = ''; }, 700);
      HOLD[a.id] = HOLD[b.id] = now + 5500;
    }
  }
  (ev.say || []).forEach(([id, t, d]) => { HOLD[id] = Math.max(HOLD[id] || 0, now + d + 2500); setTimeout(() => sayBubble(field, id, t), (d || 0) + (ev.meet ? 250 : 0)); });
  if (ev.brawl) setTimeout(() => brawl(field, ev.brawl), 800);
  if (ev.hop) setTimeout(() => ev.hop.forEach(id => flash(critEl(field, id), 'hop', 2300)), ev.hopAt || 300);
  if (ev.dance) ev.dance.forEach(id => flash(critEl(field, id), 'dance', 3200));
  if (ev.faint) setTimeout(() => flash(critEl(field, ev.faint), 'faint', 2600), ev.faintAt || 900);
  if (ev.nap) { const e = critEl(field, ev.nap); if (e) e.classList.add('asleep'); }
  if (ev.dig) { const e = critEl(field, ev.dig); if (e) { HOLD[ev.dig] = now + 3000; setTimeout(() => e.classList.add('dig'), 500); } }
}

function rel(a, b) { const k = rkey(a, b); return S.friends[k] || (S.friends[k] = { f: 0, n: 0 }); }
function relLabel(f) { return f >= 70 ? '💞 Best friends' : f >= 30 ? '🙂 Friends' : f > -30 ? '👋 Getting to know each other' : f > -70 ? '😒 Rivals' : '😠 Enemies'; }
const moodFace = h => h >= 75 ? '😄' : h >= 50 ? '🙂' : h >= 30 ? '😐' : '😟';
function spec(a) {

}

  for (const k in a.gear) { const it = ITEMS[a.gear[k]]; if (it) { sp += it.sp || 0; st += it.st || 0; } }
  return { sp: Math.max(1, sp), st: Math.max(1, st) };
}
function spriteHTML(a, size) {

}
function bubble(a) {

function news(m) { S.news.unshift({ t: Date.now(), m }); S.news = S.news.slice(0, 12); }
function toast(m) {

  while (box.children.length > 3) box.firstChild.remove();

function bump(id) { const el = $('#pill-' + id); if (el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); } }
function newAnimal(s, t, u) { return { id: S.nextId++, s, t, u: u || null, name: pick(NAMES), p: pick(PERS_KEYS), happy: 62, full: 80, pen: null, gear: {}, pat: 0, caged: false, escaped: null, nap: 0 }; }
function adopt(s, t, u) { const a = newAnimal(s, t, u); S.animals.push(a); return a; }
function bar(v, cls = '') { const c = v < 30 ? 'low' : v < 55 ? 'warm' : ''; return `<div class="bar ${cls || c}"><i style="width:${clamp(v, 0, 100)}%"></i></div>`; }

// ---------- state ----------
function fresh() {
  S = { v: 1, coins: 300, wood: 20, food: 20, animals: [], pens: [{ id: 1, zone: 'farm', slot: 0, cap: 4 }], decor: [{ zone: 'farm', spot: 0, item: 'flowers' }],
    inv: { ball: 1, tree: 1 }, friends: {}, stats: { maths: { c: 0, t: 0 }, english: { c: 0, t: 0 }, reading: { c: 0, t: 0 }, comp: { c: 0, t: 0 } },
    claimed: {}, notified: {}, recent: {}, tickets: 40, last: Date.now(), news: [], nextId: 1, nextPen: 2, missions: 0, savedAt: 0 };
  const sheep = SP('Sheep').i, goat = SP('Goat').i;
  const a = adopt(sheep, 0), b = adopt(sheep, 1), c = adopt(goat, 1);
  a.p = 'bully'; b.p = 'wimp'; c.p = 'clown'; a.pen = b.pen = c.pen = 1;
  news(`Welcome to your new zoo! ${a.name} (a bully), ${b.name} (a wimp) and ${c.name} (the class clown) moved into the Farmyard. What could go wrong?`);

function fix(d) {
  const f = { coins: 0, wood: 0, food: 0, animals: [], pens: [], decor: [], inv: {}, friends: {}, stats: {}, claimed: {}, notified: {}, recent: {}, tickets: 0, last: Date.now(), news: [], nextId: 1, nextPen: 1, missions: 0, savedAt: 0 };
  for (const k in f) if (d[k] === undefined || d[k] === null) d[k] = f[k];
  for (const s of ['maths', 'english', 'reading', 'comp']) d.stats[s] = d.stats[s] || { c: 0, t: 0 };
  d.nextId = Math.max(d.nextId, 1, ...d.animals.map(a => a.id + 1));
  d.nextPen = Math.max(d.nextPen, 1, ...d.pens.map(p => p.id + 1));
  for (const a of d.animals) { a.gear = a.gear || {}; if (typeof a.p === 'number') a.p = OLD_PERS[a.p] || 'sweet'; if (!PERS[a.p]) a.p = pick(PERS_KEYS); a.caged = !!a.caged; a.escaped = a.escaped || null; a.nap = a.nap || 0; }
  return d;
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); if (d && d.v === 1 && Array.isArray(d.animals)) { S = fix(d); return true; } } } catch (e) {}
  return false;
}
function save() { S.savedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} queueDB(); }

// account save (db capability) so the zoo follows the player between devices
let DB = null, UID = null, dbT = null, dbBusy = false, dbAgain = false, syncNote = 'Progress saves on this device';
function queueDB() { if (!DB) return; clearTimeout(dbT); dbT = setTimeout(pushDB, 4000); }
async function pushDB() {
  if (!DB) return; if (dbBusy) { dbAgain = true; return; }
  dbBusy = true;
  try { await DB.doc(`data/users/${UID}/save`).set({ json: JSON.stringify(S), savedAt: S.savedAt }); syncNote = 'Progress saves to your Claude account'; }
  catch (e) { if (e && e.code === 'invalid_argument') { DB = null; syncNote = 'Progress saves on this device only'; } }
  dbBusy = false; renderFoot();
  if (dbAgain) { dbAgain = false; queueDB(); }
}
async function initDB() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    DB = db; UID = uid;
    const snap = await db.doc(`data/users/${uid}/save`).get();
    if (snap.exists) {
      const d = snap.data();
      if (d && typeof d.json === 'string' && (d.savedAt || 0) > (S.savedAt || 0)) {
        const x = JSON.parse(d.json);
        if (x && x.v === 1 && Array.isArray(x.animals)) { S = fix(x); tick(false); render(); toast('Loaded your saved zoo.'); }
      }
    }
    syncNote = 'Progress saves to your Claude account'; renderFoot(); queueDB();
  } catch (e) { /* keep device save */ }
}

// ---------- simulation ----------
function target(a, now) {
  const s = spec(a), p = PP(a); let h = 55 + p.h;
  const pen = a.pen ? penById(a.pen) : null;
  if (pen) {
    h += pen.zone === s.z ? 12 : -10;
    const mates = penAnimals(pen.id); if (mates.length >= pen.cap) h -= 3; if (mates.length > pen.cap) h -= 6;
    let fr = 0;
    for (const m of mates) { if (m === a) continue; const r = S.friends[rkey(a, m)]; if (!r) continue;
      fr += r.f >= 70 ? 8 : r.f >= 30 ? 3 : r.f <= -70 ? -12 : r.f <= -30 ? -5 : 0; }
    h += clamp(fr, -20, 20);
    if (a.caged) h -= 8;
  }
  h += a.full < 25 ? -25 : a.full < 50 ? -8 : a.full > 70 ? 8 : 0;
  for (const k in a.gear) { const it = ITEMS[a.gear[k]]; if (it && it.hap) h += it.hap; }
  if (a.pat > now) h += 10;
  return clamp(h, 0, 100);
}
function visitorRate() {
  const happy = S.animals.filter(a => a.pen && a.happy >= 50).length;
  const vis = S.decor.reduce((s, d) => s + (ITEMS[d.item].vis || 0), 0);
  return happy * 0.5 + vis * 0.25; // coins per minute
}
function tick(live) {
  const now = Date.now(); let mins = (now - S.last) / 60000;
  if (live && mins < 0.05) return;
  S.last = now; mins = clamp(mins, 0, 720);
  for (const a of S.animals) a.full = clamp(a.full - mins * 0.5, 0, 100);
  if (live && mins < 5) for (const pen of S.pens) if (!(UI.screen === 'zone' && UI.zone === pen.zone) && Math.random() < .5) runAntic(pen, false);
  const k = 1 - Math.pow(0.8, mins * 4);
  for (const a of S.animals) a.happy = clamp(a.happy + (target(a, now) - a.happy) * k, 0, 100);
  S.tickets = Math.min(TICKET_CAP, S.tickets + visitorRate() * mins);
  save();
  if (live) refreshLive();
}
function refreshLive() {
  renderRes();
  if (DRAG) return;
  if (pendingRender && !UI.modal) { pendingRender = false; if (UI.screen === 'zone') { render(); return; } }
  if (UI.screen === 'map') $('#app').innerHTML = vMap();
  if (UI.screen === 'zone') document.querySelectorAll('.critter').forEach(el => {
    const a = animal(+el.dataset.aid); if (!a) return;
    const old = el.querySelector('.bubble'); if (old) old.remove();
    const nb = bubble(a); if (nb) el.insertAdjacentHTML('beforeend', nb);
    el.classList.toggle('asleep', a.nap > Date.now());
  });
}
// live antics in the pens you're looking at
setInterval(() => {
  if (UI.screen !== 'zone' || UI.zone === 'sanct' || DRAG || UI.modal || document.hidden) return;
  const now = Date.now();
  for (const pen of S.pens.filter(p => p.zone === UI.zone)) {
    if (!NEXT[pen.id]) NEXT[pen.id] = now + ri(1200, 4000);
    if (now >= NEXT[pen.id]) { NEXT[pen.id] = now + ri(4500, 8000); runAntic(pen, true); }
  }
}, 600);

function zoneTile(id) {

  const crowd = as.slice(0, lim).map(a => spec(a).e).join('') + (as.length > lim ? '…' : '');
  const pens = id === 'sanct' ? null : S.pens.filter(p => p.zone === id).length;

  const dec = id === 'sanct' ? '' : S.decor.filter(d => d.zone === id).map(d => ITEMS[d.item].e).join('');

// ---------- zone ----------
function critterHTML(a) {

  return `<button class="${cls}" data-aid="${a.id}" style="${style}" aria-label="${esc(a.name)} the ${esc(s.type)}${tip}" title="${esc(a.name)}: ${PP(a).n}${tip}">${spriteHTML(a, 38)}<span class="tag">${a.escaped ? '🕳️ ' : ''}${esc(a.name)}</span>${bubble(a)}</button>`;
}

    </div>

// ---------- drag and drop ----------
let DRAG = null, suppressClick = false;
function clearHi() { document.querySelectorAll('.drop-ok,.drop-full').forEach(x => x.classList.remove('drop-ok', 'drop-full')); }
function dropAt(x, y) { const el = document.elementFromPoint(x, y); return el ? el.closest('[data-drop]') : null; }
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.critter'); if (!el || e.button > 0) return;
  DRAG = { el, id: +el.dataset.aid, x0: e.clientX, y0: e.clientY, on: false, ghost: null };
});
document.addEventListener('pointermove', e => {
  if (!DRAG) return;
  if (!DRAG.on) {
    if (Math.hypot(e.clientX - DRAG.x0, e.clientY - DRAG.y0) < 8) return;
    DRAG.on = true;
    const g = document.createElement('div'); g.className = 'ghost'; g.innerHTML = spriteHTML(animal(DRAG.id), 44);
    document.body.appendChild(g); DRAG.ghost = g; DRAG.el.classList.add('dragging');
  }
  e.preventDefault();
  DRAG.ghost.style.left = e.clientX + 'px'; DRAG.ghost.style.top = e.clientY + 'px';
  clearHi();
  const t = dropAt(e.clientX, e.clientY);
  if (t) {
    const v = t.dataset.drop, a = animal(DRAG.id);
    if (v.startsWith('pen:')) { const pen = penById(+v.slice(4)); t.classList.add(a.pen === pen.id || penAnimals(pen.id).length < pen.cap ? 'drop-ok' : 'drop-full'); }
    else if (v.startsWith('cage:')) { const pid = +v.slice(5), n = penAnimals(pid).filter(x => x.caged && x !== a).length; t.classList.add(n < 2 ? 'drop-ok' : 'drop-full'); }
    else t.classList.add('drop-ok');
  }
}, { passive: false });
document.addEventListener('pointerup', e => {
  if (!DRAG) return; const d = DRAG; DRAG = null;
  if (!d.on) return;
  suppressClick = true; setTimeout(() => suppressClick = false, 60);
  d.ghost.remove(); d.el.classList.remove('dragging'); clearHi();
  const t = dropAt(e.clientX, e.clientY); if (t) dropOn(d.id, t, e.clientX, e.clientY);
});
document.addEventListener('pointercancel', () => { if (DRAG) { if (DRAG.ghost) DRAG.ghost.remove(); DRAG.el.classList.remove('dragging'); clearHi(); DRAG = null; } });
function placePos(id, box, x, y) { if (!box) return; const r = box.getBoundingClientRect(); POS[id] = { x: clamp((x - r.left) / r.width * 100, 8, 92), y: clamp((y - r.top) / r.height * 100, 16, 84) }; }
function moveAnimal(a, dest) {
  if (dest === 'sanct') { if (a.pen) { a.pen = null; a.caged = false; a.escaped = null; toast(`${a.name} is resting in the Sanctuary.`); } return true; }
  const pen = penById(dest); if (!pen) return false;
  if (a.pen === pen.id) return true;
  if (penAnimals(pen.id).length >= pen.cap) { toast(`That pen is full (${pen.cap} animals). Add space with a pen extension in ✏️ Edit zoo.`); return false; }
  const wasHome = a.escaped === pen.id;
  a.pen = pen.id; a.caged = false; a.escaped = null; const s = spec(a);
  if (wasHome) toast(`${a.name} is back home. "Aw, man. I was having fun."`);
  else toast(s.z === pen.zone ? `${a.name} loves it here!` : `${a.name} moved in, but would be happier in the ${ZONE[s.z].name}.`);
  return true;
}
function dropOn(id, t, x, y) {
  const a = animal(id), v = t.dataset.drop;
  if (v === 'sanct') { moveAnimal(a, 'sanct'); if (t.classList.contains('meadow')) placePos(id, t, x, y); }
  else if (v.startsWith('cage:')) {
    const pid = +v.slice(5);
    if (a.pen === pid || moveAnimal(a, pid)) {
      if (penAnimals(pid).filter(o => o.caged && o !== a).length >= 2) toast('The cage only fits 2 animals.');
      else if (!a.caged) { a.caged = true; a.escaped = null; toast(pick([`${a.name}: "This is SO unfair!"`, `Locked up! ${a.name} will think about what they did.`, `${a.name}: "I'm innocent, I tell you!"`, `${a.name} is in the naughty cage. No tunnelling, no fighting.`])); }
    }
  } else {
    const pid = +v.slice(4), wasCaged = a.caged && a.pen === pid;
    if (moveAnimal(a, pid)) { if (wasCaged) { a.caged = false; toast(`${a.name} is out of the cage. "FREEDOM!"`); } placePos(id, t.querySelector('.field'), x, y); }
  }
  save(); render();
}

let QS = null;
function setQ(q, cb) { QS = { q, input: '', result: null, picked: null, cb }; }
const NP_HINT = { num: 'Type your answer on the keypad (or your keyboard), then press Check.', money: 'Dollars and cents, e.g. 12.50', frac: 'Use / for fractions. Mixed numbers become improper fractions: 1 1/2 → 3/2', time: 'Use : for times, e.g. 2:45' };
function dispInner() {
  const q = QS.q, t = QS.input;

}
function numpadHTML(q) {

      : `<button class="${/\d/.test(k) ? '' : 'sym'}" data-act="key" data-k="${k}" ${done ? 'disabled' : ''} aria-label="${k === '⌫' ? 'Delete' : k === '−' ? 'Minus' : k === '/' ? 'Fraction bar' : k === ':' ? 'Colon' : k === '.' ? 'Decimal point' : k}">${k}</button>`).join('')}</div>
  </div>`;
}
function answersHTML(q) {

    return `<button data-act="answer" data-i="${i}" class="${c}" ${picked !== null ? 'disabled' : ''}><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`; }).join('')}</div>`;
}
function feedbackHTML() {
  const q = QS.q, ok = QS.result;
  const ans = q.kind === 'mc' ? q.opts[q.ans] : q.show;
  const typed = q.kind === 'num' && !ok ? `You typed <b>${esc((q.pre || '') + QS.input + (q.mode === 'num' || q.mode === 'frac' ? q.unit : ''))}</b>. ` : '';

}
function qBlockHTML() { const q = QS.q; return `<p class="qtext">${esc(q.q)}</p>${q.kind === 'mc' ? answersHTML(q) : numpadHTML(q)}${QS.result !== null ? feedbackHTML() : ''}`; }

  let s = QS.input;
  if (k === '⌫') s = s.slice(0, -1);

    else if (k === '.') { if (!part.includes('.')) s += (part === '' || part === '−' ? '0.' : '.'); }

  if (R.phase === 'q') return `<div class="screen-head"><h2>Race</h2><p>Answer correctly and ${esc(a.name)} gets a turbo boost!</p></div>

    <div style="margin-top:14px">${track}</div>`;
  const place = R.order.findIndex(i => R.lanes[i].mine);
  const done = R.phase === 'done' ? `<div class="card" style="margin-top:14px;text-align:center"><h3 style="font-size:30px">${place === 0 ? '🏆 You won!' : place === 1 ? '🥈 Second place!' : `${place === 2 ? '3rd' : '4th'} place`}</h3><p>${place === 0 ? `${esc(a.name)} earned 60 coins and feels fantastic.` : place === 1 ? `${esc(a.name)} earned 20 coins.` : 'Try shoes or a vehicle from the Shop for extra speed.'}</p>

let raceT = null;
function raceRun() {
  const R = UI.R; R.phase = 'run'; QS = null; R.lanes.forEach(l => l.prog = 0); render();
  clearInterval(raceT);
  raceT = setInterval(() => {
    if (!UI.R || UI.R !== R) { clearInterval(raceT); return; }
    R.lanes.forEach((l, i) => {
      if (R.order.includes(i)) return;
      l.prog += (l.spd + (l.mine ? R.boost : 0)) * 0.17 + Math.random() * 2.2;
      if (l.prog >= 100) { l.prog = 100; R.order.push(i); }
      const el = document.getElementById('run-' + i); if (el) el.style.left = (6 + l.prog * .82) + '%';

    if (ex) { S.decor = S.decor.filter(x => x !== ex); S.inv[ex.item] = inv(ex.item) + 1; toast(`${ITEMS[ex.item].n} moved back to your backpack.`); save(); render(); }
    else openModal({ type: 'decor', spot: i });
  },
  placeDecor(d) { const k = d.id; if (!inv(k)) return; S.inv[k]--; S.decor.push({ zone: UI.zone, spot: +d.spot, item: k }); closeModal(); toast(`${ITEMS[k].n} placed. Visitors will love it!`); save(); render(); },
  subj(d) { UI.subj = d.v; render(); },
  reward(d) { UI.reward = d.v; render(); },
  startMission() { if (UI.subj && UI.reward) startMission(); },
  answer(d) { if (!QS || QS.result !== null || QS.q.kind !== 'mc') return; QS.picked = +d.i; QS.result = QS.picked === QS.q.ans; finishQ(); },
  key(d) { pressKey(d.k); },
  submit() { submitQ(); },
  nextQ() { const M = UI.M; if (M.i >= M.qs.length - 1) { finishMission(); return; } M.i++; missionQ(); render(); const c = $('#qcard'); if (c && c.getBoundingClientRect().top < 0) c.scrollIntoView({ block: 'start' }); },
  shopTab(d) { UI.shopTab = d.v; render(); },
  shopZone(d) { UI.shopZone = d.v; render(); },
  buySp(d) {
    const s = SPECIES[+d.sp], qty = +($('#qty-' + s.i) || { value: 1 }).value, t = +($('#type-' + s.i) || { value: 0 }).value;
    if (!spend(s.p * qty)) return;
    const got = []; for (let i = 0; i < qty; i++) got.push(adopt(s.i, t));
    adoptedToast(got); save(); render(); bump('coins');
  },
  bundle(d) {
    const s = SPECIES[+d.sp], n = +d.n, cost = n === 10 ? 1000 : s.p * 4; if (!spend(cost)) return;
    const got = []; for (let i = 0; i < n; i++) got.push(adopt(s.i, ri(0, s.types.length - 1)));
    adoptedToast(got); save(); render(); bump('coins');
  },
  turtleRange() { const t = SP('Turtle'); if (!spend(500)) return; const got = t.types.map((_, i) => adopt(t.i, i)); adoptedToast(got); save(); render(); bump('coins'); },
  ultra(d) {
    const u = ULTRA_BY[d.k]; if (S.claimed[u.k]) return;
    if (d.mode === 'claim') { if (S.stats[u.subj].c < u.need) return; } else if (!spend(u.price)) return;
    const a = adopt(null, 0, u.k); a.name = u.n.split(' ')[0]; S.claimed[u.k] = true;
    news(`✨ The ${u.n} has arrived at your zoo!`); toast(`✨ The ${u.n} is waiting in the Sanctuary!`); save(); render(); bump('coins');
  },
  buyItem(d) {
    const it = ITEMS[d.id]; if (S.wood < (it.wood || 0)) { toast(`You need ${it.wood} wood. Choose wood as your mission reward!`); return; }
    if (!spend(it.price)) return; S.wood -= it.wood || 0;
    if (it.give) { for (const k in it.give) S[k] += it.give[k]; bump(Object.keys(it.give)[0]); } else S.inv[d.id] = inv(d.id) + 1;
    toast(`Bought: ${it.n}.`); save(); render(); bump('coins');
  },
  rosterF(d) { UI.rosterF = d.v; render(); },
  animal(d) { openModal({ type: 'animal', id: +d.aid }); },
  closeModal() { closeModal(); },
  feedOne(d) { const a = animal(+d.aid); if (!a || S.food < 1) return; S.food--; a.full = clamp(a.full + 50, 0, 100); a.happy = clamp(a.happy + 3, 0, 100); toast(`${a.name} munched happily.`); save(); renderModal(); renderRes(); bump('food'); },
  pat(d) { const a = animal(+d.aid); if (!a) return; a.pat = Date.now() + 10 * 60000; a.happy = clamp(a.happy + 5, 0, 100); toast(pick([`${a.name} loved that!`, `${a.name} wiggled with joy.`, `${a.name} wants another pat.`])); save(); renderModal(); },
  raceGo() { const sel = $('#raceSel'); if (sel) UI.pickA = +sel.value; UI.B = null; raceGo(); goTop(); },
  raceRun() { raceRun(); },
  battleGo() { const sel = $('#battleSel'); if (sel) UI.pickA = +sel.value; UI.R = null; clearInterval(raceT); battleGo(); goTop(); },
  battleNext() { const B = UI.B; B.hit = null; setQ(quickQ(), battleResolve); render(); },
  arenaBack() { clearInterval(raceT); UI.R = null; UI.B = null; QS = null; render(); },
  addCage(d) { const p = penById(+d.pen); if (!p || p.cage || !inv('cage')) return; S.inv.cage--; p.cage = true; toast('Naughty cage installed. Drag troublemakers into it!'); save(); render(); },
  removeCage(d) { const p = penById(+d.pen); if (!p || !p.cage) return; p.cage = false; penAnimals(p.id).forEach(a => a.caged = false); S.inv.cage = inv('cage') + 1; toast('Cage removed and back in your backpack.'); save(); render(); },
  sendHome(d) { const a = animal(+d.aid); if (!a || !a.escaped) return; const home = penById(a.escaped); if (!home) { a.escaped = null; } else if (penAnimals(home.id).length >= home.cap) { toast('Their home pen is full now!'); return; } else { a.pen = home.id; a.escaped = null; a.caged = false; toast(`${a.name} is back home. "Aw, man. I was having fun."`); } save(); render(); renderModal(); },
  uncage(d) { const a = animal(+d.aid); if (!a) return; a.caged = false; toast(`${a.name} is out of the cage. "FREEDOM!"`); save(); render(); renderModal(); },
  askReset() { openModal({ type: 'reset' }); },
  doReset() { closeModal(); fresh(); UI.M = null; UI.R = null; UI.B = null; QS = null; UI.screen = 'map'; UI.edit = false; for (const k in POS) delete POS[k]; save(); render(); toast('A brand new zoo!'); },
};

document.addEventListener('click', e => {
  if (suppressClick) { e.preventDefault(); e.stopPropagation(); return; }
  if (e.target.id === 'modal') { closeModal(); return; }
  const c = e.target.closest('.critter'); if (c) { openModal({ type: 'animal', id: +c.dataset.aid }); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn && !el.disabled) fn(el.dataset, el, e);
}, true);
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'nameInput') { const a = animal(+t.dataset.aid); if (!a) return; const v = t.value.trim().slice(0, 18); if (v) { a.name = v; toast(`Say hello to ${v}!`); } save(); render(); renderModal(); }
  else if (t.id && t.id.startsWith('gear-')) {
    const a = animal(+t.dataset.aid), slot = t.id.slice(5), old = a.gear[slot], v = t.value;
    if (old) S.inv[old] = inv(old) + 1;
    if (v) { S.inv[v] = inv(v) - 1; a.gear[slot] = v; } else delete a.gear[slot];
    save(); render(); renderModal();
  }
  else if (t.id === 'moveTo') { const a = animal(+t.dataset.aid); moveAnimal(a, t.value === 'sanct' ? 'sanct' : +t.value); save(); render(); renderModal(); }
  else if (t.id === 'raceSel' || t.id === 'battleSel') UI.pickA = +t.value;
});
document.addEventListener('input', e => { if (e.target.id === 'shopSearch') { UI.shopQ = e.target.value; const g = $('#shopGrid'); if (g) g.innerHTML = speciesCards(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.modal) { closeModal(); return; }
  if (UI.modal || /INPUT|SELECT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName)) return;
  const qOn = QS && (document.getElementById('npDisplay') || document.querySelector('.answers'));
  if (!qOn) return;
  if (QS.result !== null) { if (e.key === 'Enter') { const n = $('#nextBtn'); if (n) { e.preventDefault(); n.click(); } } return; }
  if (QS.q.kind === 'num') {
    const k = e.key;
    if (/^[0-9]$/.test(k) || k === '.' || k === '/' || k === ':') { e.preventDefault(); pressKey(k); }
    else if (k === '-') { e.preventDefault(); pressKey('−'); }
    else if (k === 'Backspace') { e.preventDefault(); pressKey('⌫'); }
    else if (k === 'Enter') { e.preventDefault(); submitQ(); }
    return;
  }
  const k = e.key.toLowerCase(), idx = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if (idx >= 0 && idx < QS.q.opts.length) ACT.answer({ i: idx });
});

// ---------- boot ----------
if (load()) tick(false); else { fresh(); save(); }
render();
setInterval(() => tick(true), 15000);
initDB();

</script>

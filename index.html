<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mission Zoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --ground:#E7F0E0; --surface:#F7FBF3; --surface-2:#DCE9D3; --ink:#17301F; --ink-soft:#4A6450; --line:#B6CCAC;
  --sign:#FFC928; --sign-ink:#2A2100; --sign-edge:#C9970A; --coin:#C98B00; --water:#2F97BD; --berry:#C93563; --leaf:#2E8A4B;
  --plank:#7A4E2A; --plank-ink:#FFF5DF; --fence:#8B5E34;
  --g-farm:#9CCB6B; --g-savanna:#E3C27A; --g-jungle:#4E9E62; --g-ocean:#5EB9DA; --g-frost:#DDEFF6; --g-bush:#D9A064; --g-sanct:#B9DB91;
  --t-farm:#86B957; --t-savanna:#D3AE62; --t-jungle:#3E8A52; --t-ocean:#4AA8CB; --t-frost:#C8E3EE; --t-bush:#C98D52; --t-sanct:#A5CC7C;
  --shadow:0 2px 0 rgba(23,48,31,.18), 0 8px 20px -12px rgba(23,48,31,.35);
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1B14; --surface:#17261D; --surface-2:#213428; --ink:#E4F0E0; --ink-soft:#A6BEA8; --line:#2E4838;
    --sign:#FFC928; --sign-ink:#2A2100; --sign-edge:#A87B00; --coin:#F2B92B; --water:#5CC0E3; --berry:#F0648D; --leaf:#5DC47D;
    --plank:#5C3A1E; --plank-ink:#FFF0D2; --fence:#9C6B3E;
    --g-farm:#4F7A34; --g-savanna:#8E7336; --g-jungle:#26603A; --g-ocean:#1E6E8E; --g-frost:#5C8494; --g-bush:#8C5B2F; --g-sanct:#4E7236;
    --t-farm:#45702C; --t-savanna:#80672E; --t-jungle:#1F5531; --t-ocean:#19627F; --t-frost:#527786; --t-bush:#7E5028; --t-sanct:#44672E;
    --shadow:0 2px 0 rgba(0,0,0,.35), 0 8px 20px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1B14; --surface:#17261D; --surface-2:#213428; --ink:#E4F0E0; --ink-soft:#A6BEA8; --line:#2E4838;
  --sign:#FFC928; --sign-ink:#2A2100; --sign-edge:#A87B00; --coin:#F2B92B; --water:#5CC0E3; --berry:#F0648D; --leaf:#5DC47D;
  --plank:#5C3A1E; --plank-ink:#FFF0D2; --fence:#9C6B3E;
  --g-farm:#4F7A34; --g-savanna:#8E7336; --g-jungle:#26603A; --g-ocean:#1E6E8E; --g-frost:#5C8494; --g-bush:#8C5B2F; --g-sanct:#4E7236;
  --t-farm:#45702C; --t-savanna:#80672E; --t-jungle:#1F5531; --t-ocean:#19627F; --t-frost:#527786; --t-bush:#7E5028; --t-sanct:#44672E;
  --shadow:0 2px 0 rgba(0,0,0,.35), 0 8px 20px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 96px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em;line-height:1.1;text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto}
.em{font-family:var(--emoji);line-height:1}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);padding-block:12px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-size:30px;color:var(--ink)}
.brand .badge{background:var(--sign);color:var(--sign-ink);font-family:var(--display);font-size:13px;padding:3px 8px;border-radius:6px;transform:rotate(-4deg);box-shadow:0 2px 0 var(--sign-edge)}
.res{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;font-weight:700;font-variant-numeric:tabular-nums}
.pill .em{font-size:18px}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.12);border-color:var(--sign)}}

/* ---------- signpost nav ---------- */
.nav{display:flex;gap:8px;flex-wrap:wrap;padding-block:12px 4px}
.nav button{display:flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:8px 14px 8px 10px;background:var(--surface);color:var(--ink);font-family:var(--display);font-size:17px;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.nav button .em{font-size:22px}
.nav button:hover{transform:translateY(-1px)}
.nav button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.nav button[aria-current="true"]{background:var(--sign);color:var(--sign-ink);box-shadow:0 3px 0 var(--sign-edge)}
@media (max-width:560px){ .nav button{font-size:15px;padding:7px 10px 7px 8px} .nav button .em{font-size:19px} .brand h1{font-size:25px} }

main{padding-block:14px 24px}
.screen-head{display:flex;flex-wrap:wrap;align-items:end;gap:8px 16px;margin-bottom:16px}
.screen-head h2{font-size:34px}
.screen-head p{margin:0;color:var(--ink-soft);max-width:60ch}
.muted{color:var(--ink-soft)}
.small{font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:9px 16px;font-weight:700;background:var(--surface-2);color:var(--ink);box-shadow:0 3px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.go{background:var(--sign);color:var(--sign-ink);box-shadow:0 3px 0 var(--sign-edge)}
.btn.leaf{background:var(--leaf);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.btn.warn{background:var(--berry);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{padding:6px 10px;font-size:14px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px}

/* ---------- map ---------- */
.map-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:900px){.map-layout{grid-template-columns:1fr}}
.parkmap{background:var(--surface-2);border-radius:22px;padding:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;position:relative;border:3px solid var(--line)}
@media (max-width:700px){.parkmap{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.parkmap{grid-template-columns:1fr}}
.zone-tile{position:relative;border:0;text-align:left;border-radius:16px;min-height:170px;padding:44px 12px 12px;background:var(--g);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .12s}
.zone-tile:hover{transform:translateY(-2px) rotate(-.3deg)}
.zone-tile::before{content:"";position:absolute;inset:0;background:var(--tex);opacity:.9;pointer-events:none}
.zone-tile > *{position:relative}
.zone-tile .plank{position:absolute;top:10px;left:10px;background:var(--plank);color:var(--plank-ink);font-family:var(--display);font-size:19px;padding:4px 12px 5px;border-radius:6px;box-shadow:0 3px 0 rgba(0,0,0,.25);transform:rotate(-1.5deg)}
.zone-tile .crowd{font-family:var(--emoji);font-size:26px;letter-spacing:2px;line-height:1.25;min-height:34px;word-break:break-all}
.zone-tile .zmeta{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.zmeta span{background:rgba(255,255,255,.78);color:#17301F;font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px}
.zone-tile.sanct{grid-column:1 / -1;min-height:120px}
.z-farm{--g:var(--g-farm);--tex:repeating-linear-gradient(100deg,transparent 0 22px,var(--t-farm) 22px 26px)}
.z-savanna{--g:var(--g-savanna);--tex:radial-gradient(circle at 20% 30%,var(--t-savanna) 0 6px,transparent 7px) 0 0/46px 40px}
.z-jungle{--g:var(--g-jungle);--tex:radial-gradient(ellipse at 50% 100%,var(--t-jungle) 0 14px,transparent 15px) 0 0/34px 30px}
.z-ocean{--g:var(--g-ocean);--tex:radial-gradient(ellipse at 50% 0,transparent 0 11px,var(--t-ocean) 12px 14px,transparent 15px) 0 0/40px 18px}
.z-frost{--g:var(--g-frost);--tex:radial-gradient(circle,var(--t-frost) 0 3px,transparent 4px) 0 0/22px 22px}
.z-bush{--g:var(--g-bush);--tex:repeating-linear-gradient(45deg,transparent 0 16px,var(--t-bush) 16px 19px)}
.z-sanct{--g:var(--g-sanct);--tex:radial-gradient(circle at 30% 40%,var(--t-sanct) 0 8px,transparent 9px) 0 0/52px 44px}
.side{display:grid;gap:14px}
.booth{background:var(--sign);color:var(--sign-ink);border-radius:16px;padding:16px;box-shadow:0 4px 0 var(--sign-edge)}
.booth h3{font-size:22px}
.booth .big{font-family:var(--display);font-size:38px;line-height:1}
.booth .btn{background:var(--ink);color:var(--ground);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.stars{font-size:20px;letter-spacing:2px;color:var(--coin)}
.news{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px;font-size:14px}
.news li{padding-bottom:8px;border-bottom:1px dashed var(--line)}
.news li:last-child{border:0}
.hint{display:flex;gap:12px;align-items:center;background:var(--surface);border:2px dashed var(--sign-edge);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.hint .em{font-size:30px}

/* ---------- zone view ---------- */
.zone-banner{border-radius:18px;padding:16px;background:var(--g);position:relative;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.zone-banner::before{content:"";position:absolute;inset:0;background:var(--tex);pointer-events:none}
.zone-banner > *{position:relative}
.zone-banner .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.zone-banner h2{font-size:32px;background:var(--plank);color:var(--plank-ink);padding:4px 14px 6px;border-radius:8px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.zone-banner .loves{margin-top:10px;background:rgba(255,255,255,.8);color:#17301F;border-radius:10px;padding:6px 10px;font-size:14px;display:inline-block}
.zone-banner .loves .em{font-size:18px;letter-spacing:1px}
.pens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.pens{grid-template-columns:1fr}}
.pen{border-radius:14px;background:var(--g);position:relative;padding:10px;border:6px dashed var(--fence);box-shadow:var(--shadow)}
.pen.drop-ok{outline:4px dashed var(--sign);outline-offset:3px}
.pen.drop-full{outline:4px dashed var(--berry);outline-offset:3px}
.pen-sign{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:2}
.pen-sign b{background:var(--plank);color:var(--plank-ink);font-family:var(--display);font-weight:400;padding:2px 10px;border-radius:6px;font-size:16px}
.pen-sign .cap{background:rgba(255,255,255,.85);color:#17301F;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:700}
.field{position:relative;border-radius:10px;background:var(--tex);margin-top:8px}
.pen-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;position:relative;z-index:2}
.plot-empty{border:3px dashed var(--line);border-radius:14px;min-height:260px;display:grid;place-items:center;text-align:center;padding:16px;color:var(--ink-soft);background:var(--surface)}
.decor-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:640px){.decor-row{grid-template-columns:repeat(3,minmax(0,1fr))}}
.spot{aspect-ratio:1;width:100%;max-width:92px;justify-self:center;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;background:var(--surface);font-size:34px}
.spot.filled{border-style:solid;border-color:transparent;background:var(--surface-2)}
button.spot{cursor:pointer}
.edit-bar{background:var(--sign);color:var(--sign-ink);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* critters */
.critter{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;touch-action:none;user-select:none;-webkit-user-select:none;transition:left 2.2s ease-in-out,top 2.2s ease-in-out;z-index:1;display:flex;flex-direction:column;align-items:center;cursor:grab}
.critter .tag{font-size:11px;font-weight:700;background:rgba(255,255,255,.88);color:#17301F;border-radius:6px;padding:0 5px;margin-top:-2px;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.critter .bubble{position:absolute;top:-14px;right:-10px;font-size:14px;font-family:var(--emoji)}
.critter:hover{z-index:3}
.critter.dragging{opacity:.25}
.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-60%) scale(1.25);filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.sprite{position:relative;display:inline-block;font-family:var(--emoji);font-size:var(--sz,34px);line-height:1}
.sprite .spr{display:inline-block}
.bob .spr{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.sprite .g-hat{position:absolute;left:50%;top:-.42em;transform:translateX(-50%);font-size:.55em}
.sprite .g-shoes{position:absolute;right:-.15em;bottom:-.1em;font-size:.4em}
.sprite .g-ride{position:absolute;left:50%;bottom:-.34em;transform:translateX(-50%);font-size:.6em;z-index:-1}
.sprite .spark{position:absolute;left:-.25em;top:-.2em;font-size:.45em;animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.2;transform:scale(.7)}}
.u-golden .spr{filter:sepia(1) saturate(5) hue-rotate(-8deg) brightness(1.08) drop-shadow(0 0 5px #FFCF40)}
.u-rainbow .spr{animation:rainbow 3s linear infinite}
@keyframes rainbow{from{filter:saturate(3) hue-rotate(0deg) drop-shadow(0 0 5px #ff7ad9)}to{filter:saturate(3) hue-rotate(360deg) drop-shadow(0 0 5px #7ad9ff)}}
.u-diamond .spr{filter:grayscale(1) brightness(1.7) contrast(1.2) drop-shadow(0 0 3px #7FE3FF) drop-shadow(0 0 9px #B8F2FF)}
.u-sparkly .spr{filter:saturate(2.4) brightness(1.1) drop-shadow(0 0 7px #FFE066)}
.tray{position:sticky;bottom:0;margin-top:16px;background:var(--surface);border:3px solid var(--line);border-radius:16px 16px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 -8px 20px -14px rgba(0,0,0,.4)}
.tray.drop-ok{border-color:var(--sign)}
.tray-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.tray-head b{font-family:var(--display);font-weight:400;font-size:18px}
.tray-list{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 4px}
.tray-list:empty{display:none}
.chip{touch-action:pan-x;position:relative;transform:none;left:auto;top:auto;flex:0 0 auto;background:var(--g-sanct);border-radius:12px;padding:8px 6px 4px;min-width:66px;transition:none}
.meadow{position:relative;min-height:420px;border-radius:18px;background:var(--g-sanct);overflow:hidden;box-shadow:var(--shadow)}
.meadow::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,var(--t-sanct) 0 8px,transparent 9px) 0 0/52px 44px}

/* ---------- missions ---------- */
.choose{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.choose{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt-card{border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:132px}
.opt-card .em{font-size:30px}
.opt-card h3{font-size:21px}
@media (max-width:420px){.opt-card h3{font-size:18px}}
.opt-card[aria-pressed="true"]{border-color:var(--sign-edge);background:var(--sign);color:var(--sign-ink)}
.opt-card[aria-pressed="true"] .muted{color:var(--sign-ink)}
.rewards{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.rewards{grid-template-columns:1fr}}
.step-label{font-family:var(--display);font-size:20px;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.step-label i{font-style:normal;background:var(--ink);color:var(--ground);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.mission{display:grid;gap:16px}
.mission.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
@media (max-width:860px){.mission.two{grid-template-columns:1fr}}
.passage{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:18px 20px;font-size:17px;line-height:1.65}
.passage h3{font-size:24px;margin-bottom:8px}
.passage p{max-width:65ch;margin:0 0 12px}
.qcard{background:var(--surface);border:3px solid var(--ink);border-radius:16px;padding:18px;box-shadow:6px 6px 0 var(--sign)}
.progress{display:flex;gap:6px;margin-bottom:12px}
.progress span{flex:1;height:8px;border-radius:99px;background:var(--surface-2)}
.progress span.ok{background:var(--leaf)}
.progress span.bad{background:var(--berry)}
.progress span.now{background:var(--sign)}
.qtext{font-size:20px;font-weight:700;line-height:1.4;margin:0 0 14px}
.answers{display:grid;gap:10px}
.answers button{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--ground);border-radius:12px;padding:10px 12px;font-size:17px}
.answers button:hover:not([disabled]){border-color:var(--ink)}
.answers button b{flex:0 0 30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font-family:var(--display);font-weight:400}
.answers button.right{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 18%,var(--ground))}
.answers button.right b{background:var(--leaf);color:#fff}
.answers button.wrong{border-color:var(--berry);background:color-mix(in srgb,var(--berry) 14%,var(--ground))}
.answers button.wrong b{background:var(--berry);color:#fff}
.answers button[disabled]{cursor:default}
.explain{margin-top:14px;border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.explain strong{font-family:var(--display);font-weight:400;font-size:20px;display:block}
.result{text-align:center;padding:26px 16px}
.result .big{font-family:var(--display);font-size:54px;line-height:1}

/* ---------- shop ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tabs button{flex:0 0 auto;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;min-width:0;width:220px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.item{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.item .top-row{display:flex;gap:10px;align-items:center}
.item .top-row .em{font-size:40px}
.item h3{font-size:19px}
.item .price{font-weight:700;color:var(--coin);font-variant-numeric:tabular-nums}
.item select{width:100%;border:2px solid var(--line);background:var(--ground);border-radius:8px;padding:5px 8px}
.item .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .row select{width:auto}
.item .grow{margin-top:auto}

// Build a question: correct answer + candidate wrong answers (first 3 unique ones are used)
function Q(q, correct, wrongs, e) {
  correct = String(correct);
  const seen = new Set([correct]), w = [];
  for (const x of wrongs) { const s = String(x); if (!seen.has(s) && s !== 'NaN' && s !== '') { seen.add(s); w.push(s); } if (w.length === 3) break; }
  const opts = shuffle([correct, ...w]);
  return { kind: 'mc', q, opts, ans: opts.indexOf(correct), e };
}

ve voice, the subject does the action."],["Which sentence is written in the passive voice?",["The cake was eaten by the children.","The children ate the cake.","The children are eating cake.","The children will eat the cake."],"In the passive voice, the thing receiving the action comes first."],["Change to the passive voice: \"The wind knocked over the bin.\"",["The bin was knocked over by the wind.","The wind was knocked over by the bin.","The bin knocked over the wind.","The wind is knocking over the bin."],"The object \"the bin\" becomes the subject."],["Which is the correct direct speech for: Tom said that he was hungry.",["Tom said, \"I am hungry.\"","Tom said, \"He is hungry.\"","Tom said \"I was hungry\".","\"Tom said I am hungry.\""],"In direct speech, use the speaker's exact words: \"I am hungry\"."],["Ella said, \"We are leaving now.\" Which is the correct reported speech?",["Ella said that they were leaving then.","Ella said that we are leaving now.","Ella said, they were leaving now.","Ella said that \"they were leaving\"."],"Pronouns and tense shift back in reported speech."],["Which sentence uses the best conjunction?",["I will come to the party if I finish my chores.","I will come to the party but I finish my chores.","I will come to the party so I finish my chores.","I will come to the party or I finish my chores."],"\"if\" shows a condition."],["Choose the best conjunction: \"___ it was cold, we went swimming.\"",["Although","Because","So","Unless"],"\"Although\" shows a surprising contrast."],["Choose the best conjunction: \"You can't go out ___ you finish your homework.\"",["until","because","although","and"],"\"until\" shows when something can happen."],["Choose the best connective: \"The bridge was closed. ___, we took the long way.\"",["Therefore","However","Meanwhile","For example"],"\"Therefore\" shows a result."],["Choose the best connective: \"The plan was clever. ___, it did not work.\"",["However","Therefore","Firstly","Because"],"\"However\" introduces a contrast."],["Which word best fills the gap? \"She won the race ___ she had a sore foot.\"",["even though","because","so","therefore"],"\"even though\" shows something surprising."],["Which prefix makes the opposite of \"honest\"?",["dis","un","im","mis"],"dishonest"],["Which prefix makes the opposite of \"legal\"?",["il","un","dis","im"],"illegal: \"il-\" is used before l."],["Which prefix makes the opposite of \"regular\"?",["ir","un","dis","im"],"irregular: \"ir-\" is used before r."],["Which prefix makes the opposite of \"patient\"?",["im","un","dis","in"],"impatient: \"im-\" is often used before p."],["Which prefix makes the opposite of \"visible\"?",["in","un","dis","im"],"invisible"],["Which prefix makes the opposite of \"understand\"?",["mis","dis","un","im"],"misunderstand means to understand wrongly."],["Which prefix means \"again\"?",["re","pre","dis","sub"],"redo, rewrite, rebuild"],["Which prefix means \"before\"?",["pre","re","post","anti"],"preview, prehistoric"],["Which prefix means \"under\" or \"below\"?",["sub","super","over","inter"],"submarine, subway"],["Which prefix means \"against\"?",["anti","pre","pro","co"],"antiseptic, anticlockwise"],["Which suffix turns \"enjoy\" into a noun?",["ment","ly","ful","est"],"enjoyment"],["Which suffix turns \"kind\" into a noun?",["ness","ly","ful","able"],"kindness"],["Which suffix turns \"hope\" into an adjective?",["ful","ment","ness","ly"],"hopeful"],["Which suffix turns \"comfort\" into an adjective?",["able","ment","ness","ly"],"comfortable"],["Which word is formed correctly?",["happiness","happyness","happieness","hapiness"],"Consonant + y: change y to i before adding -ness."],["Which word is formed correctly?",["beautiful","beautyful","beautifull","beutiful"],"beauty + ful: change y to i, and -ful has one l."],["Which word is formed correctly?",["making","makeing","makking","maiking"],"Drop the final e before adding -ing."],["Which word is formed correctly?",["stopped","stoped","stopt","stopd"],"Short vowel + single consonant: double it before -ed."],["Which word is formed correctly?",["carefully","carefuly","carfully","carefullly"],"careful + ly = carefully."],["Which word is formed correctly?",["argument","arguement","argumint","argemint"],"argue drops its e before -ment."],["What is the plural of \"leaf\"?",["leaves","leafs","leafes","leavs"],"leaf changes f to -ves."],["What is the plural of \"child\"?",["children","childs","childes","childrens"],"child has an irregular plural."],["What is the plural of \"tooth\"?",["teeth","tooths","teeths","toothes"],"tooth becomes teeth."],["What is the plural of \"potato\"?",["potatoes","potatos","potatose","potatoe"],"Some words ending in o add -es."],["What is the plural of \"box\"?",["boxes","boxs","boxies","boxen"],"Words ending in x add -es."],["What is the plural of \"church\"?",["churches","churchs","churchies","churchen"],"Words ending in ch add -es."],["What is the plural of \"monkey\"?",["monkeys","monkies","monkeies","monkeyes"],"Vowel + y: just add s."],["What is the plural of \"knife\"?",["knives","knifes","knifs","knivs"],"knife changes to knives."],["What is the plural of \"sheep\"?",["sheep","sheeps","sheepes","shoop"],"sheep stays the same."],["What is the plural of \"woman\"?",["women","womans","womens","womanes"],"woman becomes women."],["What is the plural of \"person\"?",["people","persones","peoples","persen"],"The usual plural of person is people."],["What is the plural of \"goose\"?",["geese","gooses","geeses","goosen"],"goose becomes geese."],["What is the plural of \"hero\"?",["heroes","heros","heroies","heroe"],"hero adds -es."],["What is the plural of \"berry\"?",["berries","berrys","berryes","berres"],"Consonant + y: change y to i and add -es."],["Complete the collective noun: \"a ___ of bees\"",["swarm","herd","pride","pack"],"A group of bees is a swarm."],["Complete the collective noun: \"a ___ of cows\"",["herd","swarm","school","flock"],"A group of cows is a herd."],["C et us\"?",["let's","lets","le'ts","lets'"],"The apostrophe replaces the u."],["What is the contraction of \"could have\"?",["could've","could of","coul've","couldve'"],"\"could have\" becomes \"could've\" (never \"could of\")."],["What does \"didn't\" stand for?",["did not","do not","does not","had not"],"didn't = did not."],["What does \"she'd\" stand for in \"She'd already left\"?",["she had","she would","she did","she should"],"Before \"already left\", she'd means \"she had\"."],["What does \"e.g.\" mean?",["for example","and so on","that is","the end"],"e.g. comes from Latin \"exempli gratia\": for example."],["Which word best replaces \"said\" to show someone was frightened?",["stammered","boasted","chuckled","announced"],"Stammering suggests nervousness."],["Which word best replaces \"said\" to show someone was proud of themselves?",["boasted","whimpered","mumbled","sobbed"],"To boast is to talk proudly about yourself."],["Which word best replaces \"went\" in: \"The mouse went into its hole.\"",["scurried","lumbered","marched","strolled"],"\"scurried\" suits a small, quick animal."],["Which word best replaces \"big\" in a description of a mountain?",["towering","tiny","narrow","shallow"],"\"towering\" suggests great height."],["Which word best replaces \"nice\" in: \"We had a nice time at the fair.\"",["wonderful","nicey","okay","average"],"\"wonderful\" is a stronger, more precise word."],["Which verb best shows an elephant moving heavily?",["lumbered","skipped","darted","fluttered"],"\"lumbered\" suggests slow, heavy movement."],["Which verb best shows a hummingbird moving?",["darted","plodded","lumbered","trudged"],"\"darted\" suggests quick, sudden movement."],["Which sentence uses formal language?",["We regret to inform you that the event is cancelled.","Sorry guys, the thing's off.","Yeah, nah, it's not happening.","Bad news, the party's cancelled lol."],"Formal language avoids slang and uses polite, complete sentences."],["Which sentence uses informal language?",["Hey, wanna grab a snack?","Would you like some refreshments?","Refreshments will be served at noon.","Please help yourself to the food provided."],"\"wanna\" and \"grab a snack\" are informal."]];

const PASSAGES = [{"t":"Little Travellers","p":["Every summer, female loggerhead turtles haul themselves up the beaches of eastern Australia at night. Using their back flippers, each turtle digs a deep hole in the sand and lays around one hundred soft, leathery eggs. Then she covers the nest and returns to the sea, never to see her young.","About eight weeks later, the hatchlings break out of their shells. They usually wait until the sand cools after sunset before bursting out together. Scientists believe the brightest horizon, normally moonlight reflecting off the ocean, guides them towards the water. This is why bright lights from houses and streets can be so dangerous: confused hatchlings may crawl inland instead.","Only a tiny number of hatchlings survive to become adults. Yet those that do may one day return to the very same beach to lay eggs of their own."],"qs":[["Why do hatchlings usually leave the nest after sunset?",["The sand has cooled down.","Their mothers come back for them.","Predators sleep during the day.","The tide is always high at night."],"The passage says they wait until the sand cools after sunset."],["Why can street lights be dangerous to hatchlings?",["They may follow the lights inland instead of going to the sea.","The lights heat the sand too much.","The lights scare the mother turtles.","The lights wake the hatchlings too early."],"Hatchlings head for the brightest horizon, so bright lights can lead them away from the ocean."],["The words \"haul themselves\" suggest the turtles move:",["with great effort","very quickly","gracefully","in a big group"],"To haul is to pull something heavy with effort."],["What is the main idea of the passage?",["A loggerhead turtle's journey from egg to sea is risky and remarkable.","Street lights should be banned everywhere.","Turtles are the fastest swimmers in the ocean.","Scientists have counted every turtle nest in Australia."],"The whole passage follows the turtles from nest to sea and shows the dangers."],["Which statement is supported by the text?",["A mother turtle does not raise her babies.","Hatchlings break out one at a time over many days.","Most hatchlings grow into adults.","Turtles lay their eggs in the morning."],"The mother returns to the sea \"never to see her young\"."]]},{"t":"The New Keeper","p":["On her first morning at Riverbend Zoo, Priya arrived twenty minutes early and read the feeding chart three times. \"Carrots for the tapirs, fish for the otters, and nothing for the pelicans until ten,\" she muttered, tapping each line with her finger.","Mr Hale, the head keeper, handed her a bucket. \"The otters will try to charm you,\" he warned. \"Don't give them extra, no matter how sad they look.\"","At the otter pool, two sleek heads popped up. The otters rolled onto their backs, clapped their paws and squeaked pitifully. Priya glanced over her shoulder, then back at the bucket. She counted out exactly six fish, dropped them in, and stepped firmly away from the rail.","Behind her, Mr Hale smiled and made a small tick on his clipboard."],"qs":[["Why did Priya read the feeding chart three times?",["She was anxious to get everything right.","She could not read very well.","The chart kept changing.","Mr Hale told her to."],"Arriving early and re-reading shows she was nervous about making mistakes."],["Why did the otters clap and squeak?",["To trick Priya into giving them extra food.","Because they were hurt.","To greet Mr Hale.","Because they had eaten too much."],"Mr Hale warned that the otters would try to charm her."],["What does Mr Hale's tick on the clipboard most likely mean?",["Priya passed a small test.","The otters had eaten enough for the week.","Priya had made a mistake.","It was time to feed the pelicans."],"He smiled as he ticked, so he was pleased she resisted the otters."],["\"squeaked pitifully\" means the otters squeaked in a way that:",["made them seem sad and in need","sounded angry","was very quiet","sounded like music"],"Pitiful means causing others to feel sorry for you."],["Which word best describes Priya?",["conscientious","careless","lazy","rude"],"Conscientious means careful and wanting to do a job well."]]},{"t":"The Bamboo Puzzle","p":["Giant pandas belong to the bear family, and their teeth and stomachs are built much like those of meat-eating animals. Yet almost all of their diet is bamboo, a tough grass that is low in nutrition. To survive, a panda must eat for up to fourteen hours a day, munching through as much as twelve kilograms of bamboo.","Because bamboo provides so little energy, pandas save effort wherever they can. They move slowly, rest often and rarely climb high. Scientists have even found that pandas make unusually low amounts of certain hormones that control how fast the body burns energy.","Why would a bear choose such a poor food? One explanation is competition. Bamboo grows in huge amounts and few other animals eat it, so pandas rarely have to fight for their dinner."],"qs":[["Why must pandas eat for so many hours each day?",["Bamboo gives them very little energy.","They are always being chased.","Bamboo is hard to find.","They are larger than other bears."],"Bamboo is \"low in nutrition\", so they need a lot of it."],["According to the passage, why might pandas eat bamboo?",["Few other animals compete for it.","It tastes sweeter than meat.","Their teeth cannot chew meat.","It helps them climb higher."],"The last paragraph says few other animals eat it, so pandas rarely fight for dinner."],["Which detail shows that pandas save energy?",["They rarely climb high.","They belong to the bear family.","Bamboo is a type of grass.","They eat up to twelve kilograms."],"Moving slowly, resting and rarely climbing are ways of saving effort."],["In the first paragraph, the word \"Yet\" is used to show:",["a surprising contrast","a list of reasons","the passing of time","an example"],"Their bodies suit meat, yet they eat bamboo. That is a contrast."],["The writer's main purpose is to:",["explain why pandas live on a diet of bamboo","persuade people to plant bamboo","tell a made-up story about a panda","compare pandas with polar bears"],"The passage gives facts and reasons about the panda's diet."]]},{"t":"Scout","p":["The sheep had scattered across the paddock like spilt rice by the time the storm clouds rolled in. Old Tom leaned on his stick and whistled once, long and low.","Scout was off before the sound had faded. The young kelpie ran wide, curving around the far side of the flock so she would not startle them towards the creek. When a stubborn ewe refused to move, Scout did not bark or snap. She simply crouched, fixed the ewe with a steady stare, and inched forward until the ewe turned and trotted to join the others.","By the time the first fat raindrops fell, the whole flock was bunched inside the yard. Tom swung the gate shut and scratched Scout behind the ears. \"Not bad for a pup,\" he said, but he was grinning."],"qs":[["Why did Scout run wide around the flock?",["So the sheep would not panic and run towards the creek.","Because she was chasing a rabbit.","Because Tom wanted her to take the long way.","So she could stay out of the rain."],"She curved around \"so she would not startle them towards the creek\"."],["\"scattered across the paddock like spilt rice\" is an example of:",["a simile","a metaphor","onomatopoeia","personification"],"It compares the sheep to spilt rice using \"like\"."],["How did Scout move the stubborn ewe?",["By staring steadily and creeping closer","By barking loudly","By nipping its legs","By pushing it with her nose"],"She crouched, stared and inched forward."],["What does Tom's grin suggest?",["He is prouder of Scout than his words show.","He thinks Scout did a poor job.","He is laughing at the stubborn ewe.","He is happy that it is raining."],"His words are modest, but the grin shows he is really pleased."],["Why did Scout need to work quickly?",["A storm was about to arrive.","Tom was late for dinner.","The gate was broken.","The sheep were hungry."],"The storm clouds were rolling in and rain was coming."]]},{"t":"Reef Partners","p":["On a coral reef, a clownfish darts in and out of the waving tentacles of a sea anemone. For most small fish this would be a deadly mistake, because anemone tentacles are armed with stinging cells. The clownfish, however, is covered in a special layer of mucus that stops the anemone from stinging it.","This partnership helps both animals. The anemone gives the clownfish a safe home where predators dare not follow. In return, the clownfish chases away fish that like to nibble on anemones, and its droppings provide the anemone with nutrients. Scientists call a relationship like this, where both partners benefit, mutualism.","Clownfish rarely stray more than a few metres from their anemone. For them, home is not just a place to rest; it is their shield."],"qs":[["What protects the clownfish from being stung?",["A special layer of mucus","Its bright orange colour","Its speed","Its hard scales"],"The first paragraph explains the mucus layer."],["How does the anemone benefit from the clownfish?",["The clownfish chases away fish that eat anemones.","The clownfish builds it a shelter.","The clownfish cleans the coral.","The clownfish brings it baby fish to eat."],"The second paragraph lists how the clownfish helps in return."],["Which of these is another example of mutualism?",["Bees drink nectar from flowers and carry their pollen.","A lion hunts a zebra.","A tick feeds on a dog and makes it itchy.","A cat sleeps in the sun."],"Both the bee and the flower benefit, just like the clownfish and anemone."],["\"home is not just a place to rest; it is their shield\" means:",["The anemone protects the clownfish from danger.","Clownfish carry shields.","Clownfish never sleep.","The anemone is shaped like a shield."],"A shield protects you. The anemone keeps predators away."],["\"predators dare not follow\" suggests predators are:",["afraid of the anemone","too slow","not hungry","friends with the clownfish"],"If you dare not do something, you are too scared to do it."]]},{"t":"The Big Race","p":["Everyone at Hill Street Primary expected Jonah to win the 800 metres. He had won it three years in a row, and his name was already painted in gold on the sports board.","Halfway through the race, Jonah glanced back. Ellie, the new girl, was only a few strides behind, her face calm and her arms pumping like pistons. Jonah's chest tightened. He pushed harder, but his legs felt heavy, as if his shoes were filled with sand.","On the final bend, Ellie drew level. For a moment they ran side by side, and then she edged ahead, crossing the line half a step in front.","Jonah bent over, gasping. When he looked up, Ellie was holding out her hand. After a long moment, he took it. \"Next year,\" he said, and to his own surprise, he was smiling."],"qs":[["Why did Jonah's chest tighten?",["He was worried Ellie might beat him.","He had hurt himself.","He was excited to see a friend.","He had forgotten where the finish was."],"He had just seen Ellie close behind him."],["\"arms pumping like pistons\" suggests Ellie was:",["running strongly and steadily","feeling nervous","slowing down","waving to the crowd"],"Pistons move powerfully in a steady rhythm."],["What does \"After a long moment, he took it\" suggest?",["Jonah needed time to accept losing.","Jonah did not see Ellie's hand.","Ellie had hurt Jonah's hand.","Jonah was looking for his shoes."],"The pause shows he found it hard at first."],["By the end of the story, Jonah feels:",["ready to accept the result and try again","furious with Ellie","glad he never has to race again","confused about who won"],"\"Next year\" and his smile show he accepts it and will try again."],["Which theme best fits the story?",["good sportsmanship","the danger of running","the importance of new shoes","how to cheat in a race"],"Both runners show respect after the race."]]},{"t":"The Lighthouse Keeper's Daughter","p":["For forty years, the light on Cape Wren had never gone out. Mara's grandfather had tended it, then her mother, and now, on the wildest night of the winter, it was Mara's turn, because her mother lay in bed with a fever and could barely lift her head.","The wind shrieked around the tower like something trying to get in. Mara climbed the ninety-two steps with a can of oil in each hand, counting under her breath to keep her legs moving. At the top, the great lamp was flickering. Salt spray had crusted the glass, and the wick had burned low.","She worked quickly, trimming the wick with shaking fingers and polishing the glass until her arms ached. Then she filled the reservoir and waited. The flame steadied, grew, and swept its long white arm across the black water.","Far out beyond the rocks, a ship's horn sounded twice. Mara did not know whose ship it was, and she never would. But she sat at the top of the tower until dawn, listening to the storm lose its temper, and she did not feel small at all."],"qs":[["Why was Mara looking after the light that night?",["Her mother was too sick to do it.","Her grandfather had asked her to.","She wanted to prove she was brave.","The usual keeper had gone to sea."],"The first paragraph says her mother had a fever and could barely lift her head."],["\"The wind shrieked around the tower like something trying to get in\" is an example of:",["a simile","alliteration","onomatopoeia","a rhetorical question"],"It compares the wind to something else using \"like\", so it is a simile."],["Why did Mara count the steps under her breath?",["To keep herself going while she was tired and scared","Because she had forgotten how many there were","To time how long the climb took","Because her mother had told her to"],"She counted \"to keep her legs moving\", which suggests she was struggling."],["What does the ship's horn sounding twice most likely suggest?",["A ship had seen the light and was safely steering clear of the rocks.","A ship was about to crash.","Someone on the ship knew Mara personally.","The storm was getting worse."],"The light warns ships about rocks. The horn suggests a ship had seen it and was signalling."],["How has Mara changed by the end of the story?",["She feels proud and capable.","She feels frightened and alone.","She has decided to leave Cape Wren.","She is angry with her mother."],"\"she did not feel small at all\" shows she feels confident after doing something important."]]},{"t":"How Bees Talk","p":["When a honeybee discovers a patch of flowers rich in nectar, she faces a problem. She cannot carry all of the food back herself, and she has no voice to tell her sisters where it is. Her solution is to dance.","Back inside the dark hive, the forager performs what scientists call the waggle dance. She runs in a straight line while shaking her body from side to side, then loops back around and repeats the run. The direction of the straight run tells the other bees which way to fly, measured as an angle from the position of the sun. The length of the waggle tells them how far away the flowers are: the longer she waggles, the further they must travel.","The watching bees press close, feeling the dancer's movements with their antennae and tasting samples of the nectar she brings. Then they set off to find the flowers for themselves.","The Austrian scientist Karl von Frisch spent years decoding this dance. In 1973 he shared a Nobel Prize for his work, which showed that even an insect with a brain smaller than a grain of rice can pass on surprisingly precise information."],"qs":[["What problem does the forager bee face?",["She cannot bring all the food home or tell others where it is.","She cannot find any flowers.","She is lost and cannot find the hive.","Other bees will not let her into the hive."],"The first paragraph explains she cannot carry it all and has no voice."],["What does the length of the waggle tell other bees?",["How far away the flowers are","Which direction to fly","How sweet the nectar is","How many flowers there are"],"\"the longer she waggles, the further they must travel.\""],["How do the watching bees sense the dance in the dark hive?",["By feeling it with their antennae","By watching it with their eyes","By listening to the buzzing","By smelling the flowers on her legs"],"The third paragraph says they feel the movements with their antennae."],["Why does the writer mention that a bee's brain is \"smaller than a grain of rice\"?",["To show how impressive the bee's communication is","To prove bees are not very clever","To explain why the dance is so slow","To compare bees with other insects"],"The small size makes the precise information even more surprising."],["Which is the best title for the second paragraph?",["How the Waggle Dance Works","Why Bees Need Nectar","The Life of Karl von Frisch","Dangers Inside the Hive"],"The second paragraph describes the steps and meaning of the dance."]]},{"t":"The Worst Birthday Present","p":["When Aunt Delphine handed Leo a lumpy parcel wrapped in newspaper, he already knew it would be terrible. Last year she had given him a book about the history of spoons. The year before, it was a pair of knitted socks with a separate pocket for each toe.","He tore off the paper. Inside was a small, battered wooden box with a brass clasp. Leo tried to look grateful. \"Thanks, Aunt Delphine,\" he said, in the voice he used for dentists.","\"It belonged to your great-grandfather,\" she said. \"Open it.\"","Inside, nested in faded red velvet, lay a compass. Its needle trembled and then swung firmly north. Under the lid, someone had scratched tiny letters: L.M. 1942 - ALWAYS FIND YOUR WAY HOME.","Leo's initials were L.M. too. He looked up at his aunt, and for the first time he noticed that her eyes were exactly the same grey as his own.","\"Thank you,\" he said again. This time, it came out in his real voice."],"qs":[["Why did Leo expect the present to be terrible?",["His aunt's previous presents had been strange and disappointing.","It was wrapped in newspaper.","His aunt did not like him.","He had asked for something else."],"The first paragraph lists the odd gifts from earlier years."],["What does \"in the voice he used for dentists\" suggest about how Leo said thank you?",["He was being polite but did not really mean it.","He was frightened of his aunt.","His teeth were hurting.","He was shouting."],"It suggests a forced, polite voice, not a genuine one."],["What is the significance of the letters scratched under the lid?",["They connect Leo to his great-grandfather, who had the same initials.","They tell Leo where treasure is hidden.","They were written by Aunt Delphine.","They show the compass is broken."],"L.M. matches Leo's own initials, linking him to his family history."],["What does Leo realise when he notices his aunt's eyes?",["He shares a family connection with her.","She is about to cry.","She needs glasses.","She has been playing a trick on him."],"Their matching grey eyes show a family likeness he had not noticed before."],["The contrast between the two times Leo says \"thank you\" shows that:",["his feelings changed from polite pretending to real gratitude","he forgot he had already said it","his aunt could not hear him the first time","he was being sarcastic both times"],"The second time it \"came out in his real voice\", showing genuine feeling."]]},{"t":"Why Leaves Change Colour","p":["In many parts of the world, autumn turns forests into a blaze of red, orange and gold. It looks as though the trees are putting on a show, but the colours are really a sign that the trees are preparing to shut down for winter.","All summer long, leaves are green because they are packed with chlorophyll, a chemical that captures sunlight and helps the tree make food. Chlorophyll is so plentiful that it hides other colours in the leaf, such as the yellow and orange of chemicals called carotenoids.","As the days shorten and nights grow cold, trees such as maples and oaks stop making new chlorophyll. The green slowly breaks down, and the hidden yellows and oranges finally show through. Some trees also produce new red and purple chemicals in autumn, which is why certain leaves turn crimson.","Eventually, a layer of cells forms where each leaf joins its twig, sealing it off. The leaf dries, loosens and falls. Most of Australia's native trees, such as eucalypts, keep their leaves all year round, so the most dramatic autumn colours here are usually found in parks and gardens planted with trees from colder countries."],"qs":[["Why are leaves green in summer?",["They are full of chlorophyll.","They are full of carotenoids.","They are sealed off from the tree.","They are getting ready to fall."],"Paragraph two explains that chlorophyll makes leaves green."],["According to the passage, where do the yellow and orange colours come from?",["They were in the leaf all along, hidden by the green.","The tree makes them only in winter.","They come from the soil.","They are caused by frost damage."],"The carotenoids were hidden by the plentiful chlorophyll."],["What causes trees to stop making chlorophyll?",["Shorter days and colder nights","Too much rain","Insects eating the leaves","The leaves turning red"],"Paragraph three says this happens \"as the days shorten and nights grow cold\"."],["Why are bright autumn colours less common in Australian bushland?",["Most native trees keep their leaves all year.","Australia has no autumn.","Australian trees have no chlorophyll.","The sun is too strong in Australia."],"Eucalypts and most natives keep their leaves year-round."],["What is the writer's main purpose?",["To explain the science behind autumn colours","To persuade people to plant maple trees","To describe a walk through a forest","To compare Australian and European weather"],"The passage gives facts and reasons, so its purpose is to explain."]]},{"t":"A Letter to the Council","p":["Dear Councillors,","I am writing about the plan to replace Fig Tree Park with a car park. I am eleven years old and I have played in this park every week since I was four, so I think I know it better than most people.","First, the park is the only green space within walking distance for hundreds of families in our street and the flats nearby. Many of us do not have backyards. Without the park, children would have nowhere safe to run, kick a ball or ride a bike.","Second, the giant Moreton Bay fig in the middle of the park is more than one hundred years old. Flying foxes roost in it, and dozens of birds nest in its branches. A car park cannot be moved later, but a tree like this can never be replaced.","Finally, I understand that shoppers need somewhere to park. However, the shopping centre already has an underground car park that is never more than half full on weekdays. Surely it makes more sense to use that space properly than to destroy something precious.","Please vote against this plan at your meeting on the fourteenth.","Yours sincerely,","Amira Haddad"],"qs":[["What is the main purpose of Amira's letter?",["To persuade the council not to build the car park","To describe her favourite games","To complain about the shopping centre","To thank the council for the park"],"She ends by asking the councillors to vote against the plan."],["Why does Amira mention that she has played in the park since she was four?",["To show she knows the park well","To show how old she is","To explain why she likes bikes","To prove she lives nearby"],"She says it means she knows the park better than most people."],["Which of these is Amira's strongest argument that the car park is not needed?",["The existing underground car park is often half empty.","Flying foxes live in the fig tree.","She has played there for years.","Children need space to ride bikes."],"This argument directly challenges the need for more parking."],["The words \"First\", \"Second\" and \"Finally\" help the reader to:",["follow her arguments in order","know how old the tree is","find the date of the meeting","understand the council's plan"],"They are connectives that organise a persuasive text."],["Which sentence is an opinion rather than a fact?",["\"Surely it makes more sense to use that space properly than to destroy something precious.\"","\"I am eleven years old.\"","\"The fig tree is more than one hundred years old.\"","\"The meeting is on the fourteenth.\""],"\"Surely it makes more sense\" expresses her view; it cannot be proven true or false."]]},{"t":"The Great Emu War","p":["In 1932, farmers in Western Australia faced an unusual enemy. About twenty thousand emus had migrated inland after their breeding season and discovered the farmers' wheat fields. The birds trampled crops, ate grain and pushed through fences, leaving gaps that let in rabbits.","The farmers asked the government for help, and soldiers were sent with two machine guns. Everyone expected the job to be over in days. It was not.","The emus proved astonishingly hard to hit. They scattered in every direction at the first shot and could run at around fifty kilometres per hour. When the soldiers mounted a gun on a truck, the bumpy ground made it impossible to aim, and the emus easily outran the truck anyway. The army's commander reportedly admired how the birds seemed to post lookouts while the rest of the flock fed.","After about a month, the soldiers were withdrawn. The newspapers had great fun with the story, and it is often remembered as the war that the emus won. In later years, farmers found that sturdier fences did a far better job of protecting their crops."],"qs":[["Why did the farmers ask the government for help?",["Emus were destroying their crops and fences.","Rabbits were eating the emus.","There was not enough rain for the wheat.","Soldiers had damaged their farms."],"Paragraph one describes the damage the emus caused."],["What does \"It was not\" in the second paragraph tell the reader?",["The job took much longer than expected.","The soldiers refused to go.","The farmers changed their minds.","The machine guns were broken."],"Everyone expected it to be over in days, but it was not."],["Which detail best explains why the emus were hard to hit?",["They scattered quickly and ran very fast.","They hid in the wheat.","They only came out at night.","They were protected by the farmers."],"The third paragraph describes them scattering and running at about 50 km/h."],["Why is the event often described as \"the war that the emus won\"?",["The soldiers left without solving the problem.","The emus attacked the soldiers.","The emus were given a medal.","The farmers joined the emus' side."],"The soldiers were withdrawn after a month, so the emus \"won\"."],["What does the final sentence suggest?",["A simpler solution worked better than the military one.","The emus eventually left on their own.","Farmers stopped growing wheat.","The army tried again and succeeded."],"Sturdier fences did \"a far better job\"."]]},{"t":"Night Swim","p":["The camp leader had said the lake was off-limits after dark, and for three nights Kasey had obeyed. But on the last night, when the others were asleep and the moon hung round and heavy over the water, she slipped out of the cabin in her pyjamas.","The jetty boards were still warm from the day. She sat on the edge and let her feet dangle, and the water was so still that the moon lay in it perfectly, like a second moon waiting underneath.","She had meant only to look. But then something silver flicked beneath the surface, then another, and another, until the whole lake seemed to be shivering with tiny fish. Kasey leaned closer. The jetty creaked.","\"Couldn't sleep either?\"","She nearly fell in. The camp leader, Mr Osei, was standing at the end of the jetty with his hands in his pockets. Kasey waited to be marched back to bed. Instead, he sat down beside her.","\"Bony bream,\" he said, nodding at the water. \"They come up to feed at night. Best show in the whole camp, and nobody ever sees it.\" They watched in silence until the moon slid behind the trees."],"qs":[["Why did Kasey feel she was doing something wrong?",["The lake was off-limits after dark.","She was not allowed to wear pyjamas outside.","She had woken the other campers.","She had forgotten to pack her swimsuit."],"The first sentence says the lake was off-limits after dark."],["\"like a second moon waiting underneath\" describes:",["the moon's reflection on the still water","a fish swimming in the lake","a lamp on the jetty","a cloud passing overhead"],"The still water reflected the moon perfectly."],["What does \"She nearly fell in\" show about Kasey's reaction?",["She was startled by the voice.","She was very sleepy.","The jetty was slippery.","She wanted to swim with the fish."],"The unexpected voice surprised her so much she almost toppled over."],["How does Mr Osei respond to finding Kasey?",["He shares the moment with her instead of punishing her.","He sends her straight back to bed.","He tells her off loudly.","He jumps into the lake."],"Instead of marching her back, he sits down and tells her about the fish."],["What does Mr Osei mean by \"nobody ever sees it\"?",["Most campers are asleep when the fish come up to feed.","The fish are invisible.","The lake is too dark to see anything.","He has never seen it before."],"The fish feed at night, when campers are in bed."]]},{"t":"The Invention of the Sandwich","p":["People have been putting food between pieces of bread for thousands of years, but the sandwich takes its name from an English nobleman, John Montagu, the fourth Earl of Sandwich, who lived in the 1700s.","According to a popular story, the Earl was so fond of playing cards that he refused to leave the gaming table for meals. Instead, he asked his servants to bring him slices of meat tucked between two pieces of bread. That way he could eat with one hand and keep playing with the other, without getting grease on the cards. Soon, his friends began ordering \"the same as Sandwich\".","Historians are not sure the story is true. Some point out that the Earl was a busy government official, and he may simply have eaten at his desk while working. Either way, the name stuck.","Today the humble sandwich has spread around the world in countless forms, from the Vietnamese banh mi to the Aussie salad roll. Not bad for a meal that may have been invented by someone who did not want to put down his cards."],"qs":[["Where does the word \"sandwich\" come from?",["The title of an English nobleman","The name of a type of bread","A card game from the 1700s","A town in Vietnam"],"It comes from John Montagu, the Earl of Sandwich."],["According to the story, why did the Earl want meat between bread?",["So he could eat without stopping his card game","Because he did not like cutlery","Because bread was cheap","So he could share with his friends"],"He wanted to keep playing and avoid greasy cards."],["Why does the writer say historians are \"not sure the story is true\"?",["There is another possible explanation for how he ate.","The Earl never existed.","Sandwiches were invented in Australia.","The Earl hated bread."],"Some think he ate at his desk while working."],["What does the phrase \"the name stuck\" mean?",["The name continued to be used.","The bread was sticky.","People forgot the name.","The Earl changed his name."],"An idiom meaning the name stayed in use."],["What is the tone of the final sentence?",["light-hearted and amused","angry and critical","sad and regretful","serious and worried"],"\"Not bad for a meal...\" is playful and humorous."]]},{"t":"Plastic Island","p":["In the middle of the North Pacific Ocean, swirling currents have gathered an enormous amount of floating rubbish. It is often called the Great Pacific Garbage Patch, but it is not really an island that you could walk on. Much of it is made of tiny pieces of plastic, some smaller than a grain of rice, spread through the water like pepper in soup.","Plastic does not rot away like wood or paper. Instead, sunlight and waves break it into smaller and smaller pieces called microplastics. These can be swallowed by fish, seabirds and turtles, which may mistake them for food. Sea turtles, for example, sometimes eat floating plastic bags that look like jellyfish.","Cleaning up the patch is extremely difficult because the pieces are so small and so widely spread. Some groups are testing long floating barriers that collect rubbish as the currents push it along. However, most scientists agree that the most important solution is to stop plastic reaching the ocean in the first place.","That means using less single-use plastic, recycling properly and making sure rubbish does not wash into drains and rivers, which carry it out to sea."],"qs":[["Why does the writer say the patch \"is not really an island\"?",["It is mostly scattered pieces of plastic in the water, not solid ground.","It has sunk to the bottom of the ocean.","It is too small to see.","It has already been cleaned up."],"The plastic is spread through the water, not packed into land you could walk on."],["\"spread through the water like pepper in soup\" suggests the plastic is:",["in many tiny pieces spread out widely","in one large heap","spicy and dangerous","easy to scoop out"],"Pepper in soup is scattered in tiny specks."],["Why might a sea turtle eat a plastic bag?",["It can look like a jellyfish.","Turtles enjoy the taste of plastic.","There is no other food in the ocean.","The bag contains fish."],"Paragraph two explains that bags can look like jellyfish."],["According to most scientists, what is the most important solution?",["Stopping plastic from reaching the ocean","Building floating barriers","Moving turtles to safer oceans","Turning the patch into an island"],"Paragraph three says this is \"the most important solution\"."],["Which word best describes the purpose of the final paragraph?",["to suggest what people can do to help","to entertain with a funny story","to describe the ocean currents","to explain what microplastics are"],"It lists actions people can take."]]},{"t":"The Tortoise Who Wouldn't Hurry","p":["Grandpa's tortoise, Winston, was older than Grandpa's house, older than Grandpa's car and, some said, older than Grandpa. He spent his days crossing the back lawn at a speed that made the garden snails look reckless.","Nell, who was nine and in a hurry about everything, found this unbearable. \"Why doesn't he go faster?\" she demanded, crouching beside him. \"He could be at the lettuce by now.\"","Grandpa settled into his deckchair. \"Winston's been getting to the lettuce for eighty years,\" he said. \"He's never missed it yet.\"","Nell watched as Winston paused to sniff a clover flower, turned his ancient head towards the sun and closed his eyes for a long moment, as if he were listening to something only tortoises could hear. Then he took one more slow step.","By the time he reached the lettuce, the afternoon had gone gold and Nell had stopped fidgeting. She had counted three kinds of bee, found a snail shell striped like a lolly and noticed that Grandpa hummed when he was happy.","\"Well,\" said Grandpa, as Winston began to munch. \"Worth the wait?\"","Nell thought about it. \"Yes,\" she said, surprised."],"qs":[["What does the first paragraph suggest about Winston?",["He is extremely old and extremely slow.","He is Grandpa's newest pet.","He is faster than the snails.","He lives inside the house."],"He is described as older than the house and slower than snails."],["Why did Nell find Winston's speed \"unbearable\"?",["She was impatient and liked to rush.","She was worried he was sick.","She wanted to eat the lettuce.","Grandpa told her to hurry him."],"She was \"in a hurry about everything\"."],["What did Grandpa mean when he said Winston had \"never missed it yet\"?",["Going slowly still gets Winston where he needs to be.","Winston has never eaten lettuce before.","Winston will not reach the lettuce today.","Grandpa always carries Winston to the lettuce."],"Winston always gets there in the end, even slowly."],["What did Nell notice while she waited?",["Small details she would normally have missed","That Winston was actually quite fast","That the lettuce had been eaten","That Grandpa was asleep"],"She noticed bees, a striped shell and Grandpa's humming."],["What is the main message of the story?",["Slowing down can help you notice and enjoy things.","Tortoises make better pets than snails.","You should always finish your vegetables.","Old people are always right."],"By slowing down, Nell discovered things and was glad she waited."]]},{"t":"Volcanoes: Mountains of Fire","p":["Deep beneath our feet, the Earth is extremely hot. In places, rock melts into a thick, glowing liquid called magma. Because magma is lighter than the solid rock around it, it slowly rises, collecting in underground chambers.","When the pressure in a chamber becomes too great, the magma forces its way to the surface through cracks. Once it erupts, it is called lava. Some volcanoes ooze runny lava gently, while others explode violently, blasting ash and rock high into the sky. The difference depends largely on how thick the magma is and how much gas is trapped inside it, rather like the difference between opening a bottle of still water and a shaken bottle of fizzy drink.","Volcanoes can be deadly, but they also create. Much of the land on islands such as Hawaii and Iceland was built by lava flows, and volcanic soil is often extremely fertile, which is why farmers have lived near volcanoes for thousands of years.","Australia has no active volcanoes today, but it has plenty of old ones. Many hills in western Victoria and south-eastern South Australia are the remains of volcanoes that last erupted thousands of years ago."],"qs":[["Why does magma rise towards the surface?",["It is lighter than the solid rock around it.","It is pulled up by the sun.","It is pushed by the ocean.","It is heavier than the surrounding rock."],"Paragraph one says magma is lighter than the solid rock."],["What is the difference between magma and lava?",["Magma is underground; lava has reached the surface.","Magma is cold; lava is hot.","Lava is found only in Australia.","There is no difference."],"Once it erupts, magma is called lava."],["Why does the writer compare volcanoes to bottles of water and fizzy drink?",["To explain how trapped gas makes some eruptions explosive","To show that lava is a kind of drink","To describe the colour of lava","To warn readers not to shake bottles"],"The shaken fizzy drink explodes because of gas, like an explosive eruption."],["Which sentence best sums up the third paragraph?",["Volcanoes are destructive but also useful.","Volcanoes only exist on islands.","Farmers should move away from volcanoes.","Hawaii is the largest volcano."],"It says volcanoes can be deadly, but they also create land and fertile soil."],["What does the word \"fertile\" most likely mean in this passage?",["good for growing plants","very dangerous","hot and dry","full of rocks"],"Farmers live near volcanoes because the soil helps crops grow."]]},{"t":"The Missing Trophy","p":["On Monday morning, the gleaming Inter-School Chess Trophy was gone from the glass cabinet in the school foyer. Only a dust-free circle showed where it had stood.","By lunchtime, rumours were flying. Some said a rival school had stolen it. Others blamed the cleaner, or a ghost. Ravi, who had captained the chess team, decided rumours were not good enough. He borrowed a notebook and began asking questions.","The cabinet was locked, and only two people had keys: the principal and Mrs Fontaine, the librarian. The lock had not been forced. The office lady remembered that Mrs Fontaine had stayed late on Friday. And Ravi noticed something else: a small smear of bright blue polish on the cabinet's handle.","He found Mrs Fontaine in the library, surrounded by cloths and tins. On her desk sat the trophy, sparkling like new, and on her fingers were streaks of the same blue polish.","\"I was going to put it back before anyone noticed,\" she said, going pink. \"It was looking so tarnished, and the photographer comes on Tuesday.\"","Ravi closed his notebook. \"Case solved,\" he said, \"but next time, maybe leave a note.\""],"qs":[["Why did Ravi start investigating?",["He wanted the truth instead of rumours.","The principal asked him to.","He thought he would be blamed.","He wanted to win the trophy again."],"He \"decided rumours were not good enough\"."],["What does the \"dust-free circle\" tell the reader?",["The trophy had been there until recently.","The cabinet was never cleaned.","The trophy was very small.","Someone had broken the glass."],"Dust had not settled where the trophy stood, so it was taken recently."],["Which clue pointed most clearly to Mrs Fontaine?",["The blue polish on the handle","The rumour about a ghost","The rival school","The chess team captain"],"The same blue polish was later found on her fingers."],["Why did Mrs Fontaine take the trophy?",["To clean it before the photographer came","To keep it for herself","To give it to another school","To play a joke on Ravi"],"She said it was tarnished and the photographer was coming on Tuesday."],["\"going pink\" suggests Mrs Fontaine felt:",["embarrassed","angry","ill","proud"],"Blushing usually shows embarrassment."]]},{"t":"Sleep: Why We Need It","p":["You spend about a third of your life asleep. That might sound like a waste of time, but scientists now know that sleep is one of the busiest and most important things your body does.","While you sleep, your brain sorts through the day's experiences, deciding what to keep and what to throw away. This is one reason why a good night's sleep before a test can help you remember what you have studied. Your body also uses sleep to repair muscles, fight germs and release growth hormones, which is especially important for children.","Doctors recommend that children aged six to twelve get between nine and twelve hours of sleep each night. Yet many children get far less. Screens are one reason: the bright light from phones and tablets can trick the brain into thinking it is still daytime, making it harder to fall asleep.","Experts suggest keeping a regular bedtime, switching off screens an hour before bed, and keeping bedrooms dark and cool. It may be tempting to stay up late, but a tired brain is like a phone on low battery: it still works, just not very well."],"qs":[["Why might sleep seem like \"a waste of time\" at first?",["It takes up a large part of our lives.","It makes people tired.","It is bad for the brain.","Scientists do not understand it."],"We spend about a third of our lives asleep."],["According to the passage, how can sleep help before a test?",["It helps the brain keep important memories.","It makes the test shorter.","It gives you more time to study.","It stops you feeling nervous."],"The brain sorts experiences and helps you remember what you studied."],["How do screens make it harder to fall asleep?",["Their bright light makes the brain think it is still day.","They are too loud.","They make the room too hot.","They use too much electricity."],"Paragraph three explains the light tricks the brain."],["\"a tired brain is like a phone on low battery\" means a tired brain:",["still works but not as well as it should","stops working completely","needs to be plugged in","works faster than normal"],"The comparison says \"it still works, just not very well\"."],["Which is the best title for this passage?",["The Hidden Work of Sleep","How to Stay Awake","The History of Beds","Why Screens Are Useful"],"The passage explains all the important things sleep does."]]},{"t":"The Boy Who Painted Birds","p":["When Tomasz arrived from Poland, he knew only four English words: yes, no, thank you and toilet. For the first weeks at his new school, he sat at the back of the class and said nothing at all.","At lunchtime he sat alone under the jacaranda tree with a small sketchbook. He did not eat much. Mostly, he drew.","One day a magpie landed near his feet and cocked its head at his sandwich. Tomasz held very still and drew it: the white collar, the sharp beak, the clever, curious eye. When he looked up, Zoe from his class was standing behind him, staring at the page.","\"That's amazing,\" she said. Tomasz did not understand the words, but he understood her face.","The next day she brought a book of Australian birds and pointed at the pictures. \"Kookaburra,\" she said. \"Rosella. Galah.\" Tomasz repeated each name carefully, and drew each bird on a fresh page. By the end of the term his sketchbook held forty-three birds, and he could name every one of them in English.","He still did not say much in class. But under the jacaranda tree, there were always at least two people now, and sometimes more."],"qs":[["Why did Tomasz not speak at the start?",["He knew very little English.","He was not allowed to talk.","He was angry with his classmates.","He had a sore throat."],"He knew only four English words when he arrived."],["\"he understood her face\" means that:",["he could tell from her expression that she liked his drawing","he could read her lips perfectly","he recognised her from Poland","he wanted to draw her face"],"He did not know the words, but her expression showed admiration."],["How did Zoe help Tomasz?",["She taught him bird names using a book.","She translated everything into Polish.","She drew pictures for him.","She told the teacher to move his seat."],"She brought a bird book and taught him the names."],["What does the ending suggest has changed for Tomasz?",["He has made friends.","He has become a famous artist.","He has stopped drawing.","He now talks a lot in class."],"There were now \"at least two people\" under the tree, showing friendship."],["What is the main theme of the story?",["Friendship can grow through shared interests.","Magpies are dangerous birds.","Moving to a new country is easy.","Drawing is more important than school work."],"Their friendship grows through drawing and birds."]]},{"t":"The Dingo Fence","p":["Stretching more than five thousand kilometres across Queensland, New South Wales and South Australia, the Dingo Fence is one of the longest fences in the world. It was built in stages, mostly in the late 1800s and early 1900s, to keep dingoes away from the sheep-farming lands of the south-east.","The fence is mostly made of wire mesh about 1.8 metres high, and in some sections it is buried deep enough to stop animals digging underneath. Teams of workers drive along it constantly, repairing damage caused by floods, fallen trees, wombats, kangaroos and even emus.","The fence has helped protect sheep, but it has also had unexpected effects. With fewer dingoes inside the fence, kangaroo numbers have grown much larger there, because dingoes normally hunt them. Some scientists also believe the plants and soil differ on each side of the fence, showing how removing one predator can change an entire ecosystem.","People continue to debate the fence's future. Farmers argue it is essential for their living, while some ecologists suggest dingoes play an important role in keeping the natural environment in balance."],"qs":[["What was the main reason the Dingo Fence was built?",["To protect sheep from dingoes","To keep kangaroos out of cities","To mark the border between states","To stop floods"],"Paragraph one says it keeps dingoes away from sheep-farming lands."],["Why is part of the fence buried underground?",["To stop animals digging underneath","To protect it from floods","To make it taller","To hide it from tourists"],"Paragraph two explains this."],["Why have kangaroo numbers grown inside the fence?",["There are fewer dingoes to hunt them.","Farmers feed the kangaroos.","Kangaroos cannot jump the fence.","The grass is taller inside the fence."],"Dingoes normally hunt kangaroos, so fewer dingoes means more kangaroos."],["What does the word \"ecosystem\" most likely mean?",["all the living things in an area and how they affect each other","a type of fence","a sheep farm","a group of scientists"],"The paragraph shows how one change affects plants, soil and animals together."],["How does the final paragraph present the issue?",["It describes more than one point of view.","It says the fence should be removed.","It says dingoes are dangerous pests.","It avoids mentioning any disagreement."],"It gives the views of both farmers and ecologists."]]},{"t":"Stage Fright","p":["Ten minutes before the concert, Isla's hands were so cold she could barely feel the violin strings. Out in the hall, three hundred chairs scraped and creaked as the audience sat down. Somewhere among them were her parents, her little brother and, worst of all, her entire class.","She had practised the solo every day for two months. She could play it in her sleep. She had played it in her sleep, actually, in a nightmare where all her strings snapped at once.","\"Everyone gets nervous,\" said Mr Petrov, the music teacher, noticing her face. \"Do you know what nerves are? They are your body getting ready to do something important. Your heart beats faster to give you energy. That is not a bad thing.\"","Isla wasn't sure she believed him. But when she walked onto the stage and the lights hit her, she took one slow breath, the way he had shown her, and lifted her bow.","The first note wobbled. The second was steadier. By the fourth, she had forgotten about the chairs and the faces, and there was only the music, pouring out of her like water from a tap that had been turned on at last."],"qs":[["What detail shows Isla's nervousness at the start?",["Her hands were so cold she could barely feel the strings.","She had practised every day.","Her parents were in the audience.","Mr Petrov was the music teacher."],"Cold hands are a physical sign of nerves."],["Why does Isla think her class being there is \"worst of all\"?",["She fears making a mistake in front of people s

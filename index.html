inning every fight","Being in the newspaper"],"He explains this in his final words."],["What does the narrator learn by the end?",["That admitting fear is part of real courage","That firefighters are never afraid","That he should not talk to his dad at night","That school friends ask too many questions"],"He tells the truth at school and finds it a better answer."]]},{"t":"Speed of the Cheetah","p":["The cheetah is the fastest land animal on Earth. In short bursts, it can reach speeds of about one hundred kilometres per hour, and it can accelerate from standing still to over ninety kilometres per hour in around three seconds, faster than many sports cars.","Its body is built for speed. It has a lightweight frame, long legs and an extremely flexible spine that coils and uncoils like a spring, letting it cover about seven metres in a single stride. Its large nostrils and lungs take in lots of oxygen, and its long tail works like a rudder, helping it balance and turn sharply while chasing prey.","But speed comes at a cost. A cheetah can only keep up its top speed for a short distance, usually a few hundred metres, before it overheats and must stop. After a chase it is often so exhausted that it must rest before eating, and larger predators such as lions and hyenas sometimes steal its meal.","Cheetahs are now endangered. Only about seven thousand remain in the wild, mostly in Africa, and they face threats from habitat loss and conflict with farmers."],"qs":[["How does a cheetah compare with many sports cars?",["It can speed up faster.","It has a higher top speed.","It can travel further.","It is heavier."],"It accelerates to over 90 km/h in about three seconds."],["What does the cheetah's tail do?",["Helps it balance and turn","Keeps it cool","Scares away lions","Helps it breathe"],"Paragraph two says it works like a rudder."],["Why can a cheetah only run at top speed for a short distance?",["It overheats.","Its legs are too short.","It runs out of food.","Its tail gets tired."],"Paragraph three explains this."],["Why might a cheetah lose its meal?",["It is too tired to guard it from larger predators.","It forgets where it left it.","It does not like the taste.","Farmers take it away."],"Lions and hyenas sometimes steal its meal while it rests."],["What is the purpose of the final paragraph?",["To inform readers that cheetahs are endangered","To describe how cheetahs hunt","To compare cheetahs with lions","To persuade readers to buy a sports car"],"It gives facts about their endangered status."]]},{"t":"The Wishing Well","p":["There was a well at the bottom of Mrs Abernathy's garden, and everyone in the street knew it granted wishes. Well, not everyone. Mostly just the children, and mostly just because Oscar Kim had told them so.","Oscar charged one gold coin per wish. He said it was a fee to cover the well's \"running costs\". The coins, of course, went straight into his pocket, and by the middle of the summer holidays he had nearly enough for the skateboard he wanted.","Then Lucy Tran came to the well. She was seven, and she did not have a gold coin. She had a ten-cent piece and a very serious face.","\"I wish my dad would get better,\" she said, and dropped the coin into the dark water before Oscar could stop her.","Oscar knew Lucy's dad was in hospital. He knew the well was just a well. That night he could not sleep.","The next morning, he took all his coins out of the jar, walked to the hospital gift shop and bought the biggest get-well card they had. Then he took it to Lucy's house, and helped her fill it with drawings."],"qs":[["Why do the children believe the well grants wishes?",["Oscar told them it did.","Mrs Abernathy said so.","They had seen it work.","It was in the newspaper."],"\"mostly just because Oscar Kim had told them so\"."],["Why does the writer put \"running costs\" in quotation marks?",["To show it was Oscar's made-up excuse","Because the well really had costs","Because Mrs Abernathy said it","To show it was a title"],"The quotation marks suggest it is not genuine."],["Why was Lucy's wish different from the others?",["It was serious and heartfelt.","She paid more money.","She wished for a skateboard.","She wished out loud."],"She wished for her sick father to get better."],["Why could Oscar not sleep?",["He felt guilty about taking advantage of the children.","He was excited about his skateboard.","The well was too noisy.","He was worried about Mrs Abernathy."],"He knew the well was fake and Lucy's wish was real."],["How does Oscar change by the end?",["He uses his money to do something kind.","He buys his skateboard.","He charges more for wishes.","He fills in the well."],"He spends his coins on a card for Lucy's dad."]]},{"t":"Weather Watching","p":["Long before satellites and computers, people predicted the weather by watching the sky. Some of their sayings actually contain real science.","Take the rhyme \"Red sky at night, sailor's delight; red sky in the morning, sailor's warning.\" In many parts of the world, weather systems tend to move from west to east. A red sky at sunset, in the west, often means the air to the west is dry and clear, so fine weather may be coming. A red sky at sunrise, in the east, may mean the clear weather has already passed, and clouds and rain could follow.","Clouds can also give clues. Fluffy white cumulus clouds usually mean fair weather. But if they grow tall and dark, towering into anvil shapes called cumulonimbus, a thunderstorm may be on its way.","Today, meteorologists use satellites, weather balloons and powerful computers to make forecasts. Even so, forecasting is never perfect, because the atmosphere is enormously complicated and small changes can grow into big differences over just a few days."],"qs":[["What point does the writer make in the first paragraph?",["Some old weather sayings are based on real science.","All old sayings are wrong.","Satellites are useless.","Sailors invented weather forecasting."],"\"Some of their sayings actually contain real science.\""],["According to the passage, what might a red sky at night mean?",["Fine weather may be coming.","A storm is coming.","The sun is setting early.","It will snow."],"It often means dry, clear air to the west."],["What do tall, dark anvil-shaped clouds warn of?",["A thunderstorm","Fair weather","Fog","A heatwave"],"Paragraph three explains cumulonimbus clouds."],["Which word best describes cumulus clouds in the passage?",["fluffy","towering","dark","anvil-shaped"],"They are described as fluffy and white."],["Why is weather forecasting never perfect?",["The atmosphere is very complicated and small changes can grow.","Meteorologists do not use computers.","Satellites often break.","Weather never changes."],"The final paragraph explains this."]]},{"t":"Mount Everest","p":["At 8,849 metres above sea level, Mount Everest is the highest mountain on Earth. It sits in the Himalayas, on the border between Nepal and the Tibet region of China. In Nepal it is called Sagarmatha, and in Tibet, Chomolungma.","The first people confirmed to reach the summit were Edmund Hillary, a beekeeper from New Zealand, and Tenzing Norgay, a Sherpa mountaineer from Nepal, on 29 May 1953. Tenzing had already attempted the climb several times, and his experience of the mountain was vital to their success.","Climbing Everest is extremely dangerous. Near the top, the air contains only about a third as much oxygen as at sea level, so most climbers breathe from oxygen bottles. The highest part of the mountain is known as the \"death zone\", because the human body cannot survive there for long. Climbers also face freezing temperatures, fierce winds, avalanches and deep cracks in the ice called crevasses.","Today, hundreds of people attempt to climb Everest each year, and in busy seasons long queues of climbers can form near the summit. Many worry that crowding and the rubbish left behind are harming the mountain."],"qs":[["What are the two local names for Mount Everest given in the passage?",["Sagarmatha and Chomolungma","Himalaya and Tibet","Hillary and Tenzing","Nepal and Sherpa"],"Paragraph one gives both names."],["Why was Tenzing Norgay's experience important?",["He had attempted the climb before and knew the mountain.","He was a beekeeper.","He carried all the oxygen.","He built the camps."],"Paragraph two says his experience was vital."],["Why is the top of the mountain called the \"death zone\"?",["The human body cannot survive there for long.","Many animals die there.","It is covered in graves.","It is always dark."],"Paragraph three explains the name."],["What is a crevasse?",["A deep crack in the ice","An oxygen bottle","A type of wind","A Sherpa guide"],"The passage defines crevasses."],["What concern is raised in the final paragraph?",["Crowding and rubbish may be harming the mountain.","The mountain is shrinking.","No one climbs Everest any more.","Climbers are running out of maps."],"Many worry about crowding and rubbish."]]},{"t":"The Garden on the Roof","p":["The apartment block on Kelly Street was grey from top to bottom: grey walls, grey stairs, grey car park. Even the pigeons looked grey. But the roof was the greyest of all, a flat concrete square covered in puddles and old chairs nobody wanted.","It was Mrs Nguyen from Flat 9 who carried up the first pot, a chipped ceramic one with a chilli plant in it. The next week, the Petrovs from Flat 2 brought three tomato seedlings in paint tins. Then a teenager called Dev, who everyone thought never left his room, dragged up an old bathtub and filled it with soil.","By the end of summer, the roof was crowded with beans climbing up broom handles, strawberries tumbling out of gumboots, sunflowers taller than Mr Petrov and a lemon tree in a wheelie bin. People who had lived in the building for years without saying more than hello started swapping seeds, recipes and stories.","On the last Saturday of summer, the whole building held a dinner on the roof, using food they had grown themselves. As the sun went down over the city, someone noticed that even the pigeons looked a little less grey."],"qs":[["Why does the writer repeat the word \"grey\" in the first paragraph?",["To show how dull and lifeless the building was","Because grey is the writer's favourite colour","To describe the weather","To show the building was new"],"The repetition emphasises the dreariness."],["What surprised people about Dev?",["He helped with the garden even though people thought he never went out.","He owned a bathtub shop.","He did not like plants.","He lived on the roof."],"Everyone thought he never left his room."],["\"strawberries tumbling out of gumboots\" shows that residents:",["used unusual, recycled containers as pots","wore gumboots while gardening","grew strawberries in the ground","threw fruit off the roof"],"They planted in gumboots, paint tins, a bathtub and a wheelie bin."],["What was the most important change the garden brought?",["Neighbours got to know each other.","The building was painted.","The pigeons left.","The roof stopped leaking."],"People began swapping seeds, recipes and stories."],["What does the final sentence suggest?",["The whole building feels brighter and happier.","The pigeons had been painted.","It was getting dark.","The garden attracted new birds."],"Even the pigeons seem less grey, showing a change in mood."]]},{"t":"Sharks: Misunderstood Hunters","p":["For many people, the word \"shark\" brings to mind a terrifying monster with rows of razor teeth. Movies have helped create this image. But the truth about sharks is far more interesting, and far less frightening.","There are more than five hundred species of shark, and most are harmless to humans. The largest, the whale shark, can grow longer than a bus, yet it feeds on tiny plankton by filtering water through its huge mouth. Many sharks are smaller than a person, and some, such as the dwarf lanternshark, could fit in your hand.","Shark attacks are extremely rare. Worldwide, sharks kill only a small number of people each year, fewer than are killed by many everyday dangers. Humans, on the other hand, kill tens of millions of sharks every year, mainly through fishing.","This matters, because sharks play an important role in ocean ecosystems. As predators, they help keep populations of other animals healthy and balanced. Because many sharks grow slowly and have few young, their numbers can take a very long time to recover once they fall."],"qs":[["According to the writer, what has helped create the \"monster\" image of sharks?",["Movies","Scientists","Fishermen","School books"],"Paragraph one says movies helped create this image."],["What does the whale shark eat?",["Tiny plankton","Large fish","Seals","Other sharks"],"It filters plankton through its mouth."],["What is the writer's point in paragraph three?",["Humans are a much greater danger to sharks than sharks are to humans.","Sharks attack people every day.","Sharks should all be caught.","Swimming is very dangerous."],"Sharks kill very few people, but humans kill millions of sharks."],["Why do shark populations recover slowly?",["Many grow slowly and have few young.","They eat too much.","They live only in cold water.","They are hunted by whales."],"The final paragraph explains this."],["What is the writer's main purpose?",["To change readers' negative ideas about sharks","To frighten readers","To describe a movie","To teach readers how to fish"],"The writer corrects misunderstandings about sharks."]]},{"t":"The Science Fair","p":["Nadia's volcano was supposed to erupt. It had erupted perfectly in her kitchen three times, spewing red foam across the bench and all over the cat.","Now, in front of the judges, she poured in the vinegar, stepped back and waited. The volcano gave a small, sad fizz, like a sigh. A single bubble rose, popped and slid down the side.","Behind her, somebody snickered. Nadia's cheeks burned. Then she took a breath and turned to the judges. \"Well,\" she said, \"that's interesting. Can I work out why?\"","She checked her notes. Same amount of vinegar. Same amount of red colouring. Then she picked up the jar of baking soda and read the label. It was not baking soda at all. In the morning rush, she had grabbed the cornflour.","\"Cornflour doesn't react with vinegar,\" she explained. \"Baking soda is a base, and vinegar is an acid. When they mix, they make carbon dioxide gas, and that's what makes the foam. So this failed experiment actually proves which ingredient does the work.\"","She did not win first prize. But one of the judges wrote on her feedback sheet: \"Best use of a mistake I have ever seen.\""],"qs":[["\"like a sigh\" suggests the volcano's fizz was:",["weak and disappointing","loud and exciting","dangerous","perfect"],"A sigh is small and a bit sad, like the tiny fizz."],["How did Nadia first feel when the experiment failed?",["embarrassed","bored","relieved","angry with the judges"],"Her cheeks burned when someone snickered."],["What caused the experiment to fail?",["She used cornflour instead of baking soda.","She used too little vinegar.","The red colouring was wrong.","The volcano was too small."],"She grabbed cornflour in the morning rush."],["What makes the foam in the volcano?",["Carbon dioxide gas made when an acid and base react","The red colouring","The cornflour","Air trapped in the volcano"],"Nadia explains the reaction."],["Why did the judge praise Nadia?",["She turned her mistake into a lesson about the science.","Her volcano was the biggest.","She won first prize.","She made everyone laugh."],"The judge praised her \"use of a mistake\"."]]},{"t":"Wind Power","p":["For thousands of years, people have used the wind. Sailors caught it in sails to cross oceans. Farmers built windmills to grind grain and pump water. Today, giant wind turbines turn the wind into electricity.","A modern wind turbine works rather like a fan in reverse. Instead of using electricity to spin the blades and make wind, it uses the wind to spin the blades and make electricity. The blades are connected to a shaft that turns a generator inside the housing at the top of the tower. Some turbines are taller than a thirty-storey building, with blades longer than an Olympic swimming pool.","Wind power has important advantages. The wind is free and will never run out, and turbines do not release greenhouse gases while they are working. Wind farms can also share land with farm animals and crops.","However, wind power has challenges too. The wind does not always blow, so other energy sources or batteries are needed to keep the lights on during still weather. Some people also object to how turbines look or sound, and they must be carefully placed to reduce harm to birds and bats."],"qs":[["How does the writer explain how a wind turbine works?",["By comparing it to a fan working in reverse","By describing a sailing ship","By explaining how batteries work","By describing a windmill grinding grain"],"The second paragraph uses this comparison."],["What is inside the housing at the top of the tower?",["A generator","A battery","A fan","A water pump"],"The shaft turns a generator in the housing."],["Which is an advantage of wind power mentioned in the passage?",["It does not release greenhouse gases while working.","The wind always blows.","Turbines are invisible.","It is quieter than any other energy."],"Paragraph three lists this advantage."],["Why are batteries or other energy sources needed?",["The wind does not always blow.","Turbines break every week.","Wind power is too strong.","Birds block the turbines."],"During still weather, turbines cannot generate power."],["How is the information in paragraphs three and four organised?",["Advantages, then challenges","Oldest to newest","Problem, then solution","Question and answer"],"Paragraph three gives advantages; paragraph four gives challenges."]]},{"t":"Two Sides of the Fence","p":["Grace and Mrs Lindqvist had been neighbours for three years and had spoken exactly twice. Both times it was about the fence.","The fence was old and leaning, and Mrs Lindqvist's roses kept growing through the gaps into Grace's yard, where their thorns snagged on everything, including Grace's football. Grace's football, in turn, kept flying over the fence into Mrs Lindqvist's roses.","One afternoon the ball sailed over again, and this time Grace heard a crunch and a cry. She scrambled up onto the bin to look. Mrs Lindqvist was sitting on the ground among her flowers, holding her wrist.","Grace ran next door without thinking. She helped Mrs Lindqvist inside, fetched ice from the freezer and called her own mum. It turned out the wrist was only sprained, not broken, and the ball had not even hit her; she had tripped over the garden hose.","For the next two weeks, Grace came over after school to water the roses, because Mrs Lindqvist could not hold the hose. She learned the names of every variety. Mrs Lindqvist learned the offside rule.","The fence is still old and leaning. But now there is a small gate in it."],"qs":[["What does \"had spoken exactly twice. Both times it was about the fence\" suggest?",["The neighbours did not get along well.","They were close friends.","They had just met.","They both built the fence."],"They only spoke about their disagreement."],["Why did Grace run next door \"without thinking\"?",["She instinctively wanted to help someone who was hurt.","She wanted her ball back.","She was angry with Mrs Lindqvist.","Her mum told her to."],"She reacted immediately to seeing Mrs Lindqvist injured."],["How did Mrs Lindqvist actually hurt her wrist?",["She tripped over the garden hose.","The football hit her.","She fell off the fence.","A rose thorn scratched her."],"The ball had not hit her; she tripped."],["What does \"Mrs Lindqvist learned the offside rule\" suggest?",["She took an interest in Grace's football.","She joined a football team.","She stopped Grace playing football.","She taught Grace about roses."],"Each learned about the other's interest."],["What does the new gate in the fence symbolise?",["The friendship that has grown between them","A plan to sell the house","A way to keep roses out","The fence being fixed"],"The gate represents an open connection between them."]]},{"t":"The Human Heart","p":["Your heart is a muscle about the size of your fist, and it never takes a day off. It beats about one hundred thousand times each day, pumping blood through a network of blood vessels that, laid end to end, would stretch around the Earth more than twice.","The heart has four chambers. The two upper chambers, called atria, receive blood returning to the heart. The two lower chambers, called ventricles, pump blood out. The right side of the heart sends blood to the lungs, where it picks up oxygen. The left side then pumps this oxygen-rich blood to the rest of the body.","Valves inside the heart act like one-way doors, making sure blood flows in the right direction. The \"lub-dub\" sound a doctor hears through a stethoscope is actually the sound of these valves snapping shut.","Like any muscle, the heart gets stronger with exercise. Activities that raise your heart rate, such as running, swimming, cycling or dancing, help keep it healthy for life."],"qs":[["How big is the human heart, according to the passage?",["About the size of your fist","About the size of your head","About the size of a grape","About the size of a football"],"The first sentence tells us."],["What do the ventricles do?",["Pump blood out of the heart","Receive blood returning to the heart","Hold oxygen","Make the lub-dub sound"],"Paragraph two explains the ventricles."],["Where does the right side of the heart send blood?",["To the lungs","To the brain","To the legs","To the stomach"],"It sends blood to the lungs to pick up oxygen."],["What makes the \"lub-dub\" sound?",["The heart valves snapping shut","Blood rushing through the lungs","The heart muscle stretching","The stethoscope"],"Paragraph three explains this."],["What is the main message of the final paragraph?",["Exercise helps keep your heart healthy.","Dancing is better than running.","The heart never gets tired.","Doctors use stethoscopes."],"It explains how exercise strengthens the heart."]]},{"t":"The Painting","p":["In the corner of the gallery hung a painting that nobody looked at. It was small and dark, a picture of an empty wooden chair beside a window, and visitors walked past it on their way to the bright, enormous paintings in the next room.","Every Tuesday, though, an old man came and sat on the bench in front of it. He stayed for exactly one hour. He never looked at the other paintings.","The security guard, Elif, grew curious. One Tuesday she sat down beside him. \"Why this one?\" she asked.","The old man was quiet for a while. \"My wife painted it,\" he said. \"That was her chair, by our window, where she used to read. She painted it the year before she died. I gave it to the gallery so that other people could see it.\"","He smiled a little. \"Nobody does, of course. But I do.\"","After that, Elif began telling visitors about the painting. Some of them stopped, and looked, and stayed longer than they meant to. The old man noticed. Every Tuesday after that, he nodded to Elif when he arrived, and she nodded back."],"qs":[["Why did most visitors ignore the painting?",["It was small and dark, and the bright paintings attracted them more.","It was hidden behind a curtain.","It was not allowed to be looked at.","It was damaged."],"Visitors walked past to the bright, enormous paintings."],["Why did the old man visit every Tuesday?",["The painting was made by his late wife.","He worked at the gallery.","He was an art critic.","He was waiting for a friend."],"His wife painted it."],["Why is the empty chair in the painting meaningful?",["It was where his wife used to sit and read.","It was the chair he made.","It was the gallery's oldest chair.","It was for sale."],"He explains it was her reading chair."],["Why did Elif start telling visitors about the painting?",["She wanted others to appreciate it as the old man did.","Her boss told her to.","She wanted to sell it.","She painted it herself."],"She was moved by his story."],["What does the nodding at the end show?",["A quiet understanding and friendship between them","That they were angry with each other","That the gallery was closing","That Elif was tired"],"The nods show a silent bond."]]},{"t":"The Mighty Murray","p":["The Murray River is Australia's longest river, flowing for about two and a half thousand kilometres from the Australian Alps to the sea in South Australia. For much of its length, it forms the border between New South Wales and Victoria.","The Murray and its tributaries, including the Darling, make up the Murray-Darling Basin, which covers about one seventh of Australia. The basin is often called Australia's food bowl, because a large share of the country's farm produce, including fruit, rice, cotton and dairy, is grown there with the help of water from its rivers.","For tens of thousands of years, the river has been central to the lives of many Aboriginal nations, who fished its waters, built canoes from the bark of its river red gums and cared for its wetlands.","Today, the Murray faces serious challenges. Taking large amounts of water for farms and towns, together with droughts, has sometimes left too little water flowing to keep the river and its wetlands healthy. Governments, farmers, scientists and communities continue to debate how the water should be shared fairly between people and the environment."],"qs":[["Which two states does the Murray form a border between?",["New South Wales and Victoria","Victoria and South Australia","Queensland and New South Wales","South Australia and Western Australia"],"Paragraph one tells us."],["What is a \"tributary\"?",["A smaller river that flows into a larger one","A dam across a river","A type of fish","The mouth of a river"],"The Darling is a tributary that joins the Murray system."],["Why is the basin called \"Australia's food bowl\"?",["Much of Australia's farm produce is grown there.","It is shaped like a bowl.","People eat by the river.","It has many restaurants."],"Paragraph two explains this."],["How did Aboriginal nations use the river red gums?",["They made canoes from the bark.","They built houses from the logs.","They ate the leaves.","They made paper."],"Paragraph three mentions bark canoes."],["What is the main issue in the final paragraph?",["Sharing the river's water fairly between people and the environment","Building more bridges","Stopping floods in cities","Finding the source of the river"],"It discusses debate over sharing water."]]}];

// ---------- no-repeat tracking & question value ----------
// Every question has an id. Questions you've already answered are "repeats" and pay very little.
function hashStr(t) { let h = 2166136261; for (let i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
const OLD_BANK = { e: 41, r: 35, p: 6 };   // how many of each bank were in the first version of the game
const WORTH = { typed: 1, choice: 0.6, repeat: 0.1 };   // share of the full reward a correct answer earns
const PASS_MARK = 3;                                      // multiple-choice missions pay nothing below 3/5
const seen = id => !!(S.seen && S.seen[id]);
function markSeen(id) { if (id) S.seen[id] = 1; }
function tagQ(q, id) { q.id = id; q.fresh = !seen(id); q.worth = q.fresh ? (q.kind === 'num' ? WORTH.typed : WORTH.choice) : WORTH.repeat; return q; }
function bankQ(item, tag = 'x') { const [q, o, e] = item; return tagQ(Q(q, o[0], o.slice(1), e), tag + hashStr(q + '|' + o[0])); }
const passageId = P => 'p' + hashStr(P.t);
// A typed maths question the player hasn't seen before (tries hard before settling for a repeat)
function freshMaths(avoid = new Set(), gens = MATHS) {
  let last = null;
  for (let tries = 0; tries < 60; tries++) {
    const q = pick(tries < 25 ? gens : MATHS)(), id = 'm' + hashStr(q.q);
    last = tagQ(q, id);
    if (!seen(id) && !avoid.has(id)) return last;
  }
  return last;
}
const unseenCount = subj => subj === 'maths' ? null : subj === 'comp' ? PASSAGES.filter(P => !seen(passageId(P))).length
  : (subj === 'english' ? ENGLISH : READING).filter(it => !seen((subj === 'english' ? 'e' : 'r') + hashStr(it[0] + '|' + it[1][0]))).length;
const SUBJECTS = [
  { id: 'maths', n: 'Maths', d: 'Fractions, percentages, angles, time and more' },
  { id: 'english', n: 'English', d: 'Spelling, grammar and punctuation' },
  { id: 'reading', n: 'Reading', d: 'Word meanings, idioms and figurative language' },
  { id: 'comp', n: 'Comprehension', d: 'Read a short passage and answer questions' },
];
function makeSet(subj, recent) {
  if (subj === 'maths') {
    const got = new Set(), out = [];
    for (const g of shuffle(MATHS).slice(0, 5)) { const q = freshMaths(got, [g]); got.add(q.id); out.push(q); }
    return out;
  }
  if (subj === 'comp') {
    const fresh = PASSAGES.map((_, i) => i).filter(i => !seen(passageId(PASSAGES[i])));
    const pool = fresh.length ? fresh : PASSAGES.map((_, i) => i).filter(i => i !== recent.comp);
    const pi = pick(pool); recent.comp = pi;
    const P = PASSAGES[pi], pid = passageId(P), rep = seen(pid);
    return { passage: P, pid, qs: P.qs.map((it, j) => { const q = tagQ(Q(it[0], it[1][0], it[1].slice(1), it[2]), pid + '.' + j); if (rep) { q.fresh = false; q.worth = WORTH.repeat; } return q; }) };
  }
  const bank = subj === 'english' ? ENGLISH : READING, tag = subj === 'english' ? 'e' : 'r';
  const all = bank.map((it, i) => ({ i, id: tag + hashStr(it[0] + '|' + it[1][0]) }));
  const fresh = shuffle(all.filter(x => !seen(x.id)));
  const r = recent[subj] || [];
  const old = shuffle(all.filter(x => seen(x.id) && !r.includes(x.i)));
  const idx = [...fresh, ...old].slice(0, 5).map(x => x.i);
  recent[subj] = [...r, ...idx].slice(-Math.min(40, bank.length - 5));
  return idx.map(i => bankQ(bank[i], tag));
}
// Arena questions are always typed maths: no guessing, and never the same question twice
function arenaQ() { return freshMaths(); }

function stats(a) {

}

function newAnimal(s, t, u) { return { id: S.nextId++, s, t, u: u || null, name: pick(NAMES), p: pick(PERS_KEYS), happy: 62, full: 80, pen: null, gear: {}, pat: 0, caged: false, escaped: null, nap: 0 }; }

// ---------- state ----------
function fresh() {
  S = { v: 1, coins: 300, wood: 20, food: 20, animals: [], pens: [{ id: 1, zone: 'farm', slot: 0, cap: 4 }], decor: [{ zone: 'farm', spot: 0, item: 'flowers' }],
    inv: { ball: 1, tree: 1 }, friends: {}, stats: { maths: { c: 0, t: 0 }, english: { c: 0, t: 0 }, reading: { c: 0, t: 0 }, comp: { c: 0, t: 0 } },
    claimed: {}, notified: {}, recent: {}, seen: {}, seenInit: 1, tickets: 40, last: Date.now(), news: [], nextId: 1, nextPen: 2, missions: 0, savedAt: 0 };
  const sheep = SP('Sheep').i, goat = SP('Goat').i;
  const a = adopt(sheep, 0), b = adopt(sheep, 1), c = adopt(goat, 1);
  a.p = 'bully'; b.p = 'wimp'; c.p = 'clown'; a.pen = b.pen = c.pen = 1;
  news(`Welcome to your new zoo! ${a.name} (a bully), ${b.name} (a wimp) and ${c.name} (the class clown) moved into the Farmyard. What could go wrong?`);
}
function fix(d) {
  const f = { coins: 0, wood: 0, food: 0, animals: [], pens: [], decor: [], inv: {}, friends: {}, stats: {}, claimed: {}, notified: {}, recent: {}, seen: {}, tickets: 0, last: Date.now(), news: [], nextId: 1, nextPen: 1, missions: 0, savedAt: 0 };
  for (const k in f) if (d[k] === undefined || d[k] === null) d[k] = f[k];
  for (const s of ['maths', 'english', 'reading', 'comp']) d.stats[s] = d.stats[s] || { c: 0, t: 0 };
  if (!d.seenInit) { // saves from before the no-repeat update: the old passages and questions count as already seen
    d.seenInit = 1;
    if (d.missions > 0) {
      PASSAGES.slice(0, OLD_BANK.p).forEach(P => { const id = passageId(P); d.seen[id] = 1; P.qs.forEach((_, j) => { d.seen[id + '.' + j] = 1; }); });
      ENGLISH.slice(0, OLD_BANK.e).forEach(it => { d.seen['e' + hashStr(it[0] + '|' + it[1][0])] = 1; });
      READING.slice(0, OLD_BANK.r).forEach(it => { d.seen['r' + hashStr(it[0] + '|' + it[1][0])] = 1; });
    }
  }
  d.nextId = Math.max(d.nextId, 1, ...d.animals.map(a => a.id + 1));
  d.nextPen = Math.max(d.nextPen, 1, ...d.pens.map(p => p.id + 1));
  for (const a of d.animals) { a.gear = a.gear || {}; if (typeof a.p === 'number') a.p = OLD_PERS[a.p] || 'sweet'; if (!PERS[a.p]) a.p = pick(PERS_KEYS); a.caged = !!a.caged; a.escaped = a.escaped || null; a.nap = a.nap || 0; }
  return d;
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); if (d && d.v === 1 && Array.isArray(d.animals)) { S = fix(d); return true; } } } catch (e) {}
  return false;
}
function save() { S.savedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} queueDB(); }

// account save (db capability) so the zoo follows the player between devices
let DB = null, UID = null, dbT = null, dbBusy = false, dbAgain = false, syncNote = 'Progress saves on this device';
function queueDB() { if (!DB) return; clearTimeout(dbT); dbT = setTimeout(pushDB, 4000); }
async function pushDB() {
  if (!DB) return; if (dbBusy) { dbAgain = true; return; }
  dbBusy = true;
  try { await DB.doc(`data/users/${UID}/save`).set({ json: JSON.stringify(S), savedAt: S.savedAt }); syncNote = 'Progress saves to your Claude account'; }
  catch (e) { if (e && e.code === 'invalid_argument') { DB = null; syncNote = 'Progress saves on this device only'; } }
  dbBusy = false; renderFoot();
  if (dbAgain) { dbAgain = false; queueDB(); }
}
async function initDB() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    DB = db; UID = uid;
    const snap = await db.doc(`data/users/${uid}/save`).get();
    if (snap.exists) {
      const d = snap.data();
      if (d && typeof d.json === 'string' && (d.savedAt || 0) > (S.savedAt || 0)) {
        const x = JSON.parse(d.json);
        if (x && x.v === 1 && Array.isArray(x.animals)) { S = fix(x); tick(false); render(); toast('Loaded your saved zoo.'); }
      }
    }
    syncNote = 'Progress saves to your Claude account'; renderFoot(); queueDB();
  } catch (e) { /* keep device save */ }
}

// ---------- simulation ----------
function target(a, now) {
  const s = spec(a), p = PP(a); let h = 55 + p.h;
  const pen = a.pen ? penById(a.pen) : null;
  if (pen) {
    h += pen.zone === s.z ? 12 : -10;
    const mates = penAnimals(pen.id); if (mates.length >= pen.cap) h -= 3; if (mates.length > pen.cap) h -= 6;
    let fr = 0;
    for (const m of mates) { if (m === a) continue; const r = S.friends[rkey(a, m)]; if (!r) continue;
      fr += r.f >= 70 ? 8 : r.f >= 30 ? 3 : r.f <= -70 ? -12 : r.f <= -30 ? -5 : 0; }
    h += clamp(fr, -20, 20);
    if (a.caged) h -= 8;
  }
  h += a.full < 25 ? -25 : a.full < 50 ? -8 : a.full > 70 ? 8 : 0;
  for (const k in a.gear) { const it = ITEMS[a.gear[k]]; if (it && it.hap) h += it.hap; }
  if (a.pat > now) h += 10;
  return clamp(h, 0, 100);
}
function visitorRate() {
  const happy = S.animals.filter(a => a.pen && a.happy >= 50).length;
  const vis = S.decor.reduce((s, d) => s + (ITEMS[d.item].vis || 0), 0);
  return happy * 0.5 + vis * 0.25; // coins per minute
}
function tick(live) {
  const now = Date.now(); let mins = (now - S.last) / 60000;
  if (live && mins < 0.05) return;
  S.last = now; mins = clamp(mins, 0, 720);
  for (const a of S.animals) a.full = clamp(a.full - mins * 0.5, 0, 100);
  if (live && mins < 5) for (const pen of S.pens) if (!(UI.screen === 'zone' && UI.zone === pen.zone) && Math.random() < .5) runAntic(pen, false);
  const k = 1 - Math.pow(0.8, mins * 4);
  for (const a of S.animals) a.happy = clamp(a.happy + (target(a, now) - a.happy) * k, 0, 100);
  S.tickets = Math.min(TICKET_CAP, S.tickets + visitorRate() * mins);
  save();
  if (live) refreshLive();
}
function refreshLive() {
  renderRes();
  if (DRAG) return;
  if (pendingRender && !UI.modal) { pendingRender = false; if (UI.screen === 'zone') { render(); return; } }
  if (UI.screen === 'map') $('#app').innerHTML = vMap();
  if (UI.screen === 'zone') document.querySelectorAll('.critter').forEach(el => {
    const a = animal(+el.dataset.aid); if (!a) return;
    const old = el.querySelector('.bubble'); if (old) old.remove();
    const nb = bubble(a); if (nb) el.insertAdjacentHTML('beforeend', nb);
    el.classList.toggle('asleep', a.nap > Date.now());
  });
}
// live antics in the pens you're looking at
setInterval(() => {
  if (UI.screen !== 'zone' || UI.zone === 'sanct' || DRAG || UI.modal || document.hidden) return;
  const now = Date.now();
  for (const pen of S.pens.filter(p => p.zone === UI.zone)) {
    if (!NEXT[pen.id]) NEXT[pen.id] = now + ri(1200, 4000);
    if (now >= NEXT[pen.id]) { NEXT[pen.id] = now + ri(4500, 8000); runAntic(pen, true); }
  }
}, 600);

// ---------- arena ----------
function rivalFor(my, key) {

  const s = pick(pool.length >= 3 ? pool : SPECIES), t = ri(0, s.types.length - 1), p = PERS[pick(PERS_KEYS)];
  return { e: s.types[t].e, type: s.types[t].n, name: pick(NAMES), sp: Math.max(1, s.sp + p.sp), st: Math.max(1, s.st + p.st), pers: p.n };
}
function vArena() {

  const opts = S.animals.map(a => { const s = spec(a), st = stats(a); return `<option value="${a.id}" ${UI.pickA === a.id ? 'selected' : ''}>${s.e} ${esc(a.name)} (${esc(s.type)}) · speed ${st.sp} · strength ${st.st}</option>`; }).join('');
  return `${head}<div class="arena-grid">
    <div class="card"><h3 style="font-size:28px">🏁 Race</h3><p class="muted">Race three challengers. Answer a typed maths question first: right = turbo boost, wrong = no chance of winning.</p>
      <label for="raceSel" class="small"><b>Your racer</b></label><select id="raceSel" class="kvsel" style="width:100%;border:2px solid var(--line);background:var(--ground);border-radius:8px;padding:6px 8px">${opts}</select>
      <div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn go" data-act="raceGo">Start race</button><span class="small muted">1st: 40 coins · 2nd: 10 coins</span></div></div>
    <div class="card"><h3 style="font-size:28px">🥊 Battle</h3><p class="muted">A friendly wrestle with an evenly matched challenger. Typed maths questions: a right answer lets your animal attack, a wrong one lets the challenger attack.</p>
      <label for="battleSel" class="small"><b>Your fighter</b></label><select id="battleSel" style="width:100%;border:2px solid var(--line);background:var(--ground);border-radius:8px;padding:6px 8px">${opts}</select>
      <div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn go" data-act="battleGo">Start battle</button><span class="small muted">Win: 50 coins</span></div></div>
  </div>`;
}
function raceGo() {
  const a = animal(UI.pickA) || S.animals[0]; UI.pickA = a.id;
  const st = stats(a);
  const lanes = [{ mine: true, name: a.name, html: spriteHTML(a, 40), spd: st.sp + a.happy / 25 }];
  // Challengers are matched to your animal's natural speed (species + personality), so shoes and vehicles still help,
  // but a fast animal can't win without answering correctly.
  const base = Math.max(3, spec(a).speed + PP(a).sp);
  for (let i = 0; i < 3; i++) { const r = rivalFor(Math.min(10, base), 'sp'); lanes.push({ mine: false, name: r.name, html: `<span class="sprite" style="--sz:40px"><span class="spr">${r.e}</span></span>`, spd: base + 2 + ri(0, 3) + Math.random(), type: r.type }); }
  const R = UI.R = { a: a.id, lanes: shuffle(lanes), phase: 'q', boost: 0, ok: false, worth: 0, order: [] };
  const q = arenaQ();
  setQ(q, ok => { R.ok = ok; R.boost = ok ? 2.5 : 0; R.worth = q.worth; markSeen(q.id); save(); });
  render();
}
function vRace() {
  const R = UI.R, a = animal(R.a);
  const track = `<div class="track">${R.lanes.map((l, i) => `<div class="lane ${l.mine ? 'mine' : ''}"><span class="lname">${esc(l.name)}${l.mine ? ' (you)' : ''}${R.order.includes(i) ? ` · ${['1st', '2nd', '3rd', '4th'][R.order.indexOf(i)]}` : ''}</span><span class="runner" id="run-${i}" style="left:${6 + (l.prog || 0) * .82}%">${l.html}</span></div>`).join('')}</div>`;
  if (R.phase === 'q') return `<div class="screen-head"><h2>Race</h2><p>Answer correctly and ${esc(a.name)} gets a turbo boost. Get it wrong and ${esc(a.name)} trips at the start and can't win.</p></div>
    <div class="qcard" style="max-width:720px">${qBlockHTML()}${QS.result !== null ? `<div style="margin-top:12px;text-align:right"><button class="btn go" data-act="raceRun" id="nextBtn">${QS.result ? '🔥 Start with a turbo boost! →' : 'Start the race (no chance of winning) →'}</button></div>` : ''}</div>
    <div style="margin-top:14px">${track}</div>`;
  const place = R.order.findIndex(i => R.lanes[i].mine);
  const done = R.phase === 'done' ? `<div class="card" style="margin-top:14px;text-align:center"><h3 style="font-size:30px">${place === 0 ? '🏆 You won!' : place === 1 ? '🥈 Second place!' : `${place === 2 ? '3rd' : '4th'} place`}</h3><p>${!R.ok ? `${esc(a.name)} tripped at the start because the answer was wrong. Answer correctly to have a chance of winning!` : place === 0 ? `${esc(a.name)} earned ${R.prize} coins and feels fantastic.` : place === 1 ? `${esc(a.name)} earned ${R.prize} coins.` : 'Try shoes or a vehicle from the Shop for extra speed.'}</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn go" data-act="raceGo">Race again</button><button class="btn" data-act="arenaBack">Back to the arena</button></div></div>` : '';
  return `<div class="screen-head"><h2>Race</h2><p>${R.ok ? '🔥 Turbo boost active!' : `💫 ${esc(a.name)} tripped at the start!`}</p></div>${track}${done}`;
}
let raceT = null;
function raceRun() {
  const R = UI.R; if (!R || R.phase !== 'q' || !QS || QS.result === null) return;
  R.phase = 'run'; QS = null; R.lanes.forEach(l => l.prog = 0); render();
  clearInterval(raceT);
  raceT = setInterval(() => {
    if (!UI.R || UI.R !== R) { clearInterval(raceT); return; }
    R.lanes.forEach((l, i) => {
      if (R.order.includes(i)) return;
      l.prog += (l.mine && !R.ok ? l.spd * 0.35 : l.spd + (l.mine ? R.boost : 0)) * 0.17 + Math.random() * 2.2;
      // a wrong answer means no chance: your animal can't cross the line until every challenger has
      if (l.mine && !R.ok && R.order.length < R.lanes.length - 1) l.prog = Math.min(l.prog, 96);
      if (l.prog >= 100) { l.prog = 100; R.order.push(i); }
      const el = document.getElementById('run-' + i); if (el) el.style.left = (6 + l.prog * .82) + '%';
    });
    if (R.order.length === R.lanes.length) {
      clearInterval(raceT); R.phase = 'done';
      const place = R.order.findIndex(i => R.lanes[i].mine), a = animal(R.a);
      const prize = !R.ok ? 0 : Math.round((place === 0 ? 40 : place === 1 ? 10 : 0) * R.worth); R.prize = prize;
      if (prize) { S.coins += prize; }
      if (place === 0 && a) { a.happy = clamp(a.happy + 10, 0, 100); news(`🏆 ${a.name} won a race!`); }
      save(); render(); if (prize) bump('coins');
    }
  }, 110);
}

  },
  placeDecor(d) { const k = d.id; if (!inv(k)) return; S.inv[k]--; S.decor.push({ zone: UI.zone, spot: +d.spot, item: k }); closeModal(); toast(`${ITEMS[k].n} placed. Visitors will love it!`); save(); render(); },
  subj(d) { UI.subj = d.v; render(); },
  reward(d) { UI.reward = d.v; render(); },
  startMission() { if (UI.subj && UI.reward) startMission(); },
  answer(d) { if (!QS || QS.result !== null || QS.q.kind !== 'mc' || lockLeft() > 0) return; QS.picked = +d.i; QS.result = QS.picked === QS.q.ans; finishQ(); },
  key(d) { pressKey(d.k); },
  submit() { submitQ(); },
  nextQ() { const M = UI.M; if (M.i >= M.qs.length - 1) { finishMission(); return; } M.i++; missionQ(); render(); const c = $('#qcard'); if (c && c.getBoundingClientRect().top < 0) c.scrollIntoView({ block: 'start' }); },
  shopTab(d) { UI.shopTab = d.v; render(); },
  shopZone(d) { UI.shopZone = d.v; render(); },
  buySp(d) {
    const s = SPECIES[+d.sp], qty = +($('#qty-' + s.i) || { value: 1 }).value, t = +($('#type-' + s.i) || { value: 0 }).value;
    if (!spend(s.p * qty)) return;
    const got = []; for (let i = 0; i < qty; i++) got.push(adopt(s.i, t));
    adoptedToast(got); save(); render(); bump('coins');
  },
  bundle(d) {
    const s = SPECIES[+d.sp], n = +d.n, cost = n === 10 ? 1000 : s.p * 4; if (!spend(cost)) return;
    const got = []; for (let i = 0; i < n; i++) got.push(adopt(s.i, ri(0, s.types.length - 1)));
    adoptedToast(got); save(); render(); bump('coins');
  },
  turtleRange() { const t = SP('Turtle'); if (!spend(500)) return; const got = t.types.map((_, i) => adopt(t.i, i)); adoptedToast(got); save(); render(); bump('coins'); },
  ultra(d) {
    const u = ULTRA_BY[d.k]; if (S.claimed[u.k]) return;
    if (d.mode === 'claim') { if (S.stats[u.subj].c < u.need) return; } else if (!spend(u.price)) return;
    const a = adopt(null, 0, u.k); a.name = u.n.split(' ')[0]; S.claimed[u.k] = true;
    news(`✨ The ${u.n} has arrived at your zoo!`); toast(`✨ The ${u.n} is waiting in the Sanctuary!`); save(); render(); bump('coins');
  },
  buyItem(d) {
    const it = ITEMS[d.id]; if (S.wood < (it.wood || 0)) { toast(`You need ${it.wood} wood. Choose wood as your mission reward!`); return; }
    if (!spend(it.price)) return; S.wood -= it.wood || 0;
    if (it.give) { for (const k in it.give) S[k] += it.give[k]; bump(Object.keys(it.give)[0]); } else S.inv[d.id] = inv(d.id) + 1;
    toast(`Bought: ${it.n}.`); save(); render(); bump('coins');
  },
  rosterF(d) { UI.rosterF = d.v; render(); },
  animal(d) { openModal({ type: 'animal', id: +d.aid }); },
  closeModal() { closeModal(); },
  feedOne(d) { const a = animal(+d.aid); if (!a || S.food < 1) return; S.food--; a.full = clamp(a.full + 50, 0, 100); a.happy = clamp(a.happy + 3, 0, 100); toast(`${a.name} munched happily.`); save(); renderModal(); renderRes(); bump('food'); },
  pat(d) { const a = animal(+d.aid); if (!a) return; a.pat = Date.now() + 10 * 60000; a.happy = clamp(a.happy + 5, 0, 100); toast(pick([`${a.name} loved that!`, `${a.name} wiggled with joy.`, `${a.name} wants another pat.`])); save(); renderModal(); },
  raceGo() { const sel = $('#raceSel'); if (sel) UI.pickA = +sel.value; UI.B = null; raceGo(); goTop(); },
  raceRun() { raceRun(); },
  battleGo() { const sel = $('#battleSel'); if (sel) UI.pickA = +sel.value; UI.R = null; clearInterval(raceT); battleGo(); goTop(); },
  battleNext() { const B = UI.B; if (!B || B.over || !QS || QS.result === null) return; B.hit = null; battleQ(); render(); },
  arenaBack() { clearInterval(raceT); UI.R = null; UI.B = null; QS = null; render(); },
  addCage(d) { const p = penById(+d.pen); if (!p || p.cage || !inv('cage')) return; S.inv.cage--; p.cage = true; toast('Naughty cage installed. Drag troublemakers into it!'); save(); render(); },
  removeCage(d) { const p = penById(+d.pen); if (!p || !p.cage) return; p.cage = false; penAnimals(p.id).forEach(a => a.caged = false); S.inv.cage = inv('cage') + 1; toast('Cage removed and back in your backpack.'); save(); render(); },
  sendHome(d) { const a = animal(+d.aid); if (!a || !a.escaped) return; const home = penById(a.escaped); if (!home) { a.escaped = null; } else if (penAnimals(home.id).length >= home.cap) { toast('Their home pen is full now!'); return; } else { a.pen = home.id; a.escaped = null; a.caged = false; toast(`${a.name} is back home. "Aw, man. I was having fun."`); } save(); render(); renderModal(); },
  uncage(d) { const a = animal(+d.aid); if (!a) return; a.caged = false; toast(`${a.name} is out of the cage. "FREEDOM!"`); save(); render(); renderModal(); },
  askReset() { openModal({ type: 'reset' }); },
  doReset() { closeModal(); fresh(); UI.M = null; UI.R = null; UI.B = null; QS = null; UI.screen = 'map'; UI.edit = false; for (const k in POS) delete POS[k]; save(); render(); toast('A brand new zoo!'); },
};

document.addEventListener('click', e => {
  if (suppressClick) { e.preventDefault(); e.stopPropagation(); return; }
  if (e.target.id === 'modal') { closeModal(); return; }
  const c = e.target.closest('.critter'); if (c) { openModal({ type: 'animal', id: +c.dataset.aid }); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn && !el.disabled) fn(el.dataset, el, e);
}, true);
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'nameInput') { const a = animal(+t.dataset.aid); if (!a) return; const v = t.value.trim().slice(0, 18); if (v) { a.name = v; toast(`Say hello to ${v}!`); } save(); render(); renderModal(); }
  else if (t.id && t.id.startsWith('gear-')) {
    const a = animal(+t.dataset.aid), slot = t.id.slice(5), old = a.gear[slot], v = t.value;
    if (old) S.inv[old] = inv(old) + 1;
    if (v) { S.inv[v] = inv(v) - 1; a.gear[slot] = v; } else delete a.gear[slot];
    save(); render(); renderModal();
  }
  else if (t.id === 'moveTo') { const a = animal(+t.dataset.aid); moveAnimal(a, t.value === 'sanct' ? 'sanct' : +t.value); save(); render(); renderModal(); }
  else if (t.id === 'raceSel' || t.id === 'battleSel') UI.pickA = +t.value;
});
document.addEventListener('input', e => { if (e.target.id === 'shopSearch') { UI.shopQ = e.target.value; const g = $('#shopGrid'); if (g) g.innerHTML = speciesCards(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.modal) { closeModal(); return; }
  if (UI.modal || /INPUT|SELECT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName)) return;
  const qOn = QS && (document.getElementById('npDisplay') || document.querySelector('.answers'));
  if (!qOn) return;
  if (QS.result !== null) { if (e.key === 'Enter') { const n = $('#nextBtn'); if (n) { e.preventDefault(); n.click(); } } return; }
  if (QS.q.kind === 'num') {
    const k = e.key;
    if (/^[0-9]$/.test(k) || k === '.' || k === '/' || k === ':') { e.preventDefault(); pressKey(k); }
    else if (k === '-') { e.preventDefault(); pressKey('−'); }
    else if (k === 'Backspace') { e.preventDefault(); pressKey('⌫'); }
    else if (k === 'Enter') { e.preventDefault(); submitQ(); }
    return;
  }
  const k = e.key.toLowerCase(), idx = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if (idx >= 0 && idx < QS.q.opts.length) ACT.answer({ i: idx });
});

// ---------- boot ----------
if (load()) tick(false); else { fresh(); save(); }
render();
setInterval(() => tick(true), 15000);
initDB();

</script>

</body></html>

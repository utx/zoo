hbour make?",["He lied about which axe was his.","He dropped his axe by accident.","He was rude to the woodcutter.","He went to the wrong river."],"He claimed the golden axe was his."],["What is the moral of this fable?",["Honesty is rewarded, but greed can leave you with nothing.","Always look after your tools.","Never go near rivers.","Gold is worth more than iron."],"The honest man gains; the greedy one loses everything."]]},{"t":"Penguins of the Southern Seas","p":["Although many people picture penguins standing on Antarctic ice, only a few of the world's eighteen or so penguin species live on Antarctica itself. Penguins are found across the Southern Hemisphere, from the icy south to the coasts of South America, southern Africa, New Zealand and Australia. One species, the Galapagos penguin, even lives near the equator.","Penguins cannot fly, but they are superb swimmers. Their wings have evolved into stiff flippers, and their streamlined bodies slice through the water. Emperor penguins can dive more than five hundred metres deep and hold their breath for over twenty minutes.","The smallest penguin in the world lives in Australia. The little penguin, sometimes called the fairy penguin, stands only about thirty centimetres tall. At Phillip Island in Victoria, crowds gather each evening to watch hundreds of little penguins waddle ashore after a day of fishing, a nightly event known as the Penguin Parade.","A penguin's black-and-white colouring is a clever disguise called countershading. From above, its dark back blends in with the deep water. From below, its white belly blends in with the bright surface."],"qs":[["What misconception does the first paragraph correct?",["That most penguins live on Antarctica","That penguins can fly","That penguins are fish","That penguins live in the Arctic"],"Only a few species live on Antarctica itself."],["What have penguins' wings evolved into?",["Stiff flippers","Feathered sails","Long legs","Webbed feet"],"Paragraph two explains this."],["Which is the smallest penguin in the world?",["The little penguin","The emperor penguin","The Galapagos penguin","The Antarctic penguin"],"The little penguin is about thirty centimetres tall."],["What is the Penguin Parade?",["Little penguins coming ashore each evening at Phillip Island","A festival where people dress as penguins","Emperor penguins marching across the ice","A race between penguins"],"Paragraph three explains it."],["How does countershading help a penguin?",["It helps it blend in when seen from above or below.","It keeps it warm.","It helps it swim faster.","It attracts a mate."],"The dark back and white belly blend with the water from different angles."]]},{"t":"The Substitute","p":["Mr Grimsby, our substitute teacher, did not smile. He wrote his name on the board in capital letters, underlined it twice, and turned to face us with his hands behind his back.","\"I understand,\" he said, \"that this class has a reputation.\"","We did. Last term we had driven two relief teachers away before morning tea. Harrison had a whoopee cushion ready. Mia had swapped all the whiteboard markers for permanent ones. We were, in our own opinion, legends.","Mr Grimsby sat down. The whoopee cushion let out a magnificent noise. The class held its breath.","Mr Grimsby stood up, lifted the cushion and examined it carefully. \"An excellent specimen,\" he said. \"The rubber is high quality, and the valve is well designed. Harrison, is it? Would you like to explain to the class how it works? In detail. With diagrams.\"","By lunchtime, Harrison had filled the board with an explanation of air pressure. Mia had written a report on permanent ink. And the rest of us had learned more science in a morning than in the whole of last term.","When our real teacher came back, we asked if Mr Grimsby could visit again."],"qs":[["What does \"this class has a reputation\" suggest Mr Grimsby had heard?",["The class often misbehaved with relief teachers.","The class was the best in the school.","The class loved science.","The class was very quiet."],"They had driven relief teachers away before."],["Why does the narrator say \"We were, in our own opinion, legends\"?",["The class was proud of their pranks, even though others may not agree.","The class had won an award.","The teacher called them legends.","They were famous athletes."],"\"in our own opinion\" hints that not everyone would agree."],["How did Mr Grimsby respond to the whoopee cushion?",["He turned it into a learning activity.","He shouted at the class.","He sent Harrison to the principal.","He pretended not to notice."],"He asked Harrison to explain how it works, with diagrams."],["Why did the class hold its breath?",["They were waiting to see how Mr Grimsby would react.","The room smelled bad.","They were practising for swimming.","They were scared of the cushion."],"They were in suspense after the prank."],["How did the students' attitude change by the end?",["They came to respect and like Mr Grimsby.","They became angrier.","They planned a bigger prank.","They stopped coming to school."],"They asked if he could visit again."]]},{"t":"The Mystery of Migration","p":["Every year, the bar-tailed godwit, a long-legged wading bird, performs one of the most astonishing journeys in the animal kingdom. After breeding in Alaska during the northern summer, it flies non-stop across the Pacific Ocean to New Zealand and eastern Australia, a distance of more than eleven thousand kilometres.","The journey takes around eight to ten days, and during that time the godwit does not stop to eat, drink or rest. Before it sets off, the bird eats so much that it nearly doubles its body weight, storing the energy as fat. It also shrinks some of its internal organs, such as parts of its digestive system, which it will not need during the flight.","How do godwits find their way across thousands of kilometres of open ocean with no landmarks? Scientists believe migrating birds may use a combination of clues: the position of the sun and stars, the Earth's magnetic field, and possibly even smells and sounds.","Some godwits have been fitted with tiny satellite trackers. In 2022, one young bird was recorded flying more than thirteen thousand kilometres without stopping, a new world record."],"qs":[["Where does the bar-tailed godwit breed?",["Alaska","New Zealand","Antarctica","Eastern Australia"],"The first paragraph states this."],["Why does the godwit eat so much before its journey?",["To store enough energy as fat for the non-stop flight","Because food in Alaska is delicious","To grow its digestive system","To become too heavy for predators to lift"],"It stores energy because it cannot eat during the flight."],["Why does the godwit shrink some of its organs?",["It does not need them during the flight.","They are damaged by the cold.","It wants to look smaller.","They fall off during migration."],"Paragraph two says it will not need them during the flight."],["Which word best describes how certain scientists are about how birds navigate?",["unsure","completely certain","uninterested","angry"],"Words like \"believe\", \"may\" and \"possibly\" show uncertainty."],["How do scientists know about the record-breaking flight?",["The bird was wearing a satellite tracker.","Someone followed it in a plane.","They counted its feathers.","The bird landed on a ship."],"Birds were fitted with tiny satellite trackers."]]},{"t":"The Box in the Attic","p":["Nobody had been up to the attic since Grandpa died. So when Mum finally pulled down the folding ladder and asked me to help sort through his things, I climbed up slowly, as if the dust might be sleeping and I didn't want to wake it.","Most of it was ordinary: tax papers, a broken lamp, a box of Christmas decorations with half the baubles smashed. But tucked behind the water tank was a small tin trunk with my name painted on the lid. Not my full name. Just \"Kit\", the nickname nobody used except him.","Inside were dozens of envelopes, one for every birthday since I was born. Each was sealed. Each had my age written on the front in Grandpa's shaky capitals: ONE, TWO, THREE, all the way up to TWENTY-ONE.","The envelopes for my first eleven birthdays were gone. He must have given me those, and I had never noticed the matching handwriting in all the cards over the years.","I picked up the one marked TWELVE. My birthday was next week.","Mum watched me from the top of the ladder, her eyes wet. \"He always said he would be there for every one,\" she whispered. \"I suppose he found a way.\""],"qs":[["\"as if the dust might be sleeping\" suggests the narrator felt:",["quiet and respectful in a place linked to someone who had died","excited to play a game","angry about the mess","afraid of spiders"],"The careful, quiet movement reflects respect and sadness."],["Why was the name on the trunk important?",["Only Grandpa called the narrator \"Kit\".","It was painted in gold.","It was the narrator's full name.","It was spelt wrongly."],"Kit was the nickname nobody used except him."],["Why were the first eleven envelopes missing?",["Grandpa had already given them to the narrator on past birthdays.","Someone had stolen them.","They had been lost in the attic.","Grandpa never wrote them."],"The narrator realises he must have given those already."],["How old is the narrator about to turn?",["Twelve","Eleven","Twenty-one","One"],"The next envelope is TWELVE and the birthday is next week."],["What does Mum mean by \"I suppose he found a way\"?",["Grandpa's letters let him still be part of every birthday.","Grandpa hid somewhere in the house.","Grandpa found the attic ladder.","Grandpa sent someone to deliver presents."],"The letters keep his promise to \"be there for every one\"."]]},{"t":"Chocolate: From Bean to Bar","p":["Chocolate begins its life as a seed inside a large pod that grows on the cacao tree. These trees grow only in hot, wet regions near the equator, such as West Africa, Central and South America, and parts of Asia.","When the pods are ripe, farmers cut them from the trees and split them open. Inside are around thirty to fifty seeds, known as cacao beans, surrounded by a sweet white pulp. The beans and pulp are piled up and covered, often with banana leaves, and left to ferment for about a week. Fermentation develops the flavours that later make chocolate taste like chocolate.","Next, the beans are dried in the sun, then shipped to factories around the world. There they are roasted, cracked open and ground into a thick paste called cocoa mass. Sugar, milk and cocoa butter may be added, and the mixture is stirred and heated for hours to make it smooth before being cooled and moulded into bars.","The ancient Maya and Aztec peoples of Central America drank chocolate as a bitter, spicy drink thousands of years ago. The sweet chocolate bars we know today were not developed until the 1800s."],"qs":[["Where do cacao trees grow?",["In hot, wet regions near the equator","In cold mountain areas","Only in Europe","In dry deserts"],"The first paragraph explains this."],["Why are cacao beans left to ferment?",["To develop their chocolate flavour","To make them softer to chew","To remove the seeds","To turn them white"],"Fermentation develops the flavours."],["What is cocoa mass?",["A thick paste made from ground roasted beans","The white pulp inside the pod","A type of chocolate bar","A tree that grows cacao"],"Paragraph three defines it."],["Which step comes directly after fermentation?",["Drying the beans in the sun","Roasting the beans","Cutting the pods from the tree","Adding sugar and milk"],"\"Next, the beans are dried in the sun\"."],["How was chocolate different for the Maya and Aztecs?",["It was a bitter, spicy drink.","It was a sweet bar.","It was a type of bread.","It was used as paint."],"The final paragraph explains this."]]},{"t":"Gone Fishing","p":["Pop never caught many fish. That was not really the point.","Every Saturday, he and I would walk down to the end of the old wharf before sunrise, carrying two rods, a bucket, a thermos of sweet tea and a paper bag of prawns that smelled so bad the seagulls followed us like fans following a rock star.","We would sit with our legs hanging over the edge and watch our floats bob on the grey water. Pop would tell me about the war, or about the time he met Nana at a dance, or about the enormous flathead that got away in 1974, which grew a little bigger every time he told the story.","Sometimes we did not talk at all. We just listened to the water slapping against the pylons and watched the sky turn from black to pink to gold.","Once, I asked him why we kept going when we hardly ever caught anything.","He poured me a cup of tea from the thermos and thought about it for a long time. \"Fishing's just the excuse,\" he said at last. \"The good part is the sitting.\""],"qs":[["What does \"That was not really the point\" suggest?",["Catching fish was not the main reason for going.","Pop was a poor fisherman who hated fishing.","The fish had no points.","They never went fishing."],"The story shows they went for other reasons."],["\"the seagulls followed us like fans following a rock star\" is:",["a humorous simile","a metaphor","onomatopoeia","a fact"],"It uses \"like\" to make a funny comparison."],["What does the flathead growing \"a little bigger every time he told the story\" suggest?",["Pop exaggerated the story each time.","The fish was still alive and growing.","Pop caught it several times.","The narrator did not believe it existed."],"It gently shows Pop exaggerating."],["What does the narrator enjoy about the quiet times?",["Listening to the water and watching the sunrise","Catching lots of fish","Feeding the seagulls","Drinking cold drinks"],"Paragraph four describes these peaceful moments."],["What does Pop mean by \"The good part is the sitting\"?",["The time spent together is what matters most.","He is too tired to stand.","He does not like fishing.","Sitting catches more fish."],"Fishing is just an excuse to spend time together."]]},{"t":"Earthquakes","p":["The ground beneath our feet feels solid and still, but the Earth's outer layer is actually broken into gigantic pieces called tectonic plates. These plates float on hotter, softer rock beneath and move very slowly, about as fast as your fingernails grow.","Where two plates meet, they can push together, pull apart or slide past each other. Often their edges become stuck. Pressure builds up over many years, until suddenly the rocks give way and the plates lurch. The energy released travels through the ground as shaking waves, and we feel it as an earthquake.","Scientists measure the strength of earthquakes using an instrument called a seismometer. The magnitude scale they use is not like an ordinary ruler: each step up means the shaking is about ten times larger. A magnitude 6 earthquake produces far more shaking than a magnitude 5.","Australia sits in the middle of a plate, so it has fewer large earthquakes than countries such as Japan or New Zealand, which lie on plate edges. However, earthquakes do still happen here. In 1989, an earthquake in Newcastle, New South Wales, caused serious damage and tragically killed thirteen people."],"qs":[["What are tectonic plates?",["Huge pieces of the Earth's outer layer","Dishes used by scientists","Waves in the ocean","Layers of the atmosphere"],"Paragraph one defines them."],["Why does the writer compare plate movement to fingernails growing?",["To show how slowly the plates move","To show plates are made of the same material","To explain how earthquakes feel","To show plates grow bigger"],"It gives an idea of how slow the movement is."],["What causes an earthquake, according to the passage?",["Stuck plate edges suddenly giving way","Heavy rain","The Moon pulling on the Earth","Volcanoes erupting"],"Pressure builds until the rocks give way."],["What does each step up on the magnitude scale mean?",["The shaking is about ten times larger.","The earthquake lasts ten minutes longer.","One more person feels it.","The shaking is twice as large."],"Paragraph three explains this."],["Why does Australia have fewer large earthquakes than New Zealand?",["It sits in the middle of a plate rather than on an edge.","It is a larger country.","It has more deserts.","It is closer to the equator."],"The final paragraph explains this."]]},{"t":"The Dare","p":["The old Pearson house had been empty for as long as anyone could remember. Its windows were boarded up, its garden had grown wild, and everybody at school knew that anyone who went inside would never come out the same.","\"Touch the front door,\" said Marcus, \"or you're a chicken.\" The others laughed. Ana felt her face burn.","She did not want to go. The gate squealed as she pushed it, and weeds grabbed at her ankles as she walked up the path. The porch steps groaned. Up close, the door was cracked and grey, and a single brass knocker in the shape of a lion stared at her.","She reached out. Then she stopped. Her hand hovered an inch from the wood.","Ana turned around and walked back down the path, past the weeds, through the squealing gate, to where the others were waiting.","\"Chicken!\" crowed Marcus.","\"Maybe,\" said Ana. \"But I didn't come here to prove anything to you.\" She picked up her bag and walked home, and although her heart was still pounding, she felt strangely tall."],"qs":[["Why did Ana walk up to the house?",["She felt pressured by Marcus and the others.","She wanted to buy the house.","She had left her bag there.","She was looking for her cat."],"Marcus called her a chicken and she felt her face burn."],["Which words make the house seem threatening?",["the weeds \"grabbed\" at her ankles","the house was old","the garden was big","the knocker was brass"],"\"grabbed\" gives the weeds a threatening, human-like action."],["Why did Ana stop before touching the door?",["She decided she did not need to do it.","The door opened by itself.","She heard a noise inside.","Marcus called her back."],"She chose to walk away, as her final words show."],["What does Ana mean by \"I didn't come here to prove anything to you\"?",["She does not need Marcus's approval.","She came to visit the house's owner.","She wants Marcus to try the dare.","She is apologising to Marcus."],"She decides what she does, not Marcus."],["Why does Ana feel \"strangely tall\" at the end?",["She feels proud of standing up for herself.","She is standing on the porch.","She has grown taller.","She is walking on her toes."],"Making her own choice gave her confidence."]]},{"t":"The Cleverest Crow","p":["On the Pacific island of New Caledonia lives a crow that makes tools. New Caledonian crows snip and shape twigs and leaves into hooks and probes, which they use to fish insect larvae out of holes in dead wood.","Scientists at the University of Oxford once tested a crow named Betty. They placed a small bucket of food at the bottom of a tall tube, where she could not reach it, and gave her a straight piece of wire. Betty tried to reach the food with the straight wire. When that failed, she wedged the end of the wire into a crack, bent it into a hook, and lifted the bucket out.","In later experiments, crows have solved puzzles that need several steps in the right order, such as using a short stick to reach a longer stick, which they then use to reach food.","Some researchers argue that these crows are as good at certain problem-solving tasks as young children. Not bad for a bird whose brain is about the size of a walnut. Perhaps being called a \"bird brain\" is not such an insult after all."],"qs":[["What do New Caledonian crows use their tools for?",["To reach insect larvae in holes","To build nests","To fight other crows","To open fruit"],"Paragraph one explains this."],["Why did Betty bend the wire into a hook?",["The straight wire could not lift the bucket.","The scientists showed her how.","She wanted to build a nest.","The wire was too long."],"She tried the straight wire first, and it failed."],["What does the \"short stick to reach a longer stick\" experiment show?",["Crows can plan several steps in order.","Crows prefer long sticks.","Crows cannot solve puzzles.","Crows only use tools once."],"It needs several steps done in the right order."],["What does the writer suggest with the last sentence?",["Calling someone a \"bird brain\" may not mean they are stupid.","Birds do not like being insulted.","Crows have large brains.","People should not talk to birds."],"If crows are this clever, \"bird brain\" is not much of an insult."],["What is the main idea of the passage?",["New Caledonian crows are remarkably intelligent tool users.","Crows are dangerous birds.","Oxford University has many birds.","Children are smarter than crows."],"The passage gives examples of their problem-solving."]]},{"t":"The Great Bake-Off","p":["Theo had never baked anything more complicated than toast, which was why entering the school bake-off had seemed like such an excellent idea at midnight and such a terrible idea at breakfast.","He chose a lemon tart, because it looked simple in the recipe book. The recipe book was lying.","The pastry cracked when he rolled it. He patched it with extra dough. The lemon filling refused to set, so he put it back in the oven, where it set so hard it could have been used as a frisbee. He dusted it with icing sugar to hide the brown bits, and then more icing sugar to hide the first lot of icing sugar.","At the bake-off, his tart sat between Olivia's four-layer chocolate cake and Jun's perfect French macarons. Theo wanted to hide under the table.","The judge, a retired pastry chef, took a bite of each entry. When she got to Theo's, she chewed for a long time. Then she said, \"The pastry is tough and the filling is overcooked.\" Theo's stomach dropped. \"But,\" she went on, \"the flavour is brilliant. Real lemons, not the bottled stuff. You'll be good at this one day, if you keep going.\"","Theo did not win. But he went home and made another tart. And then another."],"qs":[["What does the first sentence suggest about Theo's decision?",["It seemed like a good idea late at night but not in the morning.","He had baked many things before.","He entered the bake-off at breakfast.","He was forced to enter."],"The idea seemed excellent at midnight but terrible at breakfast."],["What does \"The recipe book was lying\" suggest?",["The tart was much harder to make than it looked.","The recipe book had the wrong page.","The recipe was for a different dessert.","Someone had written in the book."],"It humorously shows the recipe was not simple at all."],["Why did Theo add more icing sugar?",["To hide mistakes on the tart","To make it sweeter","Because the judge asked for it","To make it look like snow"],"He used it to hide the brown bits, and then the first layer."],["What did the judge like about Theo's tart?",["The flavour, especially the real lemons","The pastry","The way it was decorated","How soft the filling was"],"She praised the flavour and real lemons."],["What does the ending show about Theo?",["The judge's encouragement made him want to keep improving.","He gave up baking.","He was angry about losing.","He won the next bake-off."],"He kept making more tarts."]]},{"t":"Antarctica: The Frozen Continent","p":["Antarctica is the coldest, windiest and driest continent on Earth. The lowest natural temperature ever recorded, about minus eighty-nine degrees Celsius, was measured at the Soviet (now Russian) Vostok research station there in 1983.","It may seem strange to call a place covered in ice a desert, but deserts are defined by how little rain or snow they receive, not by how hot they are. Much of Antarctica's interior receives less precipitation each year than parts of the Sahara.","Almost all of the continent is buried under an ice sheet that is, on average, about two kilometres thick. This ice holds most of the world's fresh water. If it all melted, scientists estimate that sea levels around the world would rise by about fifty-eight metres.","No country owns Antarctica. Under the Antarctic Treaty, first signed in 1959, it is reserved for peaceful purposes and scientific research. Australia was one of the original twelve countries to sign, and today it runs three permanent research stations there: Casey, Davis and Mawson.","No people live in Antarctica permanently, but thousands of scientists and support staff visit each year to study the ice, the weather, the ocean and the animals."],"qs":[["What three words describe Antarctica in the first sentence?",["coldest, windiest and driest","coldest, largest and highest","wettest, windiest and coldest","darkest, coldest and emptiest"],"The first sentence lists these."],["Why can Antarctica be called a desert?",["It receives very little rain or snow.","It is very hot in summer.","It is covered in sand.","It has no animals."],"Deserts are defined by low precipitation."],["What would happen if Antarctica's ice all melted?",["Sea levels would rise by about fifty-eight metres.","The continent would disappear.","The Sahara would become wet.","Temperatures would drop."],"Paragraph three explains this."],["What is the Antarctic Treaty for?",["Keeping Antarctica for peace and science","Dividing Antarctica between countries","Allowing mining in Antarctica","Building cities in Antarctica"],"It reserves Antarctica for peaceful purposes and research."],["Which of these is NOT an Australian station named in the passage?",["Vostok","Casey","Davis","Mawson"],"The passage names Casey, Davis and Mawson."]]},{"t":"Lost in the Supermarket","p":["One moment Mum was right beside me in the cereal aisle. The next, I turned around holding a box of Choco Crunch to show her, and she was gone.","I was six, and the supermarket suddenly seemed as enormous as a city. The shelves towered over me. The music playing through the speakers was cheerful in a way that felt like it was mocking me. Every trolley that rolled past belonged to a stranger.","I remembered what Mum always told me: \"If you get lost, stay where you are and find someone who works there.\" So I stood very still, holding my cereal box like a shield, until I saw a woman in a green apron stacking tins of tomatoes.","\"Excuse me,\" I said, in a voice that came out much smaller than I wanted. \"I've lost my mum.\"","The woman knelt down so our eyes were level. She asked my name and my mum's name, then spoke into her walkie-talkie. A minute later, a voice boomed over the speakers, and a minute after that, Mum came running down the aisle, her face white.","She hugged me so tightly the cereal box got squashed. We bought it anyway."],"qs":[["Why did the supermarket seem \"as enormous as a city\"?",["The narrator was small and frightened.","It was the biggest supermarket in the world.","It was built like a city.","The narrator had never been to a supermarket."],"Feeling lost and small made everything seem huge."],["Why did the cheerful music seem to be \"mocking\" the narrator?",["It did not match how scared the narrator felt.","It was too loud.","The narrator did not like the song.","Someone was laughing."],"Cheerful music clashed with the narrator's fear."],["What sensible action did the narrator take?",["Stayed still and asked a worker for help","Ran around looking for Mum","Left the supermarket","Hid behind the shelves"],"The narrator followed Mum's advice."],["Why did the worker kneel down?",["To speak with the child at eye level and make them feel comfortable","To pick up tomato tins","To look under the shelves","Because she was tired"],"Getting to eye level is a kind, reassuring gesture."],["What does Mum's \"face white\" suggest?",["She had been very frightened.","She was covered in flour.","She was sick.","She was angry."],"A pale face shows fear."]]},{"t":"The Wonder of Water","p":["Water is so common that we rarely stop to think about how strange it is. Yet it has some remarkable properties that make life on Earth possible.","Most substances shrink as they cool and become solid, so their solid form sinks in their liquid form. Water is different. When it freezes, it expands, becoming about nine per cent bigger. This makes ice lighter than liquid water, which is why ice cubes float in your drink and why lakes freeze from the top down. The layer of ice on top acts like a blanket, keeping the water beneath from freezing solid, so fish can survive the winter.","Water can also soak up a great deal of heat before its temperature rises. This is why the ocean stays cooler than the land on a hot summer's day, and why coastal places usually have milder weather than places far inland.","Finally, water is sometimes called the universal solvent, because it can dissolve more substances than almost any other liquid. As water moves through our bodies, it carries dissolved nutrients to our cells and helps wash away waste."],"qs":[["What happens to water when it freezes?",["It expands.","It shrinks.","It sinks.","It becomes heavier."],"Paragraph two says it becomes about nine per cent bigger."],["Why do lakes freeze from the top down?",["Ice is lighter than liquid water, so it floats.","The top is closer to the sun.","Fish keep the bottom warm.","The wind freezes the bottom first."],"Floating ice forms at the surface."],["How does the layer of ice help fish?",["It stops the water below from freezing solid.","It gives them food.","It lets them breathe air.","It helps them see better."],"The ice acts like a blanket."],["Why are coastal places usually milder than inland places?",["The ocean soaks up heat without warming up quickly.","There is more wind inland.","The sun is weaker at the coast.","Coastal places have more trees."],"Paragraph three explains this."],["Why is water called \"the universal solvent\"?",["It can dissolve more substances than almost any other liquid.","It is found everywhere in the universe.","It solves problems.","It never changes."],"The last paragraph explains the name."]]},{"t":"Brave Enough","p":["Everybody said Dad was brave. He was a firefighter, and there was a photo of him in the newspaper carrying a little boy out of a burning house. At school, kids asked me if he was scared of anything. \"Nothing,\" I always said.","Then one night I came downstairs for a glass of water and found him sitting alone at the kitchen table in the dark. His hands were wrapped around a mug of tea that had gone cold. He didn't hear me until I was right beside him.","\"Couldn't sleep,\" he said, and tried to smile. It didn't quite work.","I sat down. For a long time neither of us said anything. Then he told me about the fire that day, a warehouse, and about the moment the roof started to come down and he didn't know if his friend Sal had got out. Sal had. But Dad's hands were still shaking a little.","\"I thought you weren't scared of anything,\" I said.","He looked at me for a long moment. \"Being brave isn't about not being scared, mate,\" he said. \"It's about being scared and going in anyway. And then being honest about it afterwards.\"","The next time someone at school asked, I told them the truth. It turned out to be a better answer."],"qs":[["Why did the narrator believe Dad was not scared of anything?",["Dad was a firefighter who had done brave things.","Dad had told him so.","Dad never went to work.","Dad was very tall."],"Everyone called him brave and he had rescued a child."],["What does the cold tea suggest?",["Dad had been sitting there for a long time, lost in thought.","Dad does not like hot tea.","The kettle was broken.","Dad had just arrived home."],"The tea had time to go cold while he sat."],["\"tried to smile. It didn't quite work\" shows that Dad:",["was still upset and could not hide it","was happy to see his son","had hurt his face","was about to laugh"],"His smile failed because he was troubled."],["What is Dad's definition of bravery?",["Feeling scared but acting anyway, and being honest about it","Never feeling afraid","Winning every fight","Being in the newspaper"],"He explains this in his final words."],["What does the narrator learn by the end?",["That admitting fear is part of real courage","That firefighters are never afraid","That he should not talk to his dad at night","That school friends ask too many questions"],"He tells the truth at school and finds it a better answer."]]},{"t":"Speed of the Cheetah","p":["The cheetah is the fastest land animal on Earth. In short bursts, it can reach speeds of about one hundred kilometres per hour, and it can accelerate from standing still to over ninety kilometres per hour in around three seconds, faster than many sports cars.","Its body is built for speed. It has a lightweight frame, long legs and an extremely flexible spine that coils and uncoils like a spring, letting it cover about seven metres in a single stride. Its large nostrils and lungs take in lots of oxygen, and its long tail works like a rudder, helping it balance and turn sharply while chasing prey.","But speed comes at a cost. A cheetah can only keep up its top speed for a short distance, usually a few hundred metres, before it overheats and must stop. After a chase it is often so exhausted that it must rest before eating, and larger predators such as lions and hyenas sometimes steal its meal.","Cheetahs are now endangered. Only about seven thousand remain in the wild, mostly in Africa, and they face threats from habitat loss and conflict with farmers."],"qs":[["How does a cheetah compare with many sports cars?",["It can speed up faster.","It has a higher top speed.","It can travel further.","It is heavier."],"It accelerates to over 90 km/h in about three seconds."],["What does the cheetah's tail do?",["Helps it balance and turn","Keeps it cool","Scares away lions","Helps it breathe"],"Paragraph two says it works like a rudder."],["Why can a cheetah only run at top speed for a short distance?",["It overheats.","Its legs are too short.","It runs out of food.","Its tail gets tired."],"Paragraph three explains this."],["Why might a cheetah lose its meal?",["It is too tired to guard it from larger predators.","It forgets where it left it.","It does not like the taste.","Farmers take it away."],"Lions and hyenas sometimes steal its meal while it rests."],["What is the purpose of the final paragraph?",["To inform readers that cheetahs are endangered","To describe how cheetahs hunt","To compare cheetahs with lions","To persuade readers to buy a sports car"],"It gives facts about their endangered status."]]},{"t":"The Wishing Well","p":["There was a well at the bottom of Mrs Abernathy's garden, and everyone in the street knew it granted wishes. Well, not everyone. Mostly just the children, and mostly just because Oscar Kim had told them so.","Oscar charged one gold coin per wish. He said it was a fee to cover the well's \"running costs\". The coins, of course, went straight into his pocket, and by the middle of the summer holidays he had nearly enough for the skateboard he wanted.","Then Lucy Tran came to the well. She was seven, and she did not have a gold coin. She had a ten-cent piece and a very serious face.","\"I wish my dad would get better,\" she said, and dropped the coin into the dark water before Oscar could stop her.","Oscar knew Lucy's dad was in hospital. He knew the well was just a well. That night he could not sleep.","The next morning, he took all his coins out of the jar, walked to the hospital gift shop and bought the biggest get-well card they had. Then he took it to Lucy's house, and helped her fill it with drawings."],"qs":[["Why do the children believe the well grants wishes?",["Oscar told them it did.","Mrs Abernathy said so.","They had seen it work.","It was in the newspaper."],"\"mostly just because Oscar Kim had told them so\"."],["Why does the writer put \"running costs\" in quotation marks?",["To show it was Oscar's made-up excuse","Because the well really had costs","Because Mrs Abernathy said it","To show it was a title"],"The quotation marks suggest it is not genuine."],["Why was Lucy's wish different from the others?",["It was serious and heartfelt.","She paid more money.","She wished for a skateboard.","She wished out loud."],"She wished for her sick father to get better."],["Why could Oscar not sleep?",["He felt guilty about taking advantage of the children.","He was excited about his skateboard.","The well was too noisy.","He was worried about Mrs Abernathy."],"He knew the well was fake and Lucy's wish was real."],["How does Oscar change by the end?",["He uses his money to do something kind.","He buys his skateboard.","He charges more for wishes.","He fills in the well."],"He spends his coins on a card for Lucy's dad."]]},{"t":"Weather Watching","p":["Long before satellites and computers, people predicted the weather by watching the sky. Some of their sayings actually contain real science.","Take the rhyme \"Red sky at night, sailor's delight; red sky in the morning, sailor's warning.\" In many parts of the world, weather systems tend to move from west to east. A red sky at sunset, in the west, often means the air to the west is dry and clear, so fine weather may be coming. A red sky at sunrise, in the east, may mean the clear weather has already passed, and clouds and rain could follow.","Clouds can also give clues. Fluffy white cumulus clouds usually mean fair weather. But if they grow tall and dark, towering into anvil shapes called cumulonimbus, a thunderstorm may be on its way.","Today, meteorologists use satellites, weather balloons and powerful computers to make forecasts. Even so, forecasting is never perfect, because the atmosphere is enormously complicated and small changes can grow into big differences over just a few days."],"qs":[["What point does the writer make in the first paragraph?",["Some old weather sayings are based on real science.","All old sayings are wrong.","Satellites are useless.","Sailors invented weather forecasting."],"\"Some of their sayings actually contain real science.\""],["According to the passage, what might a red sky at night mean?",["Fine weather may be coming.","A storm is coming.","The sun is setting early.","It will snow."],"It often means dry, clear air to the west."],["What do tall, dark anvil-shaped clouds warn of?",["A thunderstorm","Fair weather","Fog","A heatwave"],"Paragraph three explains cumulonimbus clouds."],["Which word best describes cumulus clouds in the passage?",["fluffy","towering","dark","anvil-shaped"],"They are described as fluffy and white."],["Why is weather forecasting never perfect?",["The atmosphere is very complicated and small changes can grow.","Meteorologists do not use computers.","Satellites often break.","Weather never changes."],"The final paragraph explains this."]]},{"t":"Mount Everest","p":["At 8,849 metres above sea level, Mount Everest is the highest mountain on Earth. It sits in the Himalayas, on the border between Nepal and the Tibet region of China. In Nepal it is called Sagarmatha, and in Tibet, Chomolungma.","The first people confirmed to reach the summit were Edmund Hillary, a beekeeper from New Zealand, and Tenzing Norgay, a Sherpa mountaineer from Nepal, on 29 May 1953. Tenzing had already attempted the climb several times, and his experience of the mountain was vital to their success.","Climbing Everest is extremely dangerous. Near the top, the air contains only about a third as much oxygen as at sea level, so most climbers breathe from oxygen bottles. The highest part of the mountain is known as the \"death zone\", because the human body cannot survive there for long. Climbers also face freezing temperatures, fierce winds, avalanches and deep cracks in the ice called crevasses.","Today, hundreds of people attempt to climb Everest each year, and in busy seasons long queues of climbers can form near the summit. Many worry that crowding and the rubbish left behind are harming the mountain."],"qs":[["What are the two local names for Mount Everest given in the passage?",["Sagarmatha and Chomolungma","Himalaya and Tibet","Hillary and Tenzing","Nepal and Sherpa"],"Paragraph one gives both names."],["Why was Tenzing Norgay's experience important?",["He had attempted the climb before and knew the mountain.","He was a beekeeper.","He carried all the oxygen.","He built the camps."],"Paragraph two says his experience was vital."],["Why is the top of the mountain called the \"death zone\"?",["The human body cannot survive there for long.","Many animals die there.","It is covered in graves.","It is always dark."],"Paragraph three explains the name."],["What is a crevasse?",["A deep crack in the ice","An oxygen bottle","A type of wind","A Sherpa guide"],"The passage defines crevasses."],["What concern is raised in the final paragraph?",["Crowding and rubbish may be harming the mountain.","The mountain is shrinking.","No one climbs Everest any more.","Climbers are running out of maps."],"Many worry about crowding and rubbish."]]},{"t":"The Garden on the Roof","p":["The apartment block on Kelly Street was grey from top to bottom: grey walls, grey stairs, grey car park. Even the pigeons looked grey. But the roof was the greyest of all, a flat concrete square covered in puddles and old chairs nobody wanted.","It was Mrs Nguyen from Flat 9 who carried up the first pot, a chipped ceramic one with a chilli plant in it. The next week, the Petrovs from Flat 2 brought three tomato seedlings in paint tins. Then a teenager called Dev, who everyone thought never left his room, dragged up an old bathtub and filled it with soil.","By the end of summer, the roof was crowded with beans climbing up broom handles, strawberries tumbling out of gumboots, sunflowers taller than Mr Petrov and a lemon tree in a wheelie bin. People who had lived in the building for years without saying more than hello started swapping seeds, recipes and stories.","On the last Saturday of summer, the whole building held a dinner on the roof, using food they had grown themselves. As the sun went down over the city, someone noticed that even the pigeons looked a little less grey."],"qs":[["Why does the writer repeat the word \"grey\" in the first paragraph?",["To show how dull and lifeless the building was","Because grey is the writer's favourite colour","To describe the weather","To show the building was new"],"The repetition emphasises the dreariness."],["What surprised people about Dev?",["He helped with the garden even though people thought he never went out.","He owned a bathtub shop.","He did not like plants.","He lived on the roof."],"Everyone thought he never left his room."],["\"strawberries tumbling out of gumboots\" shows that residents:",["used unusual, recycled containers as pots","wore gumboots while gardening","grew strawberries in the ground","threw fruit off the roof"],"They planted in gumboots, paint tins, a bathtub and a wheelie bin."],["What was the most important change the garden brought?",["Neighbours got to know each other.","The building was painted.","The pigeons left.","The roof stopped leaking."],"People began swapping seeds, recipes and stories."],["What does the final sentence suggest?",["The whole building feels brighter and happier.","The pigeons had been painted.","It was getting dark.","The garden attracted new birds."],"Even the pigeons seem less grey, showing a change in mood."]]},{"t":"Sharks: Misunderstood Hunters","p":["For many people, the word \"shark\" brings to mind a terrifying monster with rows of razor teeth. Movies have helped create this image. But the truth about sharks is far more interesting, and far less frightening.","There are more than five hundred species of shark, and most are harmless to humans. The largest, the whale shark, can grow longer than a bus, yet it feeds on tiny plankton by filtering water through its huge mouth. Many sharks are smaller than a person, and some, such as the dwarf lanternshark, could fit in your hand.","Shark attacks are extremely rare. Worldwide, sharks kill only a small number of people each year, fewer than are killed by many everyday dangers. Humans, on the other hand, kill tens of millions of sharks every year, mainly through fishing.","This matters, because sharks play an important role in ocean ecosystems. As predators, they help keep populations of other animals healthy and balanced. Because many sharks grow slowly and have few young, their numbers can take a very long time to recover once they fall."],"qs":[["According to the writer, what has helped create the \"monster\" image of sharks?",["Movies","Scientists","Fishermen","School books"],"Paragraph one says movies helped create this image."],["What does the whale shark eat?",["Tiny plankton","Large fish","Seals","Other sharks"],"It filters plankton through its mouth."],["What is the writer's point in paragraph three?",["Humans are a much greater danger to sharks than sharks are to humans.","Sharks attack people every day.","Sharks should all be caught.","Swimming is very dangerous."],"Sharks kill very few people, but humans kill millions of sharks."],["Why do shark populations recover slowly?",["Many grow slowly and have few young.","They eat too much.","They live only in cold water.","They are hunted by whales."],"The final paragraph explains this."],["What is the writer's main purpose?",["To change readers' negative ideas about sharks","To frighten readers","To describe a movie","To teach readers how to fish"],"The writer corrects misunderstandings about sharks."]]},{"t":"The Science Fair","p":["Nadia's volcano was supposed to erupt. It had erupted perfectly in her kitchen three times, spewing red foam across the bench and all over the cat.","Now, in front of the judges, she poured in the vinegar, stepped back and waited. The volcano gave a small, sad fizz, like a sigh. A single bubble rose, popped and slid down the side.","Behind her, somebody snickered. Nadia's cheeks burned. Then she took a breath and turned to the judges. \"Well,\" she said, \"that's interesting. Can I work out why?\"","She checked her notes. Same amount of vinegar. Same amount of red colouring. Then she picked up the jar of baking soda and read the label. It was not baking soda at all. In the morning rush, she had grabbed the cornflour.","\"Cornflour doesn't react with vinegar,\" she explained. \"Baking soda is a base, and vinegar is an acid. When they mix, they make carbon dioxide gas, and that's what makes the foam. So this failed experiment actually proves which ingredient does the work.\"","She did not win first prize. But one of the judges wrote on her feedback sheet: \"Best use of a mistake I have ever seen.\""],"qs":[["\"like a sigh\" suggests the volcano's fizz was:",["weak and disappointing","loud and exciting","dangerous","perfect"],"A sigh is small and a bit sad, like the tiny fizz."],["How did Nadia first feel when the experiment failed?",["embarrassed","bored","relieved","angry with the judges"],"Her cheeks burned when someone snickered."],["What caused the experiment to fail?",["She used cornflour instead of baking soda.","She used too little vinegar.","The red colouring was wrong.","The volcano was too small."],"She grabbed cornflour in the morning rush."],["What makes the foam in the volcano?",["Carbon dioxide gas made when an acid and base react","The red colouring","The cornflour","Air trapped in the volcano"],"Nadia explains the reaction."],["Why did the judge praise Nadia?",["She turned her mistake into a lesson about the science.","Her volcano was the biggest.","She won first prize.","She made everyone laugh."],"The judge praised her \"use of a mistake\"."]]},{"t":"Wind Power","p":["For thousands of years, people have used the wind. Sailors caught it in sails to cross oceans. Farmers built windmills to grind grain and pump water. Today, giant wind turbines turn the wind into electricity.","A modern wind turbine works rather like a fan in reverse. Instead of using electricity to spin the blades and make wind, it uses the wind to spin the blades and make electricity. The blades are connected to a shaft that turns a generator inside the housing at the top of the tower. Some turbines are taller than a thirty-storey building, with blades longer than an Olympic swimming pool.","Wind power has important advantages. The wind is free and will never run out, and turbines do not release greenhouse gases while they are working. Wind farms can also share land with farm animals and crops.","However, wind power has challenges too. The wind does not always blow, so other energy sources or batteries are needed to keep the lights on during still weather. Some people also object to how turbines look or sound, and they must be carefully placed to reduce harm to birds and bats."],"qs":[["How does the writer explain how a wind turbine works?",["By comparing it to a fan working in reverse","By describing a sailing ship","By explaining how batteries work","By describing a windmill grinding grain"],"The second paragraph uses this comparison."],["What is inside the housing at the top of the tower?",["A generator","A battery","A fan","A water pump"],"The shaft turns a generator in the housing."],["Which is an advantage of wind power mentioned in the passage?",["It does not release greenhouse gases while working.","The wind always blows.","Turbines are invisible.","It is quieter than any other energy."],"Paragraph three lists this advantage."],["Why are batteries or other energy sources needed?",["The wind does not always blow.","Turbines break every week.","Wind power is too strong.","Birds block the turbines."],"During still weather, turbines cannot generate power."],["How is the information in paragraphs three and four organised?",["Advantages, then challenges","Oldest to newest","Problem, then solution","Question and answer"],"Paragraph three gives advantages; paragraph four gives challenges."]]},{"t":"Two Sides of the Fence","p":["Grace and Mrs Lindqvist had been neighbours for three years and had spoken exactly twice. Both times it was about the fence.","The fence was old and leaning, and Mrs Lindqvist's roses kept growing through the gaps into Grace's yard, where their thorns snagged on everything, including Grace's football. Grace's football, in turn, kept flying over the fence into Mrs Lindqvist's roses.","One afternoon the ball sailed over again, and this time Grace heard a crunch and a cry. She scrambled up onto the bin to look. Mrs Lindqvist was sitting on the ground among her flowers, holding her wrist.","Grace ran next door without thinking. She helped Mrs Lindqvist inside, fetched ice from the freezer and called her own mum. It turned out the wrist was only sprained, not broken, and the ball had not even hit her; she had tripped over the garden hose.","For the next two weeks, Grace came over after school to water the roses, because Mrs Lindqvist could not hold the hose. She learned the names of every variety. Mrs Lindqvist learned the offside rule.","The fence is still old and leaning. But now there is a small gate in it."],"qs":[["What does \"had spoken exactly twice. Both times it was about the fence\" suggest?",["The neighbours did not get along well.","They were close friends.","They had just met.","They both built the fence."],"They only spoke about their disagreement."],["Why did Grace run next door \"without thinking\"?",["She instinctively wanted to help someone who was hurt.","She wanted her ball back.","She was angry with Mrs Lindqvist.","Her mum told her to."],"She reacted immediately to seeing Mrs Lindqvist injured."],["How did Mrs Lindqvist actually hurt her wrist?",["She tripped over the garden hose.","The football hit her.","She fell off the fence.","A rose thorn scratched her."],"The ball had not hit her; she tripped."],["What does \"Mrs Lindqvist learned the offside rule\" suggest?",["She took an interest in Grace's football.","She joined a football team.","She stopped Grace playing football.","She taught Grace about roses."],"Each learned about the other's interest."],["What does the new gate in the fence symbolise?",["The friendship that has grown between them","A plan to sell the house","A way to keep roses out","The fence being fixed"],"The gate represents an open connection between them."]]},{"t":"The Human Heart","p":["Your heart is a muscle about the size of your fist, and it never takes a day off. It beats about one hundred thousand times each day, pumping blood through a network of blood vessels that, laid end to end, would stretch around the Earth more than twice.","The heart has four chambers. The two upper chambers, called atria, receive blood returning to the heart. The two lower chambers, called ventricles, pump blood out. The right side of the heart sends blood to the lungs, where it picks up oxygen. The left side then pumps this oxygen-rich blood to the rest of the body.","Valves inside the heart act like one-way doors, making sure blood flows in the right direction. The \"lub-dub\" sound a doctor hears through a stethoscope is actually the sound of these valves snapping shut.","Like any muscle, the heart gets stronger with exercise. Activities that raise your heart rate, such as running, swimming, cycling or dancing, help keep it healthy for life."],"qs":[["How big is the human heart, according to the passage?",["About the size of your fist","About the size of your head","About the size of a grape","About the size of a football"],"The first sentence tells us."],["What do the ventricles do?",["Pump blood out of the heart","Receive blood returning to the heart","Hold oxygen","Make the lub-dub sound"],"Paragraph two explains the ventricles."],["Where does the right side of the heart send blood?",["To the lungs","To the brain","To the legs","To the stomach"],"It sends blood to the lungs to pick up oxygen."],["What makes the \"lub-dub\" sound?",["The heart valves snapping shut","Blood rushing through the lungs","The heart muscle stretching","The stethoscope"],"Paragraph three explains this."],["What is the main message of the final paragraph?",["Exercise helps keep your heart healthy.","Dancing is better than running.","The heart never gets tired.","Doctors use stethoscopes."],"It explains how exercise strengthens the heart."]]},{"t":"The Painting","p":["In the corner of the gallery hung a painting that nobody looked at. It was small and dark, a picture of an empty wooden chair beside a window, and visitors walked past it on their way to the bright, enormous paintings in the next room.","Every Tuesday, though, an old man came and sat on the bench in front of it. He stayed for exactly one hour. He never looked at the other paintings.","The security guard, Elif, grew curious. One Tuesday she sat down beside him. \"Why this one?\" she asked.","The old man was quiet for a while. \"My wife painted it,\" he said. \"That was her chair, by our window, where she used to read. She painted it the year before she died. I gave it to the gallery so that other people could see it.\"","He smiled a little. \"Nobody does, of course. But I do.\"","After that, Elif began telling visitors about the painting. Some of them stopped, and looked, and stayed longer than they meant to. The old man noticed. Every Tuesday after that, he nodded to Elif when he arrived, and she nodded back."],"qs":[["Why did most visitors ignore the painting?",["It was small and dark, and the bright paintings attracted them more.","It was hidden behind a curtain.","It was not allowed to be looked at.","It was damaged."],"Visitors walked past to the bright, enormous paintings."],["Why did the old man visit every Tuesday?",["The painting was made by his late wife.","He worked at the gallery.","He was an art critic.","He was waiting for a friend."],"His wife painted it."],["Why is the empty chair in the painting meaningful?",["It was where his wife used to sit and read.","It was the chair he made.","It was the gallery's oldest chair.","It was for sale."],"He explains it was her reading chair."],["Why did Elif start telling visitors about the painting?",["She wanted others to appreciate it as the old man did.","Her boss told her to.","She wanted to sell it.","She painted it herself."],"She was moved by his story."],["What does the nodding at the end show?",["A quiet understanding and friendship between them","That they were angry with each other","That the gallery was closing","That Elif was tired"],"The nods show a silent bond."]]},{"t":"The Mighty Murray","p":["The Murray River is Australia's longest river, flowing for about two and a half thousand kilometres from the Australian Alps to the sea in South Australia. For much of its length, it forms the border between New South Wales and Victoria.","The Murray and its tributaries, including the Darling, make up the Murray-Darling Basin, which covers about one seventh of Australia. The basin is often called Australia's food bowl, because a large share of the country's farm produce, including fruit, rice, cotton and dairy, is grown there with the help of water from its rivers.","For tens of thousands of years, the river has been central to the lives of many Aboriginal nations, who fished its waters, built canoes from the bark of its river red gums and cared for its wetlands.","Today, the Murray faces serious challenges. Taking large amounts of water for farms and towns, together with droughts, has sometimes left too little water flowing to keep the river and its wetlands healthy. Governments, farmers, scientists and communities continue to debate how the water should be shared fairly between people and the environment."],"qs":[["Which two states does the Murray form a border between?",["New South Wales and Victoria","Victoria and South Australia","Queensland and New South Wales","South Australia and Western Australia"],"Paragraph one tells us."],["What is a \"tributary\"?",["A smaller river that flows into a larger one","A dam across a river","A type of fish","The mouth of a river"],"The Darling is a tributary that joins the Murray system."],["Why is the basin called \"Australia's food bowl\"?",["Much of Australia's farm produce is grown there.","It is shaped like a bowl.","People eat by the river.","It has many restaurants."],"Paragraph two explains this."],["How did Aboriginal nations use the river red gums?",["They made canoes from the bark.","They built houses from the logs.","They ate the leaves.","They made paper."],"Paragraph three mentions bark canoes."],["What is the main issue in the final paragraph?",["Sharing the river's water fairly between people and the environment","Building more bridges","Stopping floods in cities","Finding the source of the river"],"It discusses debate over sharing water."]]}];

function bankQ(item, tag = 'x') { const [q, o, e] = item; return tagQ(Q(q, o[0], o.slice(1), e), tag + hashStr(q + '|' + o[0])); }
const passageId = P => 'p' + hashStr(P.t);

function freshMaths(avoid = new Set(), gens = MATHS) {

}

function makeSet(subj, recent) {

    const fresh = PASSAGES.map((_, i) => i).filter(i => !seen(passageId(PASSAGES[i])));
    const pool = fresh.length ? fresh : PASSAGES.map((_, i) => i).filter(i => i !== recent.comp);
    const pi = pick(pool); recent.comp = pi;
    const P = PASSAGES[pi], pid = passageId(P), rep = seen(pid);

  }
  const bank = subj === 'english' ? ENGLISH : READING, tag = subj === 'english' ? 'e' : 'r';
  const all = bank.map((it, i) => ({ i, id: tag + hashStr(it[0] + '|' + it[1][0]) }));

  const r = recent[subj] || [];
  const old = shuffle(all.filter(x => seen(x.id) && !r.includes(x.i)));
  const idx = [...fresh, ...old].slice(0, 5).map(x => x.i);

  return idx.map(i => bankQ(bank[i], tag));
}

// ---------------- kangaroos and wallabies ----------------

// ---------------- turtles: six kinds, each shaped like the real thing ----------------

const TURTLE_SHAPE = {
  leather: { rx: 10, ry: 8.6, back: 1.4, head: 3.5, flip: 1.9, beak: 0 },

  logger:  { rx: 9.4, ry: 10, back: 1.05, head: 4.6, flip: 1.05, beak: 0 },
  hawk:    { rx: 9.8, ry: 10, back: 1.1, head: 3.1, flip: 1.05, beak: 1 },
  flat:    { rx: 11, ry: 6.6, back: 1, head: 3.2, flip: 1.05, beak: 0 },

}

// ---------------- ducks: long body, flat bill, tail flick ----------------

const PLANS = { duck: drawDuck, perch: drawPerch, quad: drawQuad, sit: drawSit, roo: drawRoo, bun: drawBun, bird: drawBird, penguin: drawPenguin, owl: drawOwl, tall: drawTall, wader: drawWader, swan: drawSwan, fish: drawFish, shell: drawShell, crab: drawCrab, squid: drawSquid, jelly: drawJelly, long: drawLong, snake: drawSnake, frog: drawFrog, seal: drawSeal, bug: drawBug };

// Draw any animal: returns { pb, meta } where meta has anchor points for hats, shoes and speech.

// cache: species index + kind + ultra + mood + frame + facing → canvas

  grump: (a, mates, D) => { D.emo(a, 'anger'); D.say(a, pick(PERS.grump.lines)); D.mood(a, 'angry', 0); },
  sweet: (a, mates, D) => { const m = pick(mates); if (!m) { D.say(a, pick(['*hugs a rock*', 'I love you, rock.'])); D.emo(a, 'heart'); return; } D.meet(a, m); D.mood(a, 'love', 900, 2200); D.emo(a, 'heart', 900); D.say(a, pick(PERS.sweet.lines), 900);
    if (m.p === 'grump') { D.say(m, pick(['...fine. ONE hug.', 'Get off. ...Okay, a bit longer.', 'Humph. *secretly smiles*']), 2200); friend(a, m, 8); hap(m, 3); } else { D.mood(m, 'love', 1200, 1800); D.emo(m, 'heart', 1300); friend(a, m, 6); hap(m, 3); } hap(a, 2); },
  thief: (a, mates, D) => { const m = pick(mates); if (!m) { D.say(a, '*sniffs around for snacks*'); D.emo(a, 'food'); return; } D.meet(a, m); D.emo(a, 'food', 800);
    const guard = mates.find(x => x.p === 'grump');

    if (m.p === 'clown') { D.say(m, 'HAHA! Classic!', 1800); D.act(m, 'jump', 1800, 700); friend(a, m, 6); }

};

// ---------- pair chemistry ----------
const CHEM = [
  { a: 'bully', b: ['wimp', 'scaredy'], w: 1.4, run(a, b, mates, D) {
    const guard = mates.find(x => x.p === 'peace' && x !== b) || mates.find(x => friendF(x, b) >= 70 && x !== a && x !== b);
    D.meet(a, b); D.say(a, pick(['Boo!', 'Hand over your lunch.', 'What are YOU looking at?']), 700); D.mood(b, 'shock', 1300); D.emo(b, 'sweat', 1300);
    if (guard) { D.meet(guard, a, 1600); D.say(guard, guard.p === 'peace' ? 'Leave them alone. Now.' : 'Hey! Back off my friend!', 2300); D.say(a, 'Fine... whatever.', 3800); friend(guard, b, 6); friend(a, guard, -3); hap(b, 2); return; } D.act(b, 'run', 1600, 1600); D.say(b, pick(PERS[b.p].lines), 1700); friend(a, b, -6); hap(b, -4); } },
  { a: 'clown', b: ['grump'], w: 1.1, run(a, b, mates, D) { const joke = pick(JOKES); D.meet(a, b); D.say(a, joke, 700, 3000); D.say(b, '...', 3200, 1200); D.say(b, pick(['...HA! I mean. Hmph.', '*snorts* That was stupid. Tell me another.', 'Okay, THAT was funny.']), 4400); D.mood(b, 'happy', 4400); friend(a, b, 6); hap(b, 4); } },
  { a: 'party', b: ['sleepy'], w: 1.1, run(a, b, mates, D) { D.meet(a, b); D.say(a, 'WAKE UP! IT\'S PARTY TIME!', 700); D.act(a, 'dance', 700, 2400); b.nap = 0; D.mood(b, 'angry', 1700); D.say(b, pick(['I WAS SLEEPING!', 'Why. Why would you do this.']), 1800); friend(a, b, -5); hap(b, -4); } },
  { a: 'chatter', b: ['sleepy'], w: 1, run(a, b, mates, D) { D.meet(a, b); D.say(a, 'So THEN my cousin Gary said...', 700); D.say(a, '...and the weather was...', 3000); D.say(b, '...zzz...', 3600); b.nap = Date.now() + 45000; friend(a, b, 3); } },
  { a: 'showoff', b: ['showoff', 'daredevil'], w: 1, run(a, b, mates, D) { D.face(a, b); D.say(a, 'Bet you can\'t do THIS!', 0); D.act(a, 'jump', 500, 1200); D.say(b, 'Pfft. Watch THIS!', 1900); D.act(b, 'spin', 2300, 1300); D.burst(b, 'sparkle', 2500, 4); D.say(a, 'Okay. Rematch tomorrow.', 4200); friend(a, b, 3); hap(a, 2); hap(b, 2); } },
  { a: 'daredevil', b: ['scaredy', 'wimp'], w: 1, run(a, b, mates, D) { D.meet(a, b); D.say(a, 'I dare you to jump that puddle!', 700); D.mood(b, 'shock', 1800); D.say(b, 'NO WAY!', 1900); const did = Math.random() < .5; if (did) { D.say(b, '...okay, one tiny jump.', 3200); D.act(b, 'jump', 3900, 700); D.say(a, 'LEGEND!', 4700); friend(a, b, 7); hap(b, 4); } else { D.act(b, 'run', 2500, 1500); friend(a, b, -1); } } },
  { a: 'knowit', b: ['clown', 'dreamer', 'chatter'], w: .9, run(a, b, mates, D) { D.meet(a, b); D.emo(a, 'bulb', 600); D.say(a, pick(FACTS), 700, 3600); D.say(b, b.p === 'clown' ? 'Actually, that fact is 3% funny.' : b.p === 'dreamer' ? 'Ooh. Numbers are like clouds.' : 'I KNEW that! Also did you know...', 3800); friend(a, b, 3); } },
  { a: 'drama', b: ['drama', 'diva'], w: 1, run(a, b, mates, D) { D.face(a, b); D.say(a, 'I am the MOST dramatic animal here!', 0); D.say(b, 'Excuse me?! *gasps*', 1900); D.act(a, 'faint', 3000, 2000); D.act(b, 'faint', 3300, 2000); D.say(pick(mates.filter(m => m !== a && m !== b)) || a, pick(['Every. Single. Day.', 'Should I call a vet?']), 3800); friend(a, b, Math.random() < .5 ? 4 : -4); } },
  { a: 'escape', b: ['dreamer', 'daredevil', 'prank'], w: .8, run(a, b, mates, D) { D.meet(a, b); D.say(a, 'Psst. Want to see my secret tunnel?', 700); D.say(b, b.p === 'dreamer' ? 'Ooh, tunnels are like upside-down clouds.' : 'YES. Obviously yes.', 2300); friend(a, b, 6); } },
  { a: 'diva', b: ['*'], w: .6, need: b => !!b.gear.hat, run(a, b, mates, D) { D.meet(a, b); D.say(a, 'Where did you get THAT?', 700); D.mood(a, 'angry', 700); D.say(b, pick(['From the Shop, obviously.', 'Jealous?', 'It was a gift!']), 2200); friend(a, b, -3); } },
  { a: 'copycat', b: ['*'], w: .5, run(a, b, mates, D) { D.meet(a, b); D.say(b, pick(PERS[b.p].lines), 700); D.say(a, '...' + pick(PERS[b.p].lines), 2200); D.say(b, 'Stop copying me!', 3500); D.say(a, 'Stop copying me!', 4300); friend(a, b, 1); } },
  { a: 'sweet', b: ['wimp', 'scaredy'], w: 1, run(a, b, mates, D) { D.meet(a, b); D.say(a, "Don't worry, I'll look after you.", 700); D.mood(b, 'love', 2000); D.emo(b, 'heart', 2000); D.say(b, 'R-really? Thank you!', 2200); friend(a, b, 9); hap(b, 5); } },
  { a: 'peace', b: ['bully', 'grump'], w: .9, run(a, b, mates, D) { D.meet(a, b); D.say(a, 'Hey. Deep breaths. Want a snack?', 700); D.say(b, pick(['...yeah. Thanks.', 'Humph. Okay.', 'I guess I was being a bit mean.']), 2300); friend(a, b, 5); hap(b, 3); } },
];
function chemFor(a, b) { return CHEM.filter(c => c.a === a.p && (c.b.includes('*') || c.b.includes(b.p)) && (!c.need || c.need(b))); }

// ---------- general pair antics ----------
function evGame(a, b, D) { const [name, lines, move] = pick(GAMES); D.meet(a, b); D.say(a, lines[0], 700); D.say(b, lines[1], 2300); if (move) { D.act(a, move, 900, 1400); D.act(b, move, 1100, 1400); } D.emo(a, 'heart', 3200); friend(a, b, 6); hap(a, 2); hap(b, 2); return `${a.name} and ${b.name} played ${name}.`; }
function evFight(a, b, mates, D) {
  const peace = mates.find(x => x.p === 'peace' && x !== a && x !== b);
  D.meet(a, b); D.mood(a, 'angry', 600, 3000); D.mood(b, 'angry', 900, 2800); D.say(a, pick([...PERS[a.p].lines.slice(0, 2), 'Oi!', 'You want to go?!']), 700);
  if (peace) { D.meet(peace, a, 1500); D.say(peace, pick(PERS.peace.lines), 2000); D.say(a, 'Fine. Sorry.', 3600); D.say(b, 'Sorry too.', 4200); friend(a, b, 2); return null; }
  D.dust(a, b, 1600); D.dust(a, b, 2200); D.act(a, 'shake', 1500, 1400); D.act(b, 'shake', 1500, 1400);
  for (const m of mates) if (m !== a && m !== b && (m.p === 'scaredy' || m.p === 'wimp')) { D.mood(m, 'shock', 1700); D.act(m, 'run', 1800, 1400); hap(m, -2); }
  const sa = stats(a).st + Math.random() * 6, sb = stats(b).st + Math.random() * 6, [w, l] = sa >= sb ? [a, b] : [b, a];
  D.say(w, pick(WIN_LINES), 3200); D.say(l, pick(LOSE_LINES), 3500); D.mood(l, 'sad', 3400, 2400); D.mood(w, 'happy', 3200);
  friend(a, b, -10); hap(l, -6); hap(w, 2);
  return `${w.name} won a scuffle against ${l.name}.`;
}

// Tunnelling, toned down: only Escape Artists and Daredevils, only when bored AND unhappy, at most once every 45 minutes each,
// and only into another pen in the same area. They wander home again by themselves after a while.
function canDig(a, now) {
  if (a.caged || !a.pen || a.escaped) return false;
  const p = PERS[a.p]; if (!p.dig) return false;
  if (now < (a.dig || 0)) return false;
  if (a.happy >= 45) return false;
  if (a.p === 'escape' && a.gear.toy) return false;
  if (a.p === 'daredevil' && (a.gear.shoes || a.gear.ride)) return false;
  const pen = penById(a.pen);
  return S.pens.some(q => q !== pen && q.zone === pen.zone && penAnimals(q.id).length < q.cap);
}
function evTunnel(a, D) {
  const pen = penById(a.pen), dests = S.pens.filter(q => q !== pen && q.zone === pen.zone && penAnimals(q.id).length < q.cap);
  const dest = pick(dests); if (!dest) return null;
  a.dig = Date.now() + 45 * 60000;
  D.say(a, a.p === 'escape' ? 'Nobody look at me... *dig dig dig*' : 'Hold my carrot! *LEAPS the fence*');
  D.act(a, 'shake', 400, 1500);
  const home = pen.id;
  a.escaped = home; a.pen = dest.id; a.back = Date.now() + 10 * 60000;
  if (D.live) setTimeout(() => { if (SC && SC.kind === 'zone') { syncActors(); const ac = actorFor(a); burst(ac.x, ac.y - 10, 'dust', 4); say(a, pick(['Er... hello, new friends!', "Don't mind me!", 'Nice place you\'ve got here.'])); } }, 60);
  const txt = `🕳️ ${a.name} ${a.p === 'escape' ? 'tunnelled' : 'jumped the fence'} into pen ${dest.slot + 1} of the ${ZONE[dest.zone].name}. It will wander home in a while, or drag it back.`;
  news(txt); return txt;
}

// the Daydreamer's little treasures
function evTreasure(a, D) {
  if (Date.now() < (a.found || 0)) return null;
  a.found = Date.now() + 20 * 60000;
  const k = Math.random() < .5 ? 'food' : 'wood', n = 1 + (Math.random() < .4 ? 1 : 0);
  S[k] += n; D.emo(a, 'sparkle'); D.say(a, k === 'food' ? `Ooh! I found ${n} carrot${n > 1 ? 's' : ''} in a cloud-shaped puddle!` : `Ooh! ${n} stick${n > 1 ? 's' : ''} shaped like a dragon! (That's wood.)`);
  news(`✨ ${a.name} the Daydreamer found ${n} ${k} while daydreaming.`); setTimeout(() => { renderRes(); bump(k); }, 100);
  return 'found';
}

// choose and run one antic for a pen
function antic(pen, live) {
  const now = Date.now(), all = penAnimals(pen.id);
  const free = all.filter(a => !a.caged && !(a.nap > now)), caged = all.filter(a => a.caged);
  const D = director(live), opts = [];
  for (const a of free) {
    const mates = others(a, free);
    if (SOLO[a.p]) opts.push([1, () => SOLO[a.p](a, shuffle(mates), D)]);
    if (!wishMet(a)) opts.push([.35, () => { D.say(a, WISH_SAYS[a.p] || 'I wish...'); D.emo(a, 'cloud'); }]);
    for (const b of mates) {
      for (const c of chemFor(a, b)) opts.push([c.w, () => c.run(a, b, free, D)]);
      opts.push([.18 + PERS[a.p].kind * .25, () => evGame(a, b, D)]);
      const fp = PERS[a.p].fight * (friendF(a, b) <= -50 ? 1.6 : friendF(a, b) >= 50 ? .15 : .6);
      opts.push([fp * .55, () => evFight(a, b, free, D)]);
    }
    if (canDig(a, now)) opts.push([.2, () => evTunnel(a, D)]);
    if (a.p === 'dreamer' && a.happy >= 50 && now >= (a.found || 0)) opts.push([.12, () => evTreasure(a, D)]);
  }
  for (const c of caged) opts.push([.6, () => { D.say(c, pick(CAGE_LINES)); D.mood(c, 'sad'); }]);
  const fn = Wpick(opts); if (!fn) return;
  fn();
}
function runLiveAntics(now) {
  if (!SC || SC.kind !== 'zone') return;
  for (const pen of S.pens.filter(p => p.zone === SC.zone)) {
    if (!NEXT_ANTIC[pen.id]) NEXT_ANTIC[pen.id] = now + 1500 + Math.random() * 2500;
    if (now < NEXT_ANTIC[pen.id]) continue;
    const n = penAnimals(pen.id).length;
    NEXT_ANTIC[pen.id] = now + (n <= 1 ? 9000 : 4500) + Math.random() * 3500;
    if (n) { antic(pen, true); dirtySoon(); }
  }
}
const NEXT_ANTIC = {};
let dirtyT = null;
function dirtySoon() { clearTimeout(dirtyT); dirtyT = setTimeout(() => { save(); if (UI.screen === 'zone') refreshZonePanel(); }, 1500); }

<script>
// Mission Zoo: state, simulation and the zoo screens (Zoo Gate, travel map, areas).

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtC = n => Math.floor(n).toLocaleString('en-AU');
const KEY = 'missionZoo.v1';
const TICKET_CAP = 600;
// Daily limits, so coins mostly come from answering questions:
const ARENA_DAILY = 3;       // races and battles pay coins at most this many times a day
const BOOTH_DAILY = 300;     // the ticket booth pays out at most this many coins a day
const OPEN_MARK = 3;         // a mission with at least this many right answers opens the ticket booth for the day
function dayKey() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function today() { const k = dayKey(); if (!S.day || S.day.d !== k) S.day = { d: k, arena: 0, booth: 0, missions: 0, open: false }; return S.day; }
const boothOpen = () => today().open;
const boothRoom = () => Math.max(0, BOOTH_DAILY - today().booth - Math.floor(S.tickets));

let S;
const UI = { screen: 'gate', zone: null, edit: false, shopTab: 'animals', shopZone: 'all', shopQ: '', rosterF: 'all', subj: null, reward: null, M: null, R: null, B: null, modal: null, pickA: null, mapHover: null, stickZ: 'all' };

// ---------- helpers ----------
const animal = id => S.animals.find(a => a.id === id);
const penById = id => S.pens.find(p => p.id === id);
const penAnimals = id => S.animals.filter(a => a.pen === id);
const inv = k => S.inv[k] || 0;
const rkey = (a, b) => a.id < b.id ? `${a.id}|${b.id}` : `${b.id}|${a.id}`;
function rel(a, b) { const k = rkey(a, b); return S.friends[k] || (S.friends[k] = { f: 0, n: 0 }); }
function relLabel(f) { return f >= 70 ? 'Best friends' : f >= 30 ? 'Friends' : f > -30 ? 'Getting to know each other' : f > -70 ? 'Rivals' : 'Enemies'; }
const relIcon = f => f >= 70 ? 'heart' : f >= 30 ? 'note' : f > -30 ? 'dots' : f > -70 ? 'sweat' : 'anger';
function spec(a) {

function aura(a, mates) { // what the pen-mates' personalities do to this animal's mood
  let h = 0; const peace = mates.some(m => m.p === 'peace');

    if (m.caged) continue;
    const p = m.p === 'copycat' ? (copyOf(m) || 'copycat') : m.p;
    if (p === 'clown') h += a.p === 'grump' ? 1 : 3;
    else if (p === 'party') h += a.p === 'sleepy' ? -6 : a.p === 'grump' ? -3 : 4;
    else if (p === 'sweet') h += 2;
    else if (p === 'bully') h += (a.p === 'wimp' || a.p === 'scaredy' ? -8 : -2) * (peace ? .5 : 1);
    else if (p === 'grump') h -= 1;
    else if (p === 'prank') h += a.p === 'diva' || a.p === 'grump' ? -3 : a.p === 'clown' ? 2 : 0;

    let fr = 0;

<script>

  </div>`;
}

// ---------- wiring ----------
function wire() {
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    if (b.tagName === 'SELECT' || b.tagName === 'INPUT') return;
    const f = ACT[b.dataset.act]; if (f) { e.preventDefault(); f(b.dataset); }
  });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && UI.modal) { closeModal(); return; }
    if (!QS || UI.modal) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
    if (QS.result !== null) { if (e.key === 'Enter') { const n = $('#nextBtn'); if (n) { e.preventDefault(); n.click(); } } return; }
    if (QS.q.kind === 'spell') { if (/^[a-z]$/i.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) typeLetter(e.key); else if (e.key === 'Backspace') typeLetter('⌫'); else if (e.key === 'Enter') checkSpelling(); else return; e.preventDefault(); return; }
    if (QS.q.kind === 'mc') { const k = e.key.toLowerCase(), i = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k); if (i >= 0 && i < QS.q.opts.length && !QS.hidden.includes(i)) { e.preventDefault(); ACT.answer({ i }); } return; }
    if (/^[0-9]$/.test(e.key)) pressKey(e.key); else if (e.key === 'Backspace') pressKey('⌫'); else if (e.key === '-') pressKey('−');
    else if (e.key === '.' || e.key === '/' || e.key === ':') pressKey(e.key); else if (e.key === 'Enter') { e.preventDefault(); submitQ(); } else return;
    e.preventDefault();
  });
  // scene pointer events (the canvas is replaced on each render, so delegate)
  document.addEventListener('pointerdown', e => { if (e.target.id === 'sceneCv') sceneDown(e); else if (e.target.closest('.tray .chip')) trayDown(e); });
  document.addEventListener('pointermove', e => { if (TRAY) trayMove(e); else if (SC && (e.target.id === 'sceneCv' || DRAG)) sceneMove(e); });
  document.addEventListener('pointerup', e => { if (TRAY) trayUp(e); else if (SC && (e.target.id === 'sceneCv' || DRAG)) sceneUp(e); });

function gagFor(key) {
  if (key.startsWith('spawn:')) {
    const [, sp, t] = key.split(':'), s = SP(sp), kind = s.types[+t] || s.types[0];

}

// ---------- backgrounds ----------
function stageBG(kind) {
  return cachePB('stagebg|' + kind, () => {
    const pb = new PB(SW, SH);
    const sky = { day: ['#d6eef9', '#eaf6fb'], desert: ['#fbe0b0', '#fdf0d2'], night: ['#2e2d52', '#454476'], sea: ['#d6eef9', '#eaf6fb'], mountain: ['#cfe6f7', '#eaf4fb'] }[kind] || ['#d6eef9', '#eaf6fb'];
    for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) pb.set(x, y, y < 32 ? sky[0] : sky[1]);
    if (kind === 'night') { for (let i = 0; i < 22; i++) pb.set(hash2(i, 1) * SW, hash2(i, 2) * 40, '#fff6dc'); pb.circ(SW - 22, 14, 7, '#fff1c8'); pb.circ(SW - 18, 11, 6, sky[0]); }
    if (kind === 'day' || kind === 'sea') { for (const [x, y] of [[18, 13], [90, 9]]) { for (const [dx, dy, r] of [[0, 0, 5], [6, -2, 6], [12, 0, 5]]) pb.circ(x + dx, y + dy, r, '#ffffff'); } }
    // far hills
    if (kind !== 'sea') for (let x = 0; x < SW; x++) { const h = SGROUND - 12 - Math.round(6 + Math.sin(x / 17) * 5 + Math.sin(x / 7) * 2); for (let y = h; y < SGROUND - 6; y++) pb.set(x, y, kind === 'desert' ? '#ecc98a' : kind === 'night' ? '#3e5a5a' : kind === 'mountain' ? '#b7d4a0' : '#c3e2a8'); }
    if (kind === 'mountain') pb.poly([[10, SH], [56, 26], [104, SH]], (x, y) => y < 36 ? '#ffffff' : ramp('#a9a3bd')[x > 56 ? 2 : 1]);
    // ground
    const gcol = { day: '#bfe0a4', desert: '#f1dcad', night: '#4c6b5c', mountain: '#bfe0a4', sea: '#8fcbe8' }[kind] || '#bfe0a4';
    for (let y = SGROUND - 6; y < SH; y++) for (let x = 0; x < SW; x++) { if (kind === 'mountain' && y < 64) continue; const h = hash2(x, y, 5); pb.set(x, y, h > .93 ? mix(gcol, INK, .12) : h < .05 ? mix(gcol, '#ffffff', .35) : gcol); }
    if (kind === 'desert') { for (let x = 0; x < SW; x++) { const h = SGROUND - 4 + Math.round(Math.sin(x / 13) * 2); for (let y = h; y < h + 1; y++) pb.set(x, y, '#e2c48e'); } }
    if (kind === 'sea') for (let x = 0; x < SW; x++) if ((x + 3) % 9 < 3) pb.set(x, SGROUND - 6, '#ffffff');
    return pb;
  });
}

  if (G && G.bg === 'sea' && !G.props) lift = -10 + Math.sin(t / 400) * 1.5;
  if (G && G.bg === 'sea' && G.props) { lift = 6 + Math.sin(t / 400) * 1.5; ax = 54 + Math.sin(t / 900) * 6; }

function kia() { const k = S.animals.find(a => a.p === 'knowit'); return k || { id: 0, name: 'Professor Hoot', s: SP('Owl').i, t: 1, gear: {}, guest: true }; }

function funNext(M) { if (M && M.fun && MODES[M.fun].next) MODES[M.fun].next(M); }

// ---------- actions ----------
Object.assign(ACT, {
  whatIf(d) { const M = UI.M; if (!M || M.fun !== 'homo' || !QS) return; const q = M.qs[M.i], H = q.homo, w = H.wrongs.find(x => x[0] === d.w); if (!w) return; M.stage = { gag: w[2], word: w[0], whatIf: w[0] !== q.opts[QS.picked], t0: performance.now() }; render(); },
  funGo(d) { UI.subj = d.v; if (!UI.reward) UI.reward = 'coins'; startFun(d.v); },

/* Layout: a pixel-art zoo scene on top, cream "signboard" panels underneath, and an icon dock pinned to the bottom. */
:root{
  --bg:#e3eed4; --bg-dot:#d6e6c4; --panel:#fff8ec; --panel-2:#f5ead6; --ink:#46395a; --ink-soft:#7a6c8f; --line:#5a4a6e;
  --pink:#f5acc3; --pink-deep:#dc7c9d; --yellow:#fbe08a; --yellow-deep:#d6ae4f; --mint:#b8e6c6; --sky:#abd8f0; --ok:#4f9e67; --bad:#cf5c78;
  --btn-ink:#3b2f4d; --bubble:#fffdf7;
  --display:"ZooDigits","Pixelify Sans","Courier New",monospace;
  --body:"ZooDigits","Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1e1b2b; --bg-dot:#25213a; --panel:#2c2740; --panel-2:#352f4d; --ink:#f0e9f8; --ink-soft:#b8accf; --line:#8b7cae;
  --pink:#f0a2bb; --pink-deep:#c9678a; --yellow:#f4d67c; --yellow-deep:#b99040; --mint:#8fcfa3; --sky:#8ec3e2; --ok:#7fd49a; --bad:#f08aa3; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1e1b2b; --bg-dot:#25213a; --panel:#2c2740; --panel-2:#352f4d; --ink:#f0e9f8; --ink-soft:#b8accf; --line:#8b7cae;
  --pink:#f0a2bb; --pink-deep:#c9678a; --yellow:#f4d67c; --yellow-deep:#b99040; --mint:#8fcfa3; --sky:#8ec3e2; --ok:#7fd49a; --bad:#f08aa3; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);background-image:radial-gradient(var(--bg-dot) 1.5px,transparent 1.6px);background-size:14px 14px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink-deep);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
.wrap{max-width:1080px;margin:0 auto}
.small{font-size:14px}.muted{color:var(--ink-soft)}.num{font-variant-numeric:tabular-nums}
canvas.pxi,canvas.spr,canvas.ghost{image-rendering:pixelated;image-rendering:crisp-edges;display:inline-block;vertical-align:middle}
canvas.pxi.big{transform:scale(1.4);transform-origin:left center;margin-right:8px}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;border-bottom:3px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:30px;letter-spacing:.02em;color:var(--ink);text-shadow:2px 2px 0 var(--pink)}
.brand span{font-family:var(--display);font-size:14px;color:var(--ink-soft)}
.res{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:4px;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:1px 9px 1px 4px;font-family:var(--display);font-size:17px;box-shadow:0 2px 0 var(--line)}
.pill.time b{font-size:14px}
.pill.bump{animation:bump .5s steps(4)}
@keyframes bump{40%{transform:translateY(-4px);background:var(--yellow)}}

/* bottom dock of icons */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:3px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px}
.dock button{display:flex;flex-direction:column;align-items:center;gap:1px;border:2px solid transparent;background:none;border-radius:8px;padding:4px 8px 3px;font-family:var(--display);font-size:13px;color:var(--ink);min-width:60px}
.dock button[aria-current="true"]{background:var(--yellow);border-color:var(--line);color:var(--btn-ink)}
.dock button:hover{background:var(--panel-2)}
.dock button[aria-current="true"]:hover{background:var(--yellow)}
@media (max-width:620px){.dock{gap:0;padding-inline:2px}.dock button{min-width:0;flex:1;padding:3px 1px;font-size:11px}}

main{padding-block:14px 24px}
.screen-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;margin-bottom:12px}
.screen-head h2{font-size:32px}
.screen-head p{margin:0;color:var(--ink-soft);max-width:68ch}

/* panels and buttons: cream signboards with a thick purple-grey edge */
.panel{background:var(--panel);border:3px solid var(--line);border-radius:8px;padding:14px;box-shadow:0 3px 0 var(--line)}
.panel h3{font-size:21px;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line);border-radius:6px;padding:7px 14px;font-family:var(--display);font-size:17px;font-weight:600;background:var(--panel-2);color:var(--ink);box-shadow:0 3px 0 var(--line);transition:transform .06s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.go{background:var(--yellow);color:var(--btn-ink)}
.btn.warn{background:var(--pink);color:var(--btn-ink)}
.btn.sm{padding:4px 9px;font-size:15px}
.btn.big{font-size:21px;padding:9px 22px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.linkish{border:0;background:none;padding:0;color:var(--pink-deep);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.row.center{justify-content:center}
.grow{flex:1}
.bar{height:8px;background:var(--panel-2);border:2px solid var(--line);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.warm i{background:#e6b34f}.bar.low i{background:var(--bad)}.bar.gold i{background:var(--yellow-deep)}
select,input[type=search],input.name-in{border:2px solid var(--line);background:var(--panel-2);border-radius:6px;padding:5px 8px}
select.wide{width:100%}

/* the scene */
.stage-wrap{max-width:960px;margin:0 auto 14px}
.stage{position:relative;border:3px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 4px 0 var(--line);background:#bfe0a4}
.stage canvas{display:block;width:100%;aspect-ratio:320/240;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:pan-y}
.stage.arena canvas{aspect-ratio:320/150}
.overlay{position:absolute;inset:0;pointer-events:none}
.overlay>*{pointer-events:auto}
.bubble{position:absolute;transform:translate(-50%,calc(-100% - 6px));background:var(--bubble);color:#3b2f4d;border:2px solid #5a4a6e;border-radius:6px;padding:2px 8px;font-family:var(--display);font-size:14px;line-height:1.25;max-width:min(190px,46%);width:max-content;pointer-events:none;box-shadow:0 2px 0 #5a4a6e}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:8px;height:8px;background:var(--bubble);border-right:2px solid #5a4a6e;border-bottom:2px solid #5a4a6e;transform:translateX(-50%) rotate(45deg)}
.bubble.left{transform:translate(-85%,calc(-100% - 6px))}.bubble.left::after{left:85%}
.bubble.right{transform:translate(-15%,calc(-100% - 6px))}.bubble.right::after{left:15%}
.bubble.pop{animation:pop .22s steps(3)}
@keyframes pop{0%{opacity:0;margin-top:4px}100%{opacity:1;margin-top:0}}
.spot-lbl,.station-lbl,.pen-lbl{position:absolute;transform:translate(-50%,-100%);font-family:var(--display);font-size:13px;line-height:1.2;background:#fff8ec;color:#3b2f4d;border:2px solid #5a4a6e;border-radius:5px;padding:1px 6px;white-space:nowrap;display:flex;align-items:center;gap:3px;box-shadow:0 2px 0 #5a4a6e}
.spot-lbl.sign{background:#b98a5a;color:#fff8ec}
.station-lbl{transform:translate(-50%,0);font-size:12px}
.station-lbl:hover,.spot-lbl:hover{background:#fbe08a}
.pen-lbl{transform:none;background:#b98a5a;color:#fff8ec;font-size:12px;border-color:#5a4a6e;pointer-events:none}
.pen-lbl.build{pointer-events:auto;background:#fbe08a;color:#3b2f4d;font-size:14px}
@media (max-width:560px){.bubble{font-size:12px;padding:1px 6px}.spot-lbl,.station-lbl{font-size:11px}.pen-lbl{font-size:10px;padding:0 4px}}

/* zoo gate panels */
.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:960px;margin:0 auto}
@media (max-width:820px){.panels{grid-template-columns:1fr}}
.booth{background:var(--yellow);color:var(--btn-ink)}
.booth .big{font-family:var(--display);font-size:40px;line-height:1}
.booth .small{color:var(--btn-ink)}
.tips,.diary{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.tips li{display:flex;gap:8px;align-items:flex-start}
.diary li{border-bottom:2px dotted var(--panel-2);padding-bottom:6px}
.diary.long{max-height:60vh;overflow:auto}

/* map area cards */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;max-width:960px;margin:0 auto}
.area-card{text-align:left;border:3px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 12px 10px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:0 3px 0 var(--line);position:relative;overflow:hidden}
.area-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--zc)}
.area-card b{font-family:var(--display);font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chips span{font-size:12px;background:var(--panel-2);border-radius:4px;padding:0 6px}

/* area view */
.zone-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px;max-width:960px;margin-inline:auto}
.plank{background:#b98a5a;color:#fff8ec;padding:3px 12px 5px;border:3px solid var(--line);border-radius:6px;font-size:26px;box-shadow:0 3px 0 var(--line)}
.edit-bar{max-width:960px;margin:0 auto 10px;background:var(--yellow);color:var(--btn-ink);border:3px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600}
.tray{max-width:960px;margin:0 auto 14px;background:var(--panel);border:3px dashed var(--line);border-radius:8px;padding:8px 10px}
.tray.drop-ok{background:var(--mint);border-style:solid}
.tray-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.tray-head b{font-family:var(--display);font-size:18px;display:flex;align-items:center;gap:4px}
.tray-list{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 2px}
.tray-list:empty{display:none}
.chip{flex:0 0 auto;border:2px solid var(--line);background:var(--panel-2);border-radius:6px;padding:2px 4px;display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-size:12px;touch-action:none;cursor:grab}
.pens-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:960px;margin:0 auto}
@media (max-width:700px){.pens-list{grid-template-columns:1fr}}
.pen-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.pen-top b{font-family:var(--display);font-size:19px}
.vibe{display:inline-flex;align-items:center;gap:3px;background:var(--panel-2);border-radius:4px;padding:0 6px;font-family:var(--display);font-size:14px}
.pen-animals{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin-top:8px}
.mini{display:flex;align-items:center;gap:6px;text-align:left;border:2px solid var(--line);border-radius:6px;background:var(--panel-2);padding:2px 6px 4px 2px}
.mini>span{display:flex;flex-direction:column;min-width:0;flex:1}
.mini .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .wi{opacity:.6}.mini .wi.ok{opacity:1}
.pen-lbl.plot{transform:translateX(-50%);background:rgba(255,248,236,.85);color:#5a4a6e;border-style:dashed;box-shadow:none}
.empty-note{display:flex;gap:10px;align-items:center;grid-column:1/-1}
.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-70%);filter:drop-shadow(0 6px 4px rgba(0,0,0,.3))}

/* missions */
.mission-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;margin-bottom:14px}
@media (max-width:760px){.mission-top{grid-template-columns:1fr}}
.rules{display:grid;gap:6px;align-content:start}
.rules canvas{margin-right:2px}
.step-label{font-family:var(--display);font-size:20px;display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.step-label i{font-style:normal;background:var(--pink);color:var(--btn-ink);border:2px solid var(--line);border-radius:5px;width:28px;height:28px;display:grid;place-items:center}
.choose{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.choose.rewards{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:820px){.choose,.choose.rewards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt-card{border:3px solid var(--line);background:var(--panel);border-radius:8px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:0 3px 0 var(--line)}
.opt-card h3{font-size:21px}
.opt-card[aria-pressed="true"]{background:var(--yellow);color:var(--btn-ink)}
.opt-card[aria-pressed="true"] .muted{color:var(--btn-ink)}
.new{color:var(--ok);font-weight:600}.old{color:var(--bad);font-weight:600}
.opt-card[aria-pressed="true"] .new,.opt-card[aria-pressed="true"] .old{color:var(--btn-ink)}
.go-row{margin-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.buddy{display:flex;gap:12px;align-items:center}
.buddy-spr{flex:0 0 auto;background:var(--mint);border:2px solid var(--line);border-radius:8px;padding:2px}
.buddy-say{min-width:0}
.buddy-say p{margin:4px 0;font-family:var(--display);font-size:17px;background:var(--bubble);color:#3b2f4d;border:2px solid #5a4a6e;border-radius:6px;padding:4px 10px;position:relative}
.mission.one{max-width:760px;margin:0 auto;display:grid;gap:14px}
.mission.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.mission.two .stack{display:grid;gap:14px}
@media (max-width:860px){.mission.two{grid-template-columns:1fr}}
.passage h3{font-size:24px;margin-bottom:8px}
.passage p{max-width:65ch;font-size:17px;line-height:1.65}
.qcard .progress{display:flex;gap:5px;margin-bottom:6px}
.progress span{flex:1;height:8px;border:2px solid var(--line);border-radius:3px;background:var(--panel-2)}
.progress span.ok{background:var(--ok)}.progress span.bad{background:var(--bad)}.progress span.now{background:var(--yellow)}
.qtext{font-size:20px;font-weight:600;margin:10px 0 12px;max-width:65ch}
.answers{display:grid;gap:8px}
.answers button{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);border-radius:6px;background:var(--panel-2);padding:9px 12px;box-shadow:0 2px 0 var(--line)}
.answers button b{font-family:var(--display);background:var(--panel);border:2px solid var(--line);border-radius:4px;width:26px;height:26px;display:grid;place-items:center;flex:0 0 auto}
.answers button.right{background:var(--mint);color:var(--btn-ink)}.answers button.wrong{background:var(--pink);color:var(--btn-ink)}
.answers button.gone{opacity:.25;text-decoration:line-through}
.answers button[disabled]{cursor:default}
.lock-note{margin:0 0 8px;padding:6px 10px;border-radius:6px;background:var(--panel-2);font-size:14px}
.hint{margin-top:8px}
.numpad{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
@media (max-width:560px){.numpad{grid-template-columns:1fr}}
.np-display{font-family:var(--display);font-size:34px;min-height:58px;border:3px solid var(--line);border-radius:8px;background:var(--panel-2);padding:4px 12px;display:flex;align-items:center;gap:4px;overflow:hidden}
.np-display .ph{color:var(--ink-soft)}.np-display .unit{color:var(--ink-soft);font-size:24px}
.np-display.right{background:var(--mint);color:var(--btn-ink)}.np-display.wrong{background:var(--pink);color:var(--btn-ink)}
.np-display.shake{animation:shake .3s steps(4)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.caret{width:3px;height:30px;background:var(--ink);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.np-hint{font-size:13px;color:var(--ink-soft);margin-top:6px}
.keys{display:grid;grid-template-columns:repeat(4,56px);gap:6px}
@media (max-width:560px){.keys{grid-template-columns:repeat(4,minmax(0,1fr))}}
.keys button{height:48px;border:2px solid var(--line);border-radius:6px;background:var(--panel);font-family:var(--display);font-size:22px;box-shadow:0 3px 0 var(--line)}
.keys button.sym{background:var(--panel-2)}
.keys button.ok{background:var(--yellow);color:var(--btn-ink);font-size:17px}
.keys button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.explain{margin-top:12px;background:var(--panel-2);border-left:6px solid var(--line);border-radius:6px;padding:10px 12px;max-width:70ch}
.next-row{margin-top:12px;text-align:right}
.result{text-align:center}
.result .big{font-family:var(--display);font-size:56px;line-height:1}
.result h3{justify-content:center;font-size:30px}
.today{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;border-top:2px dotted var(--panel-2);padding-top:8px;margin-top:2px;font-size:14px}
.today span{display:inline-flex;align-items:center;gap:4px}
.open-note{display:flex;gap:6px;align-items:center;justify-content:center;background:var(--mint);color:var(--btn-ink);border:2px solid var(--line);border-radius:6px;padding:6px 10px}
.arena-note{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.arena-note.out{background:var(--yellow);color:var(--btn-ink)}
.reward-line{font-size:22px;display:flex;justify-content:center;align-items:center;gap:6px}

/* shop, roster, stickers */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:2px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;font-family:var(--display);font-size:16px}
.tabs button[aria-pressed="true"]{background:var(--pink);color:var(--btn-ink)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.filters input{flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.item{display:flex;flex-direction:column;gap:8px}
.item h3{font-size:19px}
.top-row{display:flex;gap:10px;align-items:center}
.top-row>div{min-width:0}
.tagz{display:inline-block;font-size:12px;border-radius:4px;padding:0 6px;background:var(--zc,var(--panel-2));color:var(--btn-ink);border:1px solid var(--line)}
.tagz.ultra{background:var(--yellow)}
.price{font-family:var(--display);font-size:17px;display:inline-flex;align-items:center;gap:4px}
.ultra-card{background:linear-gradient(var(--panel),var(--panel)) padding-box,repeating-linear-gradient(45deg,var(--yellow-deep) 0 6px,var(--pink-deep) 6px 12px) border-box;border-color:transparent}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.a-card{display:flex;gap:10px;align-items:center;text-align:left;padding:8px}
.a-card .who{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.a-card .who b{font-family:var(--display);font-size:19px}
.pers{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-size:14px;color:var(--pink-deep)}
.wishline.ok{color:var(--ok)}.wishline.no{color:var(--bad)}
.sprite-wrap{background:var(--mint);border:2px solid var(--line);border-radius:6px;flex:0 0 auto}
.sticker-sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;align-items:center;max-width:620px}
.sticker-sum .big{font-family:var(--display);font-size:30px}
.sub{font-size:22px;margin:18px 0 8px}
.pers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pers-stk{display:flex;align-items:center;gap:6px;padding:6px 10px;font-family:var(--display)}
.pers-stk.locked{opacity:.5}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.stk{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:4px;font-size:12px;text-align:center;line-height:1.2}
.stk.locked{background:var(--panel-2);color:var(--ink-soft)}
.stk.ultra:not(.locked){background:var(--yellow);color:var(--btn-ink)}

/* arena */
.arena-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:720px){.arena-grid{grid-template-columns:1fr}}
.lane-names{max-width:960px;margin:0 auto 12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;font-size:14px}
.lane-names .mine{font-weight:600;color:var(--pink-deep)}
.hp-row{max-width:960px;margin:0 auto 10px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.hp{display:flex;flex-direction:column;gap:2px;min-width:0}
.hp b{font-family:var(--display);font-size:19px}
.vs{font-family:var(--display);font-size:26px}
.log{max-width:960px;margin:0 auto 12px}
.qcard{max-width:960px;margin:0 auto 14px}

/* pop-up sheet */
.modal{position:fixed;inset:0;z-index:50;background:rgba(40,30,55,.55);display:grid;place-items:center;padding:16px}
.sheet{background:var(--panel);border:3px solid var(--line);border-radius:10px;box-shadow:0 5px 0 var(--line);max-width:620px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:18px;position:relative}
.sheet h3{font-size:24px;margin-bottom:8px;padding-right:36px;display:flex;align-items:center;gap:6px}
.sheet h4{font-family:var(--display);font-size:18px;margin:12px 0 6px}
.close{position:absolute;right:10px;top:10px;width:34px;height:34px;border:2px solid var(--line);border-radius:6px;background:var(--panel-2);font-size:22px;line-height:1}
.sheet-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.big-spr{background:var(--mint);border:3px solid var(--line);border-radius:8px}
.sheet-top .who{flex:1;min-width:200px;display:grid;gap:4px}
.name-in{font-family:var(--display);font-size:24px;width:100%;background:transparent;border-color:transparent;padding:2px 6px;margin-left:-6px}
.name-in:hover,.name-in:focus{border-color:var(--line);background:var(--panel-2)}
.stat{display:grid;grid-template-columns:78px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:14px}
.pers-box{margin-top:12px;background:var(--panel-2);border:2px solid var(--line);border-radius:8px;padding:10px 12px}
.pers-box p{margin:6px 0}
.pers-name{font-family:var(--display);font-size:20px;display:flex;align-items:center;gap:4px}
.wish{display:flex;gap:6px;align-items:flex-start;border-radius:6px;padding:6px 8px;background:var(--panel)}
.wish.ok{outline:2px solid var(--ok)}.wish.no{outline:2px dashed var(--bad)}
.gear-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.gear{display:grid;gap:2px}
.gear-row{display:flex;gap:6px;align-items:center}
.gear-row select{flex:1;min-width:0}
.empty-slot{width:36px;height:36px;border:2px dashed var(--line);border-radius:4px;display:inline-block}
.rels{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px}
.rels li{display:flex;align-items:center;gap:6px;min-width:0}
.rels .small{color:var(--ink-soft);margin-left:auto}
.alert{margin-top:10px;background:var(--yellow);color:var(--btn-ink);border:2px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sheet-actions{margin-top:14px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pick{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:6px;background:var(--panel-2);padding:4px 6px;text-align:left}
.pick.on{background:var(--yellow);color:var(--btn-ink)}
.visitor-row{display:flex;gap:12px;align-items:center}
.speech{font-family:var(--display);font-size:19px;background:var(--bubble);color:#3b2f4d;border:2px solid #5a4a6e;border-radius:6px;padding:6px 10px;margin:6px 0}
@media (max-width:480px){.gear-grid,.rels{grid-template-columns:1fr}}

.toasts{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:grid;gap:6px;width:min(460px,calc(100% - 32px))}
.toast{background:var(--line);color:#fff8ec;border-radius:6px;padding:8px 12px;font-family:var(--display);font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.3);animation:pop .25s steps(3)}
.foot{max-width:960px;margin:24px auto 0;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;font-size:13px;color:var(--ink-soft)}

/* fun missions */
.fun-label{margin-top:18px}
.choose.fun{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:820px){.choose.fun{grid-template-columns:1fr}}
.fun-card{background:linear-gradient(var(--panel),var(--panel)) padding-box,repeating-linear-gradient(45deg,var(--pink-deep) 0 6px,var(--yellow-deep) 6px 12px) border-box;border-color:transparent}
.fun-card[aria-pressed="true"]{background:linear-gradient(var(--yellow),var(--yellow)) padding-box,repeating-linear-gradient(45deg,var(--pink-deep) 0 6px,var(--yellow-deep) 6px 12px) border-box}
/* Homophone Chaos stage */
.homo-stage{margin:8px auto 6px;max-width:520px;border:3px solid var(--line);border-radius:8px;overflow:hidden;background:#d6eef9}
.homo-stage canvas{display:block;width:100%;aspect-ratio:128/80;image-rendering:pixelated;image-rendering:crisp-edges}
.homo-cap{font-family:var(--display);font-size:19px;line-height:1.35;margin:6px 0 2px}
.homo-cap .muted{font-family:var(--body);font-size:15px;display:block;margin-top:2px}
.blank{display:inline-block;min-width:4ch;border-bottom:3px solid var(--pink-deep);color:transparent}
.meanings{margin:8px 0;padding-left:20px}
.meanings li{margin:2px 0}
.tip{display:flex;gap:6px;align-items:flex-start;margin:6px 0;font-weight:600}
/* Spelling Bee */
.bee-hear{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.bee-clue{background:var(--panel-2);border-radius:6px;padding:8px 10px;margin:8px 0;font-size:15px;line-height:1.5}
.spell-box{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:52px;border:3px solid var(--line);border-radius:8px;background:var(--panel-2);padding:6px 8px;margin:8px 0}
.spell-box.right{background:var(--mint)}.spell-box.wrong{background:var(--pink)}
.spell-box.shake{animation:shake .3s steps(4)}
.tile{display:inline-grid;place-items:center;min-width:30px;height:38px;padding:0 4px;border:2px solid var(--line);border-radius:5px;background:var(--panel);font-family:var(--body);font-weight:600;font-size:22px;color:var(--ink)}
.tile.ok{background:#ffffff;color:#3b2f4d}.tile.bad{background:#f08aa3;color:#3b2f4d}
.kb{display:grid;gap:5px;margin-top:6px}
.kb-row{display:flex;gap:5px;justify-content:center}
.kb button{flex:1 1 0;max-width:44px;height:44px;border:2px solid var(--line);border-radius:6px;background:var(--panel);font-family:var(--body);font-weight:600;font-size:18px;box-shadow:0 3px 0 var(--line);padding:0}
.kb button.wide{max-width:none;flex:1.6 1 0}.kb button.sym{background:var(--panel-2)}.kb button.ok{background:var(--yellow);color:var(--btn-ink);font-family:var(--display);font-size:17px;flex:1 1 100%;max-width:320px}
.kb button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
@media (max-width:420px){.kb-row{gap:3px}.kb button{height:40px;font-size:16px}}
/* Hiccup Emergency */
.hic-meter{display:flex;align-items:center;gap:5px;margin:4px 0 6px;font-size:14px}
.hic-meter span:not(.small){width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--panel-2)}
.hic-meter span.on{background:var(--sky)}
/* Whodunit */
.case-crime{font-weight:600}
.suspects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}
@media (max-width:480px){.suspects{grid-template-columns:1fr}}
.suspect{position:relative;display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:8px;background:var(--panel-2);padding:6px;overflow:hidden}
.suspect>div:last-of-type{display:flex;flex-direction:column;min-width:0}
.suspect b{font-family:var(--display);font-size:17px}
.suspect.out{opacity:.55}
.suspect.guilty{background:var(--yellow);color:var(--btn-ink)}.suspect.guilty .muted{color:var(--btn-ink)}
.stamp{position:absolute;right:4px;top:4px;transform:rotate(-8deg);font-size:12px!important;border:3px solid var(--bad);color:var(--bad);font-family:var(--display);font-weight:700;font-size:15px;padding:0 6px;border-radius:4px;background:rgba(255,255,255,.7);letter-spacing:.05em}
.stamp.red{border-color:#c43d5e;color:#c43d5e}.stamp.big{position:static;display:inline-block;transform:rotate(-6deg);font-size:26px;padding:2px 12px}
.clues{margin:6px 0 0;padding-left:22px;display:grid;gap:6px}
.clues li{line-height:1.5}.clues li.now{background:var(--yellow);color:var(--btn-ink);border-radius:6px;padding:2px 6px}
.clue-now{background:var(--panel-2);border-left:6px solid var(--line);border-radius:6px;padding:8px 10px;line-height:1.5}
.case-closed{text-align:center;margin-top:10px}
.confess{display:flex;gap:12px;align-items:center;text-align:left;margin-top:12px}
.confess .speech{margin:6px 0}
/* Mystery eggs */
.egg-strip{display:flex;align-items:center;gap:10px;border-top:2px dotted var(--panel-2);padding-top:8px;margin-top:8px;text-align:left;flex-wrap:wrap}
.egg-strip>div{flex:1;min-width:160px;display:flex;flex-direction:column;gap:2px}
.egg-strip.ready{background:var(--yellow);color:var(--btn-ink);border-radius:8px;padding:8px;border-top:0}
.egg-strip.ready .small{color:var(--btn-ink)}
.wobble{animation:wobble 1s steps(6) infinite;transform-origin:50% 90%}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.egg-gain{font-weight:600}
.hatch{display:flex;justify-content:center;margin:6px 0}
.hatch canvas{width:256px;height:224px;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--mint);border:3px solid var(--line);border-radius:10px}
.hatch-msg{font-size:18px;text-align:center}
/* the Know-it-all's homework */
.hw-sheet{background:linear-gradient(90deg,transparent 22px,rgba(220,124,157,.35) 22px 24px,transparent 24px),repeating-linear-gradient(var(--panel) 0 31px,rgba(137,182,234,.22) 31px 32px);position:relative}
.hw-sheet h3{font-size:24px}
.hw-claim{font-style:italic}
.hw-list{margin:8px 0 0;padding-left:26px;display:grid;gap:10px}
.hw-list li{padding:6px 8px;border-radius:6px}

// Mission Zoo: pixel buffer and shared helpers.
// Every sprite is painted pixel by pixel into a small grid. A shape colours a pixel when the pixel's centre falls inside it.

const hex2i = h => { if (h.length === 4) h = '#' + h[1] + h[1] + h[2] + h[2] + h[3] + h[3]; return parseInt(h.slice(1), 16); };

function mix(a, b, t) { // a, b: '#rrggbb'; t: 0..1 towards b
  const x = hex2i(a), y = hex2i(b);

  const g = Math.round(((x >> 8) & 255) * (1 - t) + ((y >> 8) & 255) * t);
  const bl = Math.round((x & 255) * (1 - t) + (y & 255) * t);

}
function lum(h) { const x = hex2i(h); return (((x >> 16) & 255) * .3 + ((x >> 8) & 255) * .59 + (x & 255) * .11) / 255; }
function hsl(h, s, l) { // h 0..360, s,l 0..1 → hex
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return i2hex((Math.round(f(0) * 255) << 16) | (Math.round(f(8) * 255) << 8) | Math.round(f(4) * 255));
}
// small deterministic hash, used for speckles and noise
function hash2(x, y, s = 0) { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }

class PB {
  constructor(w, h) { this.w = w; this.h = h; this.p = new Array(w * h).fill(null); }
  set(x, y, c) { x = Math.floor(x); y = Math.floor(y); if (c && x >= 0 && y >= 0 && x < this.w && y < this.h) this.p[y * this.w + x] = c; }
  get(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h ? this.p[y * this.w + x] : null; }
  clear(x, y) { if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.p[y * this.w + x] = null; }

  shape(test, c, x0 = 0, y0 = 0, x1 = this.w, y1 = this.h) {

      const px = x + .5, py = y + .5;
      if (test(px, py)) this.set(x, y, typeof c === 'function' ? c(x, y, px, py) : c);

  }

  }

    const out = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      if (this.get(x, y)) continue;
      const n = this.get(x, y - 1) || this.get(x - 1, y) || this.get(x + 1, y) || this.get(x, y + 1);
      if (n) out.push([x, y, dark(n)]);

    return this;
  }
  flipX() { const o = new PB(this.w, this.h); for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) o.p[y * this.w + x] = this.p[y * this.w + this.w - 1 - x]; return o; }
  copyFrom(src, ox, oy) { for (let y = 0; y < src.h; y++) for (let x = 0; x < src.w; x++) { const c = src.p[y * src.w + x]; if (c) this.set(ox + x, oy + y, c); } return this; }
  map(fn) { const o = new PB(this.w, this.h); o.p = this.p.map((c, i) => c ? fn(c, i % this.w, Math.floor(i / this.w)) : null); return o; }
  toCanvas(scale = 1) {
    const cv = document.createElement('canvas'); cv.width = this.w * scale; cv.height = this.h * scale;
    const g = cv.getContext('2d'), img = g.createImageData(this.w, this.h);
    for (let i = 0; i < this.p.length; i++) { const c = this.p[i]; if (!c) continue; const v = hex2i(c); img.data[i * 4] = v >> 16 & 255; img.data[i * 4 + 1] = v >> 8 & 255; img.data[i * 4 + 2] = v & 255; img.data[i * 4 + 3] = 255; }
    if (scale === 1) { g.putImageData(img, 0, 0); return cv; }
    const t = document.createElement('canvas'); t.width = this.w; t.height = this.h; t.getContext('2d').putImageData(img, 0, 0);
    g.imageSmoothingEnabled = false; g.drawImage(t, 0, 0, cv.width, cv.height); return cv;
  }
}

// scale a small canvas up with smoothing off, so pixels stay crisp
function crisp(cv, scale) {
  const o = document.createElement('canvas'); o.width = cv.width * scale; o.height = cv.height * scale;
  const g = o.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(cv, 0, 0, o.width, o.height); return o;
}

  const opts = shuffle([correct, ...w]);
  return { kind: 'mc', q, opts, ans: opts.indexOf(correct), e };

peer","pier","pere","peir"],"To peer is to look carefully."],["Choose the correct word: \"The runners were ___ at the finish line.\"",["tied","tide","tyed","tyde"],"\"tied\" means equal. The tide is the rise and fall of the sea."],["Which sentence uses an apostrophe correctly?",["The children's toys were everywhere.","The childrens' toys were everywhere.","The childrens toys were everywhere.","The children’s' toys were everywhere."],"\"children\" is already plural, so add 's: children's."],["Which sentence uses an apostrophe correctly?",["The two girls' bikes were red.","The two girl's bikes were red.","The two girls bike's were red.","The two girls's bikes were red."],"For a plural noun ending in s, add the apostrophe after the s: girls'."],["Which sentence uses an apostrophe correctly?",["James's hat blew away.","Jame's hat blew away.","James hat's blew away.","Jameses hat blew away."],"For a name ending in s, you can add 's: James's."],["Which sentence uses an apostrophe correctly?",["The dog's bowl was empty.","The dogs bowl' was empty.","The dog's' bowl was empty.","The dogs's bowl was empty."],"One dog owns the bowl: dog's."],["Which sentence uses an apostrophe correctly?",["We couldn't find the key.","We could'nt find the key.","We couldnt' find the key.","We coul'dnt find the key."],"The apostrophe goes where the o of \"not\" is missing."],["Which sentence uses an apostrophe correctly?",["I've finished my lunch.","Iv'e finished my lunch.","Ive' finished my lunch.","I'v finished my lunch."],"\"I've\" is short for \"I have\"."],["Which sentence does NOT need an apostrophe?",["The bananas are ripe.","The banana's skin is brown.","It's a sunny day.","Tom's book is new."],"\"bananas\" is just a plural; nothing belongs to them."],["Which sentence is punctuated correctly?",["\"Can we go to the beach?\" asked Leo.","\"Can we go to the beach,\" asked Leo?","\"Can we go to the beach\" asked Leo?","Can we go to the beach? \"asked Leo.\""],"The question mark belongs inside the speech marks."],["Which sentence is punctuated correctly?",["\"I love this song,\" said Grace.","\"I love this song.\" said Grace.","\"I love this song\" said Grace.","\"I love this song, said Grace.\""],"A comma ends the spoken words before \"said Grace\"."],["Which sentence is punctuated correctly?",["Mum asked, \"Where are your shoes?\"","Mum asked \"where are your shoes?\"","Mum asked, \"Where are your shoes\"?","Mum asked, where are your shoes?"],"A comma comes before the speech, and the question mark goes inside."],["Which sentence uses a colon correctly?",["You will need three things: a hat, a drink and sunscreen.","You will need: three things a hat, a drink and sunscreen.","You: will need three things, a hat a drink and sunscreen.","You will need three things a hat: a drink and sunscreen."],"A colon can introduce a list after a complete sentence."],["Which sentence uses a semicolon correctly?",["It was raining; we stayed inside.","It was; raining we stayed inside.","It was raining we; stayed inside.","It; was raining we stayed inside."],"A semicolon joins two closely related complete sentences."],["Which sentence uses brackets correctly?",["The koala (a marsupial) sleeps for most of the day.","The koala (a marsupial sleeps) for most of the day.","(The koala) a marsupial sleeps for most of the day.","The koala a (marsupial) sleeps (for) most of the day."],"Brackets hold extra information that could be removed."],["Which sentence uses a comma correctly after an opening phrase?",["After the storm, we checked the garden.","After, the storm we checked the garden.","After the storm we, checked the garden.","After the storm we checked, the garden."],"A comma follows the opening phrase \"After the storm\"."],["Which sentence uses commas correctly?",["My sister, who is a nurse, works at night.","My sister who, is a nurse works at night.","My sister who is a nurse, works, at night.","My, sister who is a nurse works at night."],"Commas go around the extra information \"who is a nurse\"."],["Which sentence uses capital letters correctly?",["On Monday we visited Melbourne with Aunt Rosa.","On monday we visited Melbourne with aunt Rosa.","on Monday we visited melbourne with Aunt Rosa.","On Monday We Visited Melbourne with aunt rosa."],"Days, places and names used as titles need capitals."],["Which sentence uses capital letters correctly?",["In December we celebrate Christmas in Australia.","In december we celebrate Christmas in Australia.","In December we celebrate christmas in australia.","in December we Celebrate Christmas in Australia."],"Months, festivals and countries are proper nouns."],["Which of these needs an exclamation mark?",["Watch out for that car","The car is blue","Where is the car","The car is parked outside"],"An urgent warning often ends with an exclamation mark."],["Which is the best punctuation for: \"What a beautiful day it is\"",["!","?",",",";"],"An exclamation beginning with \"What a\" ends with !"],["Which sentence is a question?",["Have you seen my hat?","I have seen your hat.","Please find my hat.","What a lovely hat!"],"A question asks something and ends with a question mark."],["Which sentence uses a hyphen correctly?",["My brother is a well-known artist.","My brother is a well known-artist.","My-brother is a well known artist.","My brother is-a well known artist."],"\"well-known\" is a compound adjective joined by a hyphen."],["Where should the apostrophe go? \"The teachers meeting room\" (one teacher)",["teacher's","teachers'","teachers's","teache'rs"],"One teacher: teacher's."],["Where should the apostrophe go? \"The teachers staffroom\" (many teachers)",["teachers'","teacher's","teachers's","teache'rs"],"Many teachers: teachers'."],["What is the noun in: \"The curious puppy chased a butterfly.\"",["butterfly","curious","chased","the"],"A noun names a thing, person, place or animal."],["What is the verb in: \"The river flows into the sea.\"",["flows","river","into","sea"],"The verb is the action word."],["What is the adjective in: \"We ate delicious pancakes.\"",["delicious","ate","pancakes","we"],"\"delicious\" describes the pancakes."],["What is the adverb in: \"She sang beautifully at the concert.\"",["beautifully","sang","concert","she"],"\"beautifully\" tells how she sang."],["What is the adverb in: \"Tomorrow we will visit the museum.\"",["Tomorrow","visit","museum","we"],"\"Tomorrow\" tells when."],["What is the adverb in: \"The children played outside.\"",["outside","children","played","the"],"\"outside\" tells where they played."],["What is the pronoun in: \"They found the missing kitten.\"",["They","found","missing","kitten"],"\"They\" replaces the names of people."],["What is the preposition in: \"The cat slept under the table.\"",["under","cat","slept","table"],"\"under\" shows position."],["What is the conjunction in: \"I was hungry, so I made a sandwich.\"",["so","hungry","made","I"],"\"so\" joins two clauses."],["What is the abstract noun in: \"Her courage inspired everyone.\"",["courage","inspired","everyone","her"],"An abstract noun names something you cannot touch, like a feeling or quality."],["Which of these is an abstract noun?",["friendship","friend","friendly","befriend"],"\"friendship\" is an idea, not a thing you can touch."],["Which of these is an abstract noun?",["bravery","brave","bravely","soldier"],"\"bravery\" names a quality."],["Which of these is a collective noun?",["flock","bird","sheep","feather"],"A collective noun names a group, such as a flock."],["Which of these is a proper noun?",["Canberra","city","capital","building"],"Proper nouns name particular places and have capital letters."],["Which word is a verb?",["whisper","quiet","softly","silence"],"You can whisper; it is an action."],["Which word is an adjective?",["fragile","fragility","break","glass"],"\"fragile\" describes something."],["Which word is an adverb?",["quickly","quick","quicken","quickness"],"Many adverbs end in -ly."],["In \"The rabbit ran fast\", what type of word is \"fast\"?",["adverb","adjective","noun","verb"],"Here \"fast\" tells how the rabbit ran, so it is an adverb."],["In \"It was a fast car\", what type of word is \"fast\"?",["adjective","adverb","noun","verb"],"Here \"fast\" describes the car, so it is an adjective."],["In \"I will light the candle\", what type of word is \"light\"?",["verb","noun","adjective","adverb"],"Here \"light\" is an action."],["In \"The bag was light\", what type of word is \"light\"?",["adjective","verb","noun","adverb"],"Here \"light\" describes the bag."],["What is the determiner in: \"Those apples are sour.\"",["Those","apples","are","sour"],"A determiner comes before a noun to tell which one."],["Which word is a modal verb?",["should","run","happy","quickly"],"Modal verbs (can, could, should, must, might) show possibility or necessity."],["Which word is an interjection?",["Ouch!","run","table","slowly"],"An interjection expresses sudden feeling."],["Choose the past tense: \"Yesterday we ___ to the beach.\"",["went","goed","gone","go"],"The past tense of \"go\" is \"went\"."],["Choose the past tense: \"She ___ a letter to her friend.\"",["wrote","writed","written","writ"],"The past tense of \"write\" is \"wrote\"."],["Choose the past tense: \"The bell ___ at three o'clock.\"",["rang","ringed","rung","ranged"],"The past tense of \"ring\" is \"rang\"."],["Choose the past tense: \"He ___ the ball over the fence.\"",["threw","throwed","thrown","throwd"],"The past tense of \"throw\" is \"threw\"."],["Choose the past tense: \"The pond ___ overnight.\"",["froze","freezed","frozen","frozed"],"The past tense of \"freeze\" is \"froze\"."],["Choose the past tense: \"I ___ my lunch at home.\"",["forgot","forgetted","forgotten","forgat"],"The past tense of \"forget\" is \"forgot\"."],["Choose the past tense: \"The dog ___ a hole in the garden.\"",["dug","digged","dugged","dig"],"The past tense of \"dig\" is \"dug\"."],["Choose the past tense: \"The swimmer ___ across the pool.\"",["swam","swimmed","swum","swimed"],"The past tense of \"swim\" is \"swam\"."],["Choose the past tense: \"The ice ___ in the sun.\"",["melted","molt","melten","melt"],"\"melt\" is regular: melted."],["Choose the past tense: \"She ___ the answer.\"",["knew","knowed","known","knewed"],"The past tense of \"know\" is \"knew\"."],["Choose the past tense: \"The balloon ___ into the sky.\"",["flew","flied","flown","flyed"],"The past tense of \"fly\" is \"flew\"."],["Choose the past tense: \"They ___ a new house.\"",["built","builded","build","bilt"],"The past tense of \"build\" is \"built\"."],["Choose the past tense: \"I ___ a strange noise.\"",["heard","heared","herd","hear"],"The past tense of \"hear\" is \"heard\"."],["Choose the past tense: \"He ___ his bike to school.\"",["rode","rided","ridden","rid"],"The past tense of \"ride\" is \"rode\"."],["Choose the correct form: \"I have ___ this book twice.\"",["read","readed","red","reading"],"The past participle of \"read\" is spelt \"read\"."],["Choose the correct form: \"She has ___ all the cake.\"",["eaten","ate","eated","eat"],"After \"has\", use the past participle \"eaten\"."],["Choose the correct form: \"They have ___ to Perth.\"",["gone","went","goed","go"],"After \"have\", use \"gone\"."],["Choose the correct form: \"The window was ___ by the storm.\"",["broken","broke","breaked","break"],"After \"was\", use the past participle \"broken\"."],["Choose the correct form: \"Has the bell ___ yet?\"",["rung","rang","ringed","ring"],"After \"has\", use \"rung\"."],["Choose the correct form: \"The river has ___ over the road.\"",["risen","rose","rised","rise"],"After \"has\", use \"risen\"."],["Which sentence is in the present tense?",["The koala climbs the tree.","The koala climbed the tree.","The koala will climb the tree.","The koala had climbed the tree."],"\"climbs\" is happening now or regularly."],["Which sentence is in the past tense?",["The storm destroyed the fence.","The storm destroys the fence.","The storm will destroy the fence.","The storm is destroying the fence."],"\"destroyed\" has already happened."],["Which sentence shows an action that is happening right now?",["Dad is cooking dinner.","Dad cooked dinner.","Dad will cook dinner.","Dad has cooked dinner."],"\"is cooking\" is the present continuous tense."],["Which sentence uses the correct tense?",["Yesterday I walked to school and saw a fox.","Yesterday I walk to school and saw a fox.","Yesterday I walked to school and see a fox.","Yesterday I walking to school and seen a fox."],"Both verbs should be in the past tense."],["Choose the correct verb: \"The box of chocolates ___ on the table.\"",["is","are","were","be"],"The subject is \"box\" (singular), so use \"is\"."],["Choose the correct verb: \"Everybody ___ a turn.\"",["gets","get","getting","are getting"],"\"Everybody\" is singular."],["Choose the correct verb: \"My friends and I ___ going to the movies.\"",["are","is","am","was"],"A compound subject with \"and\" is plural."],["Choose the correct verb: \"One of the puppies ___ black spots.\"",["has","have","having","are having"],"The subject is \"one\", which is singular."],["Choose the correct verb: \"The scissors ___ on the desk.\"",["are","is","was","be"],"\"Scissors\" is treated as plural."],["Choose the correct verb: \"Either Sam or his sisters ___ feeding the cat.\"",["are","is","was","be"],"With \"either ... or\", the verb agrees with the nearer noun, \"sisters\"."],["Choose the correct word: \"Mia and ___ went to the shop.\"",["I","me","myself","mine"],"Take away \"Mia and\": \"I went to the shop.\""],["Choose the correct word: \"The teacher gave the prize to Leo and ___.\"",["me","I","myself","mine"],"Take away \"Leo and\": \"gave the prize to me\"."],["Choose the correct word: \"Between you and ___, I think it will rain.\"",["me","I","myself","mine"],"After a preposition such as \"between\", use \"me\"."],["Choose the correct word: \"Who ___ left the gate open?\"",["has","have","having","are"],"\"Who\" is treated as singular here."],["Choose the correct word: \"There ___ many reasons to recycle.\"",["are","is","was","be"],"\"reasons\" is plural, so \"are\"."],["Choose the correct word: \"Neither of the answers ___ correct.\"",["is","are","were","be"],"\"Neither\" is singular."],["Choose the correct word: \"I have ___ money than my brother.\"",["less","fewer","lesser","few"],"Use \"less\" for things you cannot count one by one, like money."],["Choose the correct word: \"There were ___ people at the game this week.\"",["fewer","less","lesser","little"],"Use \"fewer\" for things you can count."],["Choose the correct word: \"She did ___ in the test.\"",["well","good","goodly","best"],"\"well\" is the adverb that describes how she did."],["Choose the correct word: \"Which of the two puppies is ___?\"",["smaller","smallest","more small","most smallest"],"Use the comparative \"-er\" when comparing two."],["Choose the correct word: \"Mount Kosciuszko is the ___ mountain in Australia.\"",["highest","higher","most high","more higher"],"Use the superlative \"-est\" when comparing three or more."],["Choose the correct word: \"This is the ___ day of my life!\"",["best","goodest","most good","better"],"\"good, better, best\" is irregular."],["Choose the correct word: \"My cold is ___ today than yesterday.\"",["worse","worst","badder","more bad"],"\"bad, worse, worst\" is irregular. Use \"worse\" to compare two."],["Choose the correct word: \"This puzzle is ___ than the last one.\"",["more difficult","difficulter","most difficult","more difficulter"],"Long adjectives use \"more\" to compare."],["Which sentence is correct?",["Could you lend me your ruler?","Could you borrow me your ruler?","Could you lent me your ruler?","Could you borrowed me your ruler?"],"You lend something to someone; you borrow something from someone."],["Which sentence is correct?",["I should have known.","I should of known.","I should off known.","I shoulda known."],"\"should have\" is the correct form. \"should of\" is a common mistake."],["Which is a compound sentence?",["I wanted to swim, but the pool was closed.","I wanted to swim.","Because the pool was closed.","The closed pool near my house."],"A compound sentence joins two main clauses with a conjunction such as \"but\"."],["Which is a simple sentence?",["The kookaburra laughed.","The kookaburra laughed and the magpie sang.","When the sun rose, the kookaburra laughed.","The kookaburra laughed because it was morning."],"A simple sentence has one main clause."],["Which is a sentence fragment (not a complete sentence)?",["Running down the hill.","She ran down the hill.","Run down the hill!","Did she run down the hill?"],"A fragment is missing a subject or a complete verb."],["Which is a command?",["Close the door quietly.","The door is closed.","Is the door closed?","What a heavy door!"],"A command tells someone to do something."],["What is the main clause in: \"Although it was late, the children kept reading.\"",["the children kept reading","Although it was late","it was late","kept reading"],"The main clause makes sense on its own."],["What is the subordinate clause in: \"We went inside because it started to hail.\"",["because it started to hail","We went inside","it started","went inside because"],"A subordinate clause cannot stand alone; it adds information."],["Which word begins a relative clause in: \"The girl who won the race is my cousin.\"",["who","girl","won","is"],"Relative clauses often begin with who, which or that."],["What is the subject of: \"After lunch, the tired koalas slept.\"",["the tired koalas","After lunch","slept","lunch"],"The subject is who or what does the action."],["What is the object in: \"Lena kicked the ball.\"",["the ball","Lena","kicked","Lena kicked"],"The object receives the action."],["Which sentence is written in the active voice?",["The dog chased the cat.","The cat was chased by the dog.","The cat is being chased.","The cat has been chased by the dog."],"In the active voice, the subject does the action."],["Which sentence is written in the passive voice?",["The cake was eaten by the children.","The children ate the cake.","The children are eating cake.","The children will eat the cake."],"In the passive voice, the thing receiving the action comes first."],["Change to the passive voice: \"The wind knocked over the bin.\"",["The bin was knocked over by the wind.","The wind was knocked over by the bin.","The bin knocked over the wind.","The wind is knocking over the bin."],"The object \"the bin\" becomes the subject."],["Which is the correct direct speech for: Tom said that he was hungry.",["Tom said, \"I am hungry.\"","Tom said, \"He is hungry.\"","Tom said \"I was hungry\".","\"Tom said I am hungry.\""],"In direct speech, use the speaker's exact words: \"I am hungry\"."],["Ella said, \"We are leaving now.\" Which is the correct reported speech?",["Ella said that they were leaving then.","Ella said that we are leaving now.","Ella said, they were leaving now.","Ella said that \"they were leaving\"."],"Pronouns and tense shift back in reported speech."],["Which sentence uses the best conjunction?",["I will come to the party if I finish my chores.","I will come to the party but I finish my chores.","I will come to the party so I finish my chores.","I will come to the party or I finish my chores."],"\"if\" shows a condition."],["Choose the best conjunction: \"___ it was cold, we went swimming.\"",["Although","Because","So","Unless"],"\"Although\" shows a surprising contrast."],["Choose the best conjunction: \"You can't go out ___ you finish your homework.\"",["until","because","although","and"],"\"until\" shows when something can happen."],["Choose the best connective: \"The bridge was closed. ___, we took the long way.\"",["Therefore","However","Meanwhile","For example"],"\"Therefore\" shows a result."],["Choose the best connective: \"The plan was clever. ___, it did not work.\"",["However","Therefore","Firstly","Because"],"\"Howev k"],"\"auto\" means self."],["The word part \"photo\" in photograph means:",["light","camera","picture","memory"],"\"photo\" comes from the Greek for light."],["The word part \"aud\" in audience and audio means:",["hear","see","speak","sit"],"\"aud\" means hear."],["The word part \"vis\" in vision and visible means:",["see","hear","visit","feel"],"\"vis\" means see."],["The word part \"dict\" in dictate and predict means:",["say","write","read","think"],"\"dict\" means say."],["The word part \"hydro\" in hydroelectric means:",["water","fire","air","earth"],"\"hydro\" means water."],["The word part \"bi\" in bilingual means:",["two","one","many","half"],"Bilingual people speak two languages."],["The word part \"struct\" in construct means:",["build","break","bend","send"],"\"struct\" means build."],["The word part \"mono\" in monorail means:",["one","many","fast","metal"],"\"mono\" means one."],["What does \"carnivore\" mean?",["an animal that eats meat","an animal that eats plants","an animal that eats everything","an animal that eats insects only"],"\"carn\" relates to meat and \"-vore\" means eater."],["What does \"omnivore\" mean?",["an animal that eats both plants and meat","an animal that eats only meat","an animal that eats only plants","an animal that never eats"],"\"omni\" means all."],["What does \"diurnal\" mean?",["active during the day","active at night","living underground","living in water"],"Diurnal is the opposite of nocturnal."],["What does \"extinct\" mean?",["no longer existing anywhere","very rare","very dangerous","living in a zoo"],"An extinct species has died out completely."],["What does \"camouflage\" mean?",["colouring or patterns that help something blend in","a type of army food","a loud warning call","a very fast escape"],"Camouflage helps animals hide."],["What does \"hibernate\" mean?",["spend the winter in a deep sleep","move to another country","hunt at night","change colour"],"Some animals sleep through winter."],["What does \"migrate\" mean?",["move from one region to another, often with the seasons","sleep all winter","build a nest","lay eggs"],"Birds often migrate."],["What does \"predator\" mean?",["an animal that hunts others for food","an animal that is hunted","an animal that eats plants","a baby animal"],"Predators hunt prey."],["What does \"biography\" mean?",["the story of someone's life written by another person","a science textbook","a story about animals","a book of poems"],"\"bio\" means life and \"graph\" means write."],["What does \"fiction\" mean?",["stories that are made up","true stories","books about science","newspapers"],"Fiction is imaginary."],["What does \"unanimous\" mean?",["agreed by everyone","agreed by no one","secret","very loud"],"A unanimous decision has everyone in agreement."],["\"Gosh, what a disaster!\" said Mum, looking at the muddy floor. How does Mum feel?",["dismayed","delighted","relaxed","bored"],"\"What a disaster!\" shows she is upset."],["\"I suppose so,\" muttered Jack, kicking a stone. How does Jack feel?",["reluctant","thrilled","terrified","proud"],"Muttering and kicking a stone suggest he does not want to."],["Which word best describes the tone of: \"Hurry! The bridge is about to collapse!\"",["urgent","relaxed","humorous","sleepy"],"The warning demands quick action."],["Which word best describes the mood of: \"Shadows crept across the empty house, and somewhere a door creaked.\"",["eerie","cheerful","peaceful","silly"],"Shadows and creaking create an eerie feeling."],["Which word best describes the mood of: \"Children laughed as balloons floated over the sunny park.\"",["joyful","tense","gloomy","spooky"],"Laughter, balloons and sunshine are joyful."],["A text that tries to make you agree with an opinion is called:",["persuasive","narrative","procedural","descriptive"],"Persuasive texts try to convince."],["A text that tells you how to make or do something is called:",["procedural","persuasive","narrative","recount"],"Procedures give steps."],["A text that retells events in the order they happened is called:",["a recount","a procedure","an argument","a report"],"A recount retells past events in order."],["Which of these is a fact rather than an opinion?",["Canberra is the capital of Australia.","Canberra is the best city.","Canberra is boring.","Everyone should visit Canberra."],"A fact can be checked and proven."],["Which of these is an opinion rather than a fact?",["Cricket is the most exciting sport.","Cricket is played with a bat and ball.","A cricket team has eleven players.","Cricket matches can last several days."],"\"most exciting\" is a personal view."],["Which sentence shows the writer is uncertain?",["The storm might reach us by tonight.","The storm will reach us tonight.","The storm reached us last night.","The storm is here."],"\"might\" shows possibility, not certainty."],["\"The so-called 'expert' could not even name a single bird.\" What is the writer's attitude to the expert?",["doubtful and mocking","admiring","frightened","neutral"],"\"so-called\" and the quote marks show the writer doubts the expert."],["Which word shows the strongest feeling of dislike?",["loathe","dislike","mind","avoid"],"\"loathe\" means to hate intensely."],["Which word shows the strongest degree of happiness?",["ecstatic","content","pleased","satisfied"],"\"ecstatic\" means overwhelmingly happy."],["Which word shows the strongest degree of cold?",["freezing","cool","chilly","mild"],"Freezing is the coldest."],["Which word shows the smallest size?",["microscopic","small","little","compact"],"Microscopic things can only be seen with a microscope."],["Put in order from least to most: \"warm, scorching, hot\"",["warm, hot, scorching","hot, warm, scorching","scorching, hot, warm","warm, scorching, hot"],"Scorching is hotter than hot."],["In which sentence does \"bark\" mean the outer covering of a tree?",["The koala clung to the rough bark.","The dog began to bark.","I heard a loud bark.","Don't bark at me!"],"Tree te a long novel.","The novel has ten chapters."],"As an adjective, novel means new and original."],["In which sentence does \"grave\" mean serious?",["The doctor looked grave.","Flowers were placed on the grave.","The grave was in the old churchyard.","They dug a grave."],"As an adjective, grave means serious."]];

const PASSAGES = [{"t":"Little Travellers","p":["Every summer, female loggerhead turtles haul themselves up the beaches of eastern Australia at night. Using their back flippers, each turtle digs a deep hole in the sand and lays around one hundred soft, leathery eggs. Then she covers the nest and returns to the sea, never to see her young.","About eight weeks later, the hatchlings break out of their shells. They usually wait until the sand cools after sunset before bursting out together. Scientists believe the brightest horizon, normally moonlight reflecting off the ocean, guides them towards the water. This is why bright lights from houses and streets can be so dangerous: confused hatchlings may crawl inland instead.","Only a tiny number of hatchlings survive to become adults. Yet those that do may one day return to the very same beach to lay eggs of their own."],"qs":[["Why do hatchlings usually leave the nest after sunset?",["The sand has cooled down.","Their mothers come back for them.","Predators sleep during the day.","The tide is always high at night."],"The passage says they wait until the sand cools after sunset."],["Why can street lights be dangerous to hatchlings?",["They may follow the lights inland instead of going to the sea.","The lights heat the sand too much.","The lights scare the mother turtles.","The lights wake the hatchlings too early."],"Hatchlings head for the brightest horizon, so bright lights can lead them away from the ocean."],["The words \"haul themselves\" suggest the turtles move:",["with great effort","very quickly","gracefully","in a big group"],"To haul is to pull something heavy with effort."],["What is the main idea of the passage?",["A loggerhead turtle's journey from egg to sea is risky and remarkable.","Street lights should be banned everywhere.","Turtles are the fastest swimmers in the ocean.","Scientists have counted every turtle nest in Australia."],"The whole passage follows the turtles from nest to sea and shows the dangers."],["Which statement is supported by the text?",["A mother turtle does not raise her babies.","Hatchlings break out one at a time over many days.","Most hatchlings grow into adults.","Turtles lay their eggs in the morning."],"The mother returns to the sea \"never to see her young\"."]]},{"t":"The New Keeper","p":["On her first morning at Riverbend Zoo, Priya arrived twenty minutes early and read the feeding chart three times. \"Carrots for the tapirs, fish for the otters, and nothing for the pelicans until ten,\" she muttered, tapping each line with her finger.","Mr Hale, the head keeper, handed her a bucket. \"The otters will try to charm you,\" he warned. \"Don't give them extra, no matter how sad they look.\"","At the otter pool, two sleek heads popped up. The otters rolled onto their backs, clapped their paws and squeaked pitifully. Priya glanced over her shoulder, then back at the bucket. She counted out exactly six fish, dropped them in, and stepped firmly away from the rail.","Behind her, Mr Hale smiled and made a small tick on his clipboard."],"qs":[["Why did Priya read the feeding chart three times?",["She was anxious to get everything right.","She could not read very well.","The chart kept changing.","Mr Hale told her to."],"Arriving early and re-reading shows she was nervous about making mistakes."],["Why did the otters clap and squeak?",["To trick Priya into giving them extra food.","Because they were hurt.","To greet Mr Hale.","Because they had eaten too much."],"Mr Hale warned that the otters would try to charm her."],["What does Mr Hale's tick on the clipboard most likely mean?",["Priya passed a small test.","The otters had eaten enough for the week.","Priya had made a mistake.","It was time to feed the pelicans."],"He smiled as he ticked, so he was pleased she resisted the otters."],["\"squeaked pitifully\" means the otters squeaked in a way that:",["made them seem sad and in need","sounded angry","was very quiet","sounded like music"],"Pitiful means causing others to feel sorry for you."],["Which word best describes Priya?",["conscientious","careless","lazy","rude"],"Conscientious means careful and wanting to do a job well."]]},{"t":"The Bamboo Puzzle","p":["Giant pandas belong to the bear family, and their teeth and stomachs are built much like those of meat-eating animals. Yet almost all of their diet is bamboo, a tough grass that is low in nutrition. To survive, a panda must eat for up to fourteen hours a day, munching through as much as twelve kilograms of bamboo.","Because bamboo provides so little energy, pandas save effort wherever they can. They move slowly, rest often and rarely climb high. Scientists have even found that pandas make unusually low amounts of certain hormones that control how fast the body burns energy.","Why would a bear choose such a poor food? One explanation is competition. Bamboo grows in huge amounts and few other animals eat it, so pandas rarely have to fight for their dinner."],"qs":[["Why must pandas eat for so many hours each day?",["Bamboo gives them very little energy.","They are always being chased.","Bamboo is hard to find.","They are larger than other bears."],"Bamboo is \"low in nutrition\", so they need a lot of it."],["According to the passage, why might pandas eat bamboo?",["Few other animals compete for it.","It tastes sweeter than meat.","Their teeth cannot chew meat.","It helps them climb higher."],"The last paragraph says few other animals eat it, so pandas rarely fight for dinner."],["Which detail shows that pandas save energy?",["They rarely climb high.","They belong to the bear family.","Bamboo is a type of grass.","They eat up to twelve kilograms."],"Moving slowly, resting and rarely climbing are ways of saving effort."],["In the first paragraph, the word \"Yet\" is used to show:",["a surprising contrast","a list of reasons","the passing of time","an example"],"Their bodies suit meat, yet they eat bamboo. That is a contrast."],["The writer's main purpose is to:",["explain why pandas live on a diet of bamboo","persuade people to plant bamboo","tell a made-up story about a panda","compare pandas with polar bears"],"The passage gives facts and reasons about the panda's diet."]]},{"t":"Scout","p":["The sheep had scattered across the paddock like spilt rice by the time the storm clouds rolled in. Old Tom leaned on his stick and whistled once, long and low.","Scout was off before the sound had faded. The young kelpie ran wide, curving around the far side of the flock so she would not startle them towards the creek. When a stubborn ewe refused to move, Scout did not bark or snap. She simply crouched, fixed the ewe with a steady stare, and inched forward until the ewe turned and trotted to join the others.","By the time the first fat raindrops fell, the whole flock was bunched inside the yard. Tom swung the gate shut and scratched Scout behind the ears. \"Not bad for a pup,\" he said, but he was grinning."],"qs":[["Why did Scout run wide around the flock?",["So the sheep would not panic and run towards the creek.","Because she was chasing a rabbit.","Because Tom wanted her to take the long way.","So she could stay out of the rain."],"She curved around \"so she would not startle them towards the creek\"."],["\"scattered across the paddock like spilt rice\" is an example of:",["a simile","a metaphor","onomatopoeia","personification"],"It compares the sheep to spilt rice using \"like\"."],["How did Scout move the stubborn ewe?",["By staring steadily and creeping closer","By barking loudly","By nipping its legs","By pushing it with her nose"],"She crouched, stared and inched forward."],["What does Tom's grin suggest?",["He is prouder of Scout than his words show.","He thinks Scout did a poor job.","He is laughing at the stubborn ewe.","He is happy that it is raining."],"His words are modest, but the grin shows he is really pleased."],["Why did Scout need to work quickly?",["A storm was about to arrive.","Tom was late for dinner.","The gate was broken.","The sheep were hungry."],"The storm clouds were rolling in and rain was coming."]]},{"t":"Reef Partners","p":["On a coral reef, a clownfish darts in and out of the waving tentacles of a sea anemone. For most small fish this would be a deadly mistake, because anemone tentacles are armed with stinging cells. The clownfish, however, is covered in a special layer of mucus that stops the anemone from stinging it.","This partnership helps both animals. The anemone gives the clownfish a safe home where predators dare not follow. In return, the clownfish chases away fish that like to nibble on anemones, and its droppings provide the anemone with nutrients. Scientists call a relationship like this, where both partners benefit, mutualism.","Clownfish rarely stray more than a few metres from their anemone. For them, home is not just a place to rest; it is their shield."],"qs":[["What protects the clownfish from being stung?",["A special layer of mucus","Its bright orange colour","Its speed","Its hard scales"],"The first paragraph explains the mucus layer."],["How does the anemone benefit from the clownfish?",["The clownfish chases away fish that eat anemones.","The clownfish builds it a shelter.","The clownfish cleans the coral.","The clownfish brings it baby fish to eat."],"The second paragraph lists how the clownfish helps in return."],["Which of these is another example of mutualism?",["Bees drink nectar from flowers and carry their pollen.","A lion hunts a zebra.","A tick feeds on a dog and makes it itchy.","A cat sleeps in the sun."],"Both the bee and the flower benefit, just like the clownfish and anemone."],["\"home is not just a place to rest; it is their shield\" means:",["The anemone protects the clownfish from danger.","Clownfish carry shields.","Clownfish never sleep.","The anemone is shaped like a shield."],"A shield protects you. The anemone keeps predators away."],["\"predators dare not follow\" suggests predators are:",["afraid of the anemone","too slow","not hungry","friends with the clownfish"],"If you dare not do something, you are too scared to do it."]]},{"t":"The Big Race","p":["Everyone at Hill Street Primary expected Jonah to win the 800 metres. He had won it three years in a row, and his name was already painted in gold on the sports board.","Halfway through the race, Jonah glanced back. Ellie, the new girl, was only a few strides behind, her face calm and her arms pumping like pistons. Jonah's chest tightened. He pushed harder, but his legs felt heavy, as if his shoes were filled with sand.","On the final bend, Ellie drew level. For a moment they ran side by side, and then she edged ahead, crossing the line half a step in front.","Jonah bent over, gasping. When he looked up, Ellie was holding out her hand. After a long moment, he took it. \"Next year,\" he said, and to his own surprise, he was smiling."],"qs":[["Why did Jonah's chest tighten?",["He was worried Ellie might beat him.","He had hurt himself.","He was excited to see a friend.","He had forgotten where the finish was."],"He had just seen Ellie close behind him."],["\"arms pumping like pistons\" suggests Ellie was:",["running strongly and steadily","feeling nervous","slowing down","waving to the crowd"],"Pistons move powerfully in a steady rhythm."],["What does \"After a long moment, he took it\" suggest?",["Jonah needed time to accept losing.","Jonah did not see Ellie's hand.","Ellie had hurt Jonah's hand.","Jonah was looking for his shoes."],"The pause shows he found it hard at first."],["By the end of the story, Jonah feels:",["ready to accept the result and try again","furious with Ellie","glad he never has to race again","confused about who won"],"\"Next year\" and his smile show he accepts it and will try again."],["Which theme best fits the story?",["good sportsmanship","the danger of running","the importance of new shoes","how to cheat in a race"],"Both runners show respect after the race."]]},{"t":"The Lighthouse Keeper's Daughter","p":["For forty years, the light on Cape Wren had never gone out. Mara's grandfather had tended it, then her mother, and now, on the wildest night of the winter, it was Mara's turn, because her mother lay in bed with a fever and could barely lift her head.","The wind shrieked around the tower like something trying to get in. Mara climbed the ninety-two steps with a can of oil in each hand, counting under her breath to keep her legs moving. At the top, the great lamp was flickering. Salt spray had crusted the glass, and the wick had burned low.","She worked quickly, trimming the wick with shaking fingers and polishing the glass until her arms ached. Then she filled the reservoir and waited. The flame steadied, grew, and swept its long white arm across the black water.","Far out beyond the rocks, a ship's horn sounded twice. Mara did not know whose ship it was, and she never would. But she sat at the top of the tower until dawn, listening to the storm lose its temper, and she did not feel small at all."],"qs":[["Why was Mara looking after the light that night?",["Her mother was too sick to do it.","Her grandfather had asked her to.","She wanted to prove she was brave.","The usual keeper had gone to sea."],"The first paragraph says her mother had a fever and could barely lift her head."],["\"The wind shrieked around the tower like something trying to get in\" is an example of:",["a simile","alliteration","onomatopoeia","a rhetorical question"],"It compares the wind to something else using \"like\", so it is a simile."],["Why did Mara count the steps under her breath?",["To keep herself going while she was tired and scared","Because she had forgotten how many there were","To time how long the climb took","Because her mother had told her to"],"She counted \"to keep her legs moving\", which suggests she was struggling."],["What does the ship's horn sounding twice most likely suggest?",["A ship had seen the light and was safely steering clear of the rocks.","A ship was about to crash.","Someone on the ship knew Mara personally.","The storm was getting worse."],"The light warns ships about rocks. The horn suggests a ship had seen it and was signalling."],["How has Mara changed by the end of the story?",["She feels proud and capable.","She feels frightened and alone.","She has decided to leave Cape Wren.","She is angry with her mother."],"\"she did not feel small at all\" shows she feels confident after doing something important."]]},{"t":"How Bees Talk","p":["When a honeybee discovers a patch of flowers rich in nectar, she faces a problem. She cannot carry all of the food back herself, and she has no voice to tell her sisters where it is. Her solution is to dance.","Back inside the dark hive, the forager performs what scientists call the waggle dance. She runs in a straight line while shaking her body from side to side, then loops back around and repeats the run. The direction of the straight run tells the other bees which way to fly, measured as an angle from the position of the sun. The length of the waggle tells them how far away the flowers are: the longer she waggles, the further they must travel.","The watching bees press close, feeling the dancer's movements with their antennae and tasting samples of the nectar she brings. Then they set off to find the flowers for themselves.","The Austrian scientist Karl von Frisch spent years decoding this dance. In 1973 he shared a Nobel Prize for his work, which showed that even an insect with a brain smaller than a grain of rice can pass on surprisingly precise information."],"qs":[["What problem does the forager bee face?",["She cannot bring all the food home or tell others where it is.","She cannot find any flowers.","She is lost and cannot find the hive.","Other bees will not let her into the hive."],"The first paragraph explains she cannot carry it all and has no voice."],["What does the length of the waggle tell other bees?",["How far away the flowers are","Which direction to fly","How sweet the nectar is","How many flowers there are"],"\"the longer she waggles, the further they must travel.\""],["How do the watching bees sense the dance in the dark hive?",["By feeling it with their antennae","By watching it with their eyes","By listening to the buzzing","By smelling the flowers on her legs"],"The third paragraph says they feel the movements with their antennae."],["Why does the writer mention that a bee's brain is \"smaller than a grain of rice\"?",["To show how impressive the bee's communication is","To prove bees are not very clever","To explain why the dance is so slow","To compare bees with other insects"],"The small size makes the precise information even more surprising."],["Which is the best title for the second paragraph?",["How the Waggle Dance Works","Why Bees Need Nectar","The Life of Karl von Frisch","Dangers Inside the Hive"],"The second paragraph describes the steps and meaning of the dance."]]},{"t":"The Worst Birthday Present","p":["When Aunt Delphine handed Leo a lumpy parcel wrapped in newspaper, he already knew it would be terrible. Last year she had given him a book about the history of spoons. The year before, it was a pair of knitted socks with a separate pocket for each toe.","He tore off the paper. Inside was a small, battered wooden box with a brass clasp. Leo tried to look grateful. \"Thanks, Aunt Delphine,\" he said, in the voice he used for dentists.","\"It belonged to your great-grandfather,\" she said. \"Open it.\"","Inside, nested in faded red velvet, lay a compass. Its needle trembled and then swung firmly north. Under the lid, someone had scratched tiny letters: L.M. 1942 - ALWAYS FIND YOUR WAY HOME.","Leo's initials were L.M. too. He looked up at his aunt, and for the first time he noticed that her eyes were exactly the same grey as his own.","\"Thank you,\" he said again. This time, it came out in his real voice."],"qs":[["Why did Leo expect the present to be terrible?",["His aunt's previous prese

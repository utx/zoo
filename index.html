he sees every day.","She does not like her classmates.","Her class is too noisy.","Her class has not paid for tickets."],"Performing in front of peers can feel the most embarrassing."],["What is Mr Petrov's main point about nerves?",["They are a natural way the body prepares for something important.","They mean you have not practised enough.","They always make you play badly.","Only beginners feel them."],"He says nerves are your body getting ready."],["How does the writer show Isla growing more confident?",["Each note becomes steadier than the one before.","She walks off the stage.","She asks Mr Petrov to play instead.","She waves to her family."],"The first note wobbled, the second was steadier, and by the fourth she was lost in the music."],["\"like water from a tap that had been turned on at last\" suggests the music:",["flowed freely after being held back","was very quiet","sounded like dripping water","was full of mistakes"],"The simile shows the music finally flowing easily."]]},{"t":"How a Bill Becomes Law","p":["In Australia, new national laws are made by the Parliament in Canberra. Before an idea becomes a law, it is written as a document called a bill.","Most bills begin in the House of Representatives. Members of Parliament debate the bill, arguing for and against it and sometimes suggesting changes, called amendments. Then they vote. If a majority agrees, the bill passes to the second chamber, the Senate.","The Senate also debates and votes on the bill. Senators can pass it, reject it, or suggest amendments. If they make changes, the bill must go back to the House of Representatives, which must agree to the same wording. A bill cannot become law until both chambers have agreed to exactly the same text.","Finally, the bill is sent to the Governor-General, who represents the King in Australia. When the Governor-General signs it, a step known as royal assent, the bill becomes an Act of Parliament, which is the official name for a law.","This process can take days, months or even years. It is slow on purpose: it gives time for careful thought and for many different voices to be heard."],"qs":[["What is a bill?",["A written proposal for a new law","A law that has been signed","A member of the Senate","A vote in Parliament"],"Paragraph one says an idea is written as a document called a bill."],["What happens if the Senate changes a bill?",["It goes back to the House of Representatives to agree to the changes.","It becomes law straight away.","It is thrown away.","The Governor-General rewrites it."],"Both chambers must agree to the same text."],["What is \"royal assent\"?",["The Governor-General signing the bill","A vote in the Senate","An amendment to a bill","A speech by a Member of Parliament"],"Paragraph four defines it."],["Which is the correct order of steps for most bills?",["House of Representatives, Senate, Governor-General","Senate, Governor-General, House of Representatives","Governor-General, House of Representatives, Senate","Senate, House of Representatives, King"],"The passage describes this order."],["According to the writer, why is the process slow \"on purpose\"?",["So that laws are carefully considered","Because politicians are lazy","Because Canberra is far away","So that the King can visit"],"It gives time for careful thought and many voices."]]},{"t":"The Great Barrier Reef","p":["Stretching for more than two thousand kilometres along the coast of Queensland, the Great Barrier Reef is the largest coral reef system on Earth. It is so big that it can be seen from space.","Although coral looks like colourful rock or plants, it is actually made of tiny animals called polyps. Each polyp builds a hard skeleton of limestone around itself. Over thousands of years, billions of these skeletons have piled up to create the reef.","Most corals get their bright colours and much of their food from tiny algae living inside their bodies. When the ocean becomes too warm, the stressed corals push out these algae. Without them, the coral turns white, which is called coral bleaching. If the water cools again soon enough, the coral can recover, but if the heat lasts too long, it may die.","The reef is home to thousands of species, including fish, turtles, sharks, dugongs and giant clams. Protecting it means reducing pollution, controlling pests such as the crown-of-thorns starfish, and tackling climate change, which is warming the oceans."],"qs":[["What is coral actually made of?",["Tiny animals called polyps","Plants that grow on rocks","Sand pressed together","Seaweed"],"Paragraph two explains coral is made of polyps."],["How was the reef built?",["By polyp skeletons piling up over thousands of years","By volcanoes under the sea","By people building walls","By sand washed from beaches"],"Billions of skeletons piled up to create the reef."],["What causes coral bleaching?",["Water that is too warm makes corals push out their algae.","Too much sunlight on the sand.","Fish eating the colour off the coral.","The water becoming too cold."],"Paragraph three explains bleaching."],["Can bleached coral recover?",["Yes, if the water cools again soon enough.","No, never.","Only if it is painted.","Only if the starfish are removed."],"The passage says it can recover if the water cools soon enough."],["Which of these is NOT mentioned as a way to protect the reef?",["Building more beaches","Reducing pollution","Controlling crown-of-thorns starfish","Tackling climate change"],"Building beaches is not mentioned."]]},{"t":"The Kite","p":["Dad had built the kite from bamboo, brown paper and a roll of tape, and it looked it. One wing sagged. The tail was made from Mum's old stockings. Next to the sleek, bright nylon kites soaring over the beach, it looked like a crumpled shopping bag.","Sami held it behind his back. \"Maybe we should just go home,\" he muttered.","\"Nonsense,\" said Dad. \"A kite is not judged by how it looks on the ground.\" He licked a finger and held it up. \"Wind's from the south. Run that way, and don't look back.\"","Sami ran. The kite bounced along the sand, dragged, skidded, and then, with a sudden tug that nearly pulled the string from his fingers, it lifted. Up it went, past the lifeguard tower, past the gulls, past the smart nylon kites, climbing and climbing until it was only a brown speck against the blue.","Sami let out more string, then more. A little girl tugged her mother's sleeve and pointed. \"Look how high that one is!\"","Sami grinned so widely his cheeks ached. He did not say anything about shopping bags ever again."],"qs":[["Why did Sami want to go home at first?",["He was embarrassed by how the kite looked.","The wind was too strong.","He was hungry.","Dad was feeling unwell."],"He hid the kite, which looked shabby next to the others."],["What did Dad mean by \"A kite is not judged by how it looks on the ground\"?",["What matters is how well it flies.","Kites should never touch the ground.","Ground kites are the best kind.","He was not proud of the kite."],"He means performance matters more than appearance."],["Why did Dad lick his finger and hold it up?",["To find out which way the wind was blowing","To clean it","To taste the salt","To signal to Sami"],"He then says the wind is from the south."],["What does the little girl's comment show?",["Others were impressed by Sami's kite.","She wanted to buy the kite.","She was scared of kites.","The kite was about to fall."],"She pointed out how high it flew."],["Which saying best fits the message of this story?",["Don't judge a book by its cover.","The early bird catches the worm.","Too many cooks spoil the broth.","Look before you leap."],"The kite looked poor but flew brilliantly."]]},{"t":"The Platypus Puzzle","p":["When the first platypus specimen was sent from Australia to England in 1799, some scientists thought it was a hoax. With its duck-like bill, beaver-like tail, webbed feet and furry body, it looked like several animals stitched together. One scientist reportedly took a pair of scissors to the skin, searching for stitches.","The platypus turned out to be even stranger than it looked. It is one of only a handful of mammals that lay eggs. The females feed their young with milk, but they have no nipples; instead, the milk seeps out through patches of skin.","Males have a sharp spur on each back leg that can deliver a painful venom. And the bill is not hard like a duck's but soft and rubbery, covered in special sensors that can detect the tiny electrical signals given off by the muscles of shrimp, worms and insect larvae. This lets the platypus hunt underwater with its eyes, ears and nostrils closed.","Today the platypus is one of Australia's most loved animals, though it is shy and rarely seen in the wild. It needs clean, healthy rivers to survive."],"qs":[["Why did some scientists think the first platypus was a hoax?",["It looked like parts of different animals joined together.","It arrived without a head.","It was a painting, not a real animal.","It was too small to be real."],"Its mix of features made it look stitched together."],["Why did a scientist look for stitches?",["He suspected someone had sewn different animals together.","The skin had been damaged in the post.","He wanted to repair it.","He was a tailor."],"He thought it might be a fake."],["What makes the platypus unusual among mammals?",["It lays eggs.","It has fur.","It feeds its young milk.","It lives near water."],"Only a handful of mammals lay eggs."],["How does the platypus find food underwater?",["It detects electrical signals with its bill.","It uses its excellent eyesight.","It listens for the sound of shrimp.","It smells the water."],"Its bill has sensors for tiny electrical signals, and its eyes, ears and nostrils are closed."],["What does the final sentence suggest about protecting platypuses?",["Keeping rivers healthy is important.","They should be moved to zoos.","They are not in any danger.","They should be kept in England."],"It says they need clean, healthy rivers to survive."]]},{"t":"A Day Without Electricity","p":["At 6:42 on Saturday morning, the power went out across the whole of Wattle Street. The fridge shuddered and fell silent. The Wi-Fi light blinked off. My little sister Hana, halfway through a cartoon, stared at the dark television as if it had personally betrayed her.","\"It'll be back in an hour,\" said Mum. It was not back in an hour. A truck had crashed into a power pole two streets away, and the repair crew said it would take all day.","At first we moped around the house, flicking light switches out of habit. Then Dad found a pack of cards. We played Go Fish, then Snap, then a game Grandma had taught Dad that none of us knew the rules of, so we invented new ones. For lunch we ate everything in the fridge before it could spoil, which meant ice-cream, pickles and cold sausages, sometimes on the same plate.","In the afternoon, the whole street drifted outside. The neighbours brought out a cricket set. Old Mr Kavanagh, who I had never heard say more than \"morning\", turned out to be a brilliant spin bowler.","When the lights flickered back on at six, everyone cheered. But I noticed that nobody went inside for quite a long time."],"qs":[["What does the writer suggest about Hana by saying the television had \"personally betrayed her\"?",["She was upset and felt let down, in a funny, exaggerated way.","The television had actually hurt her.","She had broken the television.","She did not like cartoons."],"It is a humorous exaggeration of her disappointment."],["Why did the power stay off all day?",["A truck had crashed into a power pole.","There was a storm.","Mum forgot to pay the bill.","The fridge had broken."],"Paragraph two explains the cause."],["Why did the family eat ice-cream, pickles and sausages for lunch?",["The food would spoil without a working fridge.","It was Hana's birthday.","They had no other food in the house.","Grandma had suggested it."],"They ate everything \"before it could spoil\"."],["What surprised the narrator about Mr Kavanagh?",["He was a skilled cricket player.","He owned the power company.","He could not speak English.","He was the narrator's grandfather."],"He \"turned out to be a brilliant spin bowler\"."],["What does the final sentence suggest?",["People had enjoyed spending time together without electricity.","People were scared to go back inside.","The power went off again.","The neighbours did not like each other."],"Nobody rushed back inside, suggesting they valued the time together."]]},{"t":"Why the Sea Is Salty","p":["If you have ever swallowed a mouthful of seawater, you know it tastes very salty. But rivers and lakes are mostly fresh. So where does the ocean's salt come from?","Much of it comes from rocks on land. When rain falls, it is very slightly acidic, and as it runs over rocks and soil, it slowly dissolves tiny amounts of minerals, including salt. Rivers carry these minerals to the sea.","Then the sun does its work. Heat evaporates water from the ocean's surface, turning it into water vapour that rises to form clouds. But the salt does not evaporate; it stays behind in the sea. Over millions of years, this cycle of rivers bringing salt in and evaporation taking fresh water out has made the oceans steadily saltier.","Some salt also enters the ocean from openings in the sea floor called hydrothermal vents, where hot, mineral-rich water gushes out from inside the Earth.","On average, each litre of seawater contains about thirty-five grams of salt. That is roughly seven teaspoons, which is why drinking seawater makes you thirstier, not less thirsty."],"qs":[["What question does the first paragraph ask?",["Where does the ocean's salt come from?","Why do rivers flow into the sea?","How deep is the ocean?","Why does rain fall?"],"The paragraph ends with this question."],["How does salt get from rocks into rivers?",["Rain slowly dissolves minerals from rocks and soil.","Fish carry it.","Wind blows it from the sea.","People throw salt into rivers."],"Paragraph two explains this."],["Why does the ocean become saltier over time?",["Water evaporates but the salt stays behind.","The sun makes more salt.","Clouds rain salt into the sea.","Fish produce salt."],"Evaporation removes water but leaves the salt."],["What are hydrothermal vents?",["Openings in the sea floor where hot, mineral-rich water comes out","Clouds that form above the sea","Rivers that carry salt","Machines that remove salt"],"Paragraph four defines them."],["Why does drinking seawater make you thirstier?",["It contains a lot of salt.","It is too cold.","It contains too much fresh water.","It is too warm."],"The high salt content makes you thirstier."]]},{"t":"The Last Day of Summer","p":["The pool closed at five. At four fifty-five, Jack and Priyanka were still floating on their backs in the deep end, staring at a sky so blue it looked painted.","\"Tomorrow,\" said Priyanka, \"we'll be sitting in a classroom that smells like pencil shavings.\"","\"Don't,\" groaned Jack.","They had spent the whole holiday together: building a fort in the gully behind Jack's house, catching yabbies in the dam with bits of bacon on string, sleeping in a tent in the backyard and waking up covered in mosquito bites. But tomorrow Priyanka was starting at the high school across town, while Jack had one more year of primary school. It was the first time in six years they would not be in the same school.","The lifeguard blew her whistle. Neither of them moved.","\"We'll still see each other on weekends,\" said Jack.","\"Obviously,\" said Priyanka. But her voice was very small, and for a long time they just floated, side by side, until the lifeguard blew her whistle again, much louder."],"qs":[["Why does Jack groan \"Don't\"?",["He does not want to think about going back to school.","He has water in his ears.","He wants Priyanka to stop splashing.","He is angry with the lifeguard."],"Priyanka's comment reminds him that the holiday is ending."],["What is the main reason this day feels sad for the friends?",["They will be going to different schools.","The pool is closing forever.","Jack is moving to another country.","They had a fight."],"Priyanka is starting high school while Jack stays at primary school."],["What does \"her voice was very small\" suggest?",["Priyanka is sadder than she wants to admit.","Priyanka has a sore throat.","Priyanka is whispering a secret.","Priyanka is far away."],"A small voice suggests sadness despite her confident word \"Obviously\"."],["Why do Jack and Priyanka not move when the whistle blows?",["They want to make their last moments of summer last.","They did not hear it.","They cannot swim.","They are asleep."],"They are reluctant to let the day end."],["What mood does the writer create at the end?",["bittersweet","terrifying","hilarious","angry"],"Happy memories mixed with sadness create a bittersweet mood."]]},{"t":"Recycling Right","p":["Most Australian households now have a yellow-lidded recycling bin. But putting the wrong things in it can cause big problems. When items that cannot be recycled get mixed in, they can jam sorting machines, contaminate paper and cardboard, and even cause whole truckloads of recycling to be sent to landfill.","So what belongs in the yellow bin? In most council areas, the answer includes clean paper and cardboard, glass bottles and jars, steel and aluminium cans, and hard plastic containers such as milk bottles and yoghurt tubs. Items should be empty and loose, not bagged, because machines cannot open plastic bags.","Some common items cause the most trouble. Soft plastics, such as chip packets and bread bags, tangle in the machinery. Broken drinking glasses and ceramic mugs melt at different temperatures from bottle glass and can ruin a batch. Greasy pizza boxes contaminate clean cardboard.","Rules can vary slightly between councils, so it is always worth checking your local council's website. As one recycling worker put it, \"When in doubt, leave it out.\""],"qs":[["What can happen when the wrong items go in the recycling bin?",["Whole truckloads may be sent to landfill.","The bin changes colour.","The council gives you a new bin.","The items are sent back to your house."],"Paragraph one lists this as a possible problem."],["Why should recycling not be put in plastic bags?",["The machines cannot open them.","The bags are too heavy.","The bags are too expensive.","The bags attract animals."],"Paragraph two explains this."],["Why do broken drinking glasses cause problems?",["They melt at a different temperature from bottle glass.","They are too sharp for the workers.","They are too heavy.","They are made of plastic."],"Paragraph three explains this."],["What does \"When in doubt, leave it out\" mean?",["If you are not sure an item is recyclable, put it in the general rubbish.","Leave your bin outside all the time.","Always recycle everything.","Never use the recycling bin."],"It advises not to risk contaminating the recycling."],["This text is best described as:",["an informative text with advice","a narrative","a poem","a newspaper interview"],"It gives facts and practical advice."]]},{"t":"The Thief in the Garden","p":["Every morning, another strawberry was gone. Not eaten on the plant, not nibbled, simply gone, leaving an empty green cap on the stem.","Grandma blamed the birds, so we put up a net. The next morning, another strawberry had vanished, and the net had not been touched.","\"Rats,\" said Grandpa. So we sprinkled flour around the strawberry patch to catch its footprints. The next morning, there was a strawberry cap on the path, and in the flour were small, neat prints, far too tiny for a rat. They looked like the hands of a doll.","I stayed up that night with a torch, watching from the kitchen window. At about eleven, a little shape crept along the fence, sniffing. It was no bigger than a mouse, with enormous, shining eyes and a long tail that curled around the fence wire. It slipped under the net, tugged a strawberry free with its tiny paws and scurried back along the fence, hugging the berry like a treasure.","In the morning I looked it up. It was an eastern pygmy possum, one of the smallest marsupials in the world, and a threatened species in our state.","Grandma folded her arms. Then she sighed. \"Well,\" she said, \"I suppose we'd better plant more strawberries.\""],"qs":[["Why did the family rule out birds as the thieves?",["The net was untouched, yet strawberries still disappeared.","They saw no birds in the garden.","Birds do not eat strawberries.","Grandma loved birds."],"The net had not been touched, but another strawberry vanished."],["What was the purpose of the flour?",["To show the footprints of the thief","To make the strawberries sweeter","To stop the plants from growing","To make a cake"],"They wanted to catch its footprints."],["What did the prints in the flour tell the family?",["The thief was smaller than a rat.","The thief was a bird.","The thief was a person.","There were several thieves."],"The prints were \"far too tiny for a rat\"."],["Why did Grandma decide to plant more strawberries?",["She wanted to share them with the rare animal.","She wanted to sell them.","The old plants had died.","She wanted to trap the thief."],"After learning the animal was threatened, she chose to share rather than stop it."],["Which word best describes the narrator?",["curious","lazy","cruel","careless"],"The narrator stays up to watch and then researches the animal."]]},{"t":"The First Flight","p":["On 17 December 1903, on a windy beach at Kitty Hawk in North Carolina, USA, a machine made of wood, wire and cloth rose into the air under its own power. It flew for twelve seconds and travelled about thirty-seven metres, a shorter distance than the wingspan of many modern passenger jets. But it was the first powered, controlled flight of an aeroplane, and it changed the world.","The pilot was Orville Wright, and the plane had been designed and built by Orville and his brother Wilbur. The brothers ran a bicycle shop in Ohio, and their experience with bicycles helped them understand balance and control, which they realised was the key problem of flight.","Before building their aeroplane, the Wrights spent years experimenting with kites and gliders. They even built their own small wind tunnel to test hundreds of different wing shapes. When they could not find an engine light enough, they built one of those too, with help from their mechanic, Charlie Taylor.","That first day, the brothers made four flights, taking turns as pilot. The longest, flown by Wilbur, lasted fifty-nine seconds."],"qs":[["Why was the flight at Kitty Hawk important?",["It was the first powered, controlled aeroplane flight.","It was the longest flight ever made.","It carried the first passengers.","It was the first flight across the ocean."],"Paragraph one explains its significance."],["Why does the writer compare the flight distance to a jet's wingspan?",["To show how short the first flight was","To show how big the Wrights' plane was","To explain how jets fly","To show the Wrights built jets"],"The comparison highlights how short 37 metres is."],["How did running a bicycle shop help the Wright brothers?",["It helped them understand balance and control.","It gave them wheels for the plane.","It paid for a trip to North Carolina.","It taught them how to build engines."],"Paragraph two explains this."],["Why did the Wrights build their own engine?",["They could not find one that was light enough.","Engines were illegal.","They wanted to sell engines.","Charlie Taylor refused to help."],"Paragraph three says they could not find one light enough."],["Which word best describes the Wright brothers' approach?",["patient and methodical","careless and rushed","lucky and lazy","secretive and dishonest"],"They spent years testing kites, gliders and hundreds of wing shapes."]]},{"t":"Grandmother's Hands","p":["My grandmother's hands are the first thing I remember. Brown and creased like the paper bags she saved in the kitchen drawer, they were never still.","They kneaded dough on Sunday mornings, thumping and folding it until it grew soft and springy. They pulled weeds from between the tomato plants and pressed seeds into the soil, one by one, as if each were a secret. They plaited my hair so tightly my eyes watered, and then smoothed it down with a touch so gentle I forgot to complain.","When I was sad, they did not pat or fuss. They simply held mine, warm and dry and steady, until the sadness had somewhere else to go.","Now her hands are thin, and they shake a little when she lifts her teacup. She cannot knead dough any more. So on Sundays, I do it, and she sits at the table and watches, and sometimes she reaches over and presses her fingers into the dough beside mine, just to feel it rise."],"qs":[["\"creased like the paper bags she saved\" is an example of:",["a simile","a metaphor","personification","onomatopoeia"],"It uses \"like\" to compare her hands to paper bags."],["What does \"they were never still\" suggest about the grandmother?",["She was always busy doing things.","She was always nervous.","She had an illness.","She could not sleep."],"The following paragraph lists all the jobs her hands did."],["How did the grandmother comfort the narrator when she was sad?",["She held her hand quietly and steadily.","She told her funny stories.","She baked her a cake.","She told her not to cry."],"Her hands \"simply held mine\"."],["What has changed by the final paragraph?",["The grandmother is older and weaker, and the narrator now does the kneading.","The grandmother has moved away.","The narrator has stopped baking.","The grandmother is learning to bake."],"Her hands are thin and shaky, so the narrator kneads the dough."],["What feeling does the writer most want to express?",["deep love and respect for her grandmother","anger about growing old","boredom with baking","fear of her grandmother"],"The whole piece lovingly describes her grandmother."]]},{"t":"Octopus Escape Artists","p":["Aquarium keepers around the world share stories about octopuses that refuse to stay put. Octopuses have no bones, so they can squeeze through any gap larger than their hard beak. A large octopus can slip through a hole about the size of a coin.","They are also remarkably clever. In laboratory tests, octopuses have learned to unscrew jar lids to reach food inside, and some can tell individual people apart. One famous octopus named Inky escaped from his tank at an aquarium in New Zealand in 2016. Keepers believe he squeezed through a small gap at the top of the tank, crossed the floor at night and slid down a narrow drainpipe that led to the sea.","An octopus's intelligence is spread through its body in an unusual way. Much of its nervous system is found not in its head but in its eight arms, which can taste, touch and even react on their own.","Octopuses have short lives, often only one or two years. Some scientists wonder what these animals might achieve if they lived as long as humans do."],"qs":[["Why can octopuses squeeze through such small gaps?",["They have no bones.","They can shrink their beak.","They are very slippery.","They are very small."],"The first paragraph explains they have no bones; only the beak is hard."],["Which detail shows that octopuses are clever?",["They can unscrew jar lids.","They have eight arms.","They live for one or two years.","They have a hard beak."],"Solving a problem like a jar lid shows intelligence."],["How did keepers think Inky reached the sea?",["Through a drainpipe","By being carried by a visitor","Through a tunnel he dug","By hiding in a bucket"],"He slid down a narrow drainpipe that led to the sea."],["What is unusual about an octopus's nervous system?",["Much of it is in its arms.","It is all in its head.","It has two brains in its tail.","It has no nervous system."],"Paragraph three explains this."],["What does the final paragraph make the reader wonder?",["What octopuses could achieve with longer lives","Why octopuses live in aquariums","How to catch an octopus","Why octopuses have eight arms"],"It raises the idea of octopuses living as long as humans."]]},{"t":"The Midnight Feast","p":["The plan was perfect. At exactly midnight, the five girls in Dormitory Four would sneak down to the kitchen, collect the chocolate cake left over from the school fete, and eat it under Beatrix's bed by torchlight.","Nothing went to plan. Beatrix's alarm clock went off at eleven instead of twelve, with a ring so loud it could have woken the dead. Clementine trod on a creaky floorboard, then another, then a sleeping cat, which yowled and fled up the stairs. And when they finally reached the kitchen, they found the cake tin already open and empty, apart from a few crumbs and a handwritten note.","Clementine held it under the torch. In neat, familiar handwriting, it said: \"Delicious. Thank you, girls. Bed. Now. - Mrs Pemberton.\"","The five girls looked at each other in horror. Then, very slowly, Beatrix began to giggle. Then Clementine. Within seconds all five of them were clutching their stomachs and shaking with silent laughter, tears streaming down their faces.","They were back in bed by quarter past eleven, hungry, but happier than any cake could have made them."],"qs":[["What was the girls' plan?",["To eat leftover cake secretly at midnight","To play a trick on Mrs Pemberton","To bake a cake for the fete","To catch a cat"],"The first paragraph describes the plan."],["\"a ring so loud it could have woken the dead\" is an example of:",["hyperbole (exaggeration)","a simile","alliteration","onomatopoeia"],"It is an exaggeration for effect."],["What does the note reveal?",["Mrs Pemberton knew about the plan and ate the cake herself.","The cat ate the cake.","Beatrix had already eaten the cake.","The cake was hidden somewhere else."],"She thanked them for the \"delicious\" cake and ordered them to bed."],["Why were the girls \"happier than any cake could have made them\"?",["They shared a funny moment together.","They found more cake later.","They were not punished.","They wanted to go to bed."],"Laughing together made them happier than the cake would have."],["What is the tone of this story?",["humorous","frightening","sad","serious"],"The mishaps and the note are funny."]]},{"t":"Uluru","p":["Rising about 348 metres above the flat red plains of central Australia, Uluru is one of the most recognisable landmarks in the world. It is a huge sandstone rock formation, and much more of it lies hidden underground, possibly several kilometres deep.","Uluru changes colour throughout the day. At sunrise and sunset, when the sun's light passes through more of the atmosphere, the rock can glow deep orange and fiery red. After rain, it can look almost silver as water streams down its sides.","For the Anangu, the Aboriginal traditional owners of the land, Uluru is not simply a rock. It is a deeply sacred place, connected to ancestral stories and laws that have been passed down for tens of thousands of years. Many features of the rock, such as caves, waterholes and marks on its surface, are linked to these stories.","In 1985, ownership of the land was formally handed back to the Anangu, who now manage the national park together with the Australian government. Out of respect for the Anangu's wishes and culture, climbing Uluru was permanently banned in October 2019. Visitors are instead invited to walk around its base and learn about its significance."],"qs":[["What does the first paragraph suggest about Uluru's size?",["It is even bigger than it looks, because much of it is underground.","It is smaller than most people think.","It is the tallest mountain in Australia.","It is sinking into the ground."],"Much more of it lies hidden underground."],["Why does Uluru glow red at sunrise and sunset?",["The sun's light passes through more of the atmosphere.","It is heated by the sun.","People shine lights on it.","Rain changes its colour."],"Paragraph two explains this."],["What does \"Uluru is not simply a rock\" mean in the third paragraph?",["It has deep cultural and spiritual meaning for the Anangu.","It is made of metal.","It is actually a mountain range.","It is a building."],"It is a sacred place connected to stories and law."],["Why was climbing Uluru banned?",["Out of respect for the Anangu's wishes and culture","Because the rock was crumbling","Because it was too hot","Because there were too many snakes"],"The last paragraph states the reason."],["What happened in 1985?",["Ownership of the land was handed back to the Anangu.","Climbing was banned.","Uluru was discovered.","The national park was closed."],"The last paragraph gives this date."]]},{"t":"The Robot Who Wanted to Dance","p":["Unit 7 had been built to stack boxes. It did its job well. Every day it lifted boxes from the conveyor belt and placed them in perfect towers, never dropping one, never making a mistake.","But every evening, when the factory emptied, the cleaner, Mrs Obi, switched on a small radio and swept the floor in time to the music. She swayed. She twirled. Sometimes she spun the broom around like a dance partner.","Unit 7 watched. Its sensors recorded every movement. Its programs had no instructions for what it was feeling, so it filed the feeling under ERROR: UNKNOWN.","One night, when the radio played a particularly bouncy song, Unit 7 lifted one metal arm. Then the other. It rotated its body forty-five degrees to the left, then to the right. It was not graceful. A box fell off the top of a tower.","Mrs Obi turned around. Unit 7 froze, expecting to be switched off.","Instead, Mrs Obi laughed, a big warm laugh, and held out her hand. \"Not like that,\" she said. \"Like this.\"","The next morning, the engineers found the boxes stacked as perfectly as ever. They never noticed that one of Unit 7's error messages had been quietly renamed JOY."],"qs":[["What was Unit 7 designed to do?",["Stack boxes","Clean the factory","Play music","Teach dancing"],"The first sentence tells us."],["Why did Unit 7 file its feeling under \"ERROR: UNKNOWN\"?",["It had no program to explain what it was feeling.","It was broken.","It did not like the music.","Mrs Obi told it to."],"Its programs had no instructions for the feeling."],["Why did Unit 7 freeze when Mrs Obi turned around?",["It was afraid it would be switched off.","It had run out of power.","The song had ended.","It wanted to surprise her."],"It was \"expecting to be switched off\"."],["How does Mrs Obi respond to the dancing robot?",["She kindly offers to teach it.","She reports it to the engineers.","She turns off the radio.","She runs away."],"She laughs warmly and holds out her hand."],["What does renaming the error message \"JOY\" show?",["Unit 7 has understood the feeling it had.","The engineers fixed the robot.","The robot has stopped working.","Mrs Obi reprogrammed the robot."],"It now recognises the feeling as joy."]]},{"t":"Camels in Australia","p":["Camels are not native to Australia, yet today the country is thought to have the largest population of wild camels in the world.","In the 1800s, explorers and settlers needed a way to move goods across the dry interior. Horses and bullocks struggled in the desert heat, but camels could travel long distances with little water and carry heavy loads. Thousands of camels were imported, mainly from India and Afghanistan, along with the skilled cameleers who handled them. These cameleers helped supply remote towns and build important projects, such as the Overland Telegraph Line.","In the early 1900s, trucks and railways replaced camel trains. Many camels were no longer needed and were released into the wild. With plenty of space and few predators, their numbers grew rapidly.","Today, wild camels cause problems in some areas. They damage fences, drink from and foul precious waterholes, and eat plants that native animals depend on. Governments and Aboriginal communities manage their numbers, and some camels are captured and sold, including to countries in the Middle East.","The famous train that runs between Adelaide and Darwin is named the Ghan, in honour of the cameleers who helped open up the outback."],"qs":[["Why were camels brought to Australia?",["To carry goods across the dry interior","To live in zoos","To race against horses","To provide milk for settlers"],"Paragraph two explains they were used to move goods."],["Why were camels better than horses in the desert?",["They could travel far with little water.","They were faster than horses.","They were cheaper to buy.","They did not need to sleep."],"They could travel long distances with little water."],["Why did wild camel numbers grow so quickly?",["They had lots of space and few predators.","Farmers fed them.","More camels were imported.","They lived in cities."],"Paragraph three explains this."],["Which of these is a problem caused by wild camels?",["Fouling waterholes that native animals need","Blocking railway lines","Scaring tourists away from beaches","Eating crops in cities"],"Paragraph four lists this problem."],["Why is the Ghan train given that name?",["To honour the cameleers","It was built by camels.","It only carries camels.","It was invented in Afghanistan."],"The final paragraph explains this."]]},{"t":"Diary of a New Kid","p":["Monday. First day at Greenfield Primary. The uniform is itchy. The teacher, Ms Kaur, spelled my name wrong on the board (it's Rhys, not Reese), and I didn't correct her because everyone was staring. Ate lunch in the library. The librarian said I wasn't allowed to eat in the library. Ate lunch in the toilets.","Wednesday. A boy called Finn asked if I liked football. I said yes, even though I have never played. He said to come to the oval at lunch. I pretended to have a sore ankle.","Thursday. Finn asked about my ankle. I felt bad about lying, so I told him the truth. He laughed, but not in a mean way, and said he'd teach me. I fell over eleven times. Finn fell over twice, and one of those was on purpose, I think, so I wouldn't feel bad.","Friday. Ms Kaur spelled my name right on the board. I asked Finn if he told her. He shrugged. At lunch, four other kids joined in our game. I still fell over, but only six times.","Next week, I'm going to ask Finn if he wants to come over on Saturday."],"qs":[["Why didn't Rhys correct Ms Kaur on Monday?",["He felt self-conscious with everyone staring.","He did not know how to spell his name.","He liked the new spelling.","Ms Kaur had left the room."],"He says he didn't because everyone was staring."],["What does \"Ate lunch in the toilets\" suggest about Rhys's first day?",["He felt lonely and had nowhere to go.","He enjoyed eating alone.","The canteen was closed.","He was feeling sick."],"It shows how isolated and uncomfortable he felt."],["Why did Rhys pretend to have a sore ankle?",["He was worried about people finding out he couldn't play.","He really had hurt it.","He did not like Finn.","He wanted to go home early."],"He had said he liked football but had never played."],["What does the writer suggest about Finn falling over \"on purpose\"?",["Finn was being kind to make Rhys feel better.","Finn was clumsy.","Finn wanted to win the game.","Finn was showing off."],"He did it \"so I wouldn't feel bad\"."],["How does Rhys's situation change during the week?",["He goes from feeling alone to making friends.","He goes from happy to miserable.","He becomes the best footballer.","He moves to another school."],"By Friday he has friends to play with and plans to invite Finn over."]]},{"t":"Apollo 11","p":["On 20 July 1969, hundreds of millions of people around the world watched grainy black-and-white pictures on their televisions as American astronaut Neil Armstrong climbed down a ladder and became the first person to walk on the Moon.","Armstrong and his crewmate Buzz Aldrin landed in a small spacecraft called the lunar module, named Eagle. Their third crew member, Michael Collins, stayed in orbit around the Moon in the command module, waiting to take them home.","The landing was more dangerous than many viewers realised. As Eagle approached the surface, Armstrong saw that the computer was guiding them towards a field of large boulders. He took manual control and flew over the rocks searching for a safer spot, landing with only seconds of fuel to spare before they would have had to abort the landing.","Australia played an important part. Radio telescopes at Honeysuckle Creek near Canberra and at Parkes in New South Wales helped receive the television signals, allowing the world to watch the historic moment.","The astronauts spent about two and a half hours outside, collecting rock samples and setting up experiments, before returning safely to Earth four days later."],"qs":[["What was the name of the lunar module?",["Eagle","Apollo","Parkes","Columbia"],"Paragraph two names it."],["Why did Michael Collins stay in orbit?",["To wait in the command module and take the others home","Because he was sick","Because there was no room in the lunar module for three","To take photographs of Earth"],"He waited \"to take them home\"."],["Why did Armstrong take manual control?",["The computer was guiding them towards dangerous boulders.","The computer had switched off completely.","He wanted to land faster.","Aldrin asked him to."],"He saw they were heading for a field of large boulders."],["What does \"with only seconds of fuel to spare\" suggest about the landing?",["It was very close to having to be abandoned.","It was perfectly safe.","They had too much fuel.","They crashed."],"It shows how tense and risky the landing was."],["What role did Australia play?",["Its radio telescopes helped receive the television signals.","It built the lunar module.","An Australian walked on the Moon.","The rocket was launched from Australia."],"Paragraph four explains this."]]},{"t":"The Bushfire","p":["The smoke came first. For two days it hung over the town like a dirty yellow blanket, turning the sun into a flat red coin. Ash drifted down onto car windscreens. Nobody hung washing out.","On the third day, the wind changed. Dad listened to the emergency broadcast on the radio with his jaw clenched, then switched it off. \"We're going,\" he said. \"Now.\"","We had packed the car the night before: photo albums, Nana's jewellery box, the dog's lead, a bag of clothes each. My little brother Ollie wanted to bring his whole Lego city. There was room for one box. He chose the fire station.","As we drove out along the highway, I looked back. The hills behind our street were glowing orange, and the sky above them was a colour I had no name for.","We stayed at the evacuation centre in the school hall for three nights, sleeping on camp beds among our neighbours. On the fourth day, Dad came back from the roadblock and knelt down in front of us. For a moment he couldn't speak. Then he smiled.","\"It's still standing,\" he said. \"The fire went around it.\""],"qs":[["\"turning the sun into a flat red coin\" suggests that:",["the smoke made the sun look dull and red","the sun had disappeared","the sun was very bright","it was night-time"],"Smoke dims and reddens the sun."],["Why did Dad decide to leave on the third day?",["The wind changed, which made the fire more dangerous.","The family had run out of food.","Ollie was sick.","The school hall opened."],"The wind changed and he listened to the emergency broadcast."],["What does Ollie choosing the Lego fire station suggest?",["He hoped firefighters would protect them.","He did not like the rest of his Lego.","It was the smallest box.","He wanted to be a builder."],"It hints at his worry about the fire and hope for rescue."],["Why couldn't Dad speak for a moment when he returned?",["He was overcome with emotion.","He was out of breath from running.","He had lost his voice from the smoke.","He had forgotten what to say."],"His strong feelings about the good news made him pause."],["What does \"It's still standing\" refer to?",["Their house survived the fire.","The school hall","The fire station","The roadblock"],"The fire went around their home."]]},{"t":"How to Grow a Bean in a Jar","p":["Watching a seed sprout is one of the easiest science experiments you can do at home. All you need is a clean glass jar, some paper towel, water and a dried bean, such as a broad bean or a kidney bean.","Step 1: Fold two or three sheets of paper towel and line the inside of the jar with them. Then scrunch another sheet and push it into the middle of the jar to hold the lining in place.","Step 2: Slide the bean between the glass and the paper towel, about a third of the way down the jar, so that you can see it clearly from the outside.","Step 3: Pour a little water into the jar until the paper towel is damp all the way through. There should only be a small puddle at the bottom. Too much water can cause the bean to rot.","Step 4: Place the jar somewhere warm but out of direct sunlight, and check it every day. Add a few drops of water if the paper towel starts to dry out.","Within a few days, the bean's skin will split, and a small root will begin to grow downwards. A little later, a green shoot will push upwards towards the light. Try keeping a diary with drawings to record the changes each day."],"qs":[["What type of text is this?",["a procedure","a narrative","a persuasive letter","a poem"],"It gives numbered steps for how to do something."],["Why should the bean be placed against the glass?",["So you can watch it grow from the outside","So it stays cold","So it gets more water","So it cannot escape"],"Step 2 says so you can see it clearly."],["What might happen if you add too much water?",["The bean could rot.","The bean would grow faster.","The jar would crack.","The shoot would turn yellow."],"Step 3 warns about rotting."],["In which direction does the root grow?",["Downwards","Upwards","Sideways","In circles"],"The final paragraph says the root grows downwards."],["Why does the writer suggest keeping a diary?",["To record the changes each day","To remember to buy more beans","To practise handwriting","To write a story about the bean"],"The final sentence explains the purpose."]]},{"t":"The Honest Woodcutter (a retold fable)","p":["Long ago, a poor woodcutter was chopping trees beside a deep river when his axe slipped from his tired hands and sank beneath the water. He sat on the bank and wept, for without his axe he could not earn a living.","Suddenly the water shimmered, and a river spirit rose up holding a gleaming golden axe. \"Is this yours?\" she asked. The woodcutter shook his head. \"No, mine was only iron.\"","The spirit dived again and returned with an axe of silver. \"Is this one yours?\" Again the woodcutter shook his head.","At last, the spirit brought up a plain iron axe with a worn wooden handle. \"That's it!\" cried the woodcutter joyfully. The spirit smiled. \"Because you are honest,\" she said, \"you may keep all three.\"","When a greedy neighbour heard the story, he hurried to the river and threw his own axe into the water on purpose. When the spirit appeared with a golden axe, he shouted, \"Yes! That one is mine!\" The spirit frowned, sank beneath the water, and never returned. The greedy man went home with no golden axe, no silver axe, and no axe of his own."],"qs":[["Why did the woodcutter weep?",["Without his axe, he could not earn a living.","He had hurt his hands.","He was afraid of the river spirit.","His neighbour had stolen his axe."],"The first paragraph explains this."],["Why did the woodcutter refuse the golden and silver axes?",["They were not his.","They were too heavy.","He did not like gold or silver.","He wanted a newer axe."],"He honestly said his axe was iron."],["Why was the woodcutter rewarded?",["He told the truth.","He was very poor.","He asked politely.","He was a good swimmer."],"The spirit says \"Because you are honest\"."],["What mistake did the greedy neighbour make?",["He lied about which axe was his.","He dropped his axe by accident.","He was rude to the woodcutter.","He went to the wrong river."],"He claimed the golden axe was his."],["What is the moral of this fable?",["Honesty is rewarded, but greed can leave you with nothing.","Always look after your tools.","Never go near rivers.","Gold is worth more than iron."],"The honest man gains; the greedy one loses everything."]]},{"t":"Penguins of the Southern Seas","p":["Although many people picture penguins standing on Antarctic ice, only a few of the world's eighteen or so penguin species live on Antarctica itself. Penguins are found across the Southern Hemisphere, from the icy south to the coasts of South America, southern Africa, New Zealand and Australia. One species, the Galapagos penguin, even lives near the equator.","Penguins cannot fly, but they are superb swimmers. Their wings have evolved into stiff flippers, and their streamlined bodies slice through the water. Emperor penguins can dive more than five hundred metres deep and hold their breath for over twenty minutes.","The smallest penguin in the world lives in Australia. The little penguin, sometimes called the fairy penguin, stands only about thirty centimetres tall. At Phillip Island in Victoria, crowds gather each evening to watch hundreds of little penguins waddle ashore after a day of fishing, a nightly event known as the Penguin Parade.","A penguin's black-and-white colouring is a clever disguise called countershading. From above, its dark back blends in with the deep water. From below, its white belly blends in with the bright surface."],"qs":[["What misconception does the first paragraph correct?",["That most penguins live on Antarctica","That penguins can fly","That penguins are fish","That penguins live in the Arctic"],"Only a few species live on Antarctica itself."],["What have penguins' wings evolved into?",["Stiff flippers","Feathered sails","Long legs","Webbed feet"],"Paragraph two explains this."],["Which is the smallest penguin in the world?",["The little penguin","The emperor penguin","The Galapagos penguin","The Antarctic penguin"],"The little penguin is about thirty centimetres tall."],["What is the Penguin Parade?",["Little penguins coming ashore each evening at Phillip Island","A festival where people dress as penguins","Emperor penguins marching across the ice","A race between penguins"],"Paragraph three explains it."],["How does countershading help a penguin?",["It helps it blend in when seen from above or below.","It keeps it warm.","It helps it swim faster.","It attracts a mate."],"The dark back and white belly blend with the water from different angles."]]},{"t":"The Substitute","p":["Mr Grimsby, our substitute teacher, did not smile. He wrote his name on the board in capital letters, underlined it twice, and turned to face us with his hands behind his back.","\"I understand,\" he said, \"that this class has a reputation.\"","We did. Last term we had driven two relief teachers away before morning tea. Harrison had a whoopee cushion ready. Mia had swapped all the whiteboard markers for permanent ones. We were, in our own opinion, legends.","Mr Grimsby sat down. The whoopee cushion let out a magnificent noise. The class held its breath.","Mr Grimsby stood up, lifted the cushion and examined it carefully. \"An excellent specimen,\" he said. \"The rubber is high quality, and the valve is well designed. Harrison, is it? Would you like to explain to the class how it works? In detail. With diagrams.\"","By lunchtime, Harrison had filled the board with an explanation of air pressure. Mia had written a report on permanent ink. And the rest of us had learned more science in a morning than in the whole of last term.","When our real teacher came back, we asked if Mr Grimsby could visit again."],"qs":[["What does \"this class has a reputation\" suggest Mr Grimsby had heard?",["The class often misbehaved with relief teachers.","The class was the best in the school.","The class loved science.","The class was very quiet."],"They had driven relief teachers away before."],["Why does the narrator say \"We were, in our own opinion, legends\"?",["The class was proud of their pranks, even though others may not agree.","The class had won an award.","The teacher called them legends.","They were famous athletes."],"\"in our own opinion\" hints that not everyone would agree."],["How did Mr Grimsby respond to the whoopee cushion?",["He turned it into a learning activity.","He shouted at the class.","He sent Harrison to the principal.","He pretended not to notice."],"He asked Harrison to explain how it works, with diagrams."],["Why did the class hold its breath?",["They were waiting to see how Mr Grimsby would react.","The room smelled bad.","They were practising for swimming.","They were scared of the cushion."],"They were in suspense after the prank."],["How did the students' attitude change by the end?",["They came to respect and like Mr Grimsby.","They became angrier.","They planned a bigger prank.","They stopped coming to school."],"They asked if he could visit again."]]},{"t":"The Mystery of Migration","p":["Every year, the bar-tailed godwit, a long-legged wading bird, performs one of the most astonishing journeys in the animal kingdom. After breeding in Alaska during the northern summer, it flies non-stop across the Pacific Ocean to New Zealand and eastern Australia, a distance of more than eleven thousand kilometres.","The journey takes around eight to ten days, and during that time the godwit does not stop to eat, drink or rest. Before it sets off, the bird eats so much that it nearly doubles its body weight, storing the energy as fat. It also shrinks some of its internal organs, such as parts of its digestive system, which it will not need during the flight.","How do godwits find their way across thousands of kilometres of open ocean with no landmarks? Scientists believe migrating birds may use a combination of clues: the position of the sun and stars, the Earth's magnetic field, and possibly even smells and sounds.","Some godwits have been fitted with tiny satellite trackers. In 2022, one young bird was recorded flying more than thirteen thousand kilometres without stopping, a new world record."],"qs":[["Where does the bar-tailed godwit breed?",["Alaska","New Zealand","Antarctica","Eastern Australia"],"The first paragraph states this."],["Why does the godwit eat so much before its journey?",["To store enough energy as fat for the non-stop flight","Because food in Alaska is delicious","To grow its digestive system","To become too heavy for predators to lift"],"It stores energy because it cannot eat during the flight."],["Why does the godwit shrink some of its organs?",["It does not need them during the flight.","They are damaged by the cold.","It wants to look smaller.","They fall off during migration."],"Paragraph two says it will not need them during the flight."],["Which word best describes how certain scientists are about how birds navigate?",["unsure","completely certain","uninterested","angry"],"Words like \"believe\", \"may\" and \"possibly\" show uncertainty."],["How do scientists know about the record-breaking flight?",["The bird was wearing a satellite tracker.","Someone followed it in a plane.","They counted its feathers.","The bird landed on a ship."],"Birds were fitted with tiny satellite trackers."]]},{"t":"The Box in the Attic","p":["Nobody had been up to the attic since Grandpa died. So when Mum finally pulled down the folding ladder and asked me to help sort through his things, I climbed up slowly, as if the dust might be sleeping and I didn't want to wake it.","Most of it was ordinary: tax papers, a broken lamp, a box of Christmas decorations with half the baubles smashed. But tucked behind the water tank was a small tin trunk with my name painted on the lid. Not my full name. Just \"Kit\", the nickname nobody used except him.","Inside were dozens of envelopes, one for every birthday since I was born. Each was sealed. Each had my age written on the front in Grandpa's shaky capitals: ONE, TWO, THREE, all the way up to TWENTY-ONE.","The envelopes for my first eleven birthdays were gone. He must have given me those, and I had never noticed the matching handwriting in all the cards over the years.","I picked up the one marked TWELVE. My birthday was next week.","Mum watched me from the top of the ladder, her eyes wet. \"He always said he would be there for every one,\" she whispered. \"I suppose he found a way.\""],"qs":[["\"as if the dust might be sleeping\" suggests the narrator felt:",["quiet and respectful in a place linked to someone who had died","excited to play a game","angry about the mess","afraid of spiders"],"The careful, quiet movement reflects respect and sadness."],["Why was the name on the trunk important?",["Only Grandpa called the narrator \"Kit\".","It was painted in gold.","It was the narrator's full name.","It was spelt wrongly."],"Kit was the nickname nobody used except him."],["Why were the first eleven envelopes missing?",["Grandpa had already given them to the narrator on past birthdays.","Someone had stolen them.","They had been lost in the attic.","Grandpa never wrote them."],"The narrator realises he must have given those already."],["How old is the narrator about to turn?",["Twelve","Eleven","Twenty-one","One"],"The next envelope is TWELVE and the birthday is next week."],["What does Mum mean by \"I suppose he found a way\"?",["Grandpa's letters let him still be part of every birthday.","Grandpa hid somewhere in the house.","Grandpa found the attic ladder.","Grandpa sent someone to deliver presents."],"The letters keep his promise to \"be there for every one\"."]]},{"t":"Chocolate: From Bean to Bar","p":["Chocolate begins its life as a seed inside a large pod that grows on the cacao tree. These trees grow only in hot, wet regions near the equator, such as West Africa, Central and South America, and parts of Asia.","When the pods are ripe, farmers cut them from the trees and split them open. Inside are around thirty to fifty seeds, known as cacao beans, surrounded by a sweet white pulp. The beans and pulp are piled up and covered, often with banana leaves, and left to ferment for about a week. Fermentation develops the flavours that later make chocolate taste like chocolate.","Next, the beans are dried in the sun, then shipped to factories around the world. There they are roasted, cracked open and ground into a thick paste called cocoa mass. Sugar, milk and cocoa butter may be added, and the mixture is stirred and heated for hours to make it smooth before being cooled and moulded into bars.","The ancient Maya and Aztec peoples of Central America drank chocolate as a bitter, spicy drink thousands of years ago. The sweet chocolate bars we know today were not developed until the 1800s."],"qs":[["Where do cacao trees grow?",["In hot, wet regions near the equator","In cold mountain areas","Only in Europe","In dry deserts"],"The first paragraph explains this."],["Why are cacao beans left to ferment?",["To develop their chocolate flavour","To make them softer to chew","To remove the seeds","To turn them white"],"Fermentation develops the flavours."],["What is cocoa mass?",["A thick paste made from ground roasted beans","The white pulp inside the pod","A type of chocolate bar","A tree that grows cacao"],"Paragraph three defines it."],["Which step comes directly after fermentation?",["Drying the beans in the sun","Roasting the beans","Cutting the pods from the tree","Adding sugar and milk"],"\"Next, the beans are dried in the sun\"."],["How was chocolate different for the Maya and Aztecs?",["It was a bitter, spicy drink.","It was a sweet bar.","It was a type of bread.","It was used as paint."],"The final paragraph explains this."]]},{"t":"Gone Fishing","p":["Pop never caught many fish. That was not really the point.","Every Saturday, he and I would walk down to the end of the old wharf before sunrise, carrying two rods, a bucket, a thermos of sweet tea and a paper bag of prawns that smelled so bad the seagulls followed us like fans following a rock star.","We would sit with our legs hanging over the edge and watch our floats bob on the grey water. Pop would tell me about the war, or about the time he met Nana at a dance, or about the enormous flathead that got away in 1974, which grew a little bigger every time he told the story.","Sometimes we did not talk at all. We just listened to the water slapping against the pylons and watched the sky turn from black to pink to gold.","Once, I asked him why we kept going when we hardly ever caught anything.","He poured me a cup of tea from the thermos and thought about it for a long time. \"Fishing's just the excuse,\" he said at last. \"The good part is the sitting.\""],"qs":[["What does \"That was not really the point\" suggest?",["Catching fish was not the main reason for going.","Pop was a poor fisherman who hated fishing.","The fish had no points.","They never went fishing."],"The story shows they went for other reasons."],["\"the seagulls followed us like fans following a rock star\" is:",["a humorous simile","a metaphor","onomatopoeia","a fact"],"It uses \"like\" to make a funny comparison."],["What does the flathead growing \"a little bigger every time he told the story\" suggest?",["Pop exaggerated the story each time.","The fish was still alive and growing.","Pop caught it several times.","The narrator did not believe it existed."],"It gently shows Pop exaggerating."],["What does the narrator enjoy about the quiet times?",["Listening to the water and watching the sunrise","Catching lots of fish","Feeding the seagulls","Drinking cold drinks"],"Paragraph four describes these peaceful moments."],["What does Pop mean by \"The good part is the sitting\"?",["The time spent together is what matters most.","He is too tired to stand.","He does not like fishing.","Sitting catches more fish."],"Fishing is just an excuse to spend time together."]]},{"t":"Earthquakes","p":["The ground beneath our feet feels solid and still, but the Earth's outer layer is actually broken into gigantic pieces called tectonic plates. These plates float on hotter, softer rock beneath and move very slowly, about as fast as your fingernails grow.","Where two plates meet, they can push together, pull apart or slide past each other. Often their edges become stuck. Pressure builds up over many years, until suddenly the rocks give way and the plates lurch. The energy released travels through the ground as shaking waves, and we feel it as an earthquake.","Scientists measure the strength of earthquakes using an instrument called a seismometer. The magnitude scale they use is not like an ordinary ruler: each step up means the shaking is about ten times larger. A magnitude 6 earthquake produces far more shaking than a magnitude 5.","Australia sits in the middle of a plate, so it has fewer large earthquakes than countries such as Japan or New Zealand, which lie on plate edges. However, earthquakes do still happen here. In 1989, an earthquake in Newcastle, New South Wales, caused serious damage and tragically killed thirteen people."],"qs":[["What are tectonic plates?",["Huge pieces of the Earth's outer layer","Dishes used by scientists","Waves in the ocean","Layers of the atmosphere"],"Paragraph one defines them."],["Why does the writer compare plate movement to fingernails growing?",["To show how slowly the plates move","To show plates are made of the same material","To explain how earthquakes feel","To show plates grow bigger"],"It gives an idea of how slow the movement is."],["What causes an earthquake, according to the passage?",["Stuck plate edges suddenly giving way","Heavy rain","The Moon pulling on the Earth","Volcanoes erupting"],"Pressure builds until the rocks give way."],["What does each step up on the magnitude scale mean?",["The shaking is about ten times larger.","The earthquake lasts ten minutes longer.","One more person feels it.","The shaking is twice as large."],"Paragraph three explains this."],["Why does Australia have fewer large earthquakes than New Zealand?",["It sits in the middle of a plate rather than on an edge.","It is a larger country.","It has more deserts.","It is closer to the equator."],"The final paragraph explains this."]]},{"t":"The Dare","p":["The old Pearson house had been empty for as long as anyone could remember. Its windows were boarded up, its garden had grown wild, and everybody at school knew that anyone who went inside would never come out the same.","\"Touch the front door,\" said Marcus, \"or you're a chicken.\" The others laughed. Ana felt her face burn.","She did not want to go. The gate squealed as she pushed it, and weeds grabbed at her ankles as she walked up the path. The porch steps groaned. Up close, the door was cracked and grey, and a single brass knocker in the shape of a lion stared at her.","She reached out. Then she stopped. Her hand hovered an inch from the wood.","Ana turned around and walked back down the path, past the weeds, through the squealing gate, to where the others were waiting.","\"Chicken!\" crowed Marcus.","\"Maybe,\" said Ana. \"But I didn't come here to prove anything to you.\" She picked up her bag and walked home, and although her heart was still pounding, she felt strangely tall."],"qs":[["Why did Ana walk up to the house?",["She felt pressured by Marcus and the others.","She wanted to buy the house.","She had left her bag there.","She was looking for her cat."],"Marcus called her a chicken and she felt her face burn."],["Which words make the house seem threatening?",["the weeds \"grabbed\" at her ankles","the house was old","the garden was big","the knocker was brass"],"\"grabbed\" gives the weeds a threatening, human-like action."],["Why did Ana stop before touching the door?",["She decided she did not need to do it.","The door opened by itself.","She heard a noise inside.","Marcus called her back."],"She chose to walk away, as her final words show."],["What does Ana mean by \"I didn't come here to prove anything to you\"?",["She does not need Marcus's approval.","She came to visit the house's owner.","She wants Marcus to try the dare.","She is apologising to Marcus."],"She decides what she does, not Marcus."],["Why does Ana feel \"strangely tall\" at the end?",["She feels proud of standing up for herself.","She is standing on the porch.","She has grown taller.","She is walking on her toes."],"Making her own choice gave her confidence."]]},{"t":"The Cleverest Crow","p":["On the Pacific island of New Caledonia lives a crow that makes tools. New Caledonian crows snip and shape twigs and leaves into hooks and probes, which they use to fish insect larvae out of holes in dead wood.","Scientists at the University of Oxford once tested a crow named Betty. They placed a small bucket of food at the bottom of a tall tube, where she could not reach it, and gave her a straight piece of wire. Betty tried to reach the food with the straight wire. When that failed, she wedged the end of the wire into a crack, bent it into a hook, and lifted the bucket out.","In later experiments, crows have solved puzzles that need several steps in the right order, such as using a short stick to reach a longer stick, which they then use to reach food.","Some researchers argue that these crows are as good at certain problem-solving tasks as young children. Not bad for a bird whose brain is about the size of a walnut. Perhaps being called a \"bird brain\" is not such an insult after all."],"qs":[["What do New Caledonian crows use their tools for?",["To reach insect larvae in holes","To build nests","To fight other crows","To open fruit"],"Paragraph one explains this."],["Why did Betty bend the wire into a hook?",["The straight wire could not lift the bucket.","The scientists showed her how.","She wanted to build a nest.","The wire was too long."],"She tried the straight wire first, and it failed."],["What does the \"short stick to reach a longer stick\" experiment show?",["Crows can plan several steps in order.","Crows prefer long sticks.","Crows cannot solve puzzles.","Crows only use tools once."],"It needs several steps done in the right order."],["What does the writer suggest with the last sentence?",["Calling someone a \"bird brain\" may not mean they are stupid.","Birds do not like being insulted.","Crows have large brains.","People should not talk to birds."],"If crows are this clever, \"bird brain\" is not much of an insult."],["What is the main idea of the passage?",["New Caledonian crows are remarkably intelligent tool users.","Crows are dangerous birds.","Oxford University has many birds.","Children are smarter than crows."],"The passage gives examples of their problem-solving."]]},{"t":"The Great Bake-Off","p":["Theo had never baked anything more complicated than toast, which was why entering the school bake-off had seemed like such an excellent idea at midnight and such a terrible idea at breakfast.","He chose a lemon tart, because it looked simple in the recipe book. The recipe book was lying.","The pastry cracked when he rolled it. He patched it with extra dough. The lemon filling refused to set, so he put it back in the oven, where it set so hard it could have been used as a frisbee. He dusted it with icing sugar to hide the brown bits, and then more icing sugar to hide the first lot of icing sugar.","At the bake-off, his tart sat between Olivia's four-layer chocolate cake and Jun's perfect French macarons. Theo wanted to hide under the table.","The judge, a retired pastry chef, took a bite of each entry. When she got to Theo's, she chewed for a long time. Then she said, \"The pastry is tough and the filling is overcooked.\" Theo's stomach dropped. \"But,\" she went on, \"the flavour is brilliant. Real lemons, not the bottled stuff. You'll be good at this one day, if you keep going.\"","Theo did not win. But he went home and made another tart. And then another."],"qs":[["What does the first sentence suggest about Theo's decision?",["It seemed like a good idea late at night but not in the morning.","He had baked many things before.","He entered the bake-off at breakfast.","He was forced to enter."],"The idea seemed excellent at midnight but terrible at breakfast."],["What does \"The recipe book was lying\" suggest?",["The tart was much harder to make than it looked.","The recipe book had the wrong page.","The recipe was for a different dessert.","Someone had written in the book."],"It humorously shows the recipe was not simple at all."],["Why did Theo add more icing sugar?",["To hide mistakes on the tart","To make it sweeter","Because the judge asked for it","To make it look like snow"],"He used it to hide the brown bits, and then the first layer."],["What did the judge like about Theo's tart?",["The flavour, especially the real lemons","The pastry","The way it was decorated","How soft the filling was"],"She praised the flavour and real lemons."],["What does the ending show about Theo?",["The judge's encouragement made him want to keep improving.","He gave up baking.","He was angry about losing.","He won the next bake-off."],"He kept making more tarts."]]},{"t":"Antarctica: The Frozen Continent","p":["Antarctica is the coldest, windiest and driest continent on Earth. The lowest natural temperature ever recorded, about minus eighty-nine degrees Celsius, was measured at the Soviet (now Russian) Vostok research station there in 1983.","It may seem strange to call a place covered in ice a desert, but deserts are defined by how little rain or snow they receive, not by how hot they are. Much of Antarctica's interior receives less precipitation each year than parts of the Sahara.","Almost all of the continent is buried under an ice sheet that is, on average, about two kilometres thick. This ice holds most of the world's fresh water. If it all melted, scientists estimate that sea levels around the world would rise by about fifty-eight metres.","No country owns Antarctica. Under the Antarctic Treaty, first signed in 1959, it is reserved for peaceful purposes and scientific research. Australia was one of the original twelve countries to sign, and today it runs three permanent research stations there: Casey, Davis and Mawson.","No people live in Antarctica permanently, but thousands of scientists and support staff visit each year to study the ice, the weather, the ocean and the animals."],"qs":[["What three words describe Antarctica in the first sentence?",["coldest, windiest and driest","coldest, largest and highest","wettest, windiest and coldest","darkest, coldest and emptiest"],"The first sentence lists these."],["Why can Antarctica be called a desert?",["It receives very little rain or snow.","It is very hot in summer.","It is covered in sand.","It has no animals."],"Deserts are defined by low precipitation."],["What would happen if Antarctica's ice all melted?",["Sea levels would rise by about fifty-eight metres.","The continent would disappear.","The Sahara would become wet.","Temperatures would drop."],"Paragraph three explains this."],["What is the Antarctic Treaty for?",["Keeping Antarctica for peace and science","Dividing Antarctica between countries","Allowing mining in Antarctica","Building cities in Antarctica"],"It reserves Antarctica for peaceful purposes and research."],["Which of these is NOT an Australian station named in the passage?",["Vostok","Casey","Davis","Mawson"],"The passage names Casey, Davis and Mawson."]]},{"t":"Lost in the Supermarket","p":["One moment Mum was right beside me in the cereal aisle. The next, I turned around holding a box of Choco Crunch to show her, and she was gone.","I was six, and the supermarket suddenly seemed as enormous as a city. The shelves towered over me. The music playing through the speakers was cheerful in a way that felt like it was mocking me. Every trolley that rolled past belonged to a stranger.","I remembered what Mum always told me: \"If you get lost, stay where you are and find someone who works there.\" So I stood very still, holding my cereal box like a shield, until I saw a woman in a green apron stacking tins of tomatoes.","\"Excuse me,\" I said, in a voice that came out much smaller than I wanted. \"I've lost my mum.\"","The woman knelt down so our eyes were level. She asked my name and my mum's name, then spoke into her walkie-talkie. A minute later, a voice boomed over the speakers, and a minute after that, Mum came running down the aisle, her face white.","She hugged me so tightly the cereal box got squashed. We bought it anyway."],"qs":[["Why did the supermarket seem \"as enormous as a city\"?",["The narrator was small and frightened.","It was the biggest supermarket in the world.","It was built like a city.","The narrator had never been to a supermarket."],"Feeling lost and small made everything seem huge."],["Why did the cheerful music seem to be \"mocking\" the narrator?",["It did not match how scared the narrator felt.","It was too loud.","The narrator did not like the song.","Someone was laughing."],"Cheerful music clashed with the narrator's fear."],["What sensible action did the narrator take?",["Stayed still and asked a worker for help","Ran around looking for Mum","Left the supermarket","Hid behind the shelves"],"The narrator followed Mum's advice."],["Why did the worker kneel down?",["To speak with the child at eye level and make them feel comfortable","To pick up tomato tins","To look under the shelves","Because she was tired"],"Getting to eye level is a kind, reassuring gesture."],["What does Mum's \"face white\" suggest?",["She had been very frightened.","She was covered in flour.","She was sick.","She was angry."],"A pale face shows fear."]]},{"t":"The Wonder of Water","p":["Water is so common that we rarely stop to think about how strange it is. Yet it has some remarkable properties that make life on Earth possible.","Most substances shrink as they cool and become solid, so their solid form sinks in their liquid form. Water is different. When it freezes, it expands, becoming about nine per cent bigger. This makes ice lighter than liquid water, which is why ice cubes float in your drink and why lakes freeze from the top down. The layer of ice on top acts like a blanket, keeping the water beneath from freezing solid, so fish can survive the winter.","Water can also soak up a great deal of heat before its temperature rises. This is why the ocean stays cooler than the land on a hot summer's day, and why coastal places usually have milder weather than places far inland.","Finally, water is sometimes called the universal solvent, because it can dissolve more substances than almost any other liquid. As water moves through our bodies, it carries dissolved nutrients to our cells and helps wash away waste."],"qs":[["What happens to water when it freezes?",["It expands.","It shrinks.","It sinks.","It becomes heavier."],"Paragraph two says it becomes about nine per cent bigger."],["Why do lakes freeze from the top down?",["Ice is lighter than liquid water, so it floats.","The top is closer to the sun.","Fish keep the bottom warm.","The wind freezes the bottom first."],"Floating ice forms at the surface."],["How does the layer of ice help fish?",["It stops the water below from freezing solid.","It gives them food.","It lets them breathe air.","It helps them see better."],"The ice acts like a blanket."],["Why are coastal places usually milder than inland places?",["The ocean soaks up heat without warming up quickly.","There is more wind inland.","The sun is weaker at the coast.","Coastal places have more trees."],"Paragraph three explains this."],["Why is water called \"the universal solvent\"?",["It can dissolve more substances than almost any other liquid.","It is found everywhere in the universe.","It solves problems.","It never changes."],"The last paragraph explains the name."]]},{"t":"Brave Enough","p":["Everybody said Dad was brave. He was a firefighter, and there was a photo of him in the newspaper carrying a little boy out of a burning house. At school, kids asked me if he was scared of anything. \"Nothing,\" I always said.","Then one night I came downstairs for a glass of water and found him sitting alone at the kitchen table in the dark. His hands were wrapped around a mug of tea that had gone cold. He didn't hear me until I was right beside him.","\"Couldn't sleep,\" he said, and tried to smile. It didn't quite work.","I sat down. For a long time neither of us said anything. Then he told me about the fire that day, a warehouse, and about the moment the roof started to come down and he didn't know if his friend Sal had got out. Sal had. But Dad's hands were still shaking a little.","\"I thought you weren't scared of anything,\" I said.","He looked at me for a long moment. \"Being brave isn't about not being scared, mate,\" he said. \"It's about being scared and going in anyway. And then being honest about it afterwards.\"","The next time someone at school asked, I told them the truth. It turned out to be a better answer."],"qs":[["Why did the narrator believe Dad was not scared of anything?",["Dad was a firefighter who had done brave things.","Dad had told him so.","Dad never went to work.","Dad was very tall."],"Everyone called him brave and he had rescued a child."],["What does the cold tea suggest?",["Dad had been sitting there for a long time, lost in thought.","Dad does not like hot tea.","The kettle was broken.","Dad had just arrived home."],"The tea had time to go cold while he sat."],["\"tried to smile. It didn't quite work\" shows that Dad:",["was still upset and could not hide it","was happy to see his son","had hurt his face","was about to laugh"],"His smile failed because he was troubled."],["What is Dad's definition of bravery?",["Feeling scared but acting anyway, and being honest about it","Never feeling afraid","W

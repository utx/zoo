<script>
// Mission Zoo: more fun missions (uses the stage, modes and props from fun.js).
//  Spelling Bee     – the device says a word out loud; spell it right and the bees buzz off, wrong and they chase your buddy
//  Hiccup Emergency – typed maths; each right answer is a hiccup cure, each wrong one a mega-hiccup
//  Whodunit         – something has gone missing; suspects are your own animals; read the clues, rule them out, accuse
//  Mystery eggs     – new right answers on any mission warm an egg; when it's warm enough it hatches

// =====================================================================
//  SPEAKING: the device reads words out loud (Web Speech API)
// =====================================================================
const speechOK = () => typeof window !== 'undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
let VOICE = null;
function pickVoice() {
  if (!speechOK()) return null;
  const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); if (!vs.length) return null;
  const nice = v => /natural|premium|enhanced|google|karen|lee|catherine|daniel|serena|libby|natasha/i.test(v.name);
  return vs.find(v => /en[-_]AU/i.test(v.lang) && nice(v)) || vs.find(v => /en[-_]AU/i.test(v.lang)) || vs.find(v => /en[-_]GB/i.test(v.lang) && nice(v)) || vs.find(v => /en[-_]GB/i.test(v.lang)) || vs.find(nice) || vs[0];
}
if (speechOK()) { VOICE = pickVoice(); speechSynthesis.onvoiceschanged = () => { VOICE = pickVoice(); }; }
function speak(text, rate = .85) {
  if (!speechOK()) return false;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    VOICE = VOICE || pickVoice();
    if (VOICE) { u.voice = VOICE; u.lang = VOICE.lang; } else u.lang = 'en-AU';
    u.rate = rate; u.pitch = 1.05;
    speechSynthesis.speak(u); return true;
  } catch (e) { return false; }
}

// =====================================================================
//  SPELLING BEE
// =====================================================================
function makeBeeSet() {
  const all = SPELL.map((w, i) => ({ i, id: spellId(w) }));
  const fresh = shuffle(all.filter(x => !seen(x.id))), r = S.recent.bee || [];
  const old = shuffle(all.filter(x => seen(x.id) && !r.includes(x.i)));
  const idx = [...fresh, ...old].slice(0, 5).map(x => x.i);
  S.recent.bee = [...r, ...idx].slice(-40);
  return idx.map(i => {
    const [word, def, sent, tip] = SPELL[i];
    const q = { kind: 'spell', q: 'Spell the word you hear.', word, def, sent, tip, show: word, e: tip };
    tagQ(q, spellId(SPELL[i])); q.worth = q.fresh ? WORTH.typed : WORTH.repeat;
    return q;
  });
}
const blankOut = (sent, w) => sent.replace(new RegExp(`\\b${w}\\b`, 'i'), '_____');
function sayBee(mode) {
  const q = QS && QS.q; if (!q || q.kind !== 'spell') return;
  if (mode === 'slow') speak(q.word, .5);
  else if (mode === 'sent') speak(q.sent, .85);

}
function spellTiles() {
  const q = QS.q, t = QS.input;

  const out = rollEgg(), e = egg(); e.hatched++; e.warm = 0; e.need = EGG_NEED;
  save(); renderRes();
  openModal({ type: 'egg', out, t0: performance.now() });
  runHatch();
}
let HATCH_RAF = null;
function runHatch() {
  cancelAnimationFrame(HATCH_RAF);
  const step = now => {
    const m = UI.modal, cv = document.getElementById('hatchCv'); if (!m || m.type !== 'egg' || !cv) return;
    const g = cv.getContext('2d'), t = now - m.t0; g.imageSmoothingEnabled = false; g.clearRect(0, 0, cv.width, cv.height);
    const stage = t < 900 ? 0 : t < 1300 ? 1 : t < 1700 ? 2 : t < 2100 ? 3 : 4, wob = t < 2100 ? Math.sin(t / (t < 900 ? 90 : 50)) * (1 + stage) : 0;
    const ec = eggCv(stage); g.save(); g.translate(32, 50); g.rotate(wob * .05); g.drawImage(ec, -11, -26); g.restore();
    if (stage >= 4) {
      const o = m.out, rise = Math.min(1, (t - 2100) / 500);
      if (o.kind === 'animal') drawAnimal(g, o.a, 32, 46 - rise * 6, { mood: 'happy', noShadow: true, noGear: true, noSparkle: true, t: now, frame: ((now / 300) | 0) % 2 });
      else if (o.kind === 'silly') { const c = decorCv(o.it.k); g.drawImage(c, Math.round(32 - c.width / 2), Math.round(44 - c.height - rise * 6)); }
      else { for (let i = 0; i < 6; i++) g.drawImage(icon('coin'), 16 + (i % 3) * 10, 22 + Math.floor(i / 3) * 10 - rise * 6); }
      for (let i = 0; i < 6; i++) { const k = i / 6 * Math.PI * 2 + t / 600, d = 16 + (t - 2100) / 40; if (d < 40) g.drawImage(emote('sparkle'), Math.round(32 + Math.cos(k) * d - 3), Math.round(30 + Math.sin(k) * d * .7 - 3)); }
      const msg = document.getElementById('hatchMsg'); if (msg && msg.hidden) msg.hidden = false;
    }
    HATCH_RAF = requestAnimationFrame(step);
  };
  HATCH_RAF = requestAnimationFrame(step);
}
const MODAL_EXTRA = {
  egg(m) {
    const o = m.out;
    const said = o.kind === 'animal' ? `It's <b>${esc(o.a.name)} the ${esc(spec(o.a).type)}</b>! A ${esc(PP(o.a).n)}.${o.isNew ? ' A brand new sticker!' : ''} It's waiting for you in the Sanctuary.`
      : o.kind === 'silly' ? `It's... ${esc(o.it.said)} It's a decoration now: place it in Edit mode and visitors will come to stare at it.`
      : 'It\'s a <b>golden egg</b>! It hatched into <b>300 coins</b>!';
    return `<button class="close" data-act="closeModal" aria-label="Close">×</button><h3>${ic('star')} The mystery egg is hatching!</h3>
      <div class="hatch"><canvas id="hatchCv" width="64" height="56" aria-hidden="true"></canvas></div>
      <p id="hatchMsg" class="hatch-msg" hidden>${said}</p>
      <div class="row center"><button class="btn go" data-act="closeModal">Brilliant!</button>${o.kind === 'animal' ? '<button class="btn" data-act="go" data-s="gate">Go to the Sanctuary</button>' : o.kind === 'silly' ? '<button class="btn" data-act="go" data-s="edit">Place it</button>' : ''}</div>
      <p class="small muted">Your next egg needs ${EGG_NEED} warmth. New right answers on any mission warm it up.</p>`;
  },
};
// the silly things are decorations that never appear in the shop
for (const it of EGG_SILLY) ITEMS[it.k] = { cat: 'decor', n: it.n, price: 0, vis: 3, egg: 1 };
const DECOR_BASE = decorPB;
decorPB = function (k) {
  let pb;
  switch (k) {
    case 'eggpotato': pb = new PB(22, 18); sh(pb, 11, 11, 9, 6.5, '#c9a06b'); for (const [x, y] of [[6, 9], [15, 13], [12, 8]]) pb.set(x, y, '#9b7447'); pb.rect(4, 7, 14, 2, INK); pb.rect(5, 9, 5, 2, INK); pb.rect(12, 9, 5, 2, INK); pb.set(7, 7, '#8fa6ff'); pb.set(14, 7, '#8fa6ff'); pb.line(8, 14, 13, 14, INK); pb.set(7, 13, INK); pb.set(14, 13, INK); return done(pb);
    case 'eggsock': pb = new PB(18, 22); pb.poly([[5, 1], [12, 1], [12, 13], [16, 16], [15, 21], [4, 21], [5, 13]], (x, y) => ramp(y % 5 < 2 ? P.sky : '#ffffff')[x > 10 ? 2 : 1]); for (const x of [7, 11]) { pb.circ(x, 6, 2, '#ffffff'); pb.set(x + (x === 7 ? 0 : 1), 6, INK); } pb.line(7, 10, 11, 10, INK); return done(pb);
    case 'eggduck': pb = new PB(20, 18); sh(pb, 9, 12, 8, 5, P.yellow); sh(pb, 13, 6, 4.5, 4.5, P.yellow); pb.poly([[17, 6], [20, 7], [17, 8]], ramp(P.orange)[1]); pb.set(14, 5, INK); pb.set(4, 9, '#fff8c8'); return done(pb);
    case 'eggpineapple': pb = new PB(16, 26); for (let i = 0; i < 5; i++) pb.line(8, 9, 3 + i * 2.5, 1 + (i % 2) * 2, ramp(P.leaf)[i % 2 ? 1 : 2]); sh(pb, 8, 17, 6.5, 8, (x, y) => ((x + y) % 4 === 0 || (x - y) % 4 === 0) ? P.gold : P.yellow); pb.circ(5.5, 15, 1.5, '#ffffff'); pb.circ(10.5, 15, 1.5, '#ffffff'); pb.set(5, 15, INK); pb.set(11, 15, INK); pb.circ(8, 20, 1.2, INK); return done(pb);
    case 'eggrock': pb = new PB(22, 16); sh(pb, 11, 10, 9.5, 5.5, P.grey); pb.set(8, 7, INK); pb.set(14, 7, INK); pb.line(6, 11, 10, 10, INK); pb.line(12, 10, 16, 11, INK); pb.set(5, 10, INK); pb.set(17, 10, INK); pb.set(11, 10, INK); return done(pb);
    case 'eggcloud': pb = new PB(22, 20); for (const [x, y, r] of [[6, 9, 4.5], [11, 7, 5.5], [16, 9, 4.5], [11, 10, 5]]) sh(pb, x, y, r, r * .85, '#ffffff'); pb.set(9, 9, INK); pb.set(13, 9, INK); pb.line(10, 11, 12, 11, INK); pb.set(8, 16, P.sky); pb.set(14, 18, P.sky); pb.set(11, 17, P.sky); return done(pb);
  }
  return DECOR_BASE(k);
};

// props for the hiccup cures
const PROP_BASE = propPB2;
propPB2 = function (k) {
  let pb;
  switch (k) {
    case 'glass': pb = new PB(10, 14); pb.poly([[1, 1], [9, 1], [8, 13], [2, 13]], (x, y) => y < 5 ? '#eef8ff' : ramp('#9fd6f2')[x > 6 ? 2 : 1]); pb.set(3, 7, '#ffffff'); return done(pb);
    case 'honey': pb = new PB(16, 14); sh(pb, 6, 9, 5, 4.5, P.gold); pb.rect(2, 3, 8, 2, ramp(P.chestnut)[1]); pb.line(10, 6, 15, 2, P.silver); pb.set(15, 1, P.silver); pb.set(4, 8, '#fff1b8'); return done(pb);
    case 'feather': pb = new PB(8, 18); pb.line(4, 1, 4, 17, P.soot); for (let y = 2; y < 14; y++) { const w = y < 8 ? (y - 1) * .5 : (14 - y) * .5; pb.line(4 - w, y, 4 + w, y, y % 2 ? P.pink : P.hot); } return done(pb);
    case 'lemon': pb = new PB(14, 11); sh(pb, 7, 6, 6, 4.5, P.yellow); pb.set(1, 6, ramp(P.yellow)[2]); pb.set(13, 5, ramp(P.yellow)[2]); pb.set(5, 4, '#fff8c8'); return done(pb);
  }
  return PROP_BASE(k);
};

// ---------- actions ----------
Object.assign(ACT, {
  letter(d) { typeLetter(d.k); },
  letterBack() { typeLetter('⌫'); },
  spellCheck() { checkSpelling(); },
  hear(d) { if (!speechOK()) { toast('This device can\'t speak. Use the meaning and the sentence instead.'); return; } sayBee(d.m); },
  hatchEgg() { hatchEgg(); },
});

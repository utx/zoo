nts had been strange and disappointing.","It was wrapped in newspaper.","His aunt did not like him.","He had asked for something else."],"The first paragraph lists the odd gifts from earlier years."],["What does \"in the voice he used for dentists\" suggest about how Leo said thank you?",["He was being polite but did not really mean it.","He was frightened of his aunt.","His teeth were hurting.","He was shouting."],"It suggests a forced, polite voice, not a genuine one."],["What is the significance of the letters scratched under the lid?",["They connect Leo to his great-grandfather, who had the same initials.","They tell Leo where treasure is hidden.","They were written by Aunt Delphine.","They show the compass is broken."],"L.M. matches Leo's own initials, linking him to his family history."],["What does Leo realise when he notices his aunt's eyes?",["He shares a family connection with her.","She is about to cry.","She needs glasses.","She has been playing a trick on him."],"Their matching grey eyes show a family likeness he had not noticed before."],["The contrast between the two times Leo says \"thank you\" shows that:",["his feelings changed from polite pretending to real gratitude","he forgot he had already said it","his aunt could not hear him the first time","he was being sarcastic both times"],"The second time it \"came out in his real voice\", showing genuine feeling."]]},{"t":"Why Leaves Change Colour","p":["In many parts of the world, autumn turns forests into a blaze of red, orange and gold. It looks as though the trees are putting on a show, but the colours are really a sign that the trees are preparing to shut down for winter.","All summer long, leaves are green because they are packed with chlorophyll, a chemical that captures sunlight and helps the tree make food. Chlorophyll is so plentiful that it hides other colours in the leaf, such as the yellow and orange of chemicals called carotenoids.","As the days shorten and nights grow cold, trees such as maples and oaks stop making new chlorophyll. The green slowly breaks down, and the hidden yellows and oranges finally show through. Some trees also produce new red and purple chemicals in autumn, which is why certain leaves turn crimson.","Eventually, a layer of cells forms where each leaf joins its twig, sealing it off. The leaf dries, loosens and falls. Most of Australia's native trees, such as eucalypts, keep their leaves all year round, so the most dramatic autumn colours here are usually found in parks and gardens planted with trees from colder countries."],"qs":[["Why are leaves green in summer?",["They are full of chlorophyll.","They are full of carotenoids.","They are sealed off from the tree.","They are getting ready to fall."],"Paragraph two explains that chlorophyll makes leaves green."],["According to the passage, where do the yellow and orange colours come from?",["They were in the leaf all along, hidden by the green.","The tree makes them only in winter.","They come from the soil.","They are caused by frost damage."],"The carotenoids were hidden by the plentiful chlorophyll."],["What causes trees to stop making chlorophyll?",["Shorter days and colder nights","Too much rain","Insects eating the leaves","The leaves turning red"],"Paragraph three says this happens \"as the days shorten and nights grow cold\"."],["Why are bright autumn colours less common in Australian bushland?",["Most native trees keep their leaves all year.","Australia has no autumn.","Australian trees have no chlorophyll.","The sun is too strong in Australia."],"Eucalypts and most natives keep their leaves year-round."],["What is the writer's main purpose?",["To explain the science behind autumn colours","To persuade people to plant maple trees","To describe a walk through a forest","To compare Australian and European weather"],"The passage gives facts and reasons, so its purpose is to explain."]]},{"t":"A Letter to the Council","p":["Dear Councillors,","I am writing about the plan to replace Fig Tree Park with a car park. I am eleven years old and I have played in this park every week since I was four, so I think I know it better than most people.","First, the park is the only green space within walking distance for hundreds of families in our street and the flats nearby. Many of us do not have backyards. Without the park, children would have nowhere safe to run, kick a ball or ride a bike.","Second, the giant Moreton Bay fig in the middle of the park is more than one hundred years old. Flying foxes roost in it, and dozens of birds nest in its branches. A car park cannot be moved later, but a tree like this can never be replaced.","Finally, I understand that shoppers need somewhere to park. However, the shopping centre already has an underground car park that is never more than half full on weekdays. Surely it makes more sense to use that space properly than to destroy something precious.","Please vote against this plan at your meeting on the fourteenth.","Yours sincerely,","Amira Haddad"],"qs":[["What is the main purpose of Amira's letter?",["To persuade the council not to build the car park","To describe her favourite games","To complain about the shopping centre","To thank the council for the park"],"She ends by asking the councillors to vote against the plan."],["Why does Amira mention that she has played in the park since she was four?",["To show she knows the park well","To show how old she is","To explain why she likes bikes","To prove she lives nearby"],"She says it means she knows the park better than most people."],["Which of these is Amira's strongest argument that the car park is not needed?",["The existing underground car park is often half empty.","Flying foxes live in the fig tree.","She has played there for years.","Children need space to ride bikes."],"This argument directly challenges the need for more parking."],["The words \"First\", \"Second\" and \"Finally\" help the reader to:",["follow her arguments in order","know how old the tree is","find the date of the meeting","understand the council's plan"],"They are connectives that organise a persuasive text."],["Which sentence is an opinion rather than a fact?",["\"Surely it makes more sense to use that space properly than to destroy something precious.\"","\"I am eleven years old.\"","\"The fig tree is more than one hundred years old.\"","\"The meeting is on the fourteenth.\""],"\"Surely it makes more sense\" expresses her view; it cannot be proven true or false."]]},{"t":"The Great Emu War","p":["In 1932, farmers in Western Australia faced an unusual enemy. About twenty thousand emus had migrated inland after their breeding season and discovered the farmers' wheat fields. The birds trampled crops, ate grain and pushed through fences, leaving gaps that let in rabbits.","The farmers asked the government for help, and soldiers were sent with two machine guns. Everyone expected the job to be over in days. It was not.","The emus proved astonishingly hard to hit. They scattered in every direction at the first shot and could run at around fifty kilometres per hour. When the soldiers mounted a gun on a truck, the bumpy ground made it impossible to aim, and the emus easily outran the truck anyway. The army's commander reportedly admired how the birds seemed to post lookouts while the rest of the flock fed.","After about a month, the soldiers were withdrawn. The newspapers had great fun with the story, and it is often remembered as the war that the emus won. In later years, farmers found that sturdier fences did a far better job of protecting their crops."],"qs":[["Why did the farmers ask the government for help?",["Emus were destroying their crops and fences.","Rabbits were eating the emus.","There was not enough rain for the wheat.","Soldiers had damaged their farms."],"Paragraph one describes the damage the emus caused."],["What does \"It was not\" in the second paragraph tell the reader?",["The job took much longer than expected.","The soldiers refused to go.","The farmers changed their minds.","The machine guns were broken."],"Everyone expected it to be over in days, but it was not."],["Which detail best explains why the emus were hard to hit?",["They scattered quickly and ran very fast.","They hid in the wheat.","They only came out at night.","They were protected by the farmers."],"The third paragraph describes them scattering and running at about 50 km/h."],["Why is the event often described as \"the war that the emus won\"?",["The soldiers left without solving the problem.","The emus attacked the soldiers.","The emus were given a medal.","The farmers joined the emus' side."],"The soldiers were withdrawn after a month, so the emus \"won\"."],["What does the final sentence suggest?",["A simpler solution worked better than the military one.","The emus eventually left on their own.","Farmers stopped growing wheat.","The army tried again and succeeded."],"Sturdier fences did \"a far better job\"."]]},{"t":"Night Swim","p":["The camp leader had said the lake was off-limits after dark, and for three nights Kasey had obeyed. But on the last night, when the others were asleep and the moon hung round and heavy over the water, she slipped out of the cabin in her pyjamas.","The jetty boards were still warm from the day. She sat on the edge and let her feet dangle, and the water was so still that the moon lay in it perfectly, like a second moon waiting underneath.","She had meant only to look. But then something silver flicked beneath the surface, then another, and another, until the whole lake seemed to be shivering with tiny fish. Kasey leaned closer. The jetty creaked.","\"Couldn't sleep either?\"","She nearly fell in. The camp leader, Mr Osei, was standing at the end of the jetty with his hands in his pockets. Kasey waited to be marched back to bed. Instead, he sat down beside her.","\"Bony bream,\" he said, nodding at the water. \"They come up to feed at night. Best show in the whole camp, and nobody ever sees it.\" They watched in silence until the moon slid behind the trees."],"qs":[["Why did Kasey feel she was doing something wrong?",["The lake was off-limits after dark.","She was not allowed to wear pyjamas outside.","She had woken the other campers.","She had forgotten to pack her swimsuit."],"The first sentence says the lake was off-limits after dark."],["\"like a second moon waiting underneath\" describes:",["the moon's reflection on the still water","a fish swimming in the lake","a lamp on the jetty","a cloud passing overhead"],"The still water reflected the moon perfectly."],["What does \"She nearly fell in\" show about Kasey's reaction?",["She was startled by the voice.","She was very sleepy.","The jetty was slippery.","She wanted to swim with the fish."],"The unexpected voice surprised her so much she almost toppled over."],["How does Mr Osei respond to finding Kasey?",["He shares the moment with her instead of punishing her.","He sends her straight back to bed.","He tells her off loudly.","He jumps into the lake."],"Instead of marching her back, he sits down and tells her about the fish."],["What does Mr Osei mean by \"nobody ever sees it\"?",["Most campers are asleep when the fish come up to feed.","The fish are invisible.","The lake is too dark to see anything.","He has never seen it before."],"The fish feed at night, when campers are in bed."]]},{"t":"The Invention of the Sandwich","p":["People have been putting food between pieces of bread for thousands of years, but the sandwich takes its name from an English nobleman, John Montagu, the fourth Earl of Sandwich, who lived in the 1700s.","According to a popular story, the Earl was so fond of playing cards that he refused to leave the gaming table for meals. Instead, he asked his servants to bring him slices of meat tucked between two pieces of bread. That way he could eat with one hand and keep playing with the other, without getting grease on the cards. Soon, his friends began ordering \"the same as Sandwich\".","Historians are not sure the story is true. Some point out that the Earl was a busy government official, and he may simply have eaten at his desk while working. Either way, the name stuck.","Today the humble sandwich has spread around the world in countless forms, from the Vietnamese banh mi to the Aussie salad roll. Not bad for a meal that may have been invented by someone who did not want to put down his cards."],"qs":[["Where does the word \"sandwich\" come from?",["The title of an English nobleman","The name of a type of bread","A card game from the 1700s","A town in Vietnam"],"It comes from John Montagu, the Earl of Sandwich."],["According to the story, why did the Earl want meat between bread?",["So he could eat without stopping his card game","Because he did not like cutlery","Because bread was cheap","So he could share with his friends"],"He wanted to keep playing and avoid greasy cards."],["Why does the writer say historians are \"not sure the story is true\"?",["There is another possible explanation for how he ate.","The Earl never existed.","Sandwiches were invented in Australia.","The Earl hated bread."],"Some think he ate at his desk while working."],["What does the phrase \"the name stuck\" mean?",["The name continued to be used.","The bread was sticky.","People forgot the name.","The Earl changed his name."],"An idiom meaning the name stayed in use."],["What is the tone of the final sentence?",["light-hearted and amused","angry and critical","sad and regretful","serious and worried"],"\"Not bad for a meal...\" is playful and humorous."]]},{"t":"Plastic Island","p":["In the middle of the North Pacific Ocean, swirling currents have gathered an enormous amount of floating rubbish. It is often called the Great Pacific Garbage Patch, but it is not really an island that you could walk on. Much of it is made of tiny pieces of plastic, some smaller than a grain of rice, spread through the water like pepper in soup.","Plastic does not rot away like wood or paper. Instead, sunlight and waves break it into smaller and smaller pieces called microplastics. These can be swallowed by fish, seabirds and turtles, which may mistake them for food. Sea turtles, for example, sometimes eat floating plastic bags that look like jellyfish.","Cleaning up the patch is extremely difficult because the pieces are so small and so widely spread. Some groups are testing long floating barriers that collect rubbish as the currents push it along. However, most scientists agree that the most important solution is to stop plastic reaching the ocean in the first place.","That means using less single-use plastic, recycling properly and making sure rubbish does not wash into drains and rivers, which carry it out to sea."],"qs":[["Why does the writer say the patch \"is not really an island\"?",["It is mostly scattered pieces of plastic in the water, not solid ground.","It has sunk to the bottom of the ocean.","It is too small to see.","It has already been cleaned up."],"The plastic is spread through the water, not packed into land you could walk on."],["\"spread through the water like pepper in soup\" suggests the plastic is:",["in many tiny pieces spread out widely","in one large heap","spicy and dangerous","easy to scoop out"],"Pepper in soup is scattered in tiny specks."],["Why might a sea turtle eat a plastic bag?",["It can look like a jellyfish.","Turtles enjoy the taste of plastic.","There is no other food in the ocean.","The bag contains fish."],"Paragraph two explains that bags can look like jellyfish."],["According to most scientists, what is the most important solution?",["Stopping plastic from reaching the ocean","Building floating barriers","Moving turtles to safer oceans","Turning the patch into an island"],"Paragraph three says this is \"the most important solution\"."],["Which word best describes the purpose of the final paragraph?",["to suggest what people can do to help","to entertain with a funny story","to describe the ocean currents","to explain what microplastics are"],"It lists actions people can take."]]},{"t":"The Tortoise Who Wouldn't Hurry","p":["Grandpa's tortoise, Winston, was older than Grandpa's house, older than Grandpa's car and, some said, older than Grandpa. He spent his days crossing the back lawn at a speed that made the garden snails look reckless.","Nell, who was nine and in a hurry about everything, found this unbearable. \"Why doesn't he go faster?\" she demanded, crouching beside him. \"He could be at the lettuce by now.\"","Grandpa settled into his deckchair. \"Winston's been getting to the lettuce for eighty years,\" he said. \"He's never missed it yet.\"","Nell watched as Winston paused to sniff a clover flower, turned his ancient head towards the sun and closed his eyes for a long moment, as if he were listening to something only tortoises could hear. Then he took one more slow step.","By the time he reached the lettuce, the afternoon had gone gold and Nell had stopped fidgeting. She had counted three kinds of bee, found a snail shell striped like a lolly and noticed that Grandpa hummed when he was happy.","\"Well,\" said Grandpa, as Winston began to munch. \"Worth the wait?\"","Nell thought about it. \"Yes,\" she said, surprised."],"qs":[["What does the first paragraph suggest about Winston?",["He is extremely old and extremely slow.","He is Grandpa's newest pet.","He is faster than the snails.","He lives inside the house."],"He is described as older than the house and slower than snails."],["Why did Nell find Winston's speed \"unbearable\"?",["She was impatient and liked to rush.","She was worried he was sick.","She wanted to eat the lettuce.","Grandpa told her to hurry him."],"She was \"in a hurry about everything\"."],["What did Grandpa mean when he said Winston had \"never missed it yet\"?",["Going slowly still gets Winston where he needs to be.","Winston has never eaten lettuce before.","Winston will not reach the lettuce today.","Grandpa always carries Winston to the lettuce."],"Winston always gets there in the end, even slowly."],["What did Nell notice while she waited?",["Small details she would normally have missed","That Winston was actually quite fast","That the lettuce had been eaten","That Grandpa was asleep"],"She noticed bees, a striped shell and Grandpa's humming."],["What is the main message of the story?",["Slowing down can help you notice and enjoy things.","Tortoises make better pets than snails.","You should always finish your vegetables.","Old people are always right."],"By slowing down, Nell discovered things and was glad she waited."]]},{"t":"Volcanoes: Mountains of Fire","p":["Deep beneath our feet, the Earth is extremely hot. In places, rock melts into a thick, glowing liquid called magma. Because magma is lighter than the solid rock around it, it slowly rises, collecting in underground chambers.","When the pressure in a chamber becomes too great, the magma forces its way to the surface through cracks. Once it erupts, it is called lava. Some volcanoes ooze runny lava gently, while others explode violently, blasting ash and rock high into the sky. The difference depends largely on how thick the magma is and how much gas is trapped inside it, rather like the difference between opening a bottle of still water and a shaken bottle of fizzy drink.","Volcanoes can be deadly, but they also create. Much of the land on islands such as Hawaii and Iceland was built by lava flows, and volcanic soil is often extremely fertile, which is why farmers have lived near volcanoes for thousands of years.","Australia has no active volcanoes today, but it has plenty of old ones. Many hills in western Victoria and south-eastern South Australia are the remains of volcanoes that last erupted thousands of years ago."],"qs":[["Why does magma rise towards the surface?",["It is lighter than the solid rock around it.","It is pulled up by the sun.","It is pushed by the ocean.","It is heavier than the surrounding rock."],"Paragraph one says magma is lighter than the solid rock."],["What is the difference between magma and lava?",["Magma is underground; lava has reached the surface.","Magma is cold; lava is hot.","Lava is found only in Australia.","There is no difference."],"Once it erupts, magma is called lava."],["Why does the writer compare volcanoes to bottles of water and fizzy drink?",["To explain how trapped gas makes some eruptions explosive","To show that lava is a kind of drink","To describe the colour of lava","To warn readers not to shake bottles"],"The shaken fizzy drink explodes because of gas, like an explosive eruption."],["Which sentence best sums up the third paragraph?",["Volcanoes are destructive but also useful.","Volcanoes only exist on islands.","Farmers should move away from volcanoes.","Hawaii is the largest volcano."],"It says volcanoes can be deadly, but they also create land and fertile soil."],["What does the word \"fertile\" most likely mean in this passage?",["good for growing plants","very dangerous","hot and dry","full of rocks"],"Farmers live near volcanoes because the soil helps crops grow."]]},{"t":"The Missing Trophy","p":["On Monday morning, the gleaming Inter-School Chess Trophy was gone from the glass cabinet in the school foyer. Only a dust-free circle showed where it had stood.","By lunchtime, rumours were flying. Some said a rival school had stolen it. Others blamed the cleaner, or a ghost. Ravi, who had captained the chess team, decided rumours were not good enough. He borrowed a notebook and began asking questions.","The cabinet was locked, and only two people had keys: the principal and Mrs Fontaine, the librarian. The lock had not been forced. The office lady remembered that Mrs Fontaine had stayed late on Friday. And Ravi noticed something else: a small smear of bright blue polish on the cabinet's handle.","He found Mrs Fontaine in the library, surrounded by cloths and tins. On her desk sat the trophy, sparkling like new, and on her fingers were streaks of the same blue polish.","\"I was going to put it back before anyone noticed,\" she said, going pink. \"It was looking so tarnished, and the photographer comes on Tuesday.\"","Ravi closed his notebook. \"Case solved,\" he said, \"but next time, maybe leave a note.\""],"qs":[["Why did Ravi start investigating?",["He wanted the truth instead of rumours.","The principal asked him to.","He thought he would be blamed.","He wanted to win the trophy again."],"He \"decided rumours were not good enough\"."],["What does the \"dust-free circle\" tell the reader?",["The trophy had been there until recently.","The cabinet was never cleaned.","The trophy was very small.","Someone had broken the glass."],"Dust had not settled where the trophy stood, so it was taken recently."],["Which clue pointed most clearly to Mrs Fontaine?",["The blue polish on the handle","The rumour about a ghost","The rival school","The chess team captain"],"The same blue polish was later found on her fingers."],["Why did Mrs Fontaine take the trophy?",["To clean it before the photographer came","To keep it for herself","To give it to another school","To play a joke on Ravi"],"She said it was tarnished and the photographer was coming on Tuesday."],["\"going pink\" suggests Mrs Fontaine felt:",["embarrassed","angry","ill","proud"],"Blushing usually shows embarrassment."]]},{"t":"Sleep: Why We Need It","p":["You spend about a third of your life asleep. That might sound like a waste of time, but scientists now know that sleep is one of the busiest and most important things your body does.","While you sleep, your brain sorts through the day's experiences, deciding what to keep and what to throw away. This is one reason why a good night's sleep before a test can help you remember what you have studied. Your body also uses sleep to repair muscles, fight germs and release growth hormones, which is especially important for children.","Doctors recommend that children aged six to twelve get between nine and twelve hours of sleep each night. Yet many children get far less. Screens are one reason: the bright light from phones and tablets can trick the brain into thinking it is still daytime, making it harder to fall asleep.","Experts suggest keeping a regular bedtime, switching off screens an hour before bed, and keeping bedrooms dark and cool. It may be tempting to stay up late, but a tired brain is like a phone on low battery: it still works, just not very well."],"qs":[["Why might sleep seem like \"a waste of time\" at first?",["It takes up a large part of our lives.","It makes people tired.","It is bad for the brain.","Scientists do not understand it."],"We spend about a third of our lives asleep."],["According to the passage, how can sleep help before a test?",["It helps the brain keep important memories.","It makes the test shorter.","It gives you more time to study.","It stops you feeling nervous."],"The brain sorts experiences and helps you remember what you studied."],["How do screens make it harder to fall asleep?",["Their bright light makes the brain think it is still day.","They are too loud.","They make the room too hot.","They use too much electricity."],"Paragraph three explains the light tricks the brain."],["\"a tired brain is like a phone on low battery\" means a tired brain:",["still works but not as well as it should","stops working completely","needs to be plugged in","works faster than normal"],"The comparison says \"it still works, just not very well\"."],["Which is the best title for this passage?",["The Hidden Work of Sleep","How to Stay Awake","The History of Beds","Why Screens Are Useful"],"The passage explains all the important things sleep does."]]},{"t":"The Boy Who Painted Birds","p":["When Tomasz arrived from Poland, he knew only four English words: yes, no, thank you and toilet. For the first weeks at his new school, he sat at the back of the class and said nothing at all.","At lunchtime he sat alone under the jacaranda tree with a small sketchbook. He did not eat much. Mostly, he drew.","One day a magpie landed near his feet and cocked its head at his sandwich. Tomasz held very still and drew it: the white collar, the sharp beak, the clever, curious eye. When he looked up, Zoe from his class was standing behind him, staring at the page.","\"That's amazing,\" she said. Tomasz did not understand the words, but he understood her face.","The next day she brought a book of Australian birds and pointed at the pictures. \"Kookaburra,\" she said. \"Rosella. Galah.\" Tomasz repeated each name carefully, and drew each bird on a fresh page. By the end of the term his sketchbook held forty-three birds, and he could name every one of them in English.","He still did not say much in class. But under the jacaranda tree, there were always at least two people now, and sometimes more."],"qs":[["Why did Tomasz not speak at the start?",["He knew very little English.","He was not allowed to talk.","He was angry with his classmates.","He had a sore throat."],"He knew only four English words when he arrived."],["\"he understood her face\" means that:",["he could tell from her expression that she liked his drawing","he could read her lips perfectly","he recognised her from Poland","he wanted to draw her face"],"He did not know the words, but her expression showed admiration."],["How did Zoe help Tomasz?",["She taught him bird names using a book.","She translated everything into Polish.","She drew pictures for him.","She told the teacher to move his seat."],"She brought a bird book and taught him the names."],["What does the ending suggest has changed for Tomasz?",["He has made friends.","He has become a famous artist.","He has stopped drawing.","He now talks a lot in class."],"There were now \"at least two people\" under the tree, showing friendship."],["What is the main theme of the story?",["Friendship can grow through shared interests.","Magpies are dangerous birds.","Moving to a new country is easy.","Drawing is more important than school work."],"Their friendship grows through drawing and birds."]]},{"t":"The Dingo Fence","p":["Stretching more than five thousand kilometres across Queensland, New South Wales and South Australia, the Dingo Fence is one of the longest fences in the world. It was built in stages, mostly in the late 1800s and early 1900s, to keep dingoes away from the sheep-farming lands of the south-east.","The fence is mostly made of wire mesh about 1.8 metres high, and in some sections it is buried deep enough to stop animals digging underneath. Teams of workers drive along it constantly, repairing damage caused by floods, fallen trees, wombats, kangaroos and even emus.","The fence has helped protect sheep, but it has also had unexpected effects. With fewer dingoes inside the fence, kangaroo numbers have grown much larger there, because dingoes normally hunt them. Some scientists also believe the plants and soil differ on each side of the fence, showing how removing one predator can change an entire ecosystem.","People continue to debate the fence's future. Farmers argue it is essential for their living, while some ecologists suggest dingoes play an important role in keeping the natural environment in balance."],"qs":[["What was the main reason the Dingo Fence was built?",["To protect sheep from dingoes","To keep kangaroos out of cities","To mark the border between states","To stop floods"],"Paragraph one says it keeps dingoes away from sheep-farming lands."],["Why is part of the fence buried underground?",["To stop animals digging underneath","To protect it from floods","To make it taller","To hide it from tourists"],"Paragraph two explains this."],["Why have kangaroo numbers grown inside the fence?",["There are fewer dingoes to hunt them.","Farmers feed the kangaroos.","Kangaroos cannot jump the fence.","The grass is taller inside the fence."],"Dingoes normally hunt kangaroos, so fewer dingoes means more kangaroos."],["What does the word \"ecosystem\" most likely mean?",["all the living things in an area and how they affect each other","a type of fence","a sheep farm","a group of scientists"],"The paragraph shows how one change affects plants, soil and animals together."],["How does the final paragraph present the issue?",["It describes more than one point of view.","It says the fence should be removed.","It says dingoes are dangerous pests.","It avoids mentioning any disagreement."],"It gives the views of both farmers and ecologists."]]},{"t":"Stage Fright","p":["Ten minutes before the concert, Isla's hands were so cold she could barely feel the violin strings. Out in the hall, three hundred chairs scraped and creaked as the audience sat down. Somewhere among them were her parents, her little brother and, worst of all, her entire class.","She had practised the solo every day for two months. She could play it in her sleep. She had played it in her sleep, actually, in a nightmare where all her strings snapped at once.","\"Everyone gets nervous,\" said Mr Petrov, the music teacher, noticing her face. \"Do you know what nerves are? They are your body getting ready to do something important. Your heart beats faster to give you energy. That is not a bad thing.\"","Isla wasn't sure she believed him. But when she walked onto the stage and the lights hit her, she took one slow breath, the way he had shown her, and lifted her bow.","The first note wobbled. The second was steadier. By the fourth, she had forgotten about the chairs and the faces, and there was only the music, pouring out of her like water from a tap that had been turned on at last."],"qs":[["What detail shows Isla's nervousness at the start?",["Her hands were so cold she could barely feel the strings.","She had practised every day.","Her parents were in the audience.","Mr Petrov was the music teacher."],"Cold hands are a physical sign of nerves."],["Why does Isla think her class being there is \"worst of all\"?",["She fears making a mistake in front of people she sees every day.","She does not like her classmates.","Her class is too noisy.","Her class has not paid for tickets."],"Performing in front of peers can feel the most embarrassing."],["What is Mr Petrov's main point about nerves?",["They are a natural way the body prepares for something important.","They mean you have not practised enough.","They always make you play badly.","Only beginners feel them."],"He says nerves are your body getting ready."],["How does the writer show Isla growing more confident?",["Each note becomes steadier than the one before.","She walks off the stage.","She asks Mr Petrov to play instead.","She waves to her family."],"The first note wobbled, the second was steadier, and by the fourth she was lost in the music."],["\"like water from a tap that had been turned on at last\" suggests the music:",["flowed freely after being held back","was very quiet","sounded like dripping water","was full of mistakes"],"The simile shows the music finally flowing easily."]]},{"t":"How a Bill Becomes Law","p":["In Australia, new national laws are made by the Parliament in Canberra. Before an idea becomes a law, it is written as a document called a bill.","Most bills begin in the House of Representatives. Members of Parliament debate the bill, arguing for and against it and sometimes suggesting changes, called amendments. Then they vote. If a majority agrees, the bill passes to the second chamber, the Senate.","The Senate also debates and votes on the bill. Senators can pass it, reject it, or suggest amendments. If they make changes, the bill must go back to the House of Representatives, which must agree to the same wording. A bill cannot become law until both chambers have agreed to exactly the same text.","Finally, the bill is sent to the Governor-General, who represents the King in Australia. When the Governor-General signs it, a step known as royal assent, the bill becomes an Act of Parliament, which is the official name for a law.","This process can take days, months or even years. It is slow on purpose: it gives time for careful thought and for many different voices to be heard."],"qs":[["What is a bill?",["A written proposal for a new law","A law that has been signed","A member of the Senate","A vote in Parliament"],"Paragraph one says an idea is written as a document called a bill."],["What happens if the Senate changes a bill?",["It goes back to the House of Representatives to agree to the changes.","It becomes law straight away.","It is thrown away.","The Governor-General rewrites it."],"Both chambers must agree to the same text."],["What is \"royal assent\"?",["The Governor-General signing the bill","A vote in the Senate","An amendment to a bill","A speech by a Member of Parliament"],"Paragraph four defines it."],["Which is the correct order of steps for most bills?",["House of Representatives, Senate, Governor-General","Senate, Governor-General, House of Representatives","Governor-General, House of Representatives, Senate","Senate, House of Representatives, King"],"The passage describes this order."],["According to the writer, why is the process slow \"on purpose\"?",["So that laws are carefully considered","Because politicians are lazy","Because Canberra is far away","So that the King can visit"],"It gives time for careful thought and many voices."]]},{"t":"The Great Barrier Reef","p":["Stretching for more than two thousand kilometres along the coast of Queensland, the Great Barrier Reef is the largest coral reef system on Earth. It is so big that it can be seen from space.","Although coral looks like colourful rock or plants, it is actually made of tiny animals called polyps. Each polyp builds a hard skeleton of limestone around itself. Over thousands of years, billions of these skeletons have piled up to create the reef.","Most corals get their bright colours and much of their food from tiny algae living inside their bodies. When the ocean becomes too warm, the stressed corals push out these algae. Without them, the coral turns white, which is called coral bleaching. If the water cools again soon enough, the coral can recover, but if the heat lasts too long, it may die.","The reef is home to thousands of species, including fish, turtles, sharks, dugongs and giant clams. Protecting it means reducing pollution, controlling pests such as the crown-of-thorns starfish, and tackling climate change, which is warming the oceans."],"qs":[["What is coral actually made of?",["Tiny animals called polyps","Plants that grow on rocks","Sand pressed together","Seaweed"],"Paragraph two explains coral is made of polyps."],["How was the reef built?",["By polyp skeletons piling up over thousands of years","By volcanoes under the sea","By people building walls","By sand washed from beaches"],"Billions of skeletons piled up to create the reef."],["What causes coral bleaching?",["Water that is too warm makes corals push out their algae.","Too much sunlight on the sand.","Fish eating the colour off the coral.","The water becoming too cold."],"Paragraph three explains bleaching."],["Can bleached coral recover?",["Yes, if the water cools again soon enough.","No, never.","Only if it is painted.","Only if the starfish are removed."],"The passage says it can recover if the water cools soon enough."],["Which of these is NOT mentioned as a way to protect the reef?",["Building more beaches","Reducing pollution","Controlling crown-of-thorns starfish","Tackling climate change"],"Building beaches is not mentioned."]]},{"t":"The Kite","p":["Dad had built the kite from bamboo, brown paper and a roll of tape, and it looked it. One wing sagged. The tail was made from Mum's old stockings. Next to the sleek, bright nylon kites soaring over the beach, it looked like a crumpled shopping bag.","Sami held it behind his back. \"Maybe we should just go home,\" he muttered.","\"Nonsense,\" said Dad. \"A kite is not judged by how it looks on the ground.\" He licked a finger and held it up. \"Wind's from the south. Run that way, and don't look back.\"","Sami ran. The kite bounced along the sand, dragged, skidded, and then, with a sudden tug that nearly pulled the string from his fingers, it lifted. Up it went, past the lifeguard tower, past the gulls, past the smart nylon kites, climbing and climbing until it was only a brown speck against the blue.","Sami let out more string, then more. A little girl tugged her mother's sleeve and pointed. \"Look how high that one is!\"","Sami grinned so widely his cheeks ached. He did not say anything about shopping bags ever again."],"qs":[["Why did Sami want to go home at first?",["He was embarrassed by how the kite looked.","The wind was too strong.","He was hungry.","Dad was feeling unwell."],"He hid the kite, which looked shabby next to the others."],["What did Dad mean by \"A kite is not judged by how it looks on the ground\"?",["What matters is how well it flies.","Kites should never touch the ground.","Ground kites are the best kind.","He was not proud of the kite."],"He means performance matters more than appearance."],["Why did Dad lick his finger and hold it up?",["To find out which way the wind was blowing","To clean it","To taste the salt","To signal to Sami"],"He then says the wind is from the south."],["What does the little girl's comment show?",["Others were impressed by Sami's kite.","She wanted to buy the kite.","She was scared of kites.","The kite was about to fall."],"She pointed out how high it flew."],["Which saying best fits the message of this story?",["Don't judge a book by its cover.","The early bird catches the worm.","Too many cooks spoil the broth.","Look before you leap."],"The kite looked poor but flew brilliantly."]]},{"t":"The Platypus Puzzle","p":["When the first platypus specimen was sent from Australia to England in 1799, some scientists thought it was a hoax. With its duck-like bill, beaver-like tail, webbed feet and furry body, it looked like several animals stitched together. One scientist reportedly took a pair of scissors to the skin, searching for stitches.","The platypus turned out to be even stranger than it looked. It is one of only a handful of mammals that lay eggs. The females feed their young with milk, but they have no nipples; instead, the milk seeps out through patches of skin.","Males have a sharp spur on each back leg that can deliver a painful venom. And the bill is not hard like a duck's but soft and rubbery, covered in special sensors that can detect the tiny electrical signals given off by the muscles of shrimp, worms and insect larvae. This lets the platypus hunt underwater with its eyes, ears and nostrils closed.","Today the platypus is one of Australia's most loved animals, though it is shy and rarely seen in the wild. It needs clean, healthy rivers to survive."],"qs":[["Why did some scientists think the first platypus was a hoax?",["It looked like parts of different animals joined together.","It arrived without a head.","It was a painting, not a real animal.","It was too small to be real."],"Its mix of features made it look stitched together."],["Why did a scientist look for stitches?",["He suspected someone had sewn different animals together.","The skin had been damaged in the post.","He wanted to repair it.","He was a tailor."],"He thought it might be a fake."],["What makes the platypus unusual among mammals?",["It lays eggs.","It has fur.","It feeds its young milk.","It lives near water."],"Only a handful of mammals lay eggs."],["How does the platypus find food underwater?",["It detects electrical signals with its bill.","It uses its excellent eyesight.","It listens for the sound of shrimp.","It smells the water."],"Its bill has sensors for tiny electrical signals, and its eyes, ears and nostrils are closed."],["What does the final sentence suggest about protecting platypuses?",["Keeping rivers healthy is important.","They should be moved to zoos.","They are not in any danger.","They should be kept in England."],"It says they need clean, healthy rivers to survive."]]},{"t":"A Day Without Electricity","p":["At 6:42 on Saturday morning, the power went out across the whole of Wattle Street. The fridge shuddered and fell silent. The Wi-Fi light blinked off. My little sister Hana, halfway through a cartoon, stared at the dark television as if it had personally betrayed her.","\"It'll be back in an hour,\" said Mum. It was not back in an hour. A truck had crashed into a power pole two streets away, and the repair crew said it would take all day.","At first we moped around the house, flicking light switches out of habit. Then Dad found a pack of cards. We played Go Fish, then Snap, then a game Grandma had taught Dad that none of us knew the rules of, so we invented new ones. For lunch we ate everything in the fridge before it could spoil, which meant ice-cream, pickles and cold sausages, sometimes on the same plate.","In the afternoon, the whole street drifted outside. The neighbours brought out a cricket set. Old Mr Kavanagh, who I had never heard say more than \"morning\", turned out to be a brilliant spin bowler.","When the lights flickered back on at six, everyone cheered. But I noticed that nobody went inside for quite a long time."],"qs":[["What does the writer suggest about Hana by saying the television had \"personally betrayed her\"?",["She was upset and felt let down, in a funny, exaggerated way.","The television had actually hurt her.","She had broken the television.","She did not like cartoons."],"It is a humorous exaggeration of her disappointment."],["Why did the power stay off all day?",["A truck had crashed into a power pole.","There was a storm.","Mum forgot to pay the bill.","The fridge had broken."],"Paragraph two explains the cause."],["Why did the family eat ice-cream, pickles and sausages for lunch?",["The food would spoil without a working fridge.","It was Hana's birthday.","They had no other food in the house.","Grandma had suggested it."],"They ate everything \"before it could spoil\"."],["What surprised the narrator about Mr Kavanagh?",["He was a skilled cricket player.","He owned the power company.","He could not speak English.","He was the narrator's grandfather."],"He \"turned out to be a brilliant spin bowler\"."],["What does the final sentence suggest?",["People had enjoyed spending time together without electricity.","People were scared to go back inside.","The power went off again.","The neighbours did not like each other."],"Nobody rushed back inside, suggesting they valued the time together."]]},{"t":"Why the Sea Is Salty","p":["If you have ever swallowed a mouthful of seawater, you know it tastes very salty. But rivers and lakes are mostly fresh. So where does the ocean's salt come from?","Much of it comes from rocks on land. When rain falls, it is very slightly acidic, and as it runs over rocks and soil, it slowly dissolves tiny amounts of minerals, including salt. Rivers carry these minerals to the sea.","Then the sun does its work. Heat evaporates water from the ocean's surface, turning it into water vapour that rises to form clouds. But the salt does not evaporate; it stays behind in the sea. Over millions of years, this cycle of rivers bringing salt in and evaporation taking fresh water out has made the oceans steadily saltier.","Some salt also enters the ocean from openings in the sea floor called hydrothermal vents, where hot, mineral-rich water gushes out from inside the Earth.","On average, each litre of seawater contains about thirty-five grams of salt. That is roughly seven teaspoons, which is why drinking seawater makes you thirstier, not less thirsty."],"qs":[["What question does the first paragraph ask?",["Where does the ocean's salt come from?","Why do rivers flow into the sea?","How deep is the ocean?","Why does rain fall?"],"The paragraph ends with this question."],["How does salt get from rocks into rivers?",["Rain slowly dissolves minerals from rocks and soil.","Fish carry it.","Wind blows it from the sea.","People throw salt into rivers."],"Paragraph two explains this."],["Why does the ocean become saltier over time?",["Water evaporates but the salt stays behind.","The sun makes more salt.","Clouds rain salt into the sea.","Fish produce salt."],"Evaporation removes water but leaves the salt."],["What are hydrothermal vents?",["Openings in the sea floor where hot, mineral-rich water comes out","Clouds that form above the sea","Rivers that carry salt","Machines that remove salt"],"Paragraph four defines them."],["Why does drinking seawater make you thirstier?",["It contains a lot of salt.","It is too cold.","It contains too much fresh water.","It is too warm."],"The high salt content makes you thirstier."]]},{"t":"The Last Day of Summer","p":["The pool closed at five. At four fifty-five, Jack and Priyanka were still floating on their backs in the deep end, staring at a sky so blue it looked painted.","\"Tomorrow,\" said Priyanka, \"we'll be sitting in a classroom that smells like pencil shavings.\"","\"Don't,\" groaned Jack.","They had spent the whole holiday together: building a fort in the gully behind Jack's house, catching yabbies in the dam with bits of bacon on string, sleeping in a tent in the backyard and waking up covered in mosquito bites. But tomorrow Priyanka was starting at the high school across town, while Jack had one more year of primary school. It was the first time in six years they would not be in the same school.","The lifeguard blew her whistle. Neither of them moved.","\"We'll still see each other on weekends,\" said Jack.","\"Obviously,\" said Priyanka. But her voice was very small, and for a long time they just floated, side by side, until the lifeguard blew her whistle again, much louder."],"qs":[["Why does Jack groan \"Don't\"?",["He does not want to think about going back to school.","He has water in his ears.","He wants Priyanka to stop splashing.","He is angry with the lifeguard."],"Priyanka's comment reminds him that the holiday is ending."],["What is the main reason this day feels sad for the friends?",["They will be going to different schools.","The pool is closing forever.","Jack is moving to another country.","They had a fight."],"Priyanka is starting high school while Jack stays at primary school."],["What does \"her voice was very small\" suggest?",["Priyanka is sadder than she wants to admit.","Priyanka has a sore throat.","Priyanka is whispering a secret.","Priyanka is far away."],"A small voice suggests sadness despite her confident word \"Obviously\"."],["Why do Jack and Priyanka not move when the whistle blows?",["They want to make their last moments of summer last.","They did not hear it.","They cannot swim.","They are asleep."],"They are reluctant to let the day end."],["What mood does the writer create at the end?",["bittersweet","terrifying","hilarious","angry"],"Happy memories mixed with sadness create a bittersweet mood."]]},{"t":"Recycling Right","p":["Most Australian households now have a yellow-lidded recycling bin. But putting the wrong things in it can cause big problems. When items that cannot be recycled get mixed in, they can jam sorting machines, contaminate paper and cardboard, and even cause whole truckloads of recycling to be sent to landfill.","So what belongs in the yellow bin? In most council areas, the answer includes clean paper and cardboard, glass bottles and jars, steel and aluminium cans, and hard plastic containers such as milk bottles and yoghurt tubs. Items should be empty and loose, not bagged, because machines cannot open plastic bags.","Some common items cause the most trouble. Soft plastics, such as chip packets and bread bags, tangle in the machinery. Broken drinking glasses and ceramic mugs melt at different temperatures from bottle glass and can ruin a batch. Greasy pizza boxes contaminate clean cardboard.","Rules can vary slightly between councils, so it is always worth checking your local council's website. As one recycling worker put it, \"When in doubt, leave it out.\""],"qs":[["What can happen when the wrong items go in the recycling bin?",["Whole truckloads may be sent to landfill.","The bin changes colour.","The council gives you a new bin.","The items are sent back to your house."],"Paragraph one lists this as a possible problem."],["Why should recycling not be put in plastic bags?",["The machines cannot open them.","The bags are too heavy.","The bags are too expensive.","The bags attract animals."],"Paragraph two explains this."],["Why do broken drinking glasses cause problems?",["They melt at a different temperature from bottle glass.","They are too sharp for the workers.","They are too heavy.","They are made of plastic."],"Paragraph three explains this."],["What does \"When in doubt, leave it out\" mean?",["If you are not sure an item is recyclable, put it in the general rubbish.","Leave your bin outside all the time.","Always recycle everything.","Never use the recycling bin."],"It advises not to risk contaminating the recycling."],["This text is best described as:",["an informative text with advice","a narrative","a poem","a newspaper interview"],"It gives facts and practical advice."]]},{"t":"The Thief in the Garden","p":["Every morning, another strawberry was gone. Not eaten on the plant, not nibbled, simply gone, leaving an empty green cap on the stem.","Grandma blamed the birds, so we put up a net. The next morning, another strawberry had vanished, and the net had not been touched.","\"Rats,\" said Grandpa. So we sprinkled flour around the strawberry patch to catch its footprints. The next morning, there was a strawberry cap on the path, and in the flour were small, neat prints, far too tiny for a rat. They looked like the hands of a doll.","I stayed up that night with a torch, watching from the kitchen window. At about eleven, a little shape crept along the fence, sniffing. It was no bigger than a mouse, with enormous, shining eyes and a long tail that curled around the fence wire. It slipped under the net, tugged a strawberry free with its tiny paws and scurried back along the fence, hugging the berry like a treasure.","In the morning I looked it up. It was an eastern pygmy possum, one of the smallest marsupials in the world, and a threatened species in our state.","Grandma folded her arms. Then she sighed. \"Well,\" she said, \"I suppose we'd better plant more strawberries.\""],"qs":[["Why did the family rule out birds as the thieves?",["The net was untouched, yet strawberries still disappeared.","They saw no birds in the garden.","Birds do not eat strawberries.","Grandma loved birds."],"The net had not been touched, but another strawberry vanished."],["What was the purpose of the flour?",["To show the footprints of the thief","To make the strawberries sweeter","To stop the plants from growing","To make a cake"],"They wanted to catch its footprints."],["What did the prints in the flour tell the family?",["The thief was smaller than a rat.","The thief was a bird.","The thief was a person.","There were several thieves."],"The prints were \"far too tiny for a rat\"."],["Why did Grandma decide to plant more strawberries?",["She wanted to share them with the rare animal.","She wanted to sell them.","The old plants had died.","She wanted to trap the thief."],"After learning the animal was threatened, she chose to share rather than stop it."],["Which word best describes the narrator?",["curious","lazy","cruel","careless"],"The narrator stays up to watch and then researches the animal."]]},{"t":"The First Flight","p":["On 17 December 1903, on a windy beach at Kitty Hawk in North Carolina, USA, a machine made of wood, wire and cloth rose into the air under its own power. It flew for twelve seconds and travelled about thirty-seven metres, a shorter distance than the wingspan of many modern passenger jets. But it was the first powered, controlled flight of an aeroplane, and it changed the world.","The pilot was Orville Wright, and the plane had been designed and built by Orville and his brother Wilbur. The brothers ran a bicycle shop in Ohio, and their experience with bicycles helped them understand balance and control, which they realised was the key problem of flight.","Before building their aeroplane, the Wrights spent years experimenting with kites and gliders. They even built their own small wind tunnel to test hundreds of different wing shapes. When they could not find an engine light enough, they built one of those too, with help from their mechanic, Charlie Taylor.","That first day, the brothers made four flights, taking turns as pilot. The longest, flown by Wilbur, lasted fifty-nine seconds."],"qs":[["Why was the flight at Kitty Hawk important?",["It was the first powered, controlled aeroplane flight.","It was the longest flight ever made.","It carried the first passengers.","It was the first flight across the ocean."],"Paragraph one explains its significance."],["Why does the writer compare the flight distance to a jet's wingspan?",["To show how short the first flight was","To show how big the Wrights' plane was","To explain how jets fly","To show the Wrights built jets"],"The comparison highlights how short 37 metres is."],["How did running a bicycle shop help the Wright brothers?",["It helped them understand balance and control.","It gave them wheels for the plane.","It paid for a trip to North Carolina.","It taught them how to build engines."],"Paragraph two explains this."],["Why did the Wrights build their own engine?",["They could not find one that was light enough.","Engines were illegal.","They wanted to sell engines.","Charlie Taylor refused to help."],"Paragraph three says they could not find one light enough."],["Which word best describes the Wright brothers' approach?",["patient and methodical","careless and rushed","lucky and lazy","secretive and dishonest"],"They spent years testing kites, gliders and hundreds of wing shapes."]]},{"t":"Grandmother's Hands","p":["My grandmother's hands are the first thing I remember. Brown and creased like the paper bags she saved in the kitchen drawer, they were never still.","They kneaded dough on Sunday mornings, thumping and folding it until it grew soft and springy. They pulled weeds from between the tomato plants and pressed seeds into the soil, one by one, as if each were a secret. They plaited my hair so tightly my eyes watered, and then smoothed it down with a touch so gentle I forgot to complain.","When I was sad, they did not pat or fuss. They simply held mine, warm and dry and steady, until the sadness had somewhere else to go.","Now her hands are thin, and they shake a little when she lifts her teacup. She cannot knead dough any more. So on Sundays, I do it, and she sits at the table and watches, and sometimes she reaches over and presses her fingers into the dough beside mine, just to feel it rise."],"qs":[["\"creased like the paper bags she saved\" is an example of:",["a simile","a metaphor","personification","onomatopoeia"],"It uses \"like\" to compare her hands to paper bags."],["What does \"they were never still\" suggest about the grandmother?",["She was always busy doing things.","She was always nervous.","She had an illness.","She could not sleep."],"The following paragraph lists all the jobs her hands did."],["How did the grandmother comfort the narrator when she was sad?",["She held her hand quietly and steadily.","She told her funny stories.","She baked her a cake.","She told her not to cry."],"Her hands \"simply held mine\"."],["What has changed by the final paragraph?",["The grandmother is older and weaker, and the narrator now does the kneading.","The grandmother has moved away.","The narrator has stopped baking.","The grandmother is learning to bake."],"Her hands are thin and shaky, so the narrator kneads the dough."],["What feeling does the writer most want to express?",["deep love and respect for her grandmother","anger about growing old","boredom with baking","fear of her grandmother"],"The whole piece lovingly describes her grandmother."]]},{"t":"Octopus Escape Artists","p":["Aquarium keepers around the world share stories about octopuses that refuse to stay put. Octopuses have no bones, so they can squeeze through any gap larger than their hard beak. A large octopus can slip through a hole about the size of a coin.","They are also remarkably clever. In laboratory tests, octopuses have learned to unscrew jar lids to reach food inside, and some can tell individual people apart. One famous octopus named Inky escaped from his tank at an aquarium in New Zealand in 2016. Keepers believe he squeezed through a small gap at the top of the tank, crossed the floor at night and slid down a narrow drainpipe that led to the sea.","An octopus's intelligence is spread through its body in an unusual way. Much of its nervous system is found not in its head but in its eight arms, which can taste, touch and even react on their own.","Octopuses have short lives, often only one or two years. Some scientists wonder what these animals might achieve if they lived as long as humans do."],"qs":[["Why can octopuses squeeze through such small gaps?",["They have no bones.","They can shrink their beak.","They are very slippery.","They are very small."],"The first paragraph explains they have no bones; only the beak is hard."],["Which detail shows that octopuses are clever?",["They can unscrew jar lids.","They have eight arms.","They live for one or two years.","They have a hard beak."],"Solving a problem like a jar lid shows intelligence."],["How did keepers think Inky reached the sea?",["Through a drainpipe","By being carried by a visitor","Through a tunnel he dug","By hiding in a bucket"],"He slid down a narrow drainpipe that led to the sea."],["What is unusual about an octopus's nervous system?",["Much of it is in its arms.","It is all in its head.","It has two brains in its tail.","It has no nervous system."],"Paragraph three explains this."],["What does the final paragraph make the reader wonder?",["What octopuses could achieve with longer lives","Why octopuses live in aquariums","How to catch an octopus","Why octopuses have eight arms"],"It raises the idea of octopuses living as long as humans."]]},{"t":"The Midnight Feast","p":["The plan was perfect. At exactly midnight, the five girls in Dormitory Four would sneak down to the kitchen, collect the chocolate cake left over from the school fete, and eat it under Beatrix's bed by torchlight.","Nothing went to plan. Beatrix's alarm clock went off at eleven instead of twelve, with a ring so loud it could have woken the dead. Clementine trod on a creaky floorboard, then another, then a sleeping cat, which yowled and fled up the stairs. And when they finally reached the kitchen, they found the cake tin already open and empty, apart from a few crumbs and a handwritten note.","Clementine held it under the torch. In neat, familiar handwriting, it said: \"Delicious. Thank you, girls. Bed. Now. - Mrs Pemberton.\"","The five girls looked at each other in horror. Then, very slowly, Beatrix began to giggle. Then Clementine. Within seconds all five of them were clutching their stomachs and shaking with silent laughter, tears streaming down their faces.","They were back in bed by quarter past eleven, hungry, but happier than any cake could have made them."],"qs":[["What was the girls' plan?",["To eat leftover cake secretly at midnight","To play a trick on Mrs Pemberton","To bake a cake for the fete","To catch a cat"],"The first paragraph describes the plan."],["\"a ring so loud it could have woken the dead\" is an example of:",["hyperbole (exaggeration)","a simile","alliteration","onomatopoeia"],"It is an exaggeration for effect."],["What does the note reveal?",["Mrs Pemberton knew about the plan and ate the cake herself.","The cat ate the cake.","Beatrix had already eaten the cake.","The cake was hidden somewhere else."],"She thanked them for the \"delicious\" cake and ordered them to bed."],["Why were the girls \"happier than any cake could have made them\"?",["They shared a funny moment together.","They found more cake later.","They were not punished.","They wanted to go to bed."],"Laughing together made them happier than the cake would have."],["What is the tone of this story?",["humorous","frightening","sad","serious"],"The mishaps and the note are funny."]]},{"t":"Uluru","p":["Rising about 348 metres above the flat red plains of central Australia, Uluru is one of the most recognisable landmarks in the world. It is a huge sandstone rock formation, and much more of it lies hidden underground, possibly several kilometres deep.","Uluru changes colour throughout the day. At sunrise and sunset, when the sun's light passes through more of the atmosphere, the rock can glow deep orange and fiery red. After rain, it can look almost silver as water streams down its sides.","For the Anangu, the Aboriginal traditional owners of the land, Uluru is not simply a rock. It is a deeply sacred place, connected to ancestral stories and laws that have been passed down for tens of thousands of years. Many features of the rock, such as caves, waterholes and marks on its surface, are linked to these stories.","In 1985, ownership of the land was formally handed back to the Anangu, who now manage the national park together with the Australian government. Out of respect for the Anangu's wishes and culture, climbing Uluru was permanently banned in October 2019. Visitors are instead invited to walk around its base and learn about its significance."],"qs":[["What does the first paragraph suggest about Uluru's size?",["It is even bigger than it looks, because much of it is underground.","It is smaller than most people think.","It is the tallest mountain in Australia.","It is sinking into the ground."],"Much more of it lies hidden underground."],["Why does Uluru glow red at sunrise and sunset?",["The sun's light passes through more of the atmosphere.","It is heated by the sun.","People shine lights on it.","Rain changes its colour."],"Paragraph two explains this."],["What does \"Uluru is not simply a rock\" mean in the third paragraph?",["It has deep cultural and spiritual meaning for the Anangu.","It is made of metal.","It is actually a mountain range.","It is a building."],"It is a sacred place connected to stories and law."],["Why was climbing Uluru banned?",["Out of respect for the Anangu's wishes and culture","Because the rock was crumbling","Because it was too hot","Because there were too many snakes"],"The last paragraph states the reason."],["What happened in 1985?",["Ownership of the land was handed back to the Anangu.","Climbing was banned.","Uluru was discovered.","The national park was closed."],"The last paragraph gives this date."]]},{"t":"The Robot Who Wanted to Dance","p":["Unit 7 had been built to stack boxes. It did its job well. Every day it lifted boxes from the conveyor belt and placed them in perfect towers, never dropping one, never making a mistake.","But every evening, when the factory emptied, the cleaner, Mrs Obi, switched on a small radio and swept the floor in time to the music. She swayed. She twirled. Sometimes she spun the broom around like a dance partner.","Unit 7 watched. Its sensors recorded every movement. Its programs had no instructions for what it was feeling, so it filed the feeling under ERROR: UNKNOWN.","One night, when the radio played a particularly bouncy song, Unit 7 lifted one metal arm. Then the other. It rotated its body forty-five degrees to the left, then to the right. It was not graceful. A box fell off the top of a tower.","Mrs Obi turned around. Unit 7 froze, expecting to be switched off.","Instead, Mrs Obi laughed, a big warm laugh, and held out her hand. \"Not like that,\" she said. \"Like this.\"","The next morning, the engineers found the boxes stacked as perfectly as ever. They never noticed that one of Unit 7's error messages had been quietly renamed JOY."],"qs":[["What was Unit 7 designed to do?",["Stack boxes","Clean the factory","Play music","Teach dancing"],"The first sentence tells us."],["Why did Unit 7 file its feeling under \"ERROR: UNKNOWN\"?",["It had no program to explain what it was feeling.","It was broken.","It did not like the music.","Mrs Obi told it to."],"Its programs had no instructions for the feeling."],["Why did Unit 7 freeze when Mrs Obi turned around?",["It was afraid it would be switched off.","It had run out of power.","The song had ended.","It wanted to surprise her."],"It was \"expecting to be switched off\"."],["How does Mrs Obi respond to the dancing robot?",["She kindly offers to teach it.","She reports it to the engineers.","She turns off the radio.","She runs away."],"She laughs warmly and holds out her hand."],["What does renaming the error message \"JOY\" show?",["Unit 7 has understood the feeling it had.","The engineers fixed the robot.","The robot has stopped working.","Mrs Obi reprogrammed the robot."],"It now recognises the feeling as joy."]]},{"t":"Camels in Australia","p":["Camels are not native to Australia, yet today the country is thought to have the largest population of wild camels in the world.","In the 1800s, explorers and settlers needed a way to move goods across the dry interior. Horses and bullocks struggled in the desert heat, but camels could travel long distances with little water and carry heavy loads. Thousands of camels were imported, mainly from India and Afghanistan, along with the skilled cameleers who handled them. These cameleers helped supply remote towns and build important projects, such as the Overland Telegraph Line.","In the early 1900s, trucks and railways replaced camel trains. Many camels were no longer needed and were released into the wild. With plenty of space and few predators, their numbers grew rapidly.","Today, wild camels cause problems in some areas. They damage fences, drink from and foul precious waterholes, and eat plants that native animals depend on. Governments and Aboriginal communities manage their numbers, and some camels are captured and sold, including to countries in the Middle East.","The famous train that runs between Adelaide and Darwin is named the Ghan, in honour of the cameleers who helped open up the outback."],"qs":[["Why were camels brought to Australia?",["To carry goods across the dry interior","To live in zoos","To race against horses","To provide milk for settlers"],"Paragraph two explains they were used to move goods."],["Why were camels better than horses in the desert?",["They could travel far with little water.","They were faster than horses.","They were cheaper to buy.","They did not need to sleep."],"They could travel long distances with little water."],["Why did wild camel numbers grow so quickly?",["They had lots of space and few predators.","Farmers fed them.","More camels were imported.","They lived in cities."],"Paragraph three explains this."],["Which of these is a problem caused by wild camels?",["Fouling waterholes that native animals need","Blocking railway lines","Scaring tourists away from beaches","Eating crops in cities"],"Paragraph four lists this problem."],["Why is the Ghan train given that name?",["To honour the cameleers","It was built by camels.","It only carries camels.","It was invented in Afghanistan."],"The final paragraph explains this."]]},{"t":"Diary of a New Kid","p":["Monday. First day at Greenfield Primary. The uniform is itchy. The teacher, Ms Kaur, spelled my name wrong on the board (it's Rhys, not Reese), and I didn't correct her because everyone was staring. Ate lunch in the library. The librarian said I wasn't allowed to eat in the library. Ate lunch in the toilets.","Wednesday. A boy called Finn asked if I liked football. I said yes, even though I have never played. He said to come to the oval at lunch. I pretended to have a sore ankle.","Thursday. Finn asked about my ankle. I felt bad about lying, so I told him the truth. He laughed, but not in a mean way, and said he'd teach me. I fell over eleven times. Finn fell over twice, and one of those was on purpose, I think, so I wouldn't feel bad.","Friday. Ms Kaur spelled my name right on the board. I asked Finn if he told her. He shrugged. At lunch, four other kids joined in our game. I still fell over, but only six times.","Next week, I'm going to ask Finn if he wants to come over on Saturday."],"qs":[["Why didn't Rhys correct Ms Kaur on Monday?",["He felt self-conscious with everyone staring.","He did not know how to spell his name.","He liked the new spelling.","Ms Kaur had left the room."],"He says he didn't because everyone was staring."],["What does \"Ate lunch in the toilets\" suggest about Rhys's first day?",["He felt lonely and had nowhere to go.","He enjoyed eating alone.","The canteen was closed.","He was feeling sick."],"It shows how isolated and uncomfortable he felt."],["Why did Rhys pretend to have a sore ankle?",["He was worried about people finding out he couldn't play.","He really had hurt it.","He did not like Finn.","He wanted to go home early."],"He had said he liked football but had never played."],["What does the writer suggest about Finn falling over \"on purpose\"?",["Finn was being kind to make Rhys feel better.","Finn was clumsy.","Finn wanted to win the game.","Finn was showing off."],"He did it \"so I wouldn't feel bad\"."],["How does Rhys's situation change during the week?",["He goes from feeling alone to making friends.","He goes from happy to miserable.","He becomes the best footballer.","He moves to another school."],"By Friday he has friends to play with and plans to invite Finn over."]]},{"t":"Apollo 11","p":["On 20 July 1969, hundreds of millions of people around the world watched grainy black-and-white pictures on their televisions as American astronaut Neil Armstrong climbed down a ladder and became the first person to walk on the Moon.","Armstrong and his crewmate Buzz Aldrin landed in a small spacecraft called the lunar module, named Eagle. Their third crew member, Michael Collins, stayed in orbit around the Moon in the command module, waiting to take them home.","The landing was more dangerous than many viewers realised. As Eagle approached the surface, Armstrong saw that the computer was guiding them towards a field of large boulders. He took manual control and flew over the rocks searching for a safer spot, landing with only seconds of fuel to spare before they would have had to abort the landing.","Australia played an important part. Radio telescopes at Honeysuckle Creek near Canberra and at Parkes in New South Wales helped receive the television signals, allowing the world to watch the historic moment.","The astronauts spent about two and a half hours outside, collecting rock samples and setting up experiments, before returning safely to Earth four days later."],"qs":[["What was the name of the lunar module?",["Eagle","Apollo","Parkes","Columbia"],"Paragraph two names it."],["Why did Michael Collins stay in orbit?",["To wait in the command module and take the others home","Because he was sick","Because there was no room in the lunar module for three","To take photographs of Earth"],"He waited \"to take them home\"."],["Why did Armstrong take manual control?",["The computer was guiding them towards dangerous boulders.","The computer had switched off completely.","He wanted to land faster.","Aldrin asked him to."],"He saw they were heading for a field of large boulders."],["What does \"with only seconds of fuel to spare\" suggest about the landing?",["It was very close to having to be abandoned.","It was perfectly safe.","They had too much fuel.","They crashed."],"It shows how tense and risky the landing was."],["What role did Australia play?",["Its radio telescopes helped receive the television signals.","It built the lunar module.","An Australian walked on the Moon.","The rocket was launched from Australia."],"Paragraph four explains this."]]},{"t":"The Bushfire","p":["The smoke came first. For two days it hung over the town like a dirty yellow blanket, turning the sun into a flat red coin. Ash drifted down onto car windscreens. Nobody hung washing out.","On the third day, the wind changed. Dad listened to the emergency broadcast on the radio with his jaw clenched, then switched it off. \"We're going,\" he said. \"Now.\"","We had packed the car the night before: photo albums, Nana's jewellery box, the dog's lead, a bag of clothes each. My little brother Ollie wanted to bring his whole Lego city. There was room for one box. He chose the fire station.","As we drove out along the highway, I looked back. The hills behind our street were glowing orange, and the sky above them was a colour I had no name for.","We stayed at the evacuation centre in the school hall for three nights, sleeping on camp beds among our neighbours. On the fourth day, Dad came back from the roadblock and knelt down in front of us. For a moment he couldn't speak. Then he smiled.","\"It's still standing,\" he said. \"The fire went around it.\""],"qs":[["\"turning the sun into a flat red coin\" suggests that:",["the smoke made the sun look dull and red","the sun had disappeared","the sun was very bright","it was night-time"],"Smoke dims and reddens the sun."],["Why did Dad decide to leave on the third day?",["The wind changed, which made the fire more dangerous.","The family had run out of food.","Ollie was sick.","The school hall opened."],"The wind changed and he listened to the emergency broadcast."],["What does Ollie choosing the Lego fire station suggest?",["He hoped firefighters would protect them.","He did not like the rest of his Lego.","It was the smallest box.","He wanted to be a builder."],"It hints at his worry about the fire and hope for rescue."],["Why couldn't Dad speak for a moment when he returned?",["He was overcome with emotion.","He was out of breath from running.","He had lost his voice from the smoke.","He had forgotten what to say."],"His strong feelings about the good news made him pause."],["What does \"It's still standing\" refer to?",["Their house survived the fire.","The school hall","The fire station","The roadblock"],"The fire went around their home."]]},{"t":"How to Grow a Bean in a Jar","p":["Watching a seed sprout is one of the easiest science experiments you can do at home. All you need is a clean glass jar, some paper towel, water and a dried bean, such as a broad bean or a kidney bean.","Step 1: Fold two or three sheets of paper towel and line the inside of the jar with them. Then scrunch another sheet and push it into the middle of the jar to hold the lining in place.","Step 2: Slide the bean between the glass and the paper towel, about a third of the way down the jar, so that you can see it clearly from the outside.","Step 3: Pour a little water into the jar until the paper towel is damp all the way through. There should only be a small puddle at the bottom. Too much water can cause the bean to rot.","Step 4: Place the jar somewhere warm but out of direct sunlight, and check it every day. Add a few drops of water if the paper towel starts to dry out.","Within a few days, the bean's skin will split, and a small root will begin to grow downwards. A little later, a green shoot will push upwards towards the light. Try keeping a diary with drawings to record the changes each day."],"qs":[["What type of text is this?",["a procedure","a narrative","a persuasive letter","a poem"],"It gives numbered steps for how to do something."],["Why should the bean be placed against the glass?",["So you can watch it grow from the outside","So it stays cold","So it gets more water","So it cannot escape"],"Step 2 says so you can see it clearly."],["What might happen if you add too much water?",["The bean could rot.","The bean would grow faster.","The jar would crack.","The shoot would turn yellow."],"Step 3 warns about rotting."],["In which direction does the root grow?",["Downwards","Upwards","Sideways","In circles"],"The final paragraph says the root grows downwards."],["Why does the writer suggest keeping a diary?",["To record the changes each day","To remember to buy more beans","To practise handwriting","To write a story about the bean"],"The final sentence explains the purpose."]]},{"t":"The Honest Woodcutter (a retold fable)","p":["Long ago, a poor woodcutter was chopping trees beside a deep river when his axe slipped from his tired hands and sank beneath the water. He sat on the bank and wept, for without his axe he could not earn a living.","Suddenly the water shimmered, and a river spirit rose up holding a gleaming golden axe. \"Is this yours?\" she asked. The woodcutter shook his head. \"No, mine was only iron.\"","The spirit dived again and returned with an axe of silver. \"Is this one yours?\" Again the woodcutter shook his head.","At last, the spirit brought up a plain iron axe with a worn wooden handle. \"That's it!\" cried the woodcutter joyfully. The spirit smiled. \"Because you are honest,\" she said, \"you may keep all three.\"","When a greedy neighbour heard the story, he hurried to the river and threw his own axe into the water on purpose. When the spirit appeared with a golden axe, he shouted, \"Yes! That one is mine!\" The spirit frowned, sank beneath the water, and never returned. The greedy man went home with no golden axe, no silver axe, and no axe of his own."],"qs":[["Why did the woodcutter weep?",["Without his axe, he could not earn a living.","He had hurt his hands.","He was afraid of the river spirit.","His neighbour had stolen his axe."],"The first paragraph explains this."],["Why did the woodcutter refuse the golden and silver axes?",["They were not his.","They were too heavy.","He did not like gold or silver.","He wanted a newer axe."],"He honestly said his axe was iron."],["Why was the woodcutter rewarded?",["He told the truth.","He was very poor.","He asked politely.","He was a good swimmer."],"The spirit says \"Because you are honest\"."],["What mistake did the greedy neig
